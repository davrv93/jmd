<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venta · Tienda Sol</title>
  <link rel="stylesheet" href="/estilos.css">
  <script src="/js/config.js"></script>
</head>
<body>
  <header>
    <div class="barra">
      <div class="marca">☀ Tienda <span>Sol</span></div>
      <span id="usuario-actual" aria-label="Usuario actual"></span>
      <nav aria-label="Principal">
        <a href="/catalogo.html">Catálogo</a>
        <a href="/venta.html" aria-current="page">Venta (<span id="contador-carrito">0</span>)</a>
        <a href="/reporte.html">Reporte</a>
        <button id="boton-salir" type="button">Salir</button>
      </nav>
    </div>
  </header>
  <main>
    <h1>Venta</h1>
    <p id="carrito-vacio" class="vacio" hidden>El carrito está vacío. Agrega productos desde el <a href="/catalogo.html">catálogo</a>.</p>
    <table id="tabla-carrito" aria-label="Carrito">
      <thead><tr><th scope="col">Producto</th><th scope="col" class="num">Precio</th><th scope="col">Cantidad</th><th scope="col" class="num">Subtotal</th><th scope="col"><span class="vacio">Acción</span></th></tr></thead>
      <tbody></tbody>
    </table>
    <section class="tarjeta totales" aria-label="Cobro">
      <div>
        <span>Total</span>
        <output id="total" class="cifra" aria-label="Total a pagar">S/ 0.00</output>
      </div>
      <div>
        <label for="efectivo">Efectivo recibido (S/)</label>
        <input id="efectivo" type="number" min="0" step="0.10" inputmode="decimal">
      </div>
      <div>
        <span>Vuelto</span>
        <output id="vuelto" class="cifra" aria-label="Vuelto">S/ 0.00</output>
      </div>
      <div>
        <button id="confirmar" class="primario" type="button">Confirmar venta</button>
      </div>
    </section>
    <div id="error" class="alerta" role="alert"></div>
    <div id="exito" class="exito" role="status"></div>
  </main>
  <script type="module" src="/js/venta.js"></script>
</body>
</html>
