<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Tienda Sol</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header><div class="barra"><div class="marca">☀ Tienda <span>Sol</span></div></div></header>
  <main>
    <section class="tarjeta login" aria-labelledby="titulo">
      <h1 id="titulo">Iniciar sesión</h1>
      <form id="form-login" novalidate>
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" autocomplete="username" required>
        <label for="clave">Clave</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        <button class="primario" type="submit">Ingresar</button>
        <div id="error" class="alerta" role="alert"></div>
      </form>
    </section>
  </main>
  <script type="module">
    import { api } from '/js/comun.js';
    const form = document.getElementById('form-login');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      // getElementById en vez de form.usuario: Obscura 0.2.6 no soporta el acceso por nombre (form.<name>).
      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value;
      if (!usuario || !clave) { error.textContent = 'Ingresa usuario y clave'; return; }
      const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ usuario, clave }) });
      if (!r.ok) { error.textContent = r.cuerpo.error ?? 'No se pudo iniciar sesión'; return; }
      sessionStorage.setItem('token', r.cuerpo.token);
      sessionStorage.setItem('nombre', r.cuerpo.nombre);
      location.assign('/catalogo.html');
    });
  </script>
</body>
</html>
