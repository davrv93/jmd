# Inscripción a los cursos en modalidad web (pago por Yape revisado a mano): https://jmd-learn.online/inscripcion-web/
# Contenedor inscripcion-web en 127.0.0.1:18766 (fuente: ~/Documents/jmd/inscripcion-web). Panel en /inscripcion-web/admin.
location = /inscripcion-web { return 301 /inscripcion-web/; }
location ^~ /inscripcion-web/ {
    proxy_pass http://127.0.0.1:18766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 7m;
}
# La ruta interna del LMS la usa solo este servicio, por la red de Docker: desde internet no existe.
location ^~ /api/v1/interno/ { return 404; }
