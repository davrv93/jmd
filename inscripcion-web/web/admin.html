<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Inscripción web</title>
<style>
:root{--fondo:#f6f1e7;--tarjeta:#fffdf8;--borde:#e0d6c2;--tinta:#14172b;--suave:#555a72;--azul:#4d6bfe;--verde:#1f7a4d;--rojo:#a3261c;--oro:#a8841c;--wa:#128c4a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--fondo:#0b0d1c;--tarjeta:#141833;--borde:#2a2f55;--tinta:#f3eee2;--suave:#aab0c8;--azul:#7d93ff;--verde:#5fd39a;--rojo:#ff8a7e;--oro:#d9b44a;--wa:#3ccf7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 26px/1.1 Georgia,serif;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 16px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filtro{border:1.5px solid var(--borde);background:transparent;color:inherit;border-radius:999px;padding:8px 14px;font:600 14px system-ui;cursor:pointer}
.filtro[aria-pressed=true]{border-color:var(--azul);color:var(--azul)}
.tarjeta{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:14px;margin:10px 0}
.tarjeta .mini{width:96px;height:132px;object-fit:cover;border-radius:10px;border:1px solid var(--borde);cursor:zoom-in;background:var(--fondo)}
.tarjeta h3{margin:0 0 2px;font-size:17px}
.datos{color:var(--suave);font-size:14px;word-break:break-word}
.monto{font:700 20px/1 ui-monospace,Menlo,monospace;margin:6px 0}
.chip{display:inline-block;border:1px solid var(--borde);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.estado{font:700 11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
.e-pendiente{color:var(--oro)}.e-aprobada{color:var(--verde)}.e-rechazada{color:var(--rojo)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,.boton{font:600 14px/1 system-ui;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ok{background:var(--verde);color:#fff}.no{background:transparent;color:var(--rojo);border:1.5px solid var(--rojo)}
.wa{background:var(--wa);color:#fff}.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--borde)}
.nota{color:var(--rojo);font-weight:600;font-size:14px;margin-top:6px}
.entrar{max-width:380px;margin:60px auto;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:20px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--borde);background:var(--fondo);color:var(--tinta);font:inherit;margin:8px 0}
dialog{border:1px solid var(--borde);border-radius:16px;background:var(--tarjeta);color:var(--tinta);max-width:min(560px,92vw);padding:18px}
dialog::backdrop{background:rgba(10,12,25,.6)}
dialog img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px}
.vacio{color:var(--suave);text-align:center;padding:40px 0}
.pestanas{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--borde)}
.pestana{background:transparent;color:var(--suave);border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;font:600 15px system-ui;cursor:pointer}
.pestana[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--azul)}
.caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px;margin:0 0 14px}
.caja h2{font-size:17px;margin:0 0 10px}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fila label{font:600 13px system-ui;color:var(--suave)}
.fila input,.fila select{margin:4px 0 0}
select{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--borde);background:var(--fondo);color:var(--tinta);font:inherit}
.grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;max-height:260px;overflow:auto;border:1px solid var(--borde);border-radius:10px;padding:8px;margin:6px 0}
.grupos label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--tinta);font-weight:400}
.grupos input{width:auto;margin:2px 0 0}
.grupos small{color:var(--suave)}
.cod{font:700 17px ui-monospace,Menlo,monospace;letter-spacing:.04em}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td,.tabla th{padding:8px 6px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
.tabla th{font:700 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.inactivo{opacity:.55}
@media (max-width:640px){.tabla thead{display:none}.tabla tr{display:block;border-bottom:1px solid var(--borde);padding:8px 0}.tabla td{display:block;border:0;padding:3px 0}}
@media (max-width:480px){.tarjeta{grid-template-columns:72px 1fr}.tarjeta .mini{width:72px;height:100px}}
</style>
</head>
<body>
<div class="entrar" id="entrar" hidden>
  <h1>Panel de inscripción</h1>
  <p class="sub">Escribe la clave del panel.</p>
  <form id="fEntrar"><input type="password" id="clave" autocomplete="current-password" aria-label="Clave del panel"><button class="ok" style="width:100%;justify-content:center">Entrar</button></form>
  <p class="nota" id="eEntrar" role="alert"></p>
</div>

<main id="panel" hidden>
  <h1>Inscripciones web</h1>
  <div class="pestanas" role="tablist">
    <button class="pestana" role="tab" data-p="solicitudes" aria-selected="true">Solicitudes Yape</button>
    <button class="pestana" role="tab" data-p="codigos" aria-selected="false">Códigos</button>
  </div>
  <div id="pSolicitudes">
  <p class="sub" id="resumen"></p>
  <div class="barra">
    <button class="filtro" data-f="pendiente" aria-pressed="true">Pendientes</button>
    <button class="filtro" data-f="aprobada" aria-pressed="false">Aprobadas</button>
    <button class="filtro" data-f="rechazada" aria-pressed="false">Rechazadas</button>
    <button class="filtro" data-f="todas" aria-pressed="false">Todas</button>
    <button class="sec" id="recargar" style="margin-left:auto">Actualizar</button>
  </div>
  <div id="lista"></div>
  </div>

  <div id="pCodigos" hidden>
    <form class="caja" id="fCodigo">
      <h2>Crear código</h2>
      <div class="fila">
        <label>Código<input id="cCodigo" placeholder="Vacío = JMD-XXXX-XXXX" maxlength="32" autocomplete="off"></label>
        <label>Máximo de cursos<select id="cMax"><option value="0">Todos</option></select></label>
        <label>Usos<input id="cUsos" type="number" min="1" max="1000" value="1"></label>
        <label>Vence<input id="cVence" type="date"></label>
      </div>
      <label style="display:block;margin-top:10px;font:600 13px system-ui;color:var(--suave)">Cursos permitidos <small style="font-weight:400">(ninguno marcado = todo el catálogo vigente)</small></label>
      <div class="grupos" id="cGrupos"></div>
      <label style="font:600 13px system-ui;color:var(--suave)">Nota<input id="cNota" maxlength="200" placeholder="Para quién es o por qué"></label>
      <p class="nota" id="cError" role="alert"></p>
      <button class="ok" id="cCrear">Crear código</button>
      <div id="cListo" class="caja" style="margin-top:12px" hidden></div>
    </form>
    <div class="caja"><h2>Códigos</h2><div id="cLista"></div></div>
    <div class="caja"><h2>Canjes</h2><div id="cCanjes"></div></div>
  </div>
</main>

<dialog id="dFoto"><img id="dFotoImg" alt="Captura del Yape"><div class="acciones" style="justify-content:flex-end"><button class="sec" data-cerrar>Cerrar</button></div></dialog>
<dialog id="dConf">
  <h3 id="dConfT" style="margin-top:0"></h3><p id="dConfX" class="datos"></p>
  <textarea id="dConfMotivo" rows="3" maxlength="200" placeholder="Motivo (lo verá el alumno)" hidden></textarea>
  <p class="nota" id="dConfE"></p>
  <div class="acciones" style="justify-content:flex-end"><button class="sec" data-cerrar>Cancelar</button><button id="dConfSi" class="ok">Confirmar</button></div>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  let clave = '', datos = { solicitudes: [], config: { cursos: [] } }, filtro = 'pendiente';
  try { clave = sessionStorage.getItem('iw-clave') || ''; } catch {}

  async function api(ruta, opc = {}) {
    const r = await fetch('api/admin/' + ruta, { ...opc, headers: { 'X-Clave': clave, 'Content-Type': 'application/json', ...(opc.headers || {}) } });
    if (r.status === 401) { salir('Clave incorrecta.'); throw new Error('Clave incorrecta.'); }
    return r;
  }
  function salir(msg) { clave = ''; try { sessionStorage.removeItem('iw-clave'); } catch {} $('#panel').hidden = true; $('#entrar').hidden = false; $('#eEntrar').textContent = msg || ''; }

  const curso = id => datos.config.cursos.find(c => c.id === id) || { corto: id, titulo: id };
  const fecha = t => new Date(t).toLocaleString('es-PE', { timeZone: 'America/Lima', dateStyle: 'medium', timeStyle: 'short' });

  function mensajeWA(s) {
    const nombres = s.cursos.map(c => curso(c).titulo).join(', ');
    const nom = s.nombre.split(' ')[0];
    if (s.estado === 'aprobada') return `Hola ${nom}, ¡confirmamos tu Yape! Ya estás inscrito en: ${nombres}.\n\nEntra al aula con este enlace (vale 7 días; al abrirlo quedas conectado):\n${s.enlace}\n\nTu usuario es tu correo ${s.email}. Cualquier duda, escríbenos por aquí. — JMD Learning`;
    return `Hola ${nom}, revisamos tu inscripción a ${nombres} y no pudimos confirmarla: ${s.motivo}. Escríbenos por aquí y lo resolvemos. — JMD Learning`;
  }

  function pintar() {
    const todas = datos.solicitudes;
    const n = e => todas.filter(s => s.estado === e).length;
    $('#resumen').textContent = `${n('pendiente')} pendientes · ${n('aprobada')} aprobadas · ${n('rechazada')} rechazadas`;
    const lista = $('#lista'); lista.textContent = '';
    const ver = todas.filter(s => filtro === 'todas' || s.estado === filtro);
    if (!ver.length) { lista.innerHTML = '<p class="vacio">No hay solicitudes aquí.</p>'; return; }
    for (const s of ver) {
      const t = document.createElement('article'); t.className = 'tarjeta';
      t.innerHTML = `<img class="mini" alt="Captura del Yape"><div>
        <div class="estado e-${s.estado}"></div><h3></h3>
        <div class="datos dEmail"></div><div class="datos dTel"></div>
        <div class="monto"></div><div class="cursos"></div><div class="datos dExtra"></div>
        <div class="nota"></div><div class="acciones"></div></div>`;
      t.querySelector('.estado').textContent = s.estado + ' · ' + fecha(s.creada);
      t.querySelector('h3').textContent = s.nombre;
      t.querySelector('.dEmail').textContent = s.email;
      t.querySelector('.dTel').textContent = '+' + s.telefono;
      t.querySelector('.monto').textContent = 'S/ ' + s.monto;
      s.cursos.forEach(c => { const ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = curso(c).corto; t.querySelector('.cursos').append(ch); });
      t.querySelector('.dExtra').textContent = [s.operacion && ('Operación ' + s.operacion), s.estado === 'aprobada' && (s.cuenta_nueva ? 'Cuenta nueva' : 'Cuenta que ya existía'), s.motivo && ('Motivo: ' + s.motivo)].filter(Boolean).join(' · ');
      t.querySelector('.nota').textContent = s.nota || '';
      cargarFoto(s.id, t.querySelector('.mini'));
      const acc = t.querySelector('.acciones');
      const boton = (txt, cls, fn) => { const b = document.createElement('button'); b.className = cls; b.textContent = txt; b.onclick = fn; acc.append(b); return b; };
      if (s.estado === 'pendiente') {
        boton('Aprobar e inscribir', 'ok', () => confirmar('¿Aprobar e inscribir?', `${s.nombre} · S/ ${s.monto} · ${s.cursos.map(c => curso(c).corto).join(', ')}. Se crea o reutiliza su cuenta y se genera su enlace de acceso.`, false, async () => {
          const r = await api('aprobar/' + s.id, { method: 'POST', body: '{}' }); const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'No se pudo aprobar.');
        }));
        boton('Rechazar', 'no', () => confirmar('Rechazar solicitud', `${s.nombre} · S/ ${s.monto}`, true, async motivo => {
          const r = await api('rechazar/' + s.id, { method: 'POST', body: JSON.stringify({ motivo }) }); const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'No se pudo rechazar.');
        }));
      } else {
        const wa = document.createElement('a'); wa.className = 'boton wa'; wa.target = '_blank'; wa.rel = 'noopener';
        wa.textContent = 'Enviar por WhatsApp'; wa.href = 'https://wa.me/' + s.telefono + '?text=' + encodeURIComponent(mensajeWA(s)); acc.append(wa);
        if (s.enlace) { const b = boton('Copiar enlace', 'sec', async () => { try { await navigator.clipboard.writeText(s.enlace); b.textContent = '¡Copiado!'; } catch { b.textContent = 'No se pudo copiar'; } setTimeout(() => { b.textContent = 'Copiar enlace'; }, 2000); }); }
      }
      lista.append(t);
    }
  }

  async function cargarFoto(id, img) {
    try { const r = await api('foto/' + id); if (!r.ok) return; const u = URL.createObjectURL(await r.blob()); img.src = u; img.onclick = () => { $('#dFotoImg').src = u; $('#dFoto').showModal(); }; } catch {}
  }

  function confirmar(titulo, texto, conMotivo, accion, etiqueta, despues) {
    const d = $('#dConf'); $('#dConfT').textContent = titulo; $('#dConfX').textContent = texto; $('#dConfE').textContent = '';
    const m = $('#dConfMotivo'); m.hidden = !conMotivo; m.value = '';
    const textoSi = etiqueta || (conMotivo ? 'Rechazar' : 'Aprobar');
    const si = $('#dConfSi'); si.className = conMotivo || etiqueta ? 'no' : 'ok'; si.textContent = textoSi;
    si.disabled = false;
    si.onclick = async () => {
      if (conMotivo && !m.value.trim()) { $('#dConfE').textContent = 'Escribe el motivo.'; return; }
      si.disabled = true; si.textContent = 'Un momento…';
      const recargar = despues || cargar;
      try { await accion(m.value.trim()); d.close(); await recargar(); }
      catch (x) { $('#dConfE').textContent = x.message; si.disabled = false; si.textContent = textoSi; await recargar(); }
    };
    d.showModal(); if (conMotivo) m.focus();
  }

  async function cargar() {
    const r = await api('solicitudes');
    if (r.status === 429) { salir('Demasiados intentos. Espera unos minutos.'); return; }
    datos = await r.json(); $('#entrar').hidden = true; $('#panel').hidden = false; pintar();
  }

  // ---------- códigos ----------
  let cod = { codigos: [], canjes: [], catalogo: [], vigentes: [] };
  const tituloDe = c => (cod.catalogo.find(e => e.cohorte === c) || { titulo: c }).titulo;
  const el = (tag, cls, txt) => { const x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; };

  async function cargarCodigos() {
    const r = await api('codigos'); cod = await r.json();
    const max = $('#cMax'); const sel = max.value; max.textContent = '';
    max.append(new Option('Todos', '0'));
    for (let i = 1; i <= Math.min(cod.vigentes.length, 30); i++) max.append(new Option(String(i), String(i)));
    max.value = sel || '0';
    const g = $('#cGrupos'); const marcadas = new Set([...g.querySelectorAll('input:checked')].map(i => i.value)); g.textContent = '';
    for (const e of cod.vigentes) {
      const l = el('label'); const i = el('input'); i.type = 'checkbox'; i.value = e.cohorte; i.checked = marcadas.has(e.cohorte);
      const t = el('span'); t.append(el('span', null, e.titulo), document.createElement('br'), el('small', null, e.cohorte + (e.tipo === 'web' ? ' · web' : ' · en vivo')));
      l.append(i, t); g.append(l);
    }
    pintarCodigos();
  }

  function pintarCodigos() {
    const L = $('#cLista'); L.textContent = '';
    if (!cod.codigos.length) L.append(el('p', 'vacio', 'Aún no hay códigos.'));
    else {
      const t = el('table', 'tabla'); t.innerHTML = '<thead><tr><th>Código</th><th>Usos</th><th>Cursos</th><th>Vence</th><th></th></tr></thead>';
      const tb = el('tbody');
      for (const k of cod.codigos) {
        const tr = el('tr', k.activo ? '' : 'inactivo');
        const c1 = el('td'); c1.append(el('div', 'cod', k.codigo)); if (k.nota) c1.append(el('div', 'datos', k.nota));
        const c2 = el('td', null, `${k.usados} de ${k.usos} · quedan ${Math.max(0, k.usos - k.usados)}`);
        const c3 = el('td', null, (k.max ? 'hasta ' + k.max : 'todos') + ' · ' + (k.permitidas && k.permitidas.length ? k.permitidas.length + ' permitidos' : 'todo el catálogo'));
        const c4 = el('td', null, k.vence || 'no vence');
        const c5 = el('td');
        if (k.activo) {
          const cp = el('button', 'sec', 'Copiar'); cp.type = 'button';
          cp.onclick = async () => { try { await navigator.clipboard.writeText(k.codigo); cp.textContent = '¡Copiado!'; } catch {} setTimeout(() => { cp.textContent = 'Copiar'; }, 1500); };
          const d = el('button', 'no', 'Desactivar'); d.type = 'button';
          d.onclick = () => confirmar('¿Desactivar ' + k.codigo + '?', 'Nadie más podrá canjearlo. Los canjes hechos se quedan.', false, async () => {
            const r = await api('codigos/' + encodeURIComponent(k.codigo) + '/desactivar', { method: 'POST', body: '{}' });
            if (!r.ok) throw new Error('No se pudo desactivar.');
          }, 'Desactivar', cargarCodigos);
          c5.append(cp, ' ', d);
        } else c5.textContent = 'desactivado';
        tr.append(c1, c2, c3, c4, c5); tb.append(tr);
      }
      t.append(tb); L.append(t);
    }
    const C = $('#cCanjes'); C.textContent = '';
    if (!cod.canjes.length) { C.append(el('p', 'vacio', 'Aún no hay canjes.')); return; }
    const t = el('table', 'tabla'); t.innerHTML = '<thead><tr><th>Persona</th><th>Cursos</th><th>Código</th><th></th></tr></thead>';
    const tb = el('tbody');
    for (const x of cod.canjes) {
      const tr = el('tr');
      const a = el('td'); a.append(el('strong', null, x.nombre), el('div', 'datos', x.email), el('div', 'datos', '+' + x.telefono), el('div', 'estado ' + (x.cuenta === 'nueva' ? 'e-aprobada' : 'e-pendiente'), 'cuenta ' + x.cuenta + ' · ' + fecha(x.fecha)));
      const b = el('td'); x.cohortes.forEach(c => b.append(el('span', 'chip', tituloDe(c))));
      const c = el('td', 'cod', x.codigo); c.style.fontSize = '13px';
      const d = el('td'); const acc = el('div', 'acciones');
      const gen = el('button', 'wa', 'Enviar enlace por WhatsApp'); gen.type = 'button';
      const cop = el('button', 'sec', 'Copiar enlace'); cop.type = 'button';
      const nota = el('div', 'nota');
      const pedir = async () => {
        const r = await api('canjes/' + x.id + '/enlace', { method: 'POST', body: '{}' }); const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'No se pudo generar el enlace.'); return j.enlace;
      };
      gen.onclick = async () => {
        const v = window.open('', '_blank'); nota.textContent = '';
        try {
          const e = await pedir();
          const nombres = x.cohortes.map(tituloDe).join(', ');
          const msg = `Hola ${x.nombre.split(' ')[0]}, ya estás inscrito en: ${nombres}.\n\nEntra al aula con este enlace (vale 7 días; al abrirlo quedas conectado):\n${e}\n\nTu usuario es tu correo ${x.email}. — JMD Learning`;
          const url = 'https://wa.me/' + x.telefono + '?text=' + encodeURIComponent(msg);
          if (v) v.location = url; else location.href = url;
        } catch (err) { if (v) v.close(); nota.textContent = err.message; }
      };
      cop.onclick = async () => {
        nota.textContent = '';
        try { await navigator.clipboard.writeText(await pedir()); cop.textContent = '¡Copiado!'; setTimeout(() => { cop.textContent = 'Copiar enlace'; }, 2000); }
        catch (err) { nota.textContent = err.message; }
      };
      acc.append(gen, cop); d.append(acc, nota);
      tr.append(a, b, c, d); tb.append(tr);
    }
    t.append(tb); C.append(t);
  }

  $('#fCodigo').addEventListener('submit', async e => {
    e.preventDefault(); $('#cError').textContent = ''; const b = $('#cCrear'); b.disabled = true;
    try {
      const body = { codigo: $('#cCodigo').value.trim(), max: +$('#cMax').value, usos: +$('#cUsos').value || 1, vence: $('#cVence').value,
        permitidas: [...document.querySelectorAll('#cGrupos input:checked')].map(i => i.value), nota: $('#cNota').value.trim() };
      const r = await api('codigos', { method: 'POST', body: JSON.stringify(body) }); const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'No se pudo crear.');
      const L = $('#cListo'); L.hidden = false; L.textContent = '';
      L.append(el('div', 'datos', 'Código creado:'), el('div', 'cod', j.codigo));
      const cp = el('button', 'sec', 'Copiar código'); cp.type = 'button';
      cp.onclick = async () => { try { await navigator.clipboard.writeText(j.codigo); cp.textContent = '¡Copiado!'; } catch {} };
      L.append(cp);
      $('#cCodigo').value = ''; $('#cNota').value = '';
      await cargarCodigos();
    } catch (x) { $('#cError').textContent = x.message; } finally { b.disabled = false; }
  });

  document.querySelectorAll('.pestana').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.pestana').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    $('#pSolicitudes').hidden = t.dataset.p !== 'solicitudes'; $('#pCodigos').hidden = t.dataset.p !== 'codigos';
    if (t.dataset.p === 'codigos') cargarCodigos().catch(() => {});
  }));

  document.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
  document.querySelectorAll('.filtro').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.f; document.querySelectorAll('.filtro').forEach(x => x.setAttribute('aria-pressed', String(x === b))); pintar();
  }));
  $('#recargar').onclick = () => cargar().catch(() => {});
  $('#fEntrar').addEventListener('submit', e => {
    e.preventDefault(); clave = $('#clave').value.trim();
    try { sessionStorage.setItem('iw-clave', clave); } catch {}
    cargar().catch(() => {});
  });
  if (clave) cargar().catch(() => {}); else salir();
})();
</script>
</body>
</html>
