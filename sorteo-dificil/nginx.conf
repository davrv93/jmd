# Sorteo de penales de ¿Difícil de explicar? ¡No! (3 primeros gratis, resto 90 %): https://jmd-learn.online/sorteo-dificil/
# Contenedor sorteo-dificil en 127.0.0.1:18700 (fuente: ~/Documents/jmd/sorteo-dificil en la Mac).
location = /sorteo-dificil { return 301 /sorteo-dificil/; }
location ^~ /sorteo-dificil/ {
    proxy_pass http://127.0.0.1:18700/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
