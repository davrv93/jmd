# Sorteo de penales (Qwen Coder y Videojuegos G2) con cupones de descuento: https://jmd-learn.online/sorteo-penal/
# Contenedor sorteo-penal en 127.0.0.1:18694 (fuente: ~/Documents/jmd/sorteo-penal en la Mac).
location = /sorteo-penal { return 301 /sorteo-penal/; }
location ^~ /sorteo-penal/ {
    proxy_pass http://127.0.0.1:18694/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
