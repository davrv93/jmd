# Sorteo de cápsulas (gachapon) con cupones de descuento: https://jmd-learn.online/gachapon/
# Contenedor gachapon en 127.0.0.1:18660 (fuente: ~/Documents/jmd/gachapon en la Mac).
location = /gachapon { return 301 /gachapon/; }
location ^~ /gachapon/ {
    proxy_pass http://127.0.0.1:18660/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
