# Sorteo de la pirámide de la Hackathon Ready Set Go! (comunidad JMD Learning): https://jmd-learn.online/piramide-hackathon/
# Contenedor sorteo-piramide-hk en 127.0.0.1:18695 (fuente: ~/Documents/jmd/sorteo-piramide-hackathon en la Mac).
# Independiente de /piramide/ (sorteo-piramide, 18680), que sigue igual.
location = /piramide-hackathon { return 301 /piramide-hackathon/; }
location ^~ /piramide-hackathon/ {
    proxy_pass http://127.0.0.1:18695/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
