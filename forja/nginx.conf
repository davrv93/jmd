# Forja · estudio de personajes (12-11-2026): https://jmd-learn.online/forja/
# Contenedor forja en 127.0.0.1:18697 (fuente: ~/Documents/jmd/forja en la Mac). Embeddings locales, sin IA externa.
location = /forja { return 301 /forja/; }
location ^~ /forja/ {
    proxy_pass http://127.0.0.1:18697/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on; gzip_types application/json text/javascript text/css;
}
