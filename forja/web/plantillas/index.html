<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>__NOMBRE__ · __JUEGO__</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #14111c; color: #f5f0ff; font: 15px system-ui, sans-serif; overflow: hidden; }
  #juego { height: 100%; }
  .tacto { position: fixed; inset: auto 10px 10px; display: none; justify-content: space-between; pointer-events: none; }
  .tacto div { display: grid; grid-template-columns: repeat(3, 54px); grid-auto-rows: 54px; gap: 4px; pointer-events: auto; }
  .tacto button { border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(15,12,24,.55); color: #fff; font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .tacto { display: flex; } }
</style></head>
<body>
<div id="juego"></div>
<!-- botones táctiles: cada uno enciende y apaga una bandera en window.TACTO, que comun.js lee igual que el teclado -->
<div class="tacto">
  <div><span></span><button data-k="arriba">▲</button><span></span><button data-k="izq">◀</button><button data-k="abajo">▼</button><button data-k="der">▶</button></div>
  <div><button data-k="rayosx" title="Rayos X">👁</button><span></span><span></span><span></span><button data-k="golpe">✦</button><button data-k="salto">⤒</button></div>
</div>
<script>
  window.TACTO = {};
  for (const b of document.querySelectorAll('.tacto button')) for (const [ev, v] of [['pointerdown', true], ['pointerup', false], ['pointerleave', false], ['pointercancel', false]]) b.addEventListener(ev, (e) => { e.preventDefault(); TACTO[b.dataset.k] = v; });
</script>
__SCRIPTS__
</body></html>
