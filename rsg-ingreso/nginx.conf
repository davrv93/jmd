# Ingreso directo al curso Ready Set Go! (nombre + correo → link de ingreso): https://jmd-learn.online/readysetgo/ingreso/
# Contenedor rsg-ingreso en 127.0.0.1:18690 (--network host). Fuente: ~/Documents/jmd/rsg-ingreso en la Mac.
# Prefijo más largo que el ^~ /readysetgo/ de readysetgo.conf, así que gana aunque esté incluido después.
location = /readysetgo/ingreso { return 301 /readysetgo/ingreso/; }
location ^~ /readysetgo/ingreso/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:18690/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
