# Crea contenido con OpenMontage · inscripción por WhatsApp (11-11-2026): https://jmd-learn.online/openmontage/
# Contenido: ~/Documents/jmd/openmontage-web/web del Mac copiado a /var/www/openmontage/ (lo hace desplegar.sh).
location = /openmontage { return 301 /openmontage/; }
location ^~ /openmontage/ {
    alias /var/www/openmontage/;
    index index.html;
    add_header Cache-Control "no-cache";
}
