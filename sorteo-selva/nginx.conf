# Sorteo de las cuerdas (grupo Claude Code PRO, curso DeepSeek Harness): https://jmd-learn.online/selva/
# Contenedor sorteo-selva en 127.0.0.1:18675 (fuente: ~/Documents/jmd/sorteo-selva en la Mac).
location = /selva { return 301 /selva/; }
location ^~ /selva/ {
    proxy_pass http://127.0.0.1:18675/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
