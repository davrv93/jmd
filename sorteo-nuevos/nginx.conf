# Sorteo de cápsulas de los cursos nuevos con cupones de descuento: https://jmd-learn.online/sorteo-nuevos/
# Contenedor sorteo-nuevos en 127.0.0.1:18692 (fuente: ~/Documents/jmd/sorteo-nuevos en la Mac).
location = /sorteo-nuevos { return 301 /sorteo-nuevos/; }
location ^~ /sorteo-nuevos/ {
    proxy_pass http://127.0.0.1:18692/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
