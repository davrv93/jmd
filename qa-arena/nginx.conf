# QA Arena (gamificación del taller QA). Va DENTRO del server { } de jmd-learn.online (443):
#   sudo cp qa-arena/nginx.conf /etc/nginx/snippets/qa-arena.conf
#   y añadir «include /etc/nginx/snippets/qa-arena.conf;» en /etc/nginx/sites-enabled/jmd-learn (es archivo, no symlink)
#   sudo nginx -t && sudo systemctl reload nginx
# El contenedor escucha en 127.0.0.1:18630 (ver desplegar.sh). SSE: sin buffer y con lectura larga.
location = /qa-arena { return 301 /qa-arena/; }
location ^~ /qa-arena/ {
    proxy_pass http://127.0.0.1:18630/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 1h;
}
