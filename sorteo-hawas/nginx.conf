# Sorteo de penales de ¿Difícil de explicar? ¡No! (5 primeros gratis, resto 90 %): https://jmd-learn.online/sorteo-hawas/
# Contenedor sorteo-hawas en 127.0.0.1:18701 (fuente: ~/Documents/jmd/sorteo-hawas en la Mac).
location = /sorteo-hawas { return 301 /sorteo-hawas/; }
location ^~ /sorteo-hawas/ {
    proxy_pass http://127.0.0.1:18701/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
