<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja Race · sala de la clase</title>
<meta name="theme-color" content="#ffd633">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="static/estilo.css?v=20261031c">
<style>
/* Sala para proyectar: todas las mesas en vivo, la fase en grande y la tabla de la clase. */
main { max-width: 1400px; padding: 14px 18px 30px; }
.fase { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 6px 0 14px; padding: 12px 18px;
  background: var(--tinta); color: #fff; border: 4px solid var(--tinta); box-shadow: 6px 6px 0 var(--rojo); }
.fase h2 { font-size: clamp(22px, 2.6vw, 40px); letter-spacing: -.02em; }
.fase h2 em { font-style: normal; color: var(--amarillo); }
.fase .reloj { font-size: clamp(26px, 3vw, 48px); font-variant-numeric: tabular-nums; color: var(--amarillo); }
.grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr); gap: 18px; align-items: start; }
.mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.mesa { background: #fff; border: 4px solid var(--tinta); box-shadow: 5px 5px 0 var(--tinta); padding: 10px 12px 12px; }
.mesa h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; margin-bottom: 6px; }
.mesa h3 small { font-size: 13px; color: var(--gris); }
.carril { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 2px dashed rgba(20,17,15,.18); }
.carril:first-of-type { border-top: 0; }
.carril b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
.carril.cpu b { color: var(--gris); }
.carril .pts { font-variant-numeric: tabular-nums; font-size: 16px; }
.carril .barra { grid-column: 1 / -1; height: 10px; background: #eee3c2; border: 2px solid var(--tinta); overflow: hidden; }
.carril .barra i { display: block; height: 100%; background: var(--cian); transition: width .25s linear; }
.carril.lider .barra i { background: var(--amarillo); }
.carril.ko b, .carril.ko .pts { text-decoration: line-through; opacity: .55; }
.carril .vidas { color: var(--rojo); letter-spacing: 1px; font-size: 13px; }
.lado { display: grid; gap: 14px; }
.lado .panel { margin: 0; }
.nombres { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.podio { list-style: none; display: grid; gap: 6px; }
.podio li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; background: #fff; border: 3px solid var(--tinta); }
.podio li b { text-align: center; font-size: 18px; }
.vacio { color: var(--gris); font-size: 15px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header class="cab">
    <div><span class="kick">SALA DE LA CLASE · RONDAS DE MESA</span><h1 class="marca">Ninja <em>Race</em></h1></div>
    <div class="marcador"><span class="chip oro" id="chip-ronda">Ronda —</span><span class="chip cian" id="chip-sala">— en la sala</span></div>
  </header>
  <div class="fase"><h2 id="fase-titulo">Entren a la sala</h2><span class="reloj" id="fase-reloj"></span>
    <button class="btn verde chico" id="btn-empezar" type="button">Empezar ronda ▶</button></div>
  <div class="grid">
    <section class="mesas" id="mesas"></section>
    <aside class="lado">
      <section class="panel"><h2>En la <span>sala</span></h2><div class="nombres" id="presentes"></div></section>
      <section class="panel"><h2>Tabla de la <span>clase</span></h2><ol class="podio" id="ranking"></ol></section>
    </aside>
  </div>
  <p class="error" id="error" role="alert"></p>
</main>
<script type="module">
import { api, $, esc } from "./static/comun.js";
let v = null, desfase = 0;
const med = (p) => ["🥇", "🥈", "🥉"][p - 1] || p;
const seg = (ms) => Math.max(0, Math.ceil((ms - (Date.now() + desfase)) / 1000));
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function pintar() {
  if (!v) return;
  $("#chip-ronda").textContent = v.ronda ? `Ronda ${v.ronda}` : "Ronda 1 por empezar";
  $("#chip-sala").textContent = `${v.presentes.length} en la sala`;
  $("#presentes").innerHTML = v.presentes.length ? v.presentes.map((n) => `<span class="chip">${esc(n)}</span>`).join("") : `<span class="vacio">Nadie todavía: abran la escena y entren con su nombre.</span>`;
  $("#ranking").innerHTML = (v.ranking || []).slice(0, 10).map((p) => `<li><b>${med(p.puesto)}</b><span>${esc(p.nombre)}${p.ganadas ? ` · ${p.ganadas} 🏆` : ""}</span><span>${p.mejor} pts</span></li>`).join("") || `<li><b>—</b><span class="vacio">Sin rondas aún.</span><span></span></li>`;
  const titulo = $("#fase-titulo"), reloj = $("#fase-reloj"), btn = $("#btn-empezar");
  btn.hidden = !(v.fase === "lobby" || v.fase === "resultados");
  btn.textContent = v.fase === "resultados" ? "Otra ronda ▶" : "Empezar ronda ▶";
  if (v.fase === "lobby") { titulo.innerHTML = "Entren a la <em>sala</em>"; reloj.textContent = v.auto ? `empieza en ${seg(v.auto)} s` : ""; }
  else if (v.fase === "cuenta") { titulo.innerHTML = `Ronda ${v.ronda}: <em>¡a sus carriles!</em>`; reloj.textContent = String(seg(v.salida)); }
  else if (v.fase === "corre") { titulo.innerHTML = `Ronda ${v.ronda} <em>en carrera</em>`; reloj.textContent = mmss(Math.max(0, Math.floor((Date.now() + desfase - v.salida) / 1000))) + " / " + mmss(v.tope_ms / 1000); }
  else { titulo.innerHTML = `Ronda ${v.ronda}: <em>resultados</em>`; reloj.textContent = v.auto ? `siguiente en ${seg(v.auto)} s` : ""; }
  if (v.fase === "resultados") {
    $("#mesas").innerHTML = (v.resultados || []).map((r) => `<article class="mesa"><h3>Mesa ${r.mesa}<small>${r.puestos.length} alumnos</small></h3>
      <ol class="podio">${r.puestos.map((p) => `<li><b>${med(p.puesto)}</b><span>${esc(p.nombre)}</span><span>${p.puntos} pts</span></li>`).join("")}</ol></article>`).join("");
    return;
  }
  if (!v.mesas || !v.mesas.length || v.fase === "lobby") {
    $("#mesas").innerHTML = `<article class="mesa"><h3>Mesas de tres carriles</h3><p class="vacio">Al empezar la ronda se reparten: compañeros contra compañeros; si falta gente, KAGE y YUKI completan la mesa. Desde la segunda ronda, los de mejor puntaje corren juntos.</p></article>`;
    return;
  }
  $("#mesas").innerHTML = v.mesas.map((m) => {
    const tope = Math.max(1, ...m.asientos.filter((a) => a.humano).map((a) => a.puntos));
    const lider = Math.max(...m.asientos.filter((a) => a.humano).map((a) => a.puntos));
    return `<article class="mesa"><h3>Mesa ${m.n}<small>${m.asientos.filter((a) => a.humano).length} alumnos</small></h3>${m.asientos.map((a) => a.humano ? `
      <div class="carril${a.ko ? " ko" : ""}${a.puntos === lider && lider > 0 ? " lider" : ""}"><b>${esc(a.nombre)}</b><span class="pts">${a.puntos} pts</span>
        <span class="barra"><i style="width:${Math.round(100 * a.puntos / tope)}%"></i></span><span class="vidas">${"♥".repeat(a.vidas)}${"♡".repeat(Math.max(0, 3 - a.vidas))}</span></div>`
      : `<div class="carril cpu"><b>${esc(a.nombre)} · cpu</b><span class="pts">—</span></div>`).join("")}</article>`;
  }).join("");
}

async function leer() {
  try { v = await api("api/sala"); desfase = v.ahora - Date.now(); $("#error").textContent = ""; pintar(); }
  catch (ex) { $("#error").textContent = ex.message; }
}
function ritmo() { setTimeout(() => leer().finally(ritmo), v && (v.fase === "corre" || v.fase === "cuenta") ? 300 : 1000); }
$("#btn-empezar").addEventListener("click", async () => {
  try { await api("api/empezar", { method: "POST", body: "{}" }); await leer(); } catch (ex) { $("#error").textContent = ex.message; }
});
setInterval(pintar, 500);
await leer();
ritmo();
</script>
</body>
</html>
