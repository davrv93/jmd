# Ruleta de Ingeniería de Requerimientos (número + ruleta de 50 casillas, premio al instante): https://jmd-learn.online/ruleta-req/
# Contenedor sorteo-req en 127.0.0.1:18637 (fuente: ~/Documents/jmd/sorteo-req en la Mac).
location = /ruleta-req { return 301 /ruleta-req/; }
location ^~ /ruleta-req/ {
    proxy_pass http://127.0.0.1:18637/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
