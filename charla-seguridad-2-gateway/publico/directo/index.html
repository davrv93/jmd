<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bodega Demo</title><link rel="stylesheet" href="/estilo.css"></head>
<body class="app">
<header class="barra"><span class="marca">Bodega Demo</span><span class="sello mal">Sin gateway</span></header>
<main class="acceso" id="acceso">
  <form class="tarjeta" id="entrar">
    <div><h1>Inicia sesión</h1><p>Entra para ver y pagar tus facturas.</p></div>
    <label class="campo">Usuario<input id="usuario" value="ana" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="campo">Contraseña<input id="clave" type="password" autocomplete="current-password" required></label>
    <button class="primario">Iniciar sesión</button>
    <p class="aviso" id="aviso" role="alert"></p>
    <p class="pista">Cuentas de prueba: ana, beto y caja</p>
  </form>
</main>
<main class="tablero" id="tablero" hidden>
  <div class="fila-t"><h2 id="quien">Tus facturas</h2><button class="salir" id="salir" type="button">Cerrar sesión</button></div>
  <div class="caja"><table><thead><tr><th>Factura</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody id="filas"></tbody></table></div>
  <details class="tecnico"><summary>Ver última respuesta</summary><pre id="salida" aria-live="polite"></pre></details>
</main>
<script src="/app.js"></script></body></html>
