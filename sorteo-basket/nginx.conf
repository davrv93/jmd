# Sorteo basket del taller «Orquestación con Qwen Coder» (público): https://jmd-learn.online/sorteo-basket/
# Contenedor sorteo-basket en 127.0.0.1:18740 (fuente: ~/Documents/jmd/sorteo-basket en la Mac). Usa WebSocket en /sorteo-basket/ws.
location = /sorteo-basket { return 301 /sorteo-basket/; }
location ^~ /sorteo-basket/ {
    proxy_pass http://127.0.0.1:18740/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 8k;
}
