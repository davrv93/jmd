# Ruleta de Cursos (nombre + celular, gira y gana al instante): https://jmd-learn.online/ruleta-cursos/
# Contenedor sorteo-cursos en 127.0.0.1:18638 (fuente: ~/Documents/jmd/sorteo-cursos en la Mac).
location = /ruleta-cursos { return 301 /ruleta-cursos/; }
location ^~ /ruleta-cursos/ {
    proxy_pass http://127.0.0.1:18638/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
