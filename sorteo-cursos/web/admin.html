<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Ruleta de Cursos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
:root{--bg:#140f2e;--panel:#241c55;--line:#3b3178;--fg:#f6f1ff;--muted:#b9aee0;--gold:#f5c542;--coral:#ff6b6b;--mint:#4ee6b4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px 16px 60px}
main{max-width:1000px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:26px}h1 small{color:var(--gold);font-size:13px;letter-spacing:.12em;text-transform:uppercase;display:block}
h2{margin:0 0 8px;font-size:17px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#1d1744;color:var(--fg);width:100%;max-width:320px}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:9px;border:0;background:var(--gold);color:#2a1d00;cursor:pointer;margin:8px 8px 0 0}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.peligro{background:var(--coral);color:#3d0a0a}
.error{color:var(--coral);min-height:1.4em;margin:6px 0 0}
.suave{color:var(--muted);margin:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td button{font:inherit;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;margin-right:4px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.ok{color:var(--mint);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1><small>Panel del organizador</small>Ruleta de Cursos</h1>

  <section class="panel" id="login">
    <label for="clave">Clave del panel</label>
    <input id="clave" type="password" autocomplete="current-password">
    <button class="btn" id="btn-entrar" type="button">Entrar</button>
    <p class="error" id="login-error"></p>
  </section>

  <div id="panel" hidden>
    <section class="panel">
      <h2>Estado: <span id="fase"></span></h2>
      <p class="suave" id="resumen"></p>
      <button class="btn" id="btn-cerrar" type="button">Cerrar el sorteo (revela la semilla)</button>
      <button class="btn sec" id="btn-abrir" type="button">Reabrir (semilla nueva)</button>
      <button class="btn sec" id="btn-csv" type="button">⬇ Exportar CSV</button>
      <button class="btn sec" id="btn-refrescar" type="button">↻ Refrescar</button>
      <p class="error" id="error"></p>
      <p class="suave mono" id="huellas"></p>
    </section>

    <section class="panel">
      <h2>Validar un código</h2>
      <div class="fila">
        <div><label for="v-codigo">Código (ej. D40-4321-A1B2)</label><input id="v-codigo" class="mono" placeholder="D40-4321-A1B2"></div>
        <button class="btn" id="btn-validar" type="button" style="margin:0">Validar</button>
      </div>
      <p id="v-resultado" style="margin:8px 0 0"></p>
    </section>

    <section class="panel">
      <h2>Ganadores <span id="total"></span></h2>
      <div class="tabla"><table>
        <thead><tr><th>#</th><th>Hora</th><th>Nombre</th><th>Celular</th><th>Premio</th><th>Código</th><th>IP</th><th></th></tr></thead>
        <tbody id="personas"></tbody>
      </table></div>
    </section>

    <section class="panel">
      <h2>Volver a empezar</h2>
      <p class="suave">Borra personas y premios, con semilla nueva. Solo para otra edición.</p>
      <div class="fila">
        <input id="confirmar" placeholder="escribe REINICIAR" style="max-width:220px">
        <button class="btn peligro" id="btn-reiniciar" type="button" style="margin:0">Reiniciar</button>
      </div>
    </section>
  </div>
</main>
<script>
(function(){
  var BASE = new URL(".", location.href).pathname.replace(/admin\/?$/, "");
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var hora=function(iso){return new Date(iso).toLocaleTimeString('es-PE',{timeZone:'America/Lima',hour:'2-digit',minute:'2-digit'});};
  var NOMBRE={D30:'30 %',D40:'40 %',D50:'50 %',X6:'6 × S/100'};
  var clave=''; try{clave=sessionStorage.getItem('ruleta-cursos-clave')||'';}catch(e){}
  function adm(ruta,cuerpo){
    var op=cuerpo===undefined?{headers:{'X-Clave':clave}}:{method:'POST',headers:{'X-Clave':clave,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)};
    return fetch(BASE+ruta,op).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok)throw new Error(d.error||('Error '+r.status));return d;});});
  }
  var estado=null;
  function pintar(e){
    estado=e; $('#login').hidden=true; $('#panel').hidden=false;
    $('#fase').textContent=e.fase==='abierto'?'abierto · la gente puede girar':'cerrado';
    $('#btn-cerrar').hidden=e.fase!=='abierto'; $('#btn-abrir').hidden=e.fase!=='cerrado';
    $('#resumen').textContent=e.personasLista.length+' giros · '+Object.keys(e.entregados).map(function(k){return NOMBRE[k]+': '+e.entregados[k];}).join(' · ');
    $('#huellas').textContent='Huella publicada: '+e.compromiso+(e.fase==='cerrado'?'\nSemilla revelada: '+e.semilla:'');
    $('#total').textContent='('+e.personasLista.length+')';
    $('#personas').innerHTML=e.personasLista.slice().reverse().map(function(p){
      return '<tr><td>'+p.id+'</td><td>'+hora(p.hora)+'</td><td>'+esc(p.nombre)+'</td><td class="mono">'+esc(p.telefono)+'</td><td>'+esc(NOMBRE[p.premio]||p.premio)+'</td><td class="mono">'+esc(p.codigo)+'</td><td class="mono">'+esc(p.ip)+'</td>'+
        '<td><button data-ren="'+p.id+'">Renombrar</button><button data-quitar="'+p.id+'">Quitar</button></td></tr>';
    }).join('');
  }
  function cargar(){return adm('api/admin/estado').then(pintar);}
  function fallo(ex){$('#error').textContent=ex.message;}
  $('#btn-entrar').onclick=function(){
    clave=$('#clave').value; try{sessionStorage.setItem('ruleta-cursos-clave',clave);}catch(e){}
    cargar().catch(function(ex){$('#login-error').textContent=ex.message;});
  };
  $('#clave').addEventListener('keydown',function(e){if(e.key==='Enter')$('#btn-entrar').click();});
  $('#btn-refrescar').onclick=function(){cargar().catch(fallo);};
  $('#btn-cerrar').onclick=function(){adm('api/admin/cerrar',{}).then(pintar).catch(fallo);};
  $('#btn-abrir').onclick=function(){adm('api/admin/abrir',{}).then(pintar).catch(fallo);};
  $('#btn-csv').onclick=function(){
    fetch(BASE+'api/admin/csv',{headers:{'X-Clave':clave}}).then(function(r){return r.blob();}).then(function(b){
      var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ruleta-cursos.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    }).catch(fallo);
  };
  $('#btn-validar').onclick=function(){
    var c=$('#v-codigo').value.trim().toUpperCase(); if(!c)return;
    adm('api/admin/validar?codigo='+encodeURIComponent(c)).then(function(d){
      $('#v-resultado').innerHTML=d.valido?'<span class="ok">✓ Válido</span> · '+esc(d.persona.nombre)+' · '+esc(d.persona.telefono)+' · '+esc(NOMBRE[d.persona.premio]||d.persona.premio)+' · '+hora(d.persona.hora):'<span style="color:var(--coral)">✗ No existe ese código</span>';
    }).catch(fallo);
  };
  $('#personas').onclick=function(e){
    var b=e.target.closest('button'); if(!b)return;
    if(b.dataset.ren){var n=prompt('Nombre corregido:'); if(n)adm('api/admin/renombrar',{id:+b.dataset.ren,nombre:n}).then(pintar).catch(fallo);}
    if(b.dataset.quitar){if(confirm('¿Quitar este giro? Libera el celular para que pueda girar de nuevo.'))adm('api/admin/quitar',{id:+b.dataset.quitar}).then(pintar).catch(fallo);}
  };
  $('#btn-reiniciar').onclick=function(){
    if($('#confirmar').value!=='REINICIAR'){$('#error').textContent='Escribe REINICIAR para confirmar.';return;}
    adm('api/admin/reiniciar',{}).then(function(e){$('#confirmar').value='';pintar(e);}).catch(fallo);
  };
  if(clave)cargar().catch(function(){});
})();
</script>
</body>
</html>
