# Isla Gomita pública (carrera de plataformas, sin cuenta): https://jmd-learn.online/isla-gomita/
# Contenedor isla-gomita en 127.0.0.1:18693 (fuente: ~/Documents/jmd/isla-gomita en la Mac).
location = /isla-gomita { return 301 /isla-gomita/; }
location ^~ /isla-gomita/ {
    proxy_pass http://127.0.0.1:18693/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
