# Sorteo de la pirámide (grupo Claude Code PRO, cupones para Claude Code PRO Grupo 2): https://jmd-learn.online/piramide/
# Contenedor sorteo-piramide en 127.0.0.1:18680 (fuente: ~/Documents/jmd/sorteo-piramide en la Mac).
location = /piramide { return 301 /piramide/; }
location ^~ /piramide/ {
    proxy_pass http://127.0.0.1:18680/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
