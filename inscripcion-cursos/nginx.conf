# Inscripción especial a cursos, sin precios: https://jmd-learn.online/inscripcion-especial/
# Contenedor inscripcion-cursos en 127.0.0.1:18650 (fuente: ~/Documents/jmd/inscripcion-cursos en la Mac).
location = /inscripcion-especial { return 301 /inscripcion-especial/; }
location ^~ /inscripcion-especial/ {
    proxy_pass http://127.0.0.1:18650/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
