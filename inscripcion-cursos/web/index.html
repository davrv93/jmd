<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Inscripción a cursos · JMD Learning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--noche:#0f1020;--panel:#191a33;--borde:#34365c;--oro:#f2c14e;--crema:#f2f0e6;--gris:#b9b6ab;--coral:#ff9c88}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--noche);color:var(--crema);font:400 16px/1.35 Inter,system-ui,sans-serif}
/* los datos siempre a la vista: solo la lista de cursos hace scroll */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1120px;margin:0 auto}
.datos{flex:none;padding:12px 16px;border-bottom:1px solid var(--borde)}
.lista{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;overscroll-behavior:contain}
.tope{display:flex;align-items:baseline;gap:10px}
h1{font:800 24px/1.1 Outfit,sans-serif;letter-spacing:-.01em}
.k{font:600 14px/1 Inter,sans-serif;color:var(--oro);white-space:nowrap}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.campos .ancho{grid-column:1 / -1}
label.c{display:block;font:600 14px/1.2 Inter,sans-serif;color:var(--gris)}
input.t{display:block;width:100%;margin-top:3px;padding:9px 11px;font:400 16px/1.2 Inter,sans-serif;color:var(--crema);background:var(--panel);border:1px solid var(--borde);border-radius:10px}
input.t:focus{outline:2px solid var(--oro);outline-offset:0}
.accion{display:flex;gap:10px;align-items:center;margin-top:10px}
#cuenta{flex:1;color:var(--gris);font-weight:600;font-size:15px}
button{font:800 16px/1 Outfit,sans-serif;padding:12px 18px;border:0;border-radius:10px;background:var(--oro);color:var(--noche);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#error{color:var(--coral);font-weight:600;font-size:15px;margin-top:6px}
#error:empty{display:none}
h2{position:sticky;top:-4px;z-index:1;background:var(--noche);font:700 14px/1 Inter,sans-serif;color:var(--oro);padding:10px 0 6px}
.op{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;padding:7px 10px;background:var(--panel);border:2px solid transparent;border-radius:10px;margin-bottom:4px;cursor:pointer}
.op:has(input:checked){border-color:var(--oro)}
.op:has(input:focus-visible){outline:2px solid var(--crema);outline-offset:1px}
.op input{width:22px;height:22px;margin:0;accent-color:var(--oro);cursor:pointer}
.op b{display:block;font:700 16px/1.2 Outfit,sans-serif}
.op small{display:block;color:var(--gris);font-size:15px;line-height:1.25}
.op small em{font-style:normal;color:var(--crema);font-weight:600}
fieldset{border:0;padding:0;min-width:0}
.oculto{position:absolute;left:-9999px}
.nota{color:var(--gris);font-size:14px;padding-top:8px}
#hecho{display:none;max-width:680px;margin:0 auto;padding:32px 16px}
#hecho h1{font-size:34px}
#hecho .sub{color:var(--gris);margin-top:10px}
#hecho ul{padding:0;margin-top:16px}
#hecho li{margin-top:8px;list-style:none;padding:12px;background:var(--panel);border-radius:12px}
#hecho li b{display:block;font:700 17px/1.25 Outfit,sans-serif}
#hecho li span{color:var(--gris)}
.wa{display:block;text-align:center;margin-top:18px;padding:15px;border-radius:12px;background:#25d366;color:#06301f;font:800 17px/1 Outfit,sans-serif;text-decoration:none}
@media (min-width:860px){
  .app{flex-direction:row-reverse;gap:24px;padding:0 24px}
  .datos{flex:0 0 340px;align-self:center;padding:22px;border:1px solid var(--borde);border-radius:16px;background:var(--panel)}
  .tope{display:block}
  h1{font-size:34px;margin-top:6px}
  .campos{grid-template-columns:1fr;gap:12px;margin-top:16px}
  input.t{background:var(--noche)}
  .accion{flex-direction:column;align-items:stretch;margin-top:16px}
  #cuenta{text-align:center}
  .lista{padding:16px 8px 24px 0}
  h2{top:-16px}
  .grupo{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
  .grupo h2{grid-column:1 / -1}
  .op{margin:0}
}
</style>
</head>
<body>
<form id="form" class="app" novalidate>
  <section class="datos" aria-label="Tus datos">
    <div class="tope"><p class="k">JMD Learning</p><h1>Elige tus cursos</h1></div>
    <div class="campos">
      <label class="c ancho">Nombre y apellido<input class="t" name="nombre" autocomplete="name" required maxlength="80"></label>
      <label class="c">Celular<input class="t" name="telefono" inputmode="tel" autocomplete="tel" required placeholder="987654321"></label>
      <label class="c">Correo<input class="t" name="correo" type="email" autocomplete="email" required></label>
      <label class="oculto" aria-hidden="true">Sitio<input name="sitio" tabindex="-1" autocomplete="off"></label>
    </div>
    <p id="error" role="alert"></p>
    <div class="accion"><span id="cuenta">0 cursos marcados</span><button id="enviar" type="submit">Inscribirme</button></div>
  </section>
  <fieldset class="lista"><legend class="oculto">Cursos</legend><div id="lista"></div>
    <p class="nota">Clases en vivo, hora de Lima. Usamos tus datos solo para confirmar tu inscripción.</p>
  </fieldset>
</form>
<main id="hecho">
  <p class="k">JMD Learning</p>
  <h1>¡Listo! Recibimos tu inscripción</h1>
  <p class="sub">Te escribiremos por WhatsApp para confirmar.</p>
  <ul id="resumen"></ul>
  <a class="wa" id="wa" target="_blank" rel="noopener">Escribir por WhatsApp</a>
</main>
<script>
(function(){
  var BASE=new URL('.',location.href).pathname, CURSOS=[];
  var form=document.getElementById('form'), error=document.getElementById('error'), enviar=document.getElementById('enviar');
  function marcados(){return [].slice.call(form.querySelectorAll('input[name=curso]:checked')).map(function(i){return i.value;});}
  function contar(){var n=marcados().length;document.getElementById('cuenta').textContent=n+(n===1?' curso marcado':' cursos marcados');}
  function texto(tag,t){var e=document.createElement(tag);e.textContent=t;return e;}
  fetch(BASE+'api/cursos').then(function(r){return r.json();}).then(function(d){
    CURSOS=d;var lista=document.getElementById('lista'),area='',grupo;
    d.forEach(function(c){
      if(c.area!==area){area=c.area;grupo=document.createElement('div');grupo.className='grupo';grupo.appendChild(texto('h2',area));lista.appendChild(grupo);}
      var l=document.createElement('label');l.className='op';
      var i=document.createElement('input');i.type='checkbox';i.name='curso';i.value=c.id;i.addEventListener('change',contar);
      var t=document.createElement('div'),m=texto('small',' · '+c.fechas);m.insertBefore(texto('em',c.horario),m.firstChild);t.appendChild(texto('b',c.nombre));t.appendChild(m);
      l.appendChild(i);l.appendChild(t);grupo.appendChild(l);
    });
  }).catch(function(){error.textContent='No pude cargar los cursos. Recarga la página.';});
  form.addEventListener('submit',function(e){
    e.preventDefault();error.textContent='';
    if(!marcados().length){error.textContent='Marca al menos un curso.';return;}
    enviar.disabled=true;
    var f=new FormData(form),cuerpo={nombre:f.get('nombre'),telefono:f.get('telefono'),correo:f.get('correo'),sitio:f.get('sitio'),cursos:marcados()};
    fetch(BASE+'api/inscribir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(x){
      if(!x.ok){error.textContent=x.d.error||'No se pudo enviar. Intenta otra vez.';return;}
      var res=document.getElementById('resumen'),nombres=[];
      cuerpo.cursos.forEach(function(id){var c=CURSOS.filter(function(k){return k.id===id;})[0];if(!c)return;nombres.push(c.nombre);
        var li=document.createElement('li');li.appendChild(texto('b',c.nombre));li.appendChild(texto('span',c.horario+' · '+c.fechas));res.appendChild(li);});
      document.getElementById('wa').href='https://wa.me/51986149476?text='+encodeURIComponent('Hola, soy '+cuerpo.nombre+'. Me inscribí en: '+nombres.join(', ')+'.');
      form.style.display='none';document.getElementById('hecho').style.display='block';scrollTo(0,0);
    }).catch(function(){error.textContent='No se pudo enviar. Revisa tu conexión.';})
    .finally(function(){enviar.disabled=false;});
  });
})();
</script>
</body>
</html>
