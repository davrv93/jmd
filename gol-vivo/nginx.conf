# Gol en vivo: cancha pública compartida. https://jmd-learn.online/gol-vivo/
# Contenedor gol-vivo en 127.0.0.1:18655 (fuente: ~/Documents/jmd/gol-vivo en la Mac).
location = /gol-vivo { return 301 /gol-vivo/; }
location = /gol-vivo/api/ws {
    proxy_pass http://127.0.0.1:18655/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
}
location ^~ /gol-vivo/ {
    proxy_pass http://127.0.0.1:18655/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
