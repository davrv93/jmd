# Sorteo QA (número + ruleta de 50 casillas, premio al instante): https://jmd-learn.online/sorteo-qa/
# Contenedor sorteo-qa en 127.0.0.1:18635 (fuente: ~/Documents/jmd/sorteo-qa en la Mac).
location = /sorteo-qa { return 301 /sorteo-qa/; }
location ^~ /sorteo-qa/ {
    proxy_pass http://127.0.0.1:18635/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
