# DeepSeek Harness · Grupo 3: creación de cuenta para alumnos que ya pagaron (11-11-2026): https://jmd-learn.online/deepseek-g3/
# Página estática que usa POST /api/v1/inscripcion/deepseek-harness-3 del LMS (mismo dominio: la sesión queda abierta).
location = /deepseek-g3 { return 301 /deepseek-g3/; }
location ^~ /deepseek-g3/ {
    alias /var/www/deepseek-g3/;
    index index.html;
    add_header Cache-Control "no-cache";
}
