# Kit robo-local-nube: topes de ritmo de la ruta pública /aula-nube/ (contexto http).
# Copiar a /etc/nginx/conf.d/aula-nube-zonas.conf. En clase todos salen por la MISMA IP pública: por eso el
# tope fuerte es por token (cada alumno el suyo) y el de IP es holgado.
limit_req_zone $http_authorization zone=aula_nube_texto:10m rate=60r/m;
limit_req_zone $http_authorization zone=aula_nube_imagen:5m rate=10r/m;
limit_req_zone $http_authorization zone=aula_nube_stt:5m rate=20r/m;
limit_req_zone $binary_remote_addr zone=aula_nube_ip:10m rate=600r/m;
