# Kit robo-local-nube: la nube del curso para los alumnos que trabajan en su laptop.
# Va DENTRO del server { } de jmd-learn.online (443):   include /etc/nginx/snippets/aula-nube.conf;
# Requiere aula-nube-zonas.conf en conf.d y el módulo auth_request (viene en el nginx de Ubuntu).
#
#   /aula-nube/v1/...        -> gateway ai-orchestrator (127.0.0.1:4000). Lo valida él: token personal jg_ del
#                               alumno (o access token del realm para /v1/auth/exchange), con cuotas por alumno.
#   /aula-nube/imagen/...    -> servicio de imagen (127.0.0.1:18600): solo «maxima» y voz desde fuera.
#   /aula-nube/stt[/salud]   -> voz a texto (127.0.0.1:18610).
# Imagen y dictado pasan antes por auth_request contra /v1/auth/me del gateway (sin token válido no llegan a
# Python) y llevan «X-Aula-Nube: 1», que nginx pone SIEMPRE (pisa la del cliente): así esos servicios saben que
# la petición viene de fuera y aplican las reglas del kit. Nada de /admin, /ui ni otras rutas del gateway.

location = /aula-nube/_auth {
    internal;
    proxy_pass http://127.0.0.1:4000/v1/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
}

# Página para que el alumno saque su token personal sin el kit: entra con su cuenta del curso (device grant
# contra /kc, mismo dominio) y la página canjea el acceso en /aula-nube/v1/auth/exchange. Luego lo pega en
# JMDesign (Gateway del curso). El HTML vive en /var/www/aula-nube/ (copia de aula-nube-mi-token.html).
location = /aula-nube/mi-token {
    default_type text/html;
    alias /var/www/aula-nube/mi-token.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}

# Cualquier otra cosa bajo /aula-nube/ no existe (no cae al LMS). Las regex de abajo ganan a este prefijo.
location /aula-nube/ {
    default_type application/json;
    return 404 '{"error":{"code":"no_existe","message":"ruta desconocida en la nube del curso"}}';
}

location ~ ^/aula-nube/(v1/(?:chat/completions|messages|messages/count_tokens|models|auth/me|auth/exchange|auth/token))$ {
    limit_req zone=aula_nube_texto burst=40 nodelay;
    limit_req zone=aula_nube_ip burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;              # respuestas en streaming (SSE) de los agentes
    proxy_read_timeout 300s;
    client_max_body_size 4m;
}

# La salud no cuenta contra el tope de imágenes (Robo la consulta en cada /api/salud).
location = /aula-nube/imagen/salud {
    auth_request /aula-nube/_auth;
    limit_req zone=aula_nube_ip burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18600/salud;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Aula-Nube 1;
}

location ~ ^/aula-nube/imagen/(generar|voz)$ {
    auth_request /aula-nube/_auth;
    limit_req zone=aula_nube_imagen burst=10 nodelay;
    limit_req zone=aula_nube_ip burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18600/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Aula-Nube 1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    client_max_body_size 64k;
}

location = /aula-nube/stt {
    auth_request /aula-nube/_auth;
    limit_req zone=aula_nube_stt burst=5 nodelay;
    limit_req zone=aula_nube_ip burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18610/stt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Aula-Nube 1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    client_max_body_size 6m;
}

location = /aula-nube/stt/salud {
    auth_request /aula-nube/_auth;
    limit_req zone=aula_nube_ip burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18610/salud;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Aula-Nube 1;
}
