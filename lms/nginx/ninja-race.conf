# Sorteo Ninja Race (link aparto del LMS)
#
# Va DENTRO del server { } de jmd-learn.online (443), ANTES de «location / {»:
#   include /etc/nginx/snippets/ninja-race.conf;
# Copia este archivo con:
#   sudo cp lms/nginx/ninja-race.conf /etc/nginx/snippets/ninja-race.conf
#   sudo nginx -t && sudo systemctl reload nginx
# El contenedor escucha en 127.0.0.1:18595 (ver ninja-race/desplegar.sh).

location = /ninja-race { return 301 /ninja-race/; }

# Panel del instructor en vivo (WebSocket).
location = /ninja-race/api/admin/vivo {
    proxy_pass http://127.0.0.1:18595/api/admin/vivo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
}

location ^~ /ninja-race/ {
    proxy_pass http://127.0.0.1:18595/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}