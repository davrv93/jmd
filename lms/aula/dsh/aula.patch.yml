# Capa extra de DeepSeek Harness para el aula (se pasa con «dsh --patch /opt/dsh-aula.patch.yml»).
# Va por línea de comandos y no por ~/.dsh: el home del aula es un tmpfs que se vacía, y esta capa tiene
# precedencia sobre la interfaz web (el interruptor de Ajustes queda bloqueado en «apagado»).
#
# «Upload Session Log when using the official model API» viene ENCENDIDO por defecto: sube a DeepSeek
# el registro de la sesión con cada petición. En el aula (alumnos, trabajos de clase) se deja APAGADO.
- id: session-log-deepseek
  config:
    enabled: false
# La telemetría de comentarios (OTLP) ya se apaga con DSH_TELEMETRY_DISABLED=1 (Dockerfile); aquí se
# repite por si alguien lanza dsh sin esa variable.
- id: session-telemetry-otel
  disabled: true
