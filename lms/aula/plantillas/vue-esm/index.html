<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue sin instalar nada</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; } button { padding: .5rem 1rem; font-size: 1rem; }</style>
  <script type="importmap">{"imports":{"vue":"https://esm.sh/vue@3.5.13/dist/vue.esm-browser.js"}}</script>
</head>
<body>
  <div id="app">
    <h1>Contador: {{ n }}</h1>
    <button @click="n++">Sumar</button>
  </div>
  <script type="module">
    import { createApp, ref } from "vue";
    createApp({ setup() { return { n: ref(0) }; } }).mount("#app");
  </script>
</body>
</html>
