<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React sin instalar nada</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; } button { padding: .5rem 1rem; font-size: 1rem; }</style>
  <script type="importmap">
    {"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","htm":"https://esm.sh/htm@3.1.1"}}
  </script>
</head>
<body>
  <div id="raiz"></div>
  <script type="module">
    import { useState } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";
    import React from "react";
    const html = htm.bind(React.createElement);
    function Contador() {
      const [n, setN] = useState(0);
      return html`<div><h1>Contador: ${n}</h1><button onClick=${() => setN(n + 1)}>Sumar</button></div>`;
    }
    createRoot(document.getElementById("raiz")).render(html`<${Contador} />`);
  </script>
</body>
</html>
