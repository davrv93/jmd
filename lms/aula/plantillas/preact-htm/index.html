<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preact sin instalar nada</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; } button { padding: .5rem 1rem; font-size: 1rem; }</style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { html, render, useState } from "https://esm.sh/htm@3.1.1/preact/standalone";
    function Contador() {
      const [n, setN] = useState(0);
      return html`<div><h1>Contador: ${n}</h1><button onClick=${() => setN(n + 1)}>Sumar</button></div>`;
    }
    render(html`<${Contador} />`, document.getElementById("app"));
  </script>
</body>
</html>
