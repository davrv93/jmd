<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi página</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    button { padding: .5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Hola, esta es mi página</h1>
  <p>Edita <code>index.html</code> en la terminal y esta vista se actualiza sola.</p>
  <button id="boton">Tócame</button>
  <p id="mensaje"></p>
  <script>
    document.getElementById("boton").addEventListener("click", () => {
      document.getElementById("mensaje").textContent = "Funciona: " + new Date().toLocaleTimeString("es-PE");
    });
  </script>
</body>
</html>
