# Ver Dockerfile. Solo CONNECT al 443 de los dominios de «permitidos»; todo lo demás, 403.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 64
LogLevel Notice
# Sin «Allow»: acepta a cualquiera que lo alcance. Solo está en aula_net (interna) y en la red del compose.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/permitidos"
ConnectPort 443
DisableViaHeader Yes
