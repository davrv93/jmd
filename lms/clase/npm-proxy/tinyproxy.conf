# Ver Dockerfile. Solo CONNECT al 443 de los dominios de «permitidos»; todo lo demás, 403.
# Desde el 20-10-2026 «permitidos» abre todo HTTPS: el instructor pidió salida a internet para las aulas.
# Para volver a solo npm: deja en «permitidos» la línea ^registry\.npmjs\.org$ y reconstruye npm-proxy.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 64
LogLevel Notice
# Sin «Allow»: acepta a cualquiera que lo alcance. Solo está en aula_net (interna) y en la red del compose.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/permitidos"
ConnectPort 443
DisableViaHeader Yes
