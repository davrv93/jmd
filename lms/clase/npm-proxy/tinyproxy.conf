# Ver Dockerfile. Filtra por los dominios de «permitidos»; CONNECT solo a los puertos 443 y 80.
# Desde el 20-10-2026 «permitidos» abre todo: el instructor pidió salida a internet para las aulas.
# Desde el 27-10-2026 las aulas nuevas llevan también HTTP_PROXY, así que el http:// plano sale por aquí.
# Para volver a solo npm: deja en «permitidos» la línea ^registry\.npmjs\.org$ y reconstruye npm-proxy.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 64
LogLevel Notice
# Sin «Allow»: acepta a cualquiera que lo alcance. Solo está en aula_net (interna) y en la red del compose.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/permitidos"
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
