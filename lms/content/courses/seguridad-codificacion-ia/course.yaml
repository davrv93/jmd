id: seguridad-codificacion-ia
title: "Seguridad en codificación con IA: lo que muchos olvidan"
description: >
  El código que escribe la IA funciona, pero no siempre es seguro. Aprende a revisarlo: los agujeros más
  comunes del código generado, las vulnerabilidades típicas de PHP y Node, y las dependencias que nadie
  actualiza (como Brotli) y que dejan la puerta abierta. Clases en vivo por Zoom los miércoles 18 y 25 de
  noviembre y 2 de diciembre de 2026, de 7:30 a 9:00 pm (Lima).
cohorts: [seguridad-ia-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  La auditoría de un proyecto tuyo (o de uno de práctica): las vulnerabilidades encontradas con
  herramientas abiertas, su prioridad, la corrección que le pediste a la IA y la prueba de que quedó cerrada.
requisitos:
  - Una laptop con navegador actual y conexión a internet
  - Una cuenta en jmd-learn.online
  - Conocimientos básicos de PHP o de Node (leer código, no hace falta ser experto)
dedicacion: "3 clases en vivo de 90 minutos (miércoles 18 y 25 de noviembre y 2 de diciembre de 2026), 7:30 a 9:00 pm, hora de Lima"

modules:
  - id: s1
    title: "Sesión 1 · Lo que la IA no te dice: revisar código generado"
    lessons: [sc-01]
  - id: s2
    title: "Sesión 2 · PHP y Node: las vulnerabilidades de siempre"
    lessons: [sc-02]
  - id: s3
    title: "Sesión 3 · Brotli y las dependencias que se olvidan"
    lessons: [sc-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Seguridad con IA", grupo: "Grupo 1", area: seguridad, minutos: 90}
