id: 06-npm-audit-y-composer-audit
titulo: "Audita dependencias: npm audit y composer audit"
fase: experimentacion
paso: auditar
duracion_min: 11
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: ninguna
comandos:
  - titulo: "Node: ver qué está instalado"
    cmd: "npm ls --depth=0"
  - titulo: "Node: auditoría de dependencias"
    cmd: "npm audit"
  - titulo: "Node: sugerir arreglos (con cuidado)"
    cmd: "npm audit fix"
  - titulo: "PHP: ver qué está instalado"
    cmd: "composer show --direct"
  - titulo: "PHP: auditoría de dependencias"
    cmd: "composer audit"
