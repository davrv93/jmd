id: ia-para-todos-deepseek
title: "IA para todos: DeepSeek Harness"
description: >
  Tres sesiones prácticas para usar un asistente de IA (DeepSeek Harness) con tu propia cuenta de DeepSeek, sin saber
  programar. En la sesión 1 creas tu cuenta y tu clave y lo usas para cosas del día a día: mensajes, resúmenes,
  explicaciones, ideas y pequeñas herramientas que funcionan (lista de compras, calculadora de precios, control de
  gastos). En la sesión 2 aprendes a pedir mejor y a medir cuánto gasta, para gastar menos saldo. En la sesión 3 lo
  usas en un proyecto de práctica más grande y revisas su trabajo paso a paso. Clases en vivo por Zoom: domingos 15,
  22 y 29 de noviembre de 2026, de 7:30 a 9:00 pm (Lima).
cohorts: [ia-para-todos-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tus herramientas del día a día hechas con IA, un informe de cuánto gasta el asistente antes y después de
  aprender a pedir mejor, y la documentación de un proyecto de práctica revisada paso a paso.
requisitos:
  - No necesitas saber programar
  - "Un navegador para entrar a tu aula del LIVE (ahí ya vienen Node 24 y DeepSeek Harness: no instalas nada)"
  - "Opcional, para trabajar en casa con tu laptop: Node.js 24.9 o superior"
  - Una cuenta en jmd-learn.online y una tarjeta o medio de pago para recargar saldo en DeepSeek
dedicacion: "3 clases en vivo de 90 minutos: domingos 15, 22 y 29 de noviembre, 7:30 a 9:00 pm (Lima) · 4 h 30 min"
# Inscripción: jmd-learn.online/inscripcion/ia-para-todos-1/ · WhatsApp 986 149 476.

modules:
  - id: s1
    title: "Sesión 1 · Tu clave y tus primeros usos útiles"
    lessons: [ipt-01]
  - id: s2
    title: "Sesión 2 · Mide y reduce el consumo"
    lessons: [ipt-02]
  - id: s3
    title: "Sesión 3 · Describe por roles, audita y valida"
    lessons: [ipt-03]
  - id: extra
    title: "Lectura · Qué gasta tu cuota de Claude"
    lessons: [ipt-04]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "IA para todos: DeepSeek Harness", grupo: "Grupo 1", area: agentica, minutos: 90}

