id: ia-para-todos-deepseek
title: "IA para todos: DeepSeek Harness"
description: >
  Tres sesiones prácticas para usar un agente con tu propia cuenta de DeepSeek y documentar un sistema real:
  creas la cuenta, recargas saldo y configuras tu API key en DeepSeek Harness; eliges uno de 15 sistemas de
  práctica (SPA completas con roles, reportes, cálculos y mecanismos de seguridad) y le tomas la «foto»;
  mides cuánto consume el agente al describirlo; y entregas documentación comprobable: descripción por roles,
  auditoría de seguridad y mapa del sistema. Clases en vivo por Zoom: domingos 15, 22 y 29 de noviembre de 2026,
  de 7:30 a 9:00 pm (Lima).
cohorts: [ia-para-todos-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  La foto de tu sistema de práctica, un informe comparativo del consumo antes y después, y un paquete de
  documentación validada: descripción por roles, auditoría de seguridad, mapa del sistema con diagramas y
  dudas verificadas contra el código.
requisitos:
  - Conocimientos básicos de terminal
  - "Un navegador para entrar a tu aula del LIVE (ahí ya vienen Node 24 y DeepSeek Harness: no instalas nada)"
  - "Opcional, para trabajar en casa con tu laptop: Node.js 24.9 o superior"
  - Una cuenta en jmd-learn.online y una tarjeta o medio de pago para recargar saldo en DeepSeek
dedicacion: "3 clases en vivo de 90 minutos: domingos 15, 22 y 29 de noviembre, 7:30 a 9:00 pm (Lima) · 4 h 30 min"
# Inscripción: jmd-learn.online/inscripcion/ia-para-todos-1/ · WhatsApp 986 149 476.

modules:
  - id: s1
    title: "Sesión 1 · Cuenta, clave y la foto de tu sistema"
    lessons: [ipt-01]
  - id: s2
    title: "Sesión 2 · Mide y reduce el consumo"
    lessons: [ipt-02]
  - id: s3
    title: "Sesión 3 · Describe por roles, audita y valida"
    lessons: [ipt-03]
  - id: extra
    title: "Lectura · Qué gasta tu cuota de Claude"
    lessons: [ipt-04]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "IA para todos: DeepSeek Harness", grupo: "Grupo 1", area: agentica, minutos: 90}
