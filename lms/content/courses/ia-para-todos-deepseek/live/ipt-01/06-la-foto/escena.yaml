id: 06-la-foto
titulo: "La foto del sistema: qué trae y cómo leerla"
fase: conceptualizacion
paso: foto
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Tomar la foto de tu sistema en el aula (usa bun)"
    cmd: "aula sistema foto"
  - titulo: "Ver qué dejó la foto"
    cmd: "ls FOTO"
  - titulo: "Comprobar que ningún archivo cambió desde la foto"
    cmd: "cd /trabajo/sistema && sha256sum -c FOTO/hashes.txt"
