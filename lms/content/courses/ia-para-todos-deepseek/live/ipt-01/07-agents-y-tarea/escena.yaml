id: 07-agents-y-tarea
titulo: "AGENTS.md, la skill y tu tarea"
fase: experimentacion
paso: instrucciones
duracion_min: 10
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Aula · Copiar la skill a tu sistema (queda como en la laptop: skills/foto-del-sistema)"
    cmd: "mkdir -p /trabajo/sistema/skills && cp -R /opt/skills-curso/foto-del-sistema /trabajo/sistema/skills/"
  - titulo: "Aula · Pedirle la foto a dsh desde la terminal (respuesta + resumen de uso)"
    cmd: "aula dsh \"Lee AGENTS.md y skills/foto-del-sistema/SKILL.md. Toma la foto con node skills/foto-del-sistema/motor/foto.mjs . y sigue el procedimiento. Cita archivo:línea.\""
  - titulo: "Comprobar que nada cambió desde la foto (macOS: shasum -a 256 -c)"
    cmd: "sha256sum -c FOTO/hashes.txt"
  - titulo: "Subir la foto y tus dudas verificables"
    cmd: "git add FOTO docs && git commit -m \"sesión 1: foto del sistema y 5 afirmaciones verificadas\" && git push"
  - titulo: "Alternativa: empaquetar la entrega en un zip"
    cmd: "zip -r entrega-s1.zip FOTO docs"
