id: 05b-tu-oficio
titulo: "Tu oficio: ¿verdad o falso en el código?"
fase: conceptualizacion
paso: sistema
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Si en la escena 5 ya copiaste otro sistema: guárdalo aparte para copiar el de tu oficio"
    cmd: "mv /trabajo/sistema /trabajo/sistema-anterior"
  - titulo: "🩺 Salud · 1. Copiar tu sistema (Centro de Salud Santa Rosa)"
    cmd: "aula sistema centro-salud"
  - titulo: "🩺 Salud · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Admisión no ve el peso ni las alergias del paciente. 2) A una niña de 9 años le dice si tiene obesidad según su IMC. 3) No deja recetar a un niño más dosis de la que permite su peso. 4) Un remedio sin dosis para niños se le puede recetar a un niño. 5) En el almacén hay un remedio vencido.\""
  - titulo: "🩺 Salud · 3. Tu agenda automática"
    cmd: "aula dsh \"Lee js/config.js. Haz mi agenda: las citas en estado Programada de hoy en adelante, con día, hora, paciente, sus alergias, médico y motivo, en una tabla ordenada por fecha. Las fechas de los datos son relativas a hoy: conviértelas. Cita archivo:línea y no inventes nada.\""
  - titulo: "⚖️ Derecho · 1. Copiar tu sistema (Estudio Jurídico Paredes & Asociados)"
    cmd: "aula sistema abogados"
  - titulo: "⚖️ Derecho · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Al contar un plazo se salta los feriados. 2) Si trabajo 1 h 05 min se cobra 1 h 15 min. 3) Se puede pactar una cuota litis de 40 por ciento. 4) El día de la notificación cuenta como día 1 del plazo. 5) Una hora en audiencia se cobra más cara que una hora de escritorio.\""
  - titulo: "⚖️ Derecho · 3. Tu reporte de plazos automático"
    cmd: "aula dsh \"Lee js/config.js. Haz mi reporte de plazos: los expedientes activos con plazo, con número, cliente, materia, acto procesal, fecha de notificación, días hábiles y fecha de vencimiento, del más urgente al menos urgente. Las fechas de los datos son relativas a hoy: conviértelas y marca los que vencen en 5 días o menos. Cita archivo:línea.\""
  - titulo: "🎨 Diseño · 1. Copiar tu sistema (Maderas del Sur, mueblería)"
    cmd: "aula sistema muebleria"
  - titulo: "🎨 Diseño · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee css/app.css, js/80-app.js y js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Los colores de la marca se cambian en el CSS. 2) Si un texto no se lee sobre su fondo, el sistema cambia solo el color del texto. 3) Tiene modo oscuro. 4) Al navegar con Tab se ve un borde azul. 5) El vendedor ve cuánto costó cada mueble.\""
  - titulo: "🎨 Diseño · 3. Tu revisión de colores"
    cmd: "aula dsh \"Lee css/app.css, js/80-app.js y el tema de js/config.js. Haz una tabla con cada color del sistema, dónde se usa y si se lee bien sobre su fondo (contraste WCAG). Luego propón otra paleta de dos colores para la mueblería que se lea bien. Cita archivo:línea.\""
  - titulo: "💻 Informática · 1. Copiar tu sistema (Nexa Soluciones TI)"
    cmd: "aula sistema consultora-software"
  - titulo: "💻 Informática · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js, js/20-almacen.js, js/30-seguridad.js y js/35-auditoria.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Las contraseñas no se guardan tal cual. 2) Los datos se guardan en un servidor. 3) Si alguien cambia a escondidas el historial, el sistema se da cuenta. 4) Un proyecto que gastó 100 y avanzó 85 aparece en riesgo. 5) El consultor ve cuánto ganan sus compañeros.\""
  - titulo: "💻 Informática · 3. Tu reporte de proyectos en riesgo"
    cmd: "aula dsh \"Lee js/config.js. Haz una tabla con los proyectos de los datos de demostración: cuánto se gastó, cuánto se avanzó, si va atrasado y si está en riesgo, con la cuenta paso a paso en palabras simples. Cita archivo:línea y no inventes datos.\""
  - titulo: "Reiniciar la web de dsh para que trabaje en tu nuevo sistema (si ya la habías abierto)"
    cmd: "aula dsh web parar && aula dsh web"
