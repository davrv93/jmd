id: 05b-tu-oficio
titulo: "Tu oficio: ¿verdad o falso en el código?"
fase: conceptualizacion
paso: sistema
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Si en la escena 5 ya copiaste otro sistema: guárdalo aparte para copiar el de tu oficio"
    cmd: "mv /trabajo/sistema /trabajo/sistema-anterior"
  - titulo: "🩺 Salud · 1. Copiar tu sistema (Centro de Salud Santa Rosa)"
    cmd: "aula sistema centro-salud"
  - titulo: "🩺 Salud · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Admisión no ve el peso, la talla ni las alergias del paciente. 2) A una niña de 9 años con IMC 30 la clasifica como Obesidad I. 3) En menores de 12 años la receta no deja pasar una dosis diaria mayor que peso por mg/kg/día. 4) Un medicamento sin dosis pediátrica definida se puede recetar a un niño. 5) La dexametasona del almacén ya está vencida.\""
  - titulo: "🩺 Salud · 3. Tu agenda automática"
    cmd: "aula dsh \"Lee js/config.js. Haz mi agenda: las citas en estado Programada de hoy en adelante, con día, hora, paciente, sus alergias, médico y motivo, en una tabla ordenada por fecha. Las fechas de los datos son relativas a hoy: conviértelas. Cita archivo:línea y no inventes nada.\""
  - titulo: "⚖️ Derecho · 1. Copiar tu sistema (Estudio Jurídico Paredes & Asociados)"
    cmd: "aula sistema abogados"
  - titulo: "⚖️ Derecho · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Al contar un plazo procesal descuenta los feriados. 2) Si trabajo 1 h 05 min se facturan 1,25 h. 3) Se puede pactar una cuota litis de 40 por ciento. 4) El día de la notificación cuenta como día 1 del plazo. 5) Una audiencia vale 20 por ciento más que otra actuación de las mismas horas.\""
  - titulo: "⚖️ Derecho · 3. Tu reporte de plazos automático"
    cmd: "aula dsh \"Lee js/config.js. Haz mi reporte de plazos: los expedientes activos con plazo, con número, cliente, materia, acto procesal, fecha de notificación, días hábiles y fecha de vencimiento, del más urgente al menos urgente. Las fechas de los datos son relativas a hoy: conviértelas y marca los que vencen en 5 días o menos. Cita archivo:línea.\""
  - titulo: "🎨 Diseño · 1. Copiar tu sistema (Maderas del Sur, mueblería)"
    cmd: "aula sistema muebleria"
  - titulo: "🎨 Diseño · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee css/app.css, js/80-app.js y js/config.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Los colores de marca están en css/app.css. 2) Si el texto blanco no se lee sobre el color de acento, el sistema lo cambia solo a oscuro. 3) El sistema tiene modo oscuro automático. 4) El foco del teclado se ve con un borde azul de 3 px. 5) El vendedor ve el costo de los productos.\""
  - titulo: "🎨 Diseño · 3. Tu guía de estilo automática"
    cmd: "aula dsh \"Lee css/app.css, js/80-app.js y el tema de js/config.js. Arma la guía de estilo del sistema: una tabla con cada color, dónde se usa y su contraste con el fondo según WCAG. Luego propón otra paleta de dos colores para la mueblería, con su contraste calculado. Cita archivo:línea.\""
  - titulo: "💻 Informática · 1. Copiar tu sistema (Nexa Soluciones TI)"
    cmd: "aula sistema consultora-software"
  - titulo: "💻 Informática · 2. Que dsh compruebe las 5 afirmaciones"
    cmd: "aula dsh \"Lee js/config.js, js/20-almacen.js, js/30-seguridad.js y js/35-auditoria.js. Para cada afirmación di VERDAD o FALSO y cita archivo:línea, sin inventar: 1) Las claves se guardan con sal y 1000 iteraciones de SHA-256. 2) Los datos se guardan en un servidor. 3) La bitácora encadena hashes y detecta una entrada editada. 4) Un proyecto con CPI 0,85 se considera en riesgo. 5) El consultor ve el sueldo de sus compañeros.\""
  - titulo: "💻 Informática · 3. Tus casos de prueba automáticos"
    cmd: "aula dsh \"Lee js/config.js. Arma casos de prueba del valor ganado con 3 proyectos de los datos de demostración: entradas (BAC, % de plazo, % de avance, horas y costo), cálculo paso a paso de PV, EV, AC, CPI y SPI, y resultado esperado, en una tabla. Cita archivo:línea y no inventes datos.\""
  - titulo: "Reiniciar la web de dsh para que trabaje en tu nuevo sistema (si ya la habías abierto)"
    cmd: "aula dsh web parar && aula dsh web"
