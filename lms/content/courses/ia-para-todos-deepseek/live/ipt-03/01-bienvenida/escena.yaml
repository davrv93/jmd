id: 01-bienvenida
titulo: "Bienvenida: documentar es afirmar con evidencia"
fase: experiencia
paso: ver
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 100
compuerta: presentes
comandos:
  - titulo: "Entra a la carpeta de tu sistema (aula)"
    cmd: "cd /trabajo/sistema"
  - titulo: "Toma la foto del sistema (aula)"
    cmd: "aula sistema foto"
  - titulo: "Pon tu clave en el aula (se borra si el aula se reinicia)"
    cmd: "aula dsh clave"
  - titulo: "Abre tu dsh web en el aula (imprime tu enlace: no lo compartas)"
    cmd: "aula dsh web"
  - titulo: "Toma la foto del sistema (tu laptop, Node 20 o más; en el aula también funciona)"
    cmd: "node skills/foto-del-sistema/motor/foto.mjs ."
