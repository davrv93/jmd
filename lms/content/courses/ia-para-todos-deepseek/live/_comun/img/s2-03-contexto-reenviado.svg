<title id="t">Corrida A: el contexto se reenvía en cada llamada</title><desc id="d">Gráfico de barras: el contexto crece de 3 mil a 73 mil tokens estimados en 16 llamadas y cada llamada reenvía todo lo anterior.</desc>
