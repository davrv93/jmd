chor="start" >Entrada facturada: ≈ 634 mil</text><text x="508" y="240" font-size="19" font-weight="400" fill="#4a5565" text-anchor="start" >≈ 9 veces, por reenviar el pasado</text><rect x="40" y="700" width="1286" height="52" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="0" /><text x="40" y="732" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Supuestos: base 3 000 tokens + 14 archivos leídos de a uno + 1 listado; no es una medición de dsh.</text><rect x="1040" y="704" width="286.0" height="38" rx="19" fill="#fff4d6" stroke="#e0b44c" stroke-width="2" /><text x="1058" y="731" font-size="21" font-weight="700" fill="#7a5a00" text-anchor="start" >Esquema · estimación</text>
