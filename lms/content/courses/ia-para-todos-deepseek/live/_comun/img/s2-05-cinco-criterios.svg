<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">La vara de calidad</title><desc id="d">Cinco criterios iguales para las dos corridas y la regla de que si uno baja el ahorro es inválido.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<text x="40" y="56" font-size="44" font-weight="800" fill="#1f2a37" text-anchor="start" >La vara de calidad: cinco preguntas</text><text x="40" y="92" font-size="24" font-weight="400" fill="#4a5565" text-anchor="start" >Las mismas para la corrida A y para la B</text><rect x="40" y="124" width="820" height="84" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="166" r="26" fill="#3b57e8"/><text x="86" y="176" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="132" y="160" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >¿Cita archivo:línea?</text><text x="132" y="192" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Lo que afirma se puede abrir y comprobar.</text><rect x="40" y="222" width="820" height="84" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="264" r="26" fill="#3b57e8"/><text x="86" y="274" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="132" y="258" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >¿No inventa?</text><text x="132" y="290" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Ningún rol, archivo o función que no exista.</text><rect x="40" y="320" width="820" height="84" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="362" r="26" fill="#3b57e8"/><text x="86" y="372" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="132" y="356" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >¿Cubre todos los roles?</text><text x="132" y="388" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Si el sistema tiene 5, aparecen los 5.</text><rect x="40" y="418" width="820" height="84" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="460" r="26" fill="#3b57e8"/><text x="86" y="470" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="132" y="454" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >¿Coincide con la matriz de la foto?</text><text x="132" y="486" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Quién ve, crea, edita, emite, anula.</text><rect x="40" y="516" width="820" height="84" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="558" r="26" fill="#3b57e8"/><text x="86" y="568" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="132" y="552" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >¿Marca lo «por verificar»?</text><text x="132" y="584" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Lo no comprobado se dice, no se afirma.</text><rect x="900" y="124" width="426" height="224" rx="16" fill="#e7f6ec" stroke="#4fa36a" stroke-width="3" /><text x="924" y="168" font-size="27" font-weight="800" fill="#1d6b3a" text-anchor="start" >5 de 5 en ambas</text><text x="924" y="206" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >El ahorro cuenta:</text><text x="924" y="238" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >menos tokens, misma calidad.</text><rect x="900" y="372" width="426" height="240" rx="16" fill="#fdeaea" stroke="#d46a6a" stroke-width="3" /><text x="924" y="416" font-size="27" font-weight="800" fill="#9b2c2c" text-anchor="start" >Una pregunta baja</text><text x="924" y="454" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Ahorro inválido.</text><text x="924" y="486" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Es otra tarea más barata,</text><text x="924" y="518" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >no la misma con ahorro.</text><rect x="40" y="640" width="1286" height="78" rx="16" fill="#fff" stroke="#3b57e8" stroke-width="3" /><text x="70" y="688" font-size="29" font-weight="700" fill="#1f2a37" text-anchor="start" >Primero la calidad; después los tokens. Un ahorro con calidad menor no cuenta.</text><rect x="1040" y="726" width="273.5" height="38" rx="19" fill="#fff4d6" stroke="#e0b44c" stroke-width="2" /><text x="1058" y="753" font-size="21" font-weight="700" fill="#7a5a00" text-anchor="start" >Esquema ilustrativo</text>
</svg>
