<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Esquema: matriz de severidad por probabilidad con prioridad del 1 al 9">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2a37}
.t{font-size:24px;font-weight:700}.s{font-size:18px;fill:#4a5565}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#4a5565}
.n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700}
.box{fill:#fff;stroke:#c9d2de;stroke-width:2.5}.act{fill:#fff4d6;stroke:#e0b44c;stroke-width:2.5}.cyl{fill:#e7f6ec;stroke:#4fa36a;stroke-width:2.5}
.ar{fill:none;stroke:#3b57e8;stroke-width:3}.ad{fill:none;stroke:#8a96a8;stroke-width:2.5;stroke-dasharray:8 6}
.lb{font-size:16px;font-weight:600;fill:#3b57e8}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b57e8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a8"/></marker></defs>
<rect width="900" height="600" rx="18" fill="#f6f8fb"/>
<rect x="234" y="74" width="192" height="122" rx="10" fill="#fff4d6" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="330" y="145" text-anchor="middle" style="font-size:46px">3</text>
<rect x="434" y="74" width="192" height="122" rx="10" fill="#fde3c8" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="530" y="145" text-anchor="middle" style="font-size:46px">6</text>
<rect x="634" y="74" width="192" height="122" rx="10" fill="#f9caca" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="730" y="145" text-anchor="middle" style="font-size:46px">9</text>
<text class="t" x="212" y="143" text-anchor="end" style="font-size:24px">alta</text>
<rect x="234" y="204" width="192" height="122" rx="10" fill="#e7f6ec" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="330" y="275" text-anchor="middle" style="font-size:46px">2</text>
<rect x="434" y="204" width="192" height="122" rx="10" fill="#fff4d6" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="530" y="275" text-anchor="middle" style="font-size:46px">4</text>
<rect x="634" y="204" width="192" height="122" rx="10" fill="#fde3c8" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="730" y="275" text-anchor="middle" style="font-size:46px">6</text>
<text class="t" x="212" y="273" text-anchor="end" style="font-size:24px">media</text>
<rect x="234" y="334" width="192" height="122" rx="10" fill="#e7f6ec" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="330" y="405" text-anchor="middle" style="font-size:46px">1</text>
<rect x="434" y="334" width="192" height="122" rx="10" fill="#e7f6ec" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="530" y="405" text-anchor="middle" style="font-size:46px">2</text>
<rect x="634" y="334" width="192" height="122" rx="10" fill="#fff4d6" stroke="#c9d2de" stroke-width="2"/>
<text class="t" x="730" y="405" text-anchor="middle" style="font-size:46px">3</text>
<text class="t" x="212" y="403" text-anchor="end" style="font-size:24px">baja</text>
<text class="t" x="330" y="494" text-anchor="middle" style="font-size:24px">baja</text>
<text class="t" x="530" y="494" text-anchor="middle" style="font-size:24px">media</text>
<text class="t" x="730" y="494" text-anchor="middle" style="font-size:24px">alta</text>
<text class="t" x="530" y="532" text-anchor="middle">Probabilidad: ¿qué tan fácil es que ocurra?</text>
<text class="t" x="60" y="265" transform="rotate(-90 60 265)" text-anchor="middle">Severidad: ¿cuánto daña?</text>
<text class="s" x="230" y="40">Prioridad = severidad × probabilidad (1 a 9)</text>
<text class="s" x="30" y="585">Esquema ilustrativo</text>
</svg>