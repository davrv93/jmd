id: 03-corrida-a-sin-foto
titulo: "Corrida A, sin foto: el agente recorre el código"
fase: experiencia
paso: corrida-a
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Aula · 1. Apartar la foto, las reglas, la skill y tus docs (corrida A sin ayuda)"
    cmd: "mkdir -p /trabajo/aparte && cd /trabajo/sistema && mv FOTO AGENTS.md skills docs /trabajo/aparte/"
  - titulo: "Aula · 2. Corrida A: respuesta y RESUMEN DE USO, guardados en /trabajo/A.txt"
    cmd: "aula dsh \"Describe qué puede hacer cada rol de este sistema. Recorre el código archivo por archivo. Cita archivo:línea y marca «por verificar» lo que no hayas comprobado.\" | tee /trabajo/A.txt"
  - titulo: "Aula · 3. Devolver todo a su sitio y guardar la medición en docs/medicion"
    cmd: "mv /trabajo/aparte/* /trabajo/sistema/ && mkdir -p /trabajo/sistema/docs/medicion && mv /trabajo/A.txt /trabajo/sistema/docs/medicion/A.txt"
  - titulo: "Laptop · Copia limpia del sistema, sin FOTO ni AGENTS.md (corrida A)"
    cmd: "rm -rf /tmp/sistema-A && cp -R ~/mi-sistema /tmp/sistema-A && cd /tmp/sistema-A && rm -rf FOTO docs skills AGENTS.md"
  - titulo: "Laptop · Corrida A: recorre el código, con tiempo y eventos"
    cmd: "time npx @deepseek-ai/dsh --profile headless --json \"Describe qué puede hacer cada rol de este sistema. Recorre el código archivo por archivo. Cita archivo:línea y marca «por verificar» lo que no hayas comprobado.\" > ../A.jsonl"
  - titulo: "Laptop · Sacar la respuesta de los eventos"
    cmd: "jq -r 'select(.type==\"final\")|.text' ../A.jsonl > ../A.md"
