id: web-sorteos
title: "Crea sorteos y juegos interactivos con IA (modalidad web)"
description: >
  Curso a tu ritmo, en video. Creas sorteos y minijuegos para tu clase, tu tienda o tu evento
  pidiéndoselos a un agente de IA con un pedido en seis partes: ruletas, una máquina de cápsulas,
  una pirámide de puertas, un juego de basket con viento y un colibrí que se detiene con un toque.
  En todos, el premio lo decide el servidor y la animación solo lo revela. Seis ejemplos listos para
  levantar con Docker en Windows y en Mac.
cohorts: [web-sorteos]
proyecto_final: >
  Tu propio sorteo, hecho con tu agente a partir de uno de los seis ejemplos: con tus premios y sus
  topes, una participación por persona, panel con clave y levantado con Docker en tu computadora.
requisitos:
  - Laptop con Windows 10/11 o Mac, Chrome o Edge y conexión estable
  - Docker Desktop (cada README del repositorio explica cómo levantar el ejemplo)
  - Un agente de IA para programar (Claude Code, OpenCode, DeepSeek u otro)
  - Sin conocimientos previos de programación
dedicacion: "Modalidad web: 7 videos cortos (de 1 a 3 minutos), los prompts para copiar y un repositorio con seis ejemplos. Avanzas a tu ritmo."

modules:
  - id: m1
    title: "Parte 1 · El sorteo justo: el servidor decide"
    lessons: [sor-01]
  - id: m2
    title: "Parte 2 · Juegos que revelan el premio"
    lessons: [sor-02]
  - id: m3
    title: "Parte 3 · En vivo y en internet"
    lessons: [sor-03]

identidad:
  color: ambar
  icono: gift
  frase: "A tu ritmo: pídele a la IA sorteos y juegos que se ven bien, se juegan en el celular y no se pueden trampear."
  resultado:
    - "Pedirle a un agente un sorteo completo con el pedido en seis partes"
    - "Decidir el premio en el servidor, con topes que no se pasan"
    - "Levantar tu sorteo con Docker en Windows o Mac y administrarlo desde un panel"
