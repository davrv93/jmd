# Arena de conceptos (11b): la clave de respuestas del minijuego. La lee el servidor
# (lms/api/internal/httpapi/live_juego.go) y NUNCA se envía al navegador: la ruta de archivos de
# escena no sirve .yaml. Cada concepto va a un solo contenedor; todos salen de la sesión 2
# («Web y landing») del taller ¿Difícil de explicar?.
contenedores:
  - {id: musica,  nombre: "Música · Lyria"}
  - {id: sprites, nombre: "Sprites · poses"}
  - {id: video,   nombre: "Video · frames"}
  - {id: web,     nombre: "Web · landing"}
conceptos:
  # Música: la pieza que se pide con intención y se descarga.
  - {texto: "Lyria",                     contenedor: musica}
  - {texto: "prompt musical",            contenedor: musica}
  - {texto: "mi-musica.wav",             contenedor: musica}
  - {texto: "48 kHz",                    contenedor: musica}
  - {texto: "intención de la canción",   contenedor: musica}
  - {texto: "estribillo",                contenedor: musica}
  # Sprites: una hoja de poses recortada con alfa y ancla.
  - {texto: "atlas",                     contenedor: sprites}
  - {texto: "8 poses",                   contenedor: sprites}
  - {texto: "canal alfa",                contenedor: sprites}
  - {texto: "ancla del pie",             contenedor: sprites}
  - {texto: "hoja de sprites",           contenedor: sprites}
  - {texto: "píxel art",                 contenedor: sprites}
  # Video: p5.js dibuja y HyperFrames graba cuadro a cuadro.
  - {texto: "p5.js",                     contenedor: video}
  - {texto: "canvas 2D",                 contenedor: video}
  - {texto: "HyperFrames",               contenedor: video}
  - {texto: "fotograma",                 contenedor: video}
  - {texto: "MP4",                       contenedor: video}
  - {texto: "bucle de 8 s",              contenedor: video}
  # Web: la landing que se recorre y se comparte por WhatsApp.
  - {texto: "landing",                   contenedor: web}
  - {texto: "HTML y CSS",                contenedor: web}
  - {texto: "botón de WhatsApp",         contenedor: web}
  - {texto: "responsive",                contenedor: web}
  - {texto: "enlace publicado",          contenedor: web}
  - {texto: "texto alternativo",         contenedor: web}
