id: 11-flux
titulo: "Genera tu imagen con FLUX"
fase: experimentacion
paso: "flux"
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 70
compuerta: lo_logre
comandos:
  - { titulo: "Generar una imagen con el ejemplo (en la escena escribes tu prompt y copias el tuyo)", cmd: "mkdir -p /trabajo/flux && cd /trabajo/flux && curl -s -X POST \"${IMAGEN_URL:-http://imagen:8000}/generar\" -H \"Authorization: Bearer $OSITO_TOKEN\" -H \"Content-Type: application/json\" -o imagen-1.png -d @- <<'FIN_PROMPT'\n{\"prompt\": \"1928 black and white cartoon mouse whistling at a steamboat wheel, rubber hose style, round shapes, thick ink outlines, cream paper, film grain\", \"calidad\": \"maxima\", \"orientacion\": \"horizontal\"}\nFIN_PROMPT\nls -la imagen-1.png" }
oculta: false
