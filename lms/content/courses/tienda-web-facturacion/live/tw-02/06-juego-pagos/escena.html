<title>Escena · ¿Cuadra el pago? La ruta del pedido</title>
<link rel="icon" href="data:,">
<!--
  «¿Cuadra el pago?» · juego de la sesión 2 de «Tienda web con facturación electrónica», sobre el motor Arena JMD
  (docs/ARENA_JMD.md). Cada alumno es un robot repartidor y ve a los demás en vivo.
  A la izquierda está el chat de pedidos: cada burbuja es un pedido con su voucher. Lo recoges y lo pasas por
  «Tu app» para ver si el dinero llegó de verdad (sin eso, «Pagado» no te deja confirmar: la captura sola no
  basta). Si cuadra, el pedido cruza las puertas de su estado: Pagado → Listo para recoger → Entregado (+10).
  Si no cuadra, va a «Escribir al cliente» (monto distinto o foto que no es un pago; bono: qué le escribes),
  a la «Banca de espera» (aún no llega a tu app) o a «Anular con motivo» (sin pago ni respuesta en 3 días).
  Confirmar un pago que no cuadra vale 0 y la lupa explica por qué; nunca resta. Los drones de reparto solo te
  hacen soltar el pedido. Meta del grupo: los puntos del mostrador. Al final: título, reflexión al muro y fotito.
  Curso, grupo, sesión y fecha salen de ../../comun/tw.js: el mismo archivo sirve para el Grupo 1 y el Grupo 2.
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->

<body>
<div id="juego"><div class="sin-motor"><div><b>Abriendo el mostrador…</b>Si no aparece en unos segundos, recarga la escena.</div></div></div>
<script src="../../comun/tw.js"></script>
<script src="../../comun/arena-tw.js"></script>
<script src="../../arena/arena-jmd.js"></script>
<script>
(function () {
  "use strict";
  if (!window.ArenaJMD || !window.TWA) {
    document.getElementById("juego").innerHTML = '<div class="sin-motor"><div><b>El juego se está actualizando</b>Recarga la escena en un minuto. Si sigue igual, avísale al instructor.</div></div>';
    return;
  }
  var A = window.ArenaJMD, X = window.TWA, K = X.marca(), RED = X.REDUCIDO, rr = X.rr, soles = X.soles;

  // ---------- los casos de la clase (las 4 reglas antes de confirmar un pago) ----------
  var TIPOS = [["cuadra", 30], ["monto", 14], ["foto", 12], ["espera", 16], ["pagado", 13], ["anular", 15]];
  var NOMBRES = ["Rosa", "Luis", "Carmen", "Jorge", "Ana", "Pedro", "Lucía", "Miguel", "Sofía", "Raúl", "Elena", "Diego", "Óscar", "Pilar"];
  var FOTOS = [["🐶", "foto de su perrito"], ["🌅", "foto de un atardecer"], ["🛍️", "foto del producto"], ["📄", "foto de un documento"]];
  var ESTADOS = ["Recibido", "Pago por confirmar", "Pagado", "Listo para recoger", "Entregado"];
  var POR = {
    cuadra: "El voucher y tu app dicen lo mismo: confírmalo en «Pagado» y llévalo por la ruta hasta «Entregado».",
    monto: "El monto no cuadra con el pedido. Antes de confirmar, escríbele al cliente para revisarlo.",
    foto: "Esa foto no es un pago. Escríbele y pídele la captura correcta: él puede cambiarla desde su pedido.",
    espera: "La captura sola no basta: tu app dice que aún no llega. Espera y vuelve a mirar antes de confirmar.",
    pagado: "Ya se confirmó ayer: pásalo por «Listo para recoger», avisa al cliente con su número de pedido y entrégalo.",
    anular: "Sin pago ni respuesta en 3 días: anula con un motivo. El pedido queda en el historial, no se borra.",

  var LO_CORRECTO = { cuadra: "confirmar y entregar", monto: "escribir al cliente para revisar el monto", foto: "escribir al cliente y pedir la captura correcta",
    espera: "esperar en la banca y volver a mirar tu app", pagado: "Listo para recoger → Entregado", anular: "anular con motivo" };
  var MENSAJES = ["Hola, esa foto no es un pago. ¿Me mandas la captura de tu Yape o transferencia?",

  // ---------- el mapa: 1800 × 1300 (arriba, el letrero; así la tarjeta del celular no tapa nada) ----------
  var ANCHO = 1800, ALTO = 1300;

  var Z = {

    espera: { id: "espera", tipo: "espera", x: 760, y: 280, w: 240, h: 200, nombre: "Banca de espera", color: "#c48709", colorTexto: "#1c1300" },
    chat: { id: "chat", tipo: "chat", x: 780, y: 960, w: 240, h: 220, nombre: "Escribir al cliente", color: "#12a7a0" },
    pagado: { id: "pagado", tipo: "pagado", x: 1100, y: 420, w: 220, h: 210, nombre: "3 · Pagado", color: "#2fa35f" },

  // ---------- estado de cada pedido que llevo (solo en mi pantalla) ----------
  var EST = {}, avisada = "", mio = { entregados: 0, bien: 0, revisados: 0, colados: 0 };
  function estadoDe(ob) {
    var c = ob.id + "@" + ob.v;
    return EST[c] || (EST[c] = { app: false, paso: ob.t === "pagado" ? 2 : 1 });
  }
  function voucher(ob) {

  }
  function appDice(ob) {

  }
  function tarjetaDe(ob) {
    var st = estadoDe(ob), ahora;
    if (st.paso >= 3) ahora = "Ahora: «Entregado»";
    else if (st.paso === 2) ahora = "Ahora: «Listo para recoger»";
    else if (!st.app) ahora = "Antes de decidir, pásalo por «Tu app»";
    else ahora = "¿Cuadra? «Pagado». ¿No? Escribir al cliente, Banca de espera o Anular";
    return { etiqueta: ob.num + " · " + ob.nom, color: ob.medio === "Yape" ? "#7b2cbf" : "#2f6bff",
      titulo: "Pedido de " + soles(ob.tot) + " · voucher: " + voucher(ob),
      destacadoEtiqueta: "Tu app", destacado: st.app || ob.t === "pagado" ? appDice(ob) : "❓ Sin revisar",
      pie: "Estado: " + ESTADOS[st.paso] + " · " + ahora };
  }
  function refrescar(ob) { X.carta(tarjetaDe(ob)); }
  function cargaMia() { var c = juego && juego.yo().carga; return c ? juego.objeto(c) : null; }
  // La puerta que toca (solo para guiar el camino, no para decidir por ti).
  function siguienteZona() {
    var ob = cargaMia(); if (!ob) return "";
    var st = estadoDe(ob);
    return st.paso >= 3 ? "entregado" : st.paso === 2 ? "listo" : !st.app ? "app" : "";
  }

  // ---------- arte ----------
  function pintarPedido(g, x, y, sc, t, d) {
    var mia = sc < 1 && juego && juego.yo().carga === d.id, st = mia ? estadoDe(d) : null;
    g.save(); g.translate(x, y); g.scale(sc, sc);
    var fl = RED || sc < 1 ? 0 : Math.sin(t * 2.2 + d.i) * 2.5;
    if (sc >= 1) { g.fillStyle = "rgba(0,0,0,.2)"; g.beginPath(); g.ellipse(0, 22, 24, 6, 0, 0, 7); g.fill(); }
    g.translate(0, fl);
    if (st && st.paso >= 2) { // ya pagado: ahora es un paquete
      g.fillStyle = "#c8915a"; g.strokeStyle = "#6b4423"; g.lineWidth = 2.5; rr(g, -24, -22, 48, 40, 5); g.fill(); g.stroke();
      g.fillStyle = "#e9c79a"; g.fillRect(-4, -22, 8, 40); X.emoji(g, st.paso >= 3 ? "✅" : "📦", 0, -36, 20);
    } else {
      g.fillStyle = "#e7fbe0"; g.strokeStyle = "#1f8a5b"; g.lineWidth = 3;
      rr(g, -30, -24, 60, 40, 14); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-18, 14); g.lineTo(-26, 26); g.lineTo(-6, 15); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = "#e7fbe0"; g.fillRect(-20, 10, 16, 5);
      g.fillStyle = d.medio === "Yape" ? "#7b2cbf" : "#2f6bff"; g.beginPath(); g.arc(-15, -4, 8, 0, 7); g.fill();
      X.texto(g, "S/", -15, -4, 9, "900", "#ffffff", "center");
      g.fillStyle = "#1f8a5b"; [0, 10, 20].forEach(function (dx) { g.beginPath(); g.arc(dx, -4, 3.2, 0, 7); g.fill(); });
    }
    g.restore();
  }
  function marcoZona(g, z, t, borde) {
    var guia = siguienteZona() === z.id, pul = X.pulso(t);
    if (guia) { g.fillStyle = "rgba(242,193,78," + (.2 + pul * .24) + ")"; rr(g, z.x - 16, z.y - 16, z.w + 32, z.h + 32, 26); g.fill(); }
    g.fillStyle = "rgba(20,18,43,.22)"; rr(g, z.x + 5, z.y + 9, z.w, z.h, 18); g.fill();
    return guia;
  }
  function pintarApp(g, z, t) {
    var guia = marcoZona(g, z, t), x = z.x, y = z.y, w = z.w, h = z.h;
    g.fillStyle = "#1b1838"; rr(g, x, y, w, h, 30); g.fill();
    var gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, "#6a58e8"); gr.addColorStop(1, "#2a2160");
    g.fillStyle = gr; rr(g, x + 14, y + 26, w - 28, h - 44, 18); g.fill();
    g.fillStyle = "#14122b"; rr(g, x + w / 2 - 30, y + 10, 60, 8, 4); g.fill();
    X.texto(g, "Tu app o tu banco", x + w / 2, y + 56, 19, "800", "#ffe9a3", "center");
    g.fillStyle = "#f2c14e"; g.beginPath(); g.arc(x + w / 2, y + 116, 36, 0, 7); g.fill();
    X.texto(g, "S/", x + w / 2, y + 117, 30, "900", "#3a2600", "center");
    X.texto(g, "¿llegó el dinero?", x + w / 2, y + 172, 19, "800", "#ffffff", "center");
    X.texto(g, "la captura sola no basta", x + w / 2, y + 198, 15, "600", "#c3b9ff", "center");
    g.strokeStyle = guia ? "#f2c14e" : "#a99cff"; g.lineWidth = guia ? 6 : 4; rr(g, x, y, w, h, 30); g.stroke();
  }
  function mesa(g, z, t, fondo, borde, emoji, l1, l2) {
    var guia = marcoZona(g, z, t), x = z.x, y = z.y, w = z.w, h = z.h;
    g.fillStyle = fondo; rr(g, x, y, w, h, 20); g.fill();
    g.fillStyle = "rgba(255,255,255,.9)"; rr(g, x + 16, y + 34, w - 32, h - 52, 14); g.fill();
    X.emoji(g, emoji, x + w / 2, y + 34 + (h - 52) * .3, 46);
    X.texto(g, l1, x + w / 2, y + h - 74, 20, "900", "#1b2350", "center");
    if (l2) { var b = X.bloque(g, l2, w - 50, 2, 16, 12, "700"); g.fillStyle = "#4a4760"; g.textAlign = "center"; b.ls.forEach(function (l, i) { g.fillText(l, x + w / 2, y + h - 48 + i * (b.px + 3)); }); }
    g.strokeStyle = guia ? "#f2c14e" : borde; g.lineWidth = guia ? 6 : 4; rr(g, x, y, w, h, 20); g.stroke();
  }
  function puerta(g, z, t, n, emoji, sub) {
    var guia = marcoZona(g, z, t), x = z.x, y = z.y, w = z.w, h = z.h, c = z.color;
    g.fillStyle = "rgba(255,255,255,.6)"; rr(g, x, y, w, h, 18); g.fill();
    g.fillStyle = c; rr(g, x, y, 26, h, 10); g.fill(); rr(g, x + w - 26, y, 26, h, 10); g.fill();   // pilares
    rr(g, x, y, w, 42, 14); g.fill();                                                             // dintel
    X.emoji(g, emoji, x + w / 2, y + h * .5 + 6, 54);
    var b = X.bloque(g, sub, w - 70, 2, 16, 12, "700"); g.fillStyle = "#1b2350"; g.textAlign = "center";
    b.ls.forEach(function (l, i) { g.fillText(l, x + w / 2, y + h - 40 + (i - (b.ls.length - 1) / 2) * (b.px + 3)); });
    g.strokeStyle = guia ? "#f2c14e" : c; g.lineWidth = guia ? 6 : 4; rr(g, x, y, w, h, 18); g.stroke();
  }
  function fondo(g) {
    // letrero
    var gr = g.createLinearGradient(0, 0, 0, 220); gr.addColorStop(0, "#14122b"); gr.addColorStop(1, "#2a2160");
    g.fillStyle = gr; g.fillRect(0, 0, ANCHO, 220);
    g.strokeStyle = "rgba(242,193,78,.45)"; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 220); g.lineTo(ANCHO, 220); g.stroke();
    var r = A.rng(31);
    for (var i = 0; i < 70; i++) { g.fillStyle = "rgba(255,240,200," + (.2 + r() * .5).toFixed(2) + ")"; g.beginPath(); g.arc(r() * ANCHO, r() * 210, 1 + r() * 2, 0, 7); g.fill(); }
    X.texto(g, "¿CUADRA EL PAGO?", 900, 92, 56, "900", "#ffe9a3", "center");
    X.texto(g, "la ruta del pedido: del chat a «Entregado», sin confirmar nada a ciegas", 900, 150, 23, "700", "#c3b9ff", "center");
    // el chat de pedidos
    g.fillStyle = "rgba(0,0,0,.18)"; rr(g, CHAT.x + 6, CHAT.y + 10, CHAT.w, CHAT.h, 30); g.fill();
    g.fillStyle = "#efe7da"; rr(g, CHAT.x, CHAT.y, CHAT.w, CHAT.h, 30); g.fill();
    g.fillStyle = "#1f6f5c"; rr(g, CHAT.x, CHAT.y, CHAT.w, 110, 30); g.fill(); g.fillRect(CHAT.x, CHAT.y + 70, CHAT.w, 40);
    X.texto(g, "💬 Chat de pedidos", CHAT.x + 30, CHAT.y + 42, 26, "900", "#ffffff");
    X.texto(g, "1 · Recibido: cada burbuja es un pedido con su voucher", CHAT.x + 30, CHAT.y + 82, 16, "700", "#cdeee3");
    g.fillStyle = "rgba(31,111,92,.07)";
    for (i = 0; i < 26; i++) { var bx = CHAT.x + 30 + r() * (CHAT.w - 120), by = CHAT.y + 130 + r() * (CHAT.h - 170); rr(g, bx, by, 60 + r() * 60, 26, 12); g.fill(); }
    // la ruta: Tu app → Pagado → Listo → Entregado
    g.save(); g.lineCap = "round"; g.lineJoin = "round";
    g.strokeStyle = "rgba(242,193,78,.28)"; g.lineWidth = 64;
    g.beginPath(); g.moveTo(880, 720); g.lineTo(1210, 525); g.lineTo(1435, 785); g.lineTo(1665, 1080); g.stroke();
    g.strokeStyle = "rgba(196,135,9,.55)"; g.lineWidth = 4; g.setLineDash([18, 16]);
    g.beginPath(); g.moveTo(880, 720); g.lineTo(1210, 525); g.lineTo(1435, 785); g.lineTo(1665, 1080); g.stroke();
    g.restore();
  }

  // ---------- el juego ----------
  var juego = A.crear({
    raiz: "#juego",
    titulo: "¿Cuadra el pago?",
    subtitulo: "La ruta del pedido: llévalo del chat a «Entregado», sin confirmar un pago que no viste en tu app.",
    curso: K.curso, sesion: K.sesion, fecha: K.fecha || undefined, hashtag: K.hashtag,
    duracion: 180, duraciones: [180, 300], duracionPractica: 120,
    mundo: { ancho: ANCHO, alto: ALTO, tema: "patio" },
    jugador: { accesorio: "audifonos" },
    salida: { x: 120, y: 700, w: 340, h: 160 },
    reglas: [
      "Recoge un pedido del chat y pásalo por «Tu app»: ¿llegó el dinero?",
      "¿Cuadra? Por las puertas: Pagado → Listo → Entregado. ¿No? Escríbele, espera o anula.",
      "Errar no resta: la lupa te dice qué hacía falta. Cada pedido bien atendido suma al grupo.",
    ],
    anuncio: "a repartir",
    muros: [{ x: 810, y: 515, w: 140, h: 46 }, { x: 810, y: 880, w: 140, h: 46 }],
    zonas: [
      Object.assign({ pintar: pintarApp }, Z.app),
      Object.assign({ pintar: function (g, z, t) { mesa(g, z, t, "#c48709", "#c48709", "⏳", "Aún no llega", "espera y vuelve a mirar tu app"); } }, Z.espera),
      Object.assign({ pintar: function (g, z, t) { mesa(g, z, t, "#12a7a0", "#12a7a0", "💬", "Algo no cuadra", "monto distinto o foto que no es pago"); } }, Z.chat),
      Object.assign({ pintar: function (g, z, t) { puerta(g, z, t, 3, "✅", "confirmas solo lo que viste en tu app"); } }, Z.pagado),
      Object.assign({ pintar: function (g, z, t) { puerta(g, z, t, 4, "📦", "avisa al cliente con su número de pedido"); } }, Z.listo),
      Object.assign({ pintar: function (g, z, t) { puerta(g, z, t, 5, "🏁", "entregado: la venta descuenta tu stock"); } }, Z.entregado),
      Object.assign({ pintar: function (g, z, t) { mesa(g, z, t, "#b8344c", "#b8344c", "🗂️", "Sin pago en 3 días", "anula con motivo: queda en el historial"); } }, Z.anular),
    ],
    peligros: [
      { tipo: "dron", nombre: "el dron de reparto", ruta: [[660, 290], [660, 1250]], vel: 115, radio: 26,
        aviso: "¡El dron de reparto te hizo soltar el pedido! Volvió al chat: recógelo otra vez.", avisoSinCarga: "¡Uy, el dron de reparto! Cruza cuando pase." },
      { tipo: "dron", nombre: "el dron de reparto", ruta: [[1050, 290], [1050, 1250]], vel: 95, radio: 26,
        aviso: "¡El dron te hizo soltar el pedido! Volvió al chat.", avisoSinCarga: "¡Cuidado con el dron de reparto!" },
    ],
    decor: [{ tipo: "planta", x: 1290, y: 1240 }, { tipo: "planta", x: 1480, y: 560 }, { tipo: "planta", x: 1060, y: 1240 }],
    fondo: fondo,
    objetos: {
      cantidad: 20, prefijo: "ped",
      crear: function (i, v, rnd, M) {
        var r = rnd() * 100, acc = 0, t = "cuadra";
        for (var k = 0; k < TIPOS.length; k++) { acc += TIPOS[k][1]; if (r < acc) { t = TIPOS[k][0]; break; } }
        var tot = Math.round((18 + rnd() * 160) * 10) / 10, medio = rnd() < .55 ? "Yape" : "Transferencia";
        var nom = NOMBRES[Math.floor(rnd() * NOMBRES.length)], baja = rnd() < .5 ? .5 : .8, foto = FOTOS[Math.floor(rnd() * FOTOS.length)];
        var p = M.lugarLibre(rnd, 40, BANDEJA), sem = juego ? juego.ronda().semilla >>> 0 : 0;
        return { x: p.x, y: p.y, t: t, tot: tot, pago: t === "monto" ? Math.round(tot * baja * 10) / 10 : tot, medio: medio, nom: nom, foto: foto,
          num: "PED-" + (1000 + (i * 131 + v * 37 + sem % 911) % 9000), stock: rnd() < .34, texto: nom + " · " + soles(tot), pintar: pintarPedido };
      },
    },
    tarjeta: tarjetaDe,
    entregar: function (ob, z, api) {
      var st = estadoDe(ob), c = ob.id + "@" + ob.v, mal = function (titulo) {
        mio.colados++;
        return { ok: false, puntos: 0, titulo: titulo, explicacion: POR[ob.t], real: "Lo que tocaba: " + LO_CORRECTO[ob.t] + ".", feed: "aprendió con el " + ob.num };
      };
      switch (z.tipo) {
        case "app":
          if (!st.app) { st.app = true; mio.revisados++; api.sonido("tomar"); api.popup(z.x + z.w / 2, z.y - 10, appDice(ob), "#ffe9a3"); refrescar(ob); }
          return { rechazar: true, mensaje: "Tu app dice: " + appDice(ob) };
        case "pagado":
          if (st.paso >= 2) return { rechazar: true, mensaje: "Ya está pagado: ahora a «Listo para recoger»" };
          if (!st.app) {
            if (avisada !== c) { avisada = c; api.sonido("mal"); api.lupa({ icono: "🔍", tipo: "mal", titulo: "La captura sola no basta", texto: "Antes de confirmar, mira en tu app o tu banco que el dinero llegó de verdad.", real: "Pásalo por «Tu app» (al centro) y vuelve.", ms: 6500 }); }
            return { rechazar: true, mensaje: "Primero pásalo por «Tu app»: la captura sola no basta" };
          }
          if (ob.t === "cuadra") { st.paso = 2; api.sonido("tomar"); api.popup(z.x + z.w / 2, z.y - 10, "Pagado ✓", "#7ef0c3"); refrescar(ob); return { rechazar: true, mensaje: "✅ Pagado. Ahora: «Listo para recoger»" }; }
          return mal(ob.t === "espera" ? "Aún no llegaba" : "No cuadraba");
        case "listo":
          if (st.paso < 2) return { rechazar: true, mensaje: "Aún no está pagado: primero «Pagado»" + (st.app ? "" : " (y antes, «Tu app»)") };
          if (st.paso === 2) { st.paso = 3; api.sonido("tomar"); api.popup(z.x + z.w / 2, z.y - 10, "Listo ✓ · aviso enviado", "#9fc3ff"); refrescar(ob); return { rechazar: true, mensaje: "📦 Listo. Avisa al cliente con su número de pedido y llévalo a «Entregado»" }; }
          return { rechazar: true, mensaje: "Ya está listo: llévalo a «Entregado»" };
        case "entregado":
          if (st.paso < 3) return { rechazar: true, mensaje: "Falta pasar por «" + (st.paso < 2 ? "Pagado" : "Listo para recoger") + "»" };
          mio.entregados++; mio.bien++;
          var res = { ok: true, puntos: 10, titulo: "¡Entregado! +10", feed: "entregó el " + ob.num };
          if (ob.stock) res.bonus = { pregunta: "Se vendió por la tienda web. ¿Qué pasa con tu stock?", opciones: ["Se descuenta solo con la venta", "Lo resto yo a mano en un cuaderno", "No cambia hasta fin de mes"],
            correcta: 0, puntos: 5, segundos: 12, explicacion: "La venta por la tienda descuenta tu stock: así no vendes lo que ya no tienes." };
          return res;
        case "chat":
          if (ob.t === "monto" || ob.t === "foto") {
            mio.bien++;
            return { ok: true, puntos: 10, titulo: "¡Bien! No confirmaste a ciegas +10", feed: "escribió al cliente del " + ob.num,
              bonus: { pregunta: "¿Qué le escribes a " + ob.nom + "?", opciones: MENSAJES, correcta: ob.t === "foto" ? 0 : 1, puntos: 5, segundos: 14, explicacion: POR[ob.t] } };
          }
          return mal(ob.t === "cuadra" ? "Ese pago sí cuadraba" : "Aquí no hacía falta escribirle");
        case "espera":
          if (!st.app && ob.t !== "anular" && ob.t !== "foto" && ob.t !== "pagado") return { rechazar: true, mensaje: "¿Esperar qué? Primero mira «Tu app»" };
          if (ob.t === "espera") { mio.bien++; return { ok: true, puntos: 10, titulo: "¡Bien! Esperas sin confirmar +10", explicacion: "Cuando aparezca en tu app, recién lo confirmas. Mientras, el pedido sigue en «Pago por confirmar».", feed: "esperó a que llegue el pago del " + ob.num }; }
          return mal("No tocaba esperar");
        case "anular":
          if (ob.t === "anular") { mio.bien++; return { ok: true, puntos: 10, titulo: "Anulado con motivo +10", explicacion: "El pedido no se borra: queda en el historial con su motivo.", feed: "anuló con motivo el " + ob.num }; }
          return mal("No había que anularlo");
      }
      return { rechazar: true, mensaje: "Aquí no va" };
    },
    meta: { contador: "mostrador", texto: "Mostrador del grupo", unidad: "pts", objetivo: function (n) { return Math.max(60, n * 35); }, logro: "el mostrador del grupo va al día" },
    reflexion: { clave: K.escena || "06-juego-pagos", pregunta: "¿Qué vas a revisar siempre antes de confirmar un pago?",
      placeholder: "Ej.: «Que el dinero esté en mi Yape, no solo en la captura»", porDefecto: "La captura sola no basta: lo veo en mi app antes de confirmar." },
    alRonda: function () { EST = {}; avisada = ""; mio = { entregados: 0, bien: 0, revisados: 0, colados: 0 }; },
    alReflexion: function (t) { X.guardarReflexion(t); },
    resultado: function (s) {
      var t = mio.entregados >= 3 ? "Repartidor estrella" : mio.bien >= 4 && s.fallos <= 1 ? "Cajero de confianza" : mio.revisados >= 3 ? "Siempre mira su app"
        : mio.bien ? "Primer pedido atendido" : "Conoció la ruta del pedido";
      return X.guardar({ etiqueta: "Mi turno en el mostrador", titulo: t, resultado: juego.puntos + " puntos",
        detalle: X.pl(mio.bien, "pedido bien atendido", "pedidos bien atendidos") + " · " + X.pl(mio.entregados, "entregado") + " · " + X.pl(mio.revisados, "revisado", "revisados") + " en la app" }, juego.puntos);
    },
  });
})();
</script>
