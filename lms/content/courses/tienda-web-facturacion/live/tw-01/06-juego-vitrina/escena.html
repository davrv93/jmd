<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena · Juego: Vitrina express</title>
<!--
  Escena del modo LIVE · «Tienda web con facturación electrónica».
  Armazón de live/_plantilla (programacion-agentica-g8): escena.css común + tw.css del curso, sin recursos externos.
  Los textos del grupo (fechas, horario, WhatsApp) y la ruta del video salen de ../../comun/tw.js (TW.CURSO / TW.FECHAS).
-->
<link rel="stylesheet" href="../../comun/escena.css">
<link rel="stylesheet" href="../../comun/tw.css">
<link rel="stylesheet" href="../../comun/juego.css">
<style id="esc-propio">
.vx { display: grid; gap: .7em; }
.vx-ficha { display: grid; grid-template-columns: 5.5em 1fr; gap: .9em; align-items: center; background: var(--s2); border: 2px dashed var(--line2); border-radius: 1em; padding: .8em; }
.vx-ficha.lista { border-style: solid; border-color: var(--ok); background: var(--ok-bg); }
.vx-foto { font-size: 3.6em; text-align: center; line-height: 1.3; background: var(--s1); border-radius: .2em; }
.vx-slots { display: grid; gap: .35em; }
.vx-slot { display: grid; grid-template-columns: 6.2em 1fr; gap: .5em; align-items: center; font-size: .78em; }
.vx-slot span { color: var(--muted); font-size: .85em; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.vx-slot b { min-height: 1.9em; border-radius: .5em; background: var(--s1); border: 1px solid var(--line); padding: .3em .6em; display: flex; align-items: center; }
.vx-slot b:empty::before { content: "toca la correcta abajo"; color: var(--muted); font-weight: 500; font-style: italic; font-size: .9em; }
.vx-fichas { display: grid; grid-template-columns: repeat(2, 1fr); gap: .45em; }
.vx-t { font: 650 .78em/1.25 system-ui, sans-serif; padding: .75em .8em; border-radius: .8em; border: 1px solid var(--line2); background: var(--s1); color: var(--fg); cursor: pointer; text-align: left; touch-action: manipulation; min-height: 3.1em; display: flex; gap: .5em; align-items: center; }
.vx-t small { flex: none; font-size: .72em; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 800; }
.vx-t:disabled { opacity: .35; cursor: default; text-decoration: line-through; }
.vx-t.usada { visibility: hidden; }
.vx-estante { display: flex; flex-wrap: wrap; gap: .2em; min-height: 2em; padding: .35em .5em; border-radius: .7em; background: linear-gradient(transparent 70%, color-mix(in srgb, var(--gold) 30%, transparent) 70%); font-size: 1.35em; }
.vx-estante:empty::before { content: "Tu vitrina: aquí aparece cada ficha que completes"; font-size: .5em; color: var(--muted); align-self: center; }
@media (max-width: 860px) { .vx-ficha { grid-template-columns: 4.2em 1fr; } .vx-foto { font-size: 2.8em; } .vx-slot { grid-template-columns: 5.2em 1fr; font-size: .9em; } .vx-t { font-size: .88em; } }
</style>
</head>
<body>
<div class="esc">
  <header class="esc-cab">
    <span class="esc-fase" data-ph="ca">Conceptualización</span>
    <span class="esc-num">Sesión 1 · E06</span>
  </header>

  <main class="esc-cuerpo">
    <div class="tw-pila">
      <div class="esc-fila" style="justify-content:space-between">
        <h1 class="esc-titulo a-in" style="font-size:1.5em">Vitrina <em>express</em></h1>
        <p class="tw-nota" style="max-width:34em">Arma fichas completas en 45 segundos. Cada ficha que cierras se suma a la vitrina de todo el grupo.</p>
      </div>
      <div id="juego"></div>
    </div>
  </main>

  <footer class="esc-pie">
    <span class="esc-nota">Juego del grupo · al final, tu reflexión al muro y tu fotito</span>
  </footer>
</div>
<script src="../../comun/tw.js"></script>
<script src="../../comun/juego.js"></script>
<script src="../../comun/fotito.js"></script>
<script>
(function () {
  var $ = TW.$, $$ = TW.$$;
  // Cada producto: foto, y por cada parte una opción buena y una floja. La floja enseña por qué.
  var PROD = [
    ["🧴", "Shampoo de coco 400 ml", "S/ 18.90", "Cuidado personal"], ["👟", "Zapatillas urbanas talla 40", "S/ 129.00", "Calzado"],
    ["🍰", "Torta de chocolate, 8 porciones", "S/ 55.00", "Tortas"], ["🔨", "Martillo de carpintero 16 oz", "S/ 32.50", "Herramientas"],
    ["👕", "Polo de algodón talla M", "S/ 35.00", "Ropa de hombre"], ["🍯", "Miel de abeja 500 g", "S/ 22.00", "Abarrotes"],
    ["💄", "Labial mate tono rojo", "S/ 24.90", "Maquillaje"], ["🧃", "Jugo de naranja 1 L", "S/ 6.90", "Bebidas"],
    ["🪴", "Maceta de barro mediana", "S/ 15.00", "Jardín"], ["🎒", "Mochila escolar 20 L", "S/ 79.90", "Escolar"],
    ["🧀", "Queso fresco 1 kg", "S/ 28.00", "Lácteos"], ["🕯️", "Vela aromática de vainilla", "S/ 19.00", "Decoración"],
    ["🧦", "Medias deportivas pack x 3", "S/ 18.00", "Ropa deportiva"], ["☕", "Café molido 250 g", "S/ 14.90", "Bebidas"],
    ["🔌", "Extensión eléctrica 3 m", "S/ 27.00", "Electricidad"], ["🍪", "Galletas de avena, caja x 12", "S/ 16.50", "Snacks"]
  ];
  var FLOJO = {
    nombre: [["Producto nuevo!!!", "Un nombre vago obliga a preguntar. Di <b>qué es</b> y su tamaño o talla."], ["Oferta", "«Oferta» no se encuentra en el buscador. <b>El nombre dice qué es</b>; la oferta va en el precio."], ["Art. 0231", "Un código sirve para ti, no para tu cliente. <b>Nombre claro</b> primero."], ["Lo de siempre", "Tu cliente nuevo no sabe qué es «lo de siempre». <b>Nombra el producto</b>."]],
    precio: [["Precio al inbox", "Sin precio a la vista, el cliente escribe y espera… o se va. <b>Muestra el precio</b>."], ["Consultar", "«Consultar» es una pregunta más por chat. <b>El precio va en la ficha</b>."], ["S/ ??", "Un precio incompleto genera desconfianza. <b>Pon el monto exacto</b>."], ["Escríbenos", "Si hay que escribir para saber el precio, la tienda no trabaja sola. <b>Precio visible</b>."]],
    cat: [["Varios", "En «Varios» nadie busca. <b>La categoría es el pasillo</b> de tu tienda."], ["Otros", "«Otros» no ayuda a filtrar. <b>Usa una categoría que tu cliente reconozca</b>."], ["Nuevos", "«Nuevos» cambia cada semana. <b>La categoría dice qué tipo de producto es</b>."], ["Sin categoría", "Sin categoría, el producto se pierde en el catálogo. <b>Ponle su pasillo</b>."]]
  };
  var NOM = { nombre: "Nombre", precio: "Precio", cat: "Categoría" };
  var vivo = false, rng = Math.random, orden = [], i = 0, tipT = 0;
  var zona;
  TWJuego.montar({
    raiz: $("#juego"), segundos: 45, unidad: ["ficha", "fichas"], meta: 8, tituloGrupo: "La vitrina del grupo",
    reglas: ["Aparece un producto con su foto. Toca la opción buena para <b>Nombre</b>, <b>Precio</b> y <b>Categoría</b>.",
             "Si eliges la floja, te dice por qué y sigues: <b>no pierdes puntos</b>.",
             "Cada ficha completa va a tu vitrina y a la del grupo. Juegas contra tu mejor marca, no contra nadie."],
    pregunta: "¿Qué producto tuyo subirías primero a tu tienda, y por qué?",
    placeholder: "Ej.: «Mis tortas, porque es lo que más me preguntan»",
    resultado: function (p, e) { return { resultado: p + (p === 1 ? " ficha completa" : " fichas completas"), detalle: "Vitrina express · " + e + (e === 1 ? " aprendizaje" : " aprendizajes") }; },
    crear: function (z, api) {
      zona = z;
      var raiz = TW.el("div", "vx");
      var ficha = TW.el("div", "vx-ficha"), foto = TW.el("div", "vx-foto", "🛍️"), slots = TW.el("div", "vx-slots");
      var S = {};
      ["nombre", "precio", "cat"].forEach(function (k) { var s = TW.el("div", "vx-slot"); s.appendChild(TW.el("span", "", NOM[k])); S[k] = TW.el("b"); s.appendChild(S[k]); slots.appendChild(s); });
      ficha.appendChild(foto); ficha.appendChild(slots);
      var fichas = TW.el("div", "vx-fichas"), estante = TW.el("div", "vx-estante");
      raiz.appendChild(ficha); raiz.appendChild(fichas); raiz.appendChild(estante);
      z.appendChild(raiz);
      var faltan = 0;
      function tip(html) {
        var t = z.querySelector(".tj-tip"); if (t) t.remove();
        t = TW.el("div", "tj-tip"); t.innerHTML = html; z.appendChild(t);
        clearTimeout(tipT); tipT = setTimeout(function () { t.remove(); }, 2600);
      }
      function siguiente() {
        if (!vivo) return;
        var p = PROD[orden[i % orden.length]]; i++;
        foto.textContent = p[0]; foto.classList.remove("tj-pop"); void foto.offsetWidth; foto.classList.add("tj-pop");
        ficha.classList.remove("lista");
        Object.keys(S).forEach(function (k) { S[k].textContent = ""; });
        var buenas = { nombre: p[1], precio: p[2], cat: p[3] }, ops = [];
        Object.keys(buenas).forEach(function (k) {
          var f = FLOJO[k][Math.floor(rng() * FLOJO[k].length)];
          ops.push({ k: k, t: buenas[k], ok: true }); ops.push({ k: k, t: f[0], ok: false, por: f[1] });
        });
        for (var a = ops.length - 1; a > 0; a--) { var b = Math.floor(rng() * (a + 1)); var x = ops[a]; ops[a] = ops[b]; ops[b] = x; }
        fichas.textContent = ""; faltan = 3;
        ops.forEach(function (o) {
          var bt = TW.el("button", "vx-t"); bt.type = "button";
          bt.appendChild(TW.el("small", "", NOM[o.k])); bt.appendChild(TW.el("span", "", o.t));
          bt.addEventListener("click", function () {
            if (!vivo) return;
            if (o.ok) {
              S[o.k].textContent = o.t; bt.classList.add("usada"); faltan--;
              if (faltan === 0) {
                ficha.classList.add("lista"); api.punto(1);
                var e = TW.el("span", "tj-pop", p[0]); estante.appendChild(e);
                vivo && setTimeout(siguiente, 380);
              }
            } else {
              bt.disabled = true; bt.classList.add("tj-tiembla"); api.error(o.por); tip(o.por);
            }
          });
          fichas.appendChild(bt);
        });
      }
      return {
        empezar: function (r) {
          rng = r; vivo = true; i = 0; estante.textContent = "";
          orden = PROD.map(function (_, k) { return k; });
          for (var a = orden.length - 1; a > 0; a--) { var b = Math.floor(rng() * (a + 1)); var x = orden[a]; orden[a] = orden[b]; orden[b] = x; }
          siguiente();
        },
        parar: function () { vivo = false; $$(".vx-t", z).forEach(function (b) { b.disabled = true; }); }
      };
    }
  });
})();
</script>
<script src="../../comun/copiar.js"></script>
</body>
</html>
