<title>Escena · La ventanilla: boleta, factura o pedir el RUC</title>
<link rel="icon" href="data:,">
<!--
  «La ventanilla» · juego de la sesión 3 de «Tienda web con facturación electrónica», sobre el motor Arena JMD
  (docs/ARENA_JMD.md). Cada alumno es un robot cajero en la misma sala de atención y ve a los demás en vivo.
  Los clientes esperan en la sala, cada uno con su documento en la mano (DNI, RUC, la referencia de un
  comprobante o nada). Pasas a su lado, te sigue y lo llevas a su ventanilla: Boleta (DNI, consumidor final),
  Factura (RUC, negocio), Nota de crédito (corrige un comprobante ya emitido) o Pedir el RUC (quiere factura y no
  lo tiene). Acertar +10, con bonos de IGV y de serie; errar vale 0 y la lupa explica por qué.
  Es PRÁCTICA: hoy la tienda entrega nota de venta y la boleta y la factura solo se practican en el ambiente de
  pruebas de SUNAT; el juego no emite nada real. Lo que emite el grupo llena la caja y el «Reporte del día»
  (boletas, facturas, notas de crédito, ventas e IGV): contadores de la sala /patio leídos cada 2,5 s.
  Curso, grupo, sesión y fecha salen de ../../comun/tw.js: el mismo archivo sirve para el Grupo 1 y el Grupo 2.
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->

</style>

<script>
(function () {

  };

  var CERO = function () { return { caja: 0, bol: 0, fac: 0, nc: 0, ruc: 0, dev: 0 }; };

  // ---------- arte ----------
  function pintarCliente(g, x, y, sc, t, d) {
    var lleva = sc < 1, gx = lleva ? x - 46 : x, gy = lleva ? y + 108 : y, k = lleva ? .64 : .76, D = DOC[d.c.d];
    A.pintarRobot(g, gx, gy, k, { color: d.col, accesorio: d.acc, dir: 0, anim: d.c.k === "ruc" ? "triste" : "", t: t + d.i * .7 });
    // el documento en la mano

    g.fillStyle = "#ffffff"; g.strokeStyle = D.c; g.lineWidth = 2.4; rr(g, -15, -11, 34, 22, 4); g.fill(); g.stroke();
    g.fillStyle = D.c; g.fillRect(-15, -11, 8, 22);
    X.texto(g, D.corto, 6, 0.5, 9, "900", D.c, "center");
    g.restore();
    if (!lleva) { // lo que pide, en un globito
      var by = gy - 96 * k - 26;
      g.fillStyle = "#ffffff"; rr(g, gx - 22, by - 16, 44, 30, 12); g.fill();
      g.beginPath(); g.moveTo(gx - 5, by + 13); g.lineTo(gx, by + 21); g.lineTo(gx + 5, by + 13); g.fill();
      X.emoji(g, d.c.k === "nc" ? "↩️" : d.c.k === "boleta" ? "🧾" : "📄", gx, by, 17);
    }
  }
  function pintarVentanilla(g, z, t) {
    var x = z.x, y = z.y, w = z.w, h = z.h, lleva = juego && juego.yo().carga, pul = X.pulso(t);
    if (lleva) { g.fillStyle = "rgba(242,193,78," + (.1 + pul * .14) + ")"; rr(g, x - 12, y - 12, w + 24, h + 24, 26); g.fill(); }
    g.fillStyle = "rgba(20,18,43,.22)"; rr(g, x + 5, y + 9, w, h, 18); g.fill();
    g.fillStyle = "#fffaf0"; rr(g, x, y, w, h, 18); g.fill();
    g.save(); rr(g, x, y, w, h, 18); g.clip();
    var n = 8, a = w / n;
    for (var i = 0; i < n; i++) { g.fillStyle = i % 2 ? "#ffffff" : z.color; g.fillRect(x + i * a, y, a + .5, 30); g.beginPath(); g.arc(x + i * a + a / 2, y + 30, a / 2, 0, Math.PI); g.fill(); }
    g.restore();
    X.emoji(g, z.ico, x + 58, y + 112, 52);
    X.texto(g, z.l1, x + 102, y + 96, z.l1.length > 12 ? 23 : 28, "900", "#1b2350");

    g.strokeStyle = z.color; g.lineWidth = 4; rr(g, x, y, w, h, 18); g.stroke();
    var dt = performance.now() - (sellos[z.k] || -1e9);
    if (dt < 1500) X.sello(g, z.k === "ruc" ? "¡RUC PEDIDO!" : "¡EMITIDA · PRUEBA!", x + w / 2, y + h / 2 + 8, z.k === "ruc" ? 28 : 22, z.color, dt / 1500);
  }
  function pintarTablero(g, z) {
    var x = z.x, y = z.y, w = z.w, h = z.h, c = caja(), ventas = Math.max(0, c.caja - c.dev), igv = ventas - ventas / 1.18;
    g.fillStyle = "rgba(20,18,43,.25)"; rr(g, x + 5, y + 9, w, h, 20); g.fill();
    g.fillStyle = "#1d1838"; rr(g, x, y, w, h, 20); g.fill();
    g.strokeStyle = "#f2c14e"; g.lineWidth = 4; rr(g, x, y, w, h, 20); g.stroke();
    // la caja registradora
    g.fillStyle = "#c48709"; rr(g, x + 20, y + 40, w - 40, 150, 16); g.fill();
    g.fillStyle = "#16301e"; rr(g, x + 34, y + 54, w - 68, 70, 10); g.fill();
    var cj = X.bloque(g, soles(ventas), w - 90, 1, 34, 16, "900"); g.fillStyle = "#7ef0a0"; g.textAlign = "center"; g.fillText(cj.ls[0], x + w / 2, y + 90);
    X.texto(g, "ventas del día del grupo", x + w / 2, y + 150, 15, "800", "#3a2600", "center");
    X.texto(g, "IGV incluido: " + soles(igv), x + w / 2, y + 172, 15, "800", "#3a2600", "center");
    // el reporte
    X.texto(g, "REPORTE DEL DÍA", x + 22, y + 228, 16, "900", "#ffe9a3");
    X.pastilla(g, "PRÁCTICA", x + w - 50, y + 228, 11, "#f2c14e", "#1c1300");
    var filas = [["🧾 Boletas", c.bol], ["🏢 Facturas", c.fac], ["↩️ Notas de crédito", c.nc], ["🔎 RUC pedidos", c.ruc],
      ["Vendido", soles(c.caja)], ["Notas de crédito", "− " + soles(c.dev)], ["Ventas", soles(ventas)], ["Valor de venta", soles(ventas / 1.18)], ["IGV (18 %)", soles(igv)]];
    filas.forEach(function (f, i) {
      var fy = y + 270 + i * 36 + (i >= 4 ? 14 : 0);
      if (i === 4) { g.strokeStyle = "rgba(242,193,78,.35)"; g.lineWidth = 2; g.beginPath(); g.moveTo(x + 20, fy - 24); g.lineTo(x + w - 20, fy - 24); g.stroke(); }
      X.texto(g, f[0], x + 22, fy, 16, i === 6 ? "900" : "700", i === 6 ? "#ffe9a3" : "#d9d4ff");
      X.texto(g, String(f[1]), x + w - 22, fy, 17, "900", i === 6 ? "#ffe9a3" : "#ffffff", "right");
    });
    var nota = X.bloque(g, "Hoy la tienda entrega nota de venta. La boleta y la factura se practican solo en el ambiente de pruebas de SUNAT.", w - 44, 5, 14, 11, "600");
    g.fillStyle = "#b7b4cc"; g.textAlign = "left";
    nota.ls.forEach(function (l, i) { g.fillText(l, x + 22, y + h - 104 + i * (nota.px + 4)); });
  }
  function fondo(g) {
    var gr = g.createLinearGradient(0, 0, 0, 220); gr.addColorStop(0, "#14122b"); gr.addColorStop(1, "#2a2160");
    g.fillStyle = gr; g.fillRect(0, 0, ANCHO, 220);
    g.strokeStyle = "rgba(242,193,78,.45)"; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 220); g.lineTo(ANCHO, 220); g.stroke();
    var r = A.rng(53);
    for (var i = 0; i < 70; i++) { g.fillStyle = "rgba(255,240,200," + (.2 + r() * .5).toFixed(2) + ")"; g.beginPath(); g.arc(r() * ANCHO, r() * 210, 1 + r() * 2, 0, 7); g.fill(); }
    X.texto(g, "LA VENTANILLA", 900, 92, 56, "900", "#ffe9a3", "center");
    X.texto(g, "boleta, factura, nota de crédito o pedir el RUC · práctica en el ambiente de pruebas de SUNAT", 900, 150, 22, "700", "#c3b9ff", "center");
    // mostrador
    g.fillStyle = "#c9b38a"; g.fillRect(40, 540, 1430, 26); g.fillStyle = "#a88d5f"; g.fillRect(40, 566, 1430, 8);
    // la sala de espera: baldosas cálidas y la fila
    g.fillStyle = "rgba(196,135,9,.07)"; rr(g, SALA.x - 20, SALA.y - 30, SALA.w + 40, SALA.h + 50, 30); g.fill();
    g.strokeStyle = "rgba(196,135,9,.25)"; g.lineWidth = 3; g.setLineDash([14, 10]); rr(g, SALA.x - 20, SALA.y - 30, SALA.w + 40, SALA.h + 50, 30); g.stroke(); g.setLineDash([]);
    X.texto(g, "SALA DE ESPERA · los clientes te esperan aquí", SALA.x + 10, SALA.y - 6, 18, "800", "rgba(140,96,6,.55)");
  }

  // ---------- el juego ----------
  var juego = A.crear({
    raiz: "#juego",
    titulo: "La ventanilla",
    subtitulo: "Práctica: hoy la tienda entrega nota de venta; la boleta y la factura se practican en el ambiente de pruebas de SUNAT.",
    curso: K.curso, sesion: K.sesion, fecha: K.fecha || undefined, hashtag: K.hashtag,
    duracion: 180, duraciones: [180, 300], duracionPractica: 120,
    mundo: { ancho: ANCHO, alto: ALTO, tema: "patio" },
    jugador: { accesorio: "mono" },
    salida: { x: 580, y: 650, w: 380, h: 90 },
    reglas: [
      "Pasa al lado de un cliente de la sala: te sigue con su documento en la mano.",

    anuncio: "a atender",
    muros: [{ x: 300, y: 690, w: 160, h: 46 }, { x: 1080, y: 690, w: 160, h: 46 }],
    zonas: [V.boleta, V.factura, V.nc, V.ruc].map(function (v) { return Object.assign({ pintar: pintarVentanilla }, v); })
      .concat([Object.assign({ pintar: pintarTablero }, TABLERO)]),
    peligros: [
      { tipo: "dron", nombre: "el dron de la tienda", ruta: [[110, 630], [1420, 630]], vel: 130, radio: 26,

    fondo: fondo,
    objetos: {

      crear: function (i, v, rnd, M) {
        var c = CASOS[Math.floor(rnd() * CASOS.length)], m;
        if (c.k === "factura") m = [59, 118, 177, 236][Math.floor(rnd() * 4)];
        else if (c.k === "nc") m = 10 + Math.floor(rnd() * 51);
        else m = 12 + Math.floor(rnd() * 87);

        return { x: p.x, y: p.y, c: c, m: m, col: COLORES[Math.floor(rnd() * COLORES.length)], acc: ACCS[Math.floor(rnd() * ACCS.length)], texto: txt, pintar: pintarCliente };
      },

    tarjeta: function (ob) {

        titulo: ob.c.q + " " + ob.c.dice, destacadoEtiqueta: ob.c.k === "nc" ? "A corregir" : "Compra", destacado: soles(ob.m),
        pie: "Llévalo a su ventanilla, arriba." };
    },
    entregar: function (ob, z) {

      if (c.k === "boleta") {
        anotar("bol", 1); anotar("caja", ob.m); mio.bol++; mio.caja += ob.m;
        var r = { ok: true, puntos: 10, titulo: "Boleta de prueba emitida +10", feed: "emitió una boleta de prueba de " + soles(ob.m) };
        if (A.hash(ob.id + ":" + ob.v) % 3 === 0) r.bonus = { pregunta: "¿Con qué empieza la serie de una boleta?", opciones: ["B (B001…)", "F (F001…)", "NV (nota de venta)"], correcta: 0, puntos: 5, segundos: 12,
          explicacion: "Boleta: serie B. Factura: serie F. La nota de venta es un control interno: no reemplaza a ninguna de las dos." };
        return r;
      }
      if (c.k === "factura") {
        anotar("fac", 1); anotar("caja", ob.m); mio.fac++; mio.caja += ob.m;
        var valor = Math.round(ob.m / 1.18 * 100) / 100, igv = Math.round((ob.m - valor) * 100) / 100, rnd = A.rng(A.hash(ob.id + "|" + ob.v));
        var ops = [soles(igv), soles(ob.m * .18), "S/ 0.00: la factura no lleva IGV"];
        for (var a = 2; a > 0; a--) { var b = Math.floor(rnd() * (a + 1)), q = ops[a]; ops[a] = ops[b]; ops[b] = q; }
        return { ok: true, puntos: 10, titulo: "Factura de prueba emitida +10", feed: "emitió una factura de prueba de " + soles(ob.m),
          bonus: { pregunta: "Factura de " + soles(ob.m) + " con IGV incluido. ¿Cuánto es el IGV?", opciones: ops, correcta: ops.indexOf(soles(igv)), puntos: 5, segundos: 15,
            explicacion: "Valor de venta = " + soles(ob.m) + " ÷ 1.18 = " + soles(valor) + ". IGV = " + soles(ob.m) + " − " + soles(valor) + " = " + soles(igv) + "." } };
      }

        var rn = { ok: true, puntos: 10, titulo: "Nota de crédito de prueba +10", feed: "emitió una nota de crédito de prueba" };
        if (A.hash(ob.id + ":" + ob.v) % 2 === 0) rn.bonus = { pregunta: "¿Qué lleva siempre la nota de crédito?", opciones: ["La referencia del comprobante original", "El DNI de quien atendió", "Nada: el comprobante se borra"], correcta: 0, puntos: 5, segundos: 12,
          explicacion: "Un comprobante emitido no se borra: la nota de crédito lo corrige y dice cuál es (" + (c.d === "refb" ? "B001-…" : "F001-…") + ")." };
        return rn;
      }
      anotar("ruc", 1); mio.ruc++;
      return { ok: true, puntos: 10, titulo: "¡Bien! Sin RUC no hay factura +10", explicacion: "Pídele su RUC de 11 dígitos. Si no lo tiene, le emites boleta con su DNI.", feed: "le pidió el RUC a un cliente" };
    },
    alEntregar: function (ob, z, res) { if (res && res.ok) sellos[z.k] = performance.now(); },
    alEvento: function (e) {
      if (e.tipo !== "entrega" || !e.valor || e.x == null) return;
      Object.keys(V).forEach(function (k) { var z = V[k]; if (e.x > z.x && e.x < z.x + z.w && e.y + 100 > z.y && e.y + 100 < z.y + z.h) sellos[k] = performance.now(); });
    },
    meta: { contador: "ventanilla", texto: "Ventanilla del grupo", unidad: "pts", objetivo: function (n) { return Math.max(60, n * 50); }, logro: "la caja del grupo cerró el día" },
    reflexion: { clave: K.escena || "06-juego-ventanilla", pregunta: "¿Qué comprobante te pedirán más en tu negocio, y qué dato necesitas para emitirlo?",
      placeholder: "Ej.: «Boleta; tener a mano el DNI del cliente»", porDefecto: "Boleta con DNI, factura con RUC y nota de crédito para corregir." },
    alRonda: function () { LOCAL = CERO(); CNT = CERO(); sellos = {}; mio = { bol: 0, fac: 0, nc: 0, ruc: 0, caja: 0, igv: 0 }; },
    alReflexion: function (t) { X.guardarReflexion(t); },
    resultado: function (s) {
      var bien = mio.bol + mio.fac + mio.nc + mio.ruc;
      var t = bien >= 6 && s.fallos <= 1 ? "Ventanilla de oro" : s.bonus >= 2 ? "Ojo de contador" : bien >= 3 ? "Atención de primera" : bien ? "Primer cliente atendido" : "Conoció la ventanilla";
      return X.guardar({ etiqueta: "Mi turno en la ventanilla (práctica)", titulo: t, resultado: juego.puntos + " puntos",
        detalle: X.pl(mio.bol, "boleta") + " · " + X.pl(mio.fac, "factura") + " · " + X.pl(mio.nc, "nota de crédito", "notas de crédito") + " · " + X.pl(mio.ruc, "RUC pedido", "RUC pedidos") }, juego.puntos);
    },
  });
})();
</script>
