id: crea-contenido-openmontage
title: Crea contenido con OpenMontage
description: >
  Aprende a producir videos explicativos y su copy con un agente de IA y OpenMontage, un orquestador de
  código abierto: guion, voz, música, escenas y render final en un solo flujo. Cuatro sesiones en vivo de
  1 hora: domingos 8, 15, 22 y 29 de noviembre de 2026, de 12:00 a 1:00 pm (Lima).
cohorts: [openmontage-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu primer video explicativo con su copy para redes, producido de punta a punta con OpenMontage.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
  - Un asistente de IA de código y saldo propio para los modelos que uses (voz, música o video)
dedicacion: "4 sesiones en vivo de 1 hora (domingos 8, 15, 22 y 29 de noviembre de 2026), 12:00 a 1:00 pm, hora de Lima"

modules:
  - id: m1
    title: "Sesión 1 · Instala y entiende el flujo"
    lessons: [om-01]
  - id: m2
    title: "Sesión 2 · Guion, voz y música"
    lessons: [om-02]
  - id: m3
    title: "Sesión 3 · Escenas y video con IA"
    lessons: [om-03]
  - id: m4
    title: "Sesión 4 · Tu video final y su copy"
    lessons: [om-04]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Crea contenido con OpenMontage", grupo: "Grupo 1", area: agentica, minutos: 60}
