id: tutoriales-en-video
title: "Elaboración de tutoriales en video"
description: >
  Produce tutoriales en video paso a paso con IA: guion, pantallas simuladas, voz natural, música bajita y edición con código (HyperFrames + GSAP). Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): miércoles 2 de diciembre de 9:15 p. m. a 10:30 p. m.; domingo 6 de diciembre de 8:00 a. m. a 9:15 a. m.; sábado 12 de diciembre de 9:15 p. m. a 10:30 p. m.. Inversión: S/ 25.
cohorts: [tutoriales-en-video-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un tutorial en video de 3 a 5 minutos sobre un tema tuyo, con guion, voz, pantallas animadas y música, listo para publicar.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 25.

modules:
  - id: s1
    title: "Sesión 1 · Del tema al guion: estructura de un buen tutorial"
    lessons: [tv-01]
  - id: s2
    title: "Sesión 2 · Pantallas simuladas, animación y voz con IA"
    lessons: [tv-02]
  - id: s3
    title: "Sesión 3 · Edición, música y publicación de tu tutorial"
    lessons: [tv-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Elaboración de tutoriales en video", grupo: "Grupo 1", area: diseno, minutos: 75}
