id: 07-instala-rtk
titulo: "Instala RTK y activa el hook"
fase: experimentacion
paso: rtk
duracion_min: 12
lo_logre: true
evidencia: captura
umbral_pct: 70
compuerta: lo_logre
comandos:
  - {titulo: "macOS", cmd: "brew install rtk"}
  - {titulo: "Linux o WSL", cmd: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"}
  - {titulo: "Windows", cmd: "winget install rtk-ai.rtk"}
  - {titulo: "Comprobar", cmd: "rtk --version"}
  - {titulo: "Hook para Claude Code", cmd: "rtk init -g"}
  - {titulo: "Hook para Claude Code y plugin de OpenCode", cmd: "rtk init -g --opencode"}
  - {titulo: "¿El hook reescribe?", cmd: "rtk rewrite \"git status\""}
