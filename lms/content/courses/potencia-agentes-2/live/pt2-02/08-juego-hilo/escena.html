<title>Escena · Faros en la niebla</title>
<link rel="icon" href="data:,">
<!--
  «Faros en la niebla» · juego de la clase 2 de Potencia tus agentes, sobre el motor Arena JMD (docs/ARENA_JMD.md).
  Cada alumno es un robot JMD dentro del mapa de un proyecto (la tienda con pagos: 14 archivos, 28 900 tokens si
  el agente los lee todos). El mapa está en la niebla: no se ven los hilos entre archivos.
  - Recoges una pregunta y la llevas al archivo que la responde. Quedarte dentro de un archivo es leerlo (los grandes
    tardan más; cruzarlo de paso no cuenta): cuesta sus tokens y revela sus hilos (con quién se conecta).
    Errar no resta puntos: solo gasta tokens y enseña con la lupa.
  - El Faro Graphify (centro) cuesta 150 tokens y enciende en dorado la ruta del grafo hasta la respuesta.
  - Las preguntas de «por qué» o «quién decidió» no están en el código: van a la Bóveda Cortex (cortex_brief, 600).
  - Cada pregunta es una sesión nueva: el agente vuelve a pagar lo que lee. Pero al resolver una pregunta de código,
    lo aprendido queda en la memoria de la clase (cristal 🧠): releer ese archivo cuesta 30 para todos.
  - Puntos = miles de tokens ahorrados frente a «leer todo». La barra suma lo que ahorra la clase entera.
  - Peligro: el /compact (drones) te hace soltar la pregunta. Nadie queda fuera.
  Al final: título, reflexión al muro (clave 08-juego-hilo, la misma que el juego anterior) y la fotito.
  Deja el resumen en localStorage «pt2-02-juego» para la escena 10 (insignia), con el formato que ya leía.
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->

<body>
<div id="juego"><div class="sin-motor"><div><b>Cargando el mapa…</b>Si no aparece en unos segundos, recarga la escena.</div></div></div>
<script src="../../arena/arena-jmd.js"></script>
<script>
(function () {
  "use strict";
  if (!window.ArenaJMD) {
    document.getElementById("juego").innerHTML = '<div class="sin-motor"><div><b>El juego se está actualizando</b>Recarga la escena en un minuto. Si sigue igual, avísale al instructor.</div></div>';
    return;
  }
  var REDUCIDO = (function () { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();
  function num(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

  // ---------- el proyecto: la tienda con pagos. n = nombre, tok = leer el archivo entero, c/f = columna/fila ----------
  var F = {
    boton: { n: "Botón Pagar", tok: 900, c: 0, f: 0 }, carrito: { n: "carrito.tsx", tok: 2400, c: 1, f: 0 },
    api: { n: "api/pagos", tok: 1800, c: 2, f: 0 }, auth: { n: "auth.ts", tok: 1500, c: 3, f: 0 },
    log: { n: "logger.ts", tok: 900, c: 0, f: 1 }, utils: { n: "utils.ts", tok: 4000, c: 1, f: 1 },
    servicio: { n: "servicio.ts", tok: 3200, c: 2, f: 1 }, config: { n: "config.ts", tok: 800, c: 3, f: 1 },
    correo: { n: "correo.ts", tok: 1100, c: 0, f: 2 }, cola: { n: "cola_pagos.ts", tok: 1600, c: 1, f: 2 },
    yape: { n: "yape.ts", tok: 1200, c: 2, f: 2 }, tests: { n: "pagos.test.ts", tok: 2800, c: 3, f: 2 },
    db: { n: "tabla pagos", tok: 700, c: 1, f: 3 }, readme: { n: "README.md", tok: 6000, c: 2, f: 3 },
  };
  var IDS = Object.keys(F);
  var E = [["boton", "carrito"], ["carrito", "api"], ["carrito", "utils"], ["api", "auth"], ["api", "servicio"], ["api", "log"],
    ["servicio", "yape"], ["servicio", "cola"], ["servicio", "utils"], ["cola", "db"], ["cola", "correo"], ["auth", "config"],
    ["yape", "config"], ["tests", "servicio"], ["tests", "api"], ["readme", "config"], ["correo", "log"], ["utils", "log"]];
  var VEC = {}; IDS.forEach(function (k) { VEC[k] = []; });
  E.forEach(function (e) { VEC[e[0]].push(e[1]); VEC[e[1]].push(e[0]); });
  var TODO = IDS.reduce(function (s, k) { return s + F[k].tok; }, 0); // 28 900
  var FARO = 150, BRIEF = 600, MEMORIA = 30;

  // ---------- las preguntas: s = donde empieza, a = archivos que la responden, ruta = lo que enciende el faro ----------
  var TK = [
    { tipo: "grafo", cmd: "path", s: "boton", a: ["cola"], ruta: [["boton", "carrito", "api", "servicio", "cola"]], et: "🕸️ ¿Por dónde?",
      q: "Un cliente pulsa «Pagar»: ¿qué archivo guarda el pago en la tabla?",

      no: { db: "tabla pagos solo recibe los datos: busca a su vecino, el que escribe en ella." } },
    { tipo: "grafo", cmd: "affected", s: "config", a: ["auth", "yape"], ruta: [["config", "auth"], ["config", "yape"]], et: "🕸️ ¿Qué se rompe?",
      q: "Vas a cambiar config.ts: ¿qué archivo se rompe?",
      x: "auth.ts y yape.ts leen config.ts: los dos se rompen. El README solo lo menciona.",

    { tipo: "grafo", cmd: "path", s: "tests", a: ["servicio"], ruta: [["tests", "servicio", "yape"]], et: "🕸️ ¿Por dónde?",
      q: "pagos.test.ts falla al cobrar con Yape: ¿qué archivo está entre los dos?",
      x: "pagos.test.ts → servicio.ts → yape.ts. El fallo pasa por servicio.ts: ahí empiezas a mirar." },
    { tipo: "grafo", cmd: "explain", s: "correo", a: ["cola"], ruta: [["correo", "cola"]], et: "🕸️ ¿Quién llama?",
      q: "Llegó un correo de confirmación repetido: ¿qué archivo llama a correo.ts?",
      x: "A correo.ts lo llama cola_pagos.ts cuando guarda el pago. logger.ts solo recibe sus mensajes.",
      no: { log: "logger.ts no llama a nadie: solo recibe los mensajes de correo.ts." } },
    { tipo: "grafo", cmd: "god", s: "", a: ["api", "servicio"], ruta: [["carrito", "api", "auth"], ["log", "api", "servicio", "tests", "api"], ["yape", "servicio", "cola"], ["servicio", "utils"]], et: "🕸️ ¿El centro?",
      q: "¿Cuál es el centro del proyecto, el archivo con más conexiones?",

    { tipo: "grafo", cmd: "affected", s: "log", a: ["api", "correo", "utils"], ruta: [["log", "api"], ["log", "correo"], ["log", "utils"]], et: "🕸️ ¿Qué se rompe?",
      q: "Cambiaste el formato de logger.ts: ¿quién lo usa?",
      x: "api/pagos, correo.ts y utils.ts escriben en logger.ts. Cualquiera de los tres era correcto." },
    { tipo: "grafo", cmd: "path", s: "carrito", a: ["auth"], ruta: [["carrito", "api", "auth"]], et: "🕸️ ¿Por dónde?",
      q: "El carrito no deja pagar sin iniciar sesión: ¿qué archivo pide el login?",
      x: "carrito → api/pagos → auth.ts. El nombre ayudaba: si la respuesta está a la vista, leer directo también sirve." },
    { tipo: "grafo", cmd: "affected", s: "utils", a: ["servicio", "carrito"], ruta: [["utils", "servicio"], ["utils", "carrito"]], et: "🕸️ ¿Qué se rompe?",
      q: "utils.ts redondea mal los céntimos: ¿qué archivo que cobra sale afectado?",
      x: "servicio.ts y carrito.tsx usan utils.ts para los montos. logger.ts solo recibe mensajes.",
      no: { log: "logger.ts solo recibe mensajes de utils.ts: no cobra nada." } },
    { tipo: "grafo", cmd: "explain", s: "yape", a: ["servicio"], ruta: [["yape", "servicio"]], et: "🕸️ ¿Quién llama?",
      q: "Yape cambió su API: ¿qué archivo llama a yape.ts?",
      x: "Solo servicio.ts llama a yape.ts. config.ts no lo llama: solo le da la clave.",
      no: { config: "config.ts no llama a yape.ts: solo le da la clave." } },
    { tipo: "grafo", cmd: "explain", s: "yape", a: ["config"], ruta: [["yape", "config"]], et: "🕸️ ¿De dónde?",
      q: "¿De dónde saca yape.ts su clave?",
      x: "yape.ts lee su clave de config.ts. Nunca la busques (ni la guardes) en el README.",
      no: { readme: "El README no guarda claves (y no debería): yape.ts la lee de otro archivo." } },
    { tipo: "cortex", et: "🧠 ¿Por qué?", q: "¿Por qué los pagos pasan por una cola y no se guardan directo?",
      x: "Decisión del equipo en marzo: Yape a veces tarda 30 s y la cola reintenta sin cobrar dos veces. El código muestra la cola, no el porqué." },
    { tipo: "cortex", et: "🧠 ¿Quién decidió?", q: "¿Quién decidió aceptar Yape antes que tarjetas, y por qué?",
      x: "La dueña, en la reunión de marzo: la comisión es menor. Una decisión no está en ninguna línea de código." },
    { tipo: "cortex", et: "🧠 ¿Por qué?", q: "¿Por qué el correo sale después de guardar el pago, y no antes?",
      x: "Regla del proyecto: nunca confirmar algo que no está guardado. Las reglas viven en Cortex y el agente las lee en su resumen." },
    { tipo: "cortex", et: "🧠 ¿Qué falta?", q: "¿Qué quedó pendiente en la última sesión?",
      x: "Faltan las pruebas de reembolso. Cada sesión del agente empieza en blanco; Cortex le dice dónde se quedó." },
    { tipo: "cortex", et: "🧠 ¿Por qué?", q: "¿Por qué la clave de Yape ya no se anota en el README?",
      x: "Porque en agosto alguien la copió de ahí y se filtró. El incidente y la regla están en Cortex; el README solo dice «no la pongas aquí»." },
  ];
  var EXP_CMD = {
    affected: "affected responde «¿qué se rompe si toco X?»: los archivos que dependen de X.",
    path: "path responde «¿cómo llego de A a B?»: la ruta más corta del grafo.",
    explain: "explain responde «¿qué es X y con quién habla?»: sus vecinos directos.",
    god: "god-nodes muestra los centros: los nodos con más conexiones.",
  };
  var DATOS_CORTEX = [
    { p: "¿Con qué empieza el agente en Cortex?", o: ["cortex_brief: un resumen de unos 600 tokens", "Leyendo todo el repositorio", "graphify update ."],
      x: "cortex_brief le da el mapa de la memoria en unos 600 tokens; después baja solo por la rama que necesita." },
    { p: "Lo que escribe una IA en Cortex queda como…", o: ["Borrador, hasta que una persona lo aprueba", "Verdad definitiva", "Se borra al cerrar la sesión"],
      x: "Las personas controlan la memoria: lo que escribe la IA es borrador hasta que alguien lo aprueba." },
    { p: "Si cambia el código enlazado a una página de Cortex…", o: ["La página se marca desactualizada", "La página se corrige sola", "Nadie se entera"],
      x: "Las páginas se enlazan al código y se marcan desactualizadas cuando ese código cambia." },
    { p: "¿Cuánto cuesta buscar en Cortex?", o: ["Nada: la búsqueda es local", "Un token por palabra", "Lo mismo que leer el repositorio"],
      x: "La búsqueda corre en tu máquina: buscar no gasta tokens." },
  ];

  // ---------- el mapa: 1900 × 1230 ----------
  var ANCHO = 1900, ALTO = 1230, COLS = [200, 700, 1210, 1700], FILAS = [150, 455, 770, 1080], SW = 220, SH = 130;
  function centro(id) {
    if (id === "faro") return { x: 955, y: 612 };
    if (id === "cortex") return { x: 1700, y: 1080 };
    return { x: COLS[F[id].c], y: FILAS[F[id].f] };
  }
  var MUROS = [{ x: 545, y: 585, w: 120, h: 70, t: "node_modules" }, { x: 1255, y: 585, w: 120, h: 70, t: ".git" }];
  var ZONAS = IDS.map(function (id) {
    var c = centro(id);
    return { id: id, x: c.x - SW / 2, y: c.y - SH / 2, w: SW, h: SH, nombre: F[id].n, color: "#5a49d6", pintar: pintarSala };
  });
  ZONAS.push({ id: "faro", x: 865, y: 545, w: 180, h: 135, nombre: "Faro Graphify", color: "#c48709", colorTexto: "#1c1300", pintar: pintarFaro });
  ZONAS.push({ id: "cortex", x: 1580, y: 1010, w: 240, h: 140, nombre: "Bóveda Cortex", color: "#0f8f8a", pintar: pintarBoveda });
  var PRIMERA = ZONAS[0].id; // su dibujo pinta antes la capa del grafo (hilos, ruta dorada, cajas)

  // ---------- estado de mi ronda ----------
  var juego = null;
  function estadoNuevo() {
    return { vistos: {}, cristal: {}, tk: null, bonos: {}, aviso: false,
      mio: { resueltas: 0, ahorro: 0, gasto: 0, faros: 0, mem: 0, malas: 0, cortex: 0, escritos: 0 } };
  }
  var est = estadoNuevo();
  function actual() {
    if (!juego) return null;
    var y = juego.yo(); if (!y.carga) return null;
    var ob = juego.objeto(y.carga);
    return ob && ob.k != null ? ob : null;
  }
  // Cada pregunta es una sesión nueva: lo leído se paga otra vez (menos lo que está en memoria).
  function sesion(ob) {
    var clave = ob.id + "@" + ob.v;
    if (!est.tk || est.tk.clave !== clave) est.tk = { clave: clave, k: ob.k, gasto: 0, leidos: {}, faro: false, pista: false, avisoFaro: false, avisoCortex: false };
    return est.tk;
  }
  function claveArista(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
  function rutaEncendida(T) {
    var luz = {};
    T.ruta.forEach(function (r) { for (var i = 0; i < r.length - 1; i++) luz[claveArista(r[i], r[i + 1])] = true; });
    return luz;
  }
  function cuantosCristales() { return Object.keys(est.cristal).length; }

  // ---------- dibujo ----------
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function linea(g, a, b) { g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
  function cristal(g, x, y, s) {
    g.save(); g.translate(x, y); g.scale(s, s);
    [[-9, 0, 9, 24, "#7fe9ff"], [3, 2, 11, 32, "#a99cff"], [13, 2, 8, 19, "#7fe9ff"]].forEach(function (q) {
      g.fillStyle = q[4]; g.beginPath(); g.moveTo(q[0] - q[2] / 2, q[1]); g.lineTo(q[0], q[1] - q[3]); g.lineTo(q[0] + q[2] / 2, q[1]); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.55)"; g.beginPath(); g.moveTo(q[0] - q[2] / 4, q[1] - 2); g.lineTo(q[0], q[1] - q[3] + 4); g.lineTo(q[0], q[1] - 2); g.closePath(); g.fill();
    });
    g.restore();
  }
  function pagina(g, x, y, viva) {
    g.save(); g.translate(x, y);
    g.fillStyle = viva ? "#f4f1ff" : "rgba(244,241,255,.35)"; g.strokeStyle = "#1b2350"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-15, -20); g.lineTo(7, -20); g.lineTo(15, -12); g.lineTo(15, 20); g.lineTo(-15, 20); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = viva ? "#6a58e8" : "rgba(106,88,232,.5)"; g.fillRect(-9, -8, 18, 3); g.fillRect(-9, -1, 13, 3); g.fillRect(-9, 6, 16, 3);
    g.restore();
  }
  function niebla(g, z, t) {
    var d = REDUCIDO ? 0 : Math.sin(t * .6 + z.x) * 8;
    g.fillStyle = "rgba(225,222,255,.10)";
    g.beginPath(); g.ellipse(z.x + z.w * .3 + d, z.y + z.h * .62, 70, 30, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(z.x + z.w * .68 - d, z.y + z.h * .45, 76, 32, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(z.x + z.w * .5, z.y + z.h * .82 + d * .4, 92, 22, 0, 0, 7); g.fill();
  }
  // La capa del grafo: hilos (apagados en la niebla, visibles si leíste uno de sus extremos), la ruta del faro,
  // la línea guía hasta la respuesta y las cajas que bloquean el paso.
  function pintarGrafo(g, t) {
    var ob = actual(), T = ob && TK[ob.k], tk = ob && sesion(ob);
    var luz = T && T.tipo === "grafo" && tk.faro ? rutaEncendida(T) : {};
    g.save(); g.lineCap = "round";
    E.forEach(function (e) {
      if (luz[claveArista(e[0], e[1])]) return;
      var visto = est.vistos[e[0]] || est.vistos[e[1]];
      g.strokeStyle = visto ? "rgba(169,156,255,.62)" : "rgba(169,156,255,.10)"; g.lineWidth = visto ? 5 : 3;
      g.setLineDash(visto ? [] : [10, 16]);
      linea(g, centro(e[0]), centro(e[1]));
    });
    g.setLineDash([]);
    Object.keys(luz).forEach(function (k) {
      var p = k.split("|"), a = centro(p[0]), b = centro(p[1]);
      g.strokeStyle = "rgba(242,193,78,.22)"; g.lineWidth = 24; linea(g, a, b);
      g.strokeStyle = "#f2c14e"; g.lineWidth = 7; g.setLineDash([28, 16]); g.lineDashOffset = REDUCIDO ? 0 : -t * 70; linea(g, a, b); g.setLineDash([]);
    });
    // línea guía: de mi robot a la respuesta (si el faro ya habló) o a la bóveda (si ya sabes que es de Cortex)
    if (T && juego) {
      var destino = null, yo = juego.yo();
      if (T.tipo === "grafo" && tk.faro) {
        var md = 1e9; T.a.forEach(function (id) { var c = centro(id), d = Math.hypot(c.x - yo.x, c.y - yo.y); if (d < md) { md = d; destino = c; } });
      } else if (T.tipo === "cortex" && tk.pista) destino = centro("cortex");
      if (destino) {
        g.strokeStyle = T.tipo === "cortex" ? "rgba(127,233,255,.7)" : "rgba(255,226,122,.75)"; g.lineWidth = 3.5; g.setLineDash([4, 12]);
        g.lineDashOffset = REDUCIDO ? 0 : -t * 40; linea(g, { x: yo.x, y: yo.y - 20 }, destino); g.setLineDash([]);
      }
    }
    // cajas: node_modules y .git (no se entra)
    MUROS.forEach(function (m) {
      g.fillStyle = "rgba(0,0,0,.35)"; rr(g, m.x + 4, m.y + 8, m.w, m.h, 10); g.fill();
      g.fillStyle = "#2b2550"; rr(g, m.x, m.y, m.w, m.h, 10); g.fill();
      g.strokeStyle = "#8a7cf0"; g.lineWidth = 3; g.stroke();
      g.strokeStyle = "rgba(169,156,255,.25)"; g.lineWidth = 2;
      for (var i = 1; i < 4; i++) { g.beginPath(); g.moveTo(m.x + 8, m.y + i * m.h / 4); g.lineTo(m.x + m.w - 8, m.y + i * m.h / 4); g.stroke(); }
      g.fillStyle = "#ffd27a"; g.font = "800 17px ui-monospace, Menlo, Consolas, monospace"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(m.t, m.x + m.w / 2, m.y + m.h / 2 + 1, m.w - 12);
    });
    g.restore();
  }
  function pintarSala(g, z, t) {
    if (z.id === PRIMERA) pintarGrafo(g, t);
    var id = z.id, f = F[id], ob = actual(), T = ob && TK[ob.k], tk = ob && sesion(ob);
    var visto = !!est.vistos[id], cr = !!est.cristal[id];
    var meta = !!(T && T.tipo === "grafo" && tk.faro && T.a.indexOf(id) >= 0), inicio = !!(T && T.s === id), leido = !!(tk && tk.leidos[id]);
    var pulso = REDUCIDO ? .6 : (Math.sin(t * 5) + 1) / 2;
    g.save();
    if (meta) { g.fillStyle = "rgba(242,193,78," + (.18 + pulso * .2).toFixed(3) + ")"; rr(g, z.x - 18, z.y - 18, z.w + 36, z.h + 36, 30); g.fill(); }
    else if (cr) { g.fillStyle = "rgba(127,233,255,.12)"; rr(g, z.x - 10, z.y - 10, z.w + 20, z.h + 20, 26); g.fill(); }

    reflexion: { clave: "08-juego-hilo", pregunta: "¿Qué le darías primero a tu agente: mapa o memoria? ¿Por qué?", placeholder: "Primero le doy…",
      porDefecto: "Primero le doy el mapa: que pregunte al grafo antes de abrir archivos." },
    alRonda: function () { est = estadoNuevo(); },
    alTomar: function (ob, api) {
      if (est.aviso) return;
      est.aviso = true;
      api.toast("Cada pregunta es una sesión nueva: tu agente paga lo que lee. Lo que está en memoria 🧠 cuesta 30.", "", 4200);
    },
    // El bono acertado no se repite (esa consulta ya la sabes): se marca cuando sube stats.bonus.
    alEntregar: function (ob, zona, res, api) { if (res && res.bonus && res.bonus.clave) est.bonoPend = { clave: res.bonus.clave, antes: api.stats.bonus }; },
    alEvento: function (e, api) {
      if (e.tipo !== "memoria") return;
      var id = IDS[e.valor | 0];
      if (!id || est.cristal[id]) return;
      est.cristal[id] = true;
      var c = centro(id); api.popup(c.x, c.y - 80, "🧠 memoria", "#7fe9ff");
    },
    alReflexion: function (t) { ptGuardar("muro-08-juego-hilo", t); },
    resultado: function (s, api) {
      var m = est.mio, k = api.puntos, media = m.resueltas ? m.gasto / m.resueltas : 0;
      var titulo = !m.resueltas ? "Explorador en la niebla"
        : m.faros >= 3 && m.malas <= 2 ? "Navegante del grafo"
        : m.cortex >= 2 && m.escritos >= 1 ? "Guardián de la memoria"
        : m.escritos >= 3 ? "Cartógrafo de la clase"
        : m.resueltas >= 3 ? "Faro encendido" : "Primeros hilos";
      return { etiqueta: "Mi expedición en la niebla", titulo: titulo, resultado: k + " K tokens ahorrados",
        detalle: m.resueltas ? m.resueltas + (m.resueltas === 1 ? " pregunta" : " preguntas") + " · " + num(media) + " tok de media (leer todo: " + num(TODO) + ") · " + m.mem + " desde memoria"
          : "La próxima: recoge una pregunta y pasa por el faro." };
    },
  });

  // Ganchos para la prueba automática (Playwright): centros del mapa y la pregunta que llevo.
  window.__faros = {
    centro: centro, ids: IDS.slice(),
    llevo: function () { var ob = actual(); if (!ob) return null; var T = TK[ob.k], tk = sesion(ob); return { tipo: T.tipo, s: T.s, a: (T.a || []).slice(), faro: tk.faro, gasto: tk.gasto, q: T.q }; },
    estado: function () { return { cristales: Object.keys(est.cristal), vistos: Object.keys(est.vistos), mio: est.mio }; },
    objeto: function (id) { var o = juego.objeto(id); return o ? { x: o.x, y: o.y, k: o.k } : null; },
  };

  // ---------- el contador de tokens (arriba a la izquierda del mapa) ----------
  (function () {
    var esc = document.querySelector("#juego .aj-escenario"), banner = document.querySelector("#juego .aj-banner"), entrada = document.querySelector("#juego .aj-entrada");
    if (!esc) return;
    var hud = document.createElement("div"); hud.className = "fn-hud"; hud.setAttribute("aria-live", "off"); esc.appendChild(hud);
    var firma = "";
    setInterval(function () {
      if (est.bonoPend && juego.stats.bonus > est.bonoPend.antes) { est.bonos[est.bonoPend.clave] = true; est.bonoPend = null; }
      var y = juego.yo(), juega = (y.dentro || y.practica) && (!entrada || entrada.hidden);
      var ob = juega ? actual() : null, tk = ob ? sesion(ob) : null, n = cuantosCristales();
      var html = !juega ? "" : (tk ? '<span>🪙 <b>' + num(tk.gasto) + ' tok</b><span class="largo"> en esta pregunta</span></span>' : "") +
        '<span class="mem">🧠 <b>' + n + '</b><span class="largo"> ' + (n === 1 ? "archivo" : "archivos") + " en la memoria de la clase</span></span>";
      var top = banner && !banner.hidden && banner.textContent ? banner.offsetTop + banner.offsetHeight + 6 : 10;
      var f = html + "|" + top;
      if (f === firma) return;
      firma = f; hud.innerHTML = html; hud.style.top = top + "px"; hud.hidden = !html;
    }, 200);
  })();
})();
</script>
</body>
</html>
