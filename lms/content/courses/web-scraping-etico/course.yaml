id: web-scraping-etico
title: Web scraping ético con IA
description: >
  Extrae datos de cualquier web con Tampermonkey y scripts en el navegador, y con Python en un servidor EC2
  usando cookies y tokens en la cabecera, respetando las reglas de cada sitio. Taller en vivo por Zoom el
  domingo 8 de noviembre de 2026, de 3:00 a 6:00 p. m. (Lima).
cohorts: [scraping-etico-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un script de Tampermonkey que extrae los datos de una página mientras navegas y un extractor en Python que
  corre en un servidor EC2 con sesión (cookie y token en la cabecera), con paginación, pausas y reintentos
  para no saturar el sitio, y exportación limpia a CSV y JSON lista para importar.
requisitos:
  - Laptop con Chrome o Firefox
  - Nociones básicas de programación
  - "Cuenta de AWS opcional (te damos el servidor del curso)"
dedicacion: "Taller en vivo de 3 horas (domingo 8 de noviembre de 2026), 3:00 a 6:00 p. m., hora de Lima"

modules:
  - id: s1
    title: "Taller · Scraping ético en el navegador y en el servidor"
    lessons: [ws-01]
