id: 03-vscode
titulo: Instalar VS Code
fase: experiencia
paso: vscode
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: Instalador en macOS o Linux, cmd: "curl -fsSL https://raw.githubusercontent.com/davrv93/jmd/main/instalador/instalar.sh | bash"}
