id: 08-avatar
titulo: "Construir 2: tu estilo y tu código"
fase: experiencia
paso: ""
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 70
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · pega este pedido"
    cmd: "Sigue con /opt/skills-curso/s2-robo-estilos/SKILL.md. Arma los 4 estilos de mi asistente con --todos y luego agrega en /trabajo/mi-robo/backend/herramientas.py una herramienta que responda el horario de atención desde mi código, no desde la IA. Reinicia con sh /trabajo/mi-robo/robo.sh reiniciar y pruébala con curl. Si falla, lee tail -n 20 /trabajo/mi-robo.log y corrígelo."
  - {titulo: "Arma los 4 estilos y compáralos (visor: mi-robo/index.html)", cmd: "cd /trabajo/negocio && python3 /opt/skills-curso/s2-robo-estilos/motor/construir.py --asistente asistente.json --todos"}
  - {titulo: "Programa a tu Robo: abre en el visor mi-robo/codigo.html", cmd: ""}
  - {titulo: Ver tu código en la terminal, cmd: "cat /trabajo/mi-robo/backend/herramientas.py"}
  - {titulo: "Si tu código falla: el error exacto", cmd: "tail -n 20 /trabajo/mi-robo.log"}
