id: 07-chat
titulo: "Construir 1: el chat"
fase: experiencia
paso: ""
duracion_min: 15
lo_logre: true
evidencia: automatica
umbral_pct: 80
compuerta: evidencia
dsh: true
comandos:
  - titulo: "DeepSeek Harness · pega este pedido (cambia el negocio por el tuyo)"
    cmd: "Lee /opt/skills-curso/s2-robo-estilos/SKILL.md y síguelo. Mi negocio es: una cafetería de barrio en Lima. Crea /trabajo/negocio/asistente.json partiendo de /opt/skills-curso/s2-robo-estilos/motor/ejemplos/cafeteria.json, con el nombre de mi asistente, su saludo y 8 preguntas frecuentes con su respuesta. Ármalo con el estilo neon, arráncalo con sh /trabajo/mi-robo/robo.sh reiniciar y comprueba que curl -s localhost:8766/api/salud responde. Al final dime qué abrir en el visor."
  - {titulo: "1 · Copia tu asistente (o el ejemplo de la cafetería)", cmd: "mkdir -p /trabajo/negocio && cd /trabajo/negocio && cp /opt/skills-curso/s2-robo-estilos/motor/ejemplos/cafeteria.json asistente.json"}
  - {titulo: "2 · Ármalo con un estilo", cmd: "cd /trabajo/negocio && python3 /opt/skills-curso/s2-robo-estilos/motor/construir.py --asistente asistente.json --estilo neon"}
  - {titulo: "3 · Arráncalo", cmd: "sh /trabajo/mi-robo/robo.sh reiniciar"}
  - {titulo: Comprobar la salud, cmd: "curl -s localhost:8766/api/salud"}
  - {titulo: "Abrir en el visor: mi-robo/neon/index.html", cmd: ""}
