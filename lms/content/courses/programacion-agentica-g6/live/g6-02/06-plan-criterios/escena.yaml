id: 06-plan-criterios
titulo: Plan de trabajo con criterios
fase: conceptualizacion
paso: plan
duracion_min: 7
lo_logre: true
evidencia: automatica
umbral_pct: 80
compuerta: evidencia
dsh: true
comandos:
  - titulo: "DeepSeek Harness · pega este pedido"
    cmd: "Lee /opt/skills-curso/plan-de-trabajo/SKILL.md y síguelo. Escribe /trabajo/PLAN_TRABAJO.md con 6 tareas para el asistente de mi negocio: cargar el corpus; nombre, saludo y ánimo; tres preguntas del dominio; micrófono; flyer; pruebas de uso. Cada tarea con un criterio de aceptación que se responda sí o no con un comando o una acción."
  - {titulo: Pedir el plan al agente, cmd: "jmd chat \"/skill plan-de-trabajo crea PLAN_TRABAJO.md con 6 tareas verificables para mi asistente\""}
tareas:
  - {id: t1, titulo: "Cargar el corpus"}
  - {id: t2, titulo: "Nombre, saludo y ánimo"}
  - {id: t3, titulo: "Tres preguntas del dominio"}
  - {id: t4, titulo: "Micrófono"}
  - {id: t5, titulo: "Flyer"}
  - {id: t6, titulo: "Pruebas de uso"}
