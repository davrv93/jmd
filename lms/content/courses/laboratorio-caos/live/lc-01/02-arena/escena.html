<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena del monito</title>
<link rel="icon" href="data:,">
<!--
  ARENA DEL MONITO (Laboratorio de caos, lc-01). Minijuego por turnos del LIVE.
  Equipo Monito Tumba Server (ataca, no necesita aula) y equipo Monito Server (defiende su servidor
  de práctica real en /trabajo/monito de su aula). Cada ataque hace saltar al monito sobre la valla
  hasta el servidor atacado. Los defensores curan con dos botones o con prompts en DeepSeek Harness
  (panel a la derecha, escena con dsh: true). El alumno no instala ni activa nada: su servidor arranca
  solo al entrar al equipo, y la vista 3D y las cinemáticas (cine.js) van encendidas para todos. El estado vive en el servidor: GET/POST
  /api/v1/live/{lección}/arena (ver lms/api/internal/httpapi/live_arena.go).
  Quien prefiera escribir tiene la «Terminal» (terminal.js): una terminal de juguete que no ejecuta nada; detecta la
  intención (reglas locales y, si no alcanzan, la IA de /entender con confirmación) y llama a las mismas funciones que los botones.
-->
<style>
:root {
  --crema: #fff4de; --punto: rgba(27,31,59,.08); --tinta: #1b1f3b; --suave: #5a5f80; --caja: #ffffff;
  --banana: #ffc93c; --rojo: #d93a40; --rojo-claro: #ffd9da; --verde: #1e7a4c; --verde-claro: #d3f2e2;
  --lila: #e9e3ff; --madera: #b07a45; --madera-osc: #7a5230; --pasto: #cfeec2;
  --redondo: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="light"]) { --crema: #191c33; --punto: rgba(255,201,60,.08); --tinta: #f3eeff; --suave: #b9b6d6; --caja: #24284a; --rojo-claro: #4a2230; --verde-claro: #183d2d; --lila: #2e2a52; --pasto: #203a2a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--crema); color: var(--tinta); font: 15px/1.45 system-ui, sans-serif; background-image: radial-gradient(var(--punto) 2px, transparent 2px); background-size: 24px 24px; padding: 12px; min-height: 100vh; }
button { font: inherit; cursor: pointer; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.marca { font-family: var(--redondo); font-weight: 800; font-size: 20px; }
.marca small { display: block; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em; color: var(--rojo); }
.fase { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.pill { border: 3px solid var(--tinta); border-radius: 999px; padding: 4px 12px; background: var(--caja); font-family: var(--redondo); }
.pill.ataque { background: var(--rojo); color: #fff; }
.pill.defensa { background: var(--verde); color: #fff; }
.reloj { font: 800 20px/1 ui-monospace, Menlo, monospace; min-width: 3.2ch; text-align: right; }
.marcador { display: flex; gap: 8px; align-items: stretch; }
.marcador div { border: 3px solid var(--tinta); border-radius: 14px; padding: 4px 12px; text-align: center; font-family: var(--redondo); font-weight: 800; box-shadow: 3px 3px 0 var(--tinta); }
.marcador b { display: block; font-size: 22px; line-height: 1.1; }
.m-t { background: var(--rojo-claro); } .m-s { background: var(--verde-claro); }

.arena { position: relative; display: grid; grid-template-columns: 1fr 64px 1.25fr; min-height: 280px; border: 4px solid var(--tinta); border-radius: 22px; background: var(--pasto); overflow: hidden; box-shadow: 6px 6px 0 var(--tinta); }
.zona { padding: 12px; }
.zona h3 { margin: 0 0 8px; font-family: var(--redondo); font-size: 14px; letter-spacing: .04em; }
.barrio { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.mono { display: flex; flex-direction: column; align-items: center; width: 70px; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.15; }
.mono .cara { width: 46px; height: 46px; border-radius: 50%; background: var(--caja); border: 3px solid var(--rojo); display: grid; place-items: center; font-size: 26px; }
.mono.yo .cara { box-shadow: 0 0 0 3px var(--banana); }
.mono.ausente { opacity: .45; }
.valla { position: relative; background: repeating-linear-gradient(90deg, transparent 0 6px, var(--madera) 6px 18px, transparent 18px 24px); }
.valla::before, .valla::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background: var(--madera-osc); border-radius: 4px; }
.valla::before { top: 28%; } .valla::after { top: 66%; }
.granja { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; align-content: start; }
.srv { position: relative; border: 3px solid var(--tinta); border-radius: 14px; background: var(--caja); padding: 8px 6px 6px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.2; transition: transform .15s; }
.srv .rack { font-size: 30px; line-height: 1; }
.srv .nom { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv .est { display: block; font-size: 11px; margin-top: 2px; }
.srv.ok { background: var(--verde-claro); }
.srv.caido { background: var(--rojo-claro); }
.srv.preparando { opacity: .6; }
.srv.elegible { cursor: pointer; }
.srv.elegible:hover { transform: translateY(-2px); }
.srv.blanco { outline: 4px dashed var(--rojo); outline-offset: 2px; }
.srv.yo { box-shadow: 0 0 0 3px var(--banana); }
.vacio { color: var(--suave); font-size: 13px; }
.saltador { position: fixed; z-index: 30; font-size: 34px; pointer-events: none; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.25)); }
.boom { position: absolute; inset: auto 0 100% 0; font-size: 28px; pointer-events: none; }
.sacudir { animation: sacudir .45s; }
@keyframes sacudir { 20%{transform:translateX(-6px) rotate(-3deg)} 40%{transform:translateX(6px) rotate(3deg)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.cura { animation: cura .9s; }
@keyframes cura { 30% { box-shadow: 0 0 0 8px rgba(30,122,76,.45); } }
.cartel { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
#cartel3d { place-items: start center; padding-top: 11%; }
.cartel span { font-family: var(--redondo); font-weight: 900; font-size: clamp(26px, 5vw, 46px); background: var(--banana); color: #1b1f3b; border: 4px solid #1b1f3b; border-radius: 22px; padding: 6px 22px; box-shadow: 6px 6px 0 #1b1f3b; transform: rotate(-3deg); }

.escenario { position: relative; height: clamp(300px, 46vw, 520px); border: 4px solid var(--tinta); border-radius: 22px; overflow: hidden; box-shadow: 6px 6px 0 var(--tinta); background: #fff4de; }
.escenario canvas { width: 100%; height: 100%; display: block; touch-action: manipulation; }
#etiquetas3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.et3d { position: absolute; transform: translate(-50%, -100%); font: 700 11px/1.2 system-ui, sans-serif; color: #1b1f3b; background: rgba(255,255,255,.9); border: 2px solid #1b1f3b; border-radius: 9px; padding: 1px 6px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.et3d.yo { background: var(--banana); }
.et3d.oculta { display: none; }
.et3d.ausente { opacity: .5; }
.et3d.srv.ok { background: #d3f2e2; } .et3d.srv.caido { background: #ffd9da; } .et3d.srv.prep { opacity: .75; }
.burbuja3d { position: absolute; transform: translate(-50%, -100%); font-size: 30px; pointer-events: none; }
.et3d.jefe { font-weight: 800; border-width: 3px; }
.et3d.jefe.ema { background: #d3f2e2; } .et3d.jefe.oz { background: #dfe8ff; }
.luna { position: absolute; left: 20px; top: 14px; width: 78px; height: 78px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(circle at 34% 30%, #fffbe6 0 18%, #fff3c4 46%, #f2dc8f 100%); box-shadow: 0 0 0 6px rgba(255,243,196,.35), 0 0 34px 12px rgba(255,243,196,.55); }
.luna::before, .luna::after { content: ""; position: absolute; border-radius: 50%; background: rgba(205,180,90,.45); }
.luna::before { width: 16px; height: 16px; left: 46px; top: 20px; } .luna::after { width: 11px; height: 11px; left: 24px; top: 48px; }
.cine-barra { position: absolute; left: 0; right: 0; height: 0; background: #1b1f3b; transition: height .35s ease; pointer-events: none; z-index: 4; }
.cine-barra.a { top: 0; } .cine-barra.b { bottom: 0; }
.escenario.en-cine .cine-barra { height: 9%; }
.escena-wrap { position: relative; }
.ficha { position: absolute; left: 14px; bottom: 14px; z-index: 8; width: min(400px, calc(100% - 28px)); display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  background: var(--caja); color: var(--tinta); border: 4px solid #1b1f3b; border-left-width: 12px; border-radius: 18px; padding: 10px 12px 12px; box-shadow: 6px 6px 0 #1b1f3b; pointer-events: none; overflow: hidden; }
.ficha.problema { border-left-color: var(--rojo); } .ficha.cura { border-left-color: var(--verde); } .ficha.fallo { border-left-color: #e08a00; } .ficha.fase { border-left-color: var(--banana); }
.ficha-ic { font-size: 38px; line-height: 1; }
.ficha.mini .ficha-ic { font-size: 26px; }
.ficha-k { display: block; font: 800 11px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
.ficha.problema .ficha-k { color: var(--rojo); } .ficha.cura .ficha-k { color: var(--verde); } .ficha.fallo .ficha-k { color: #c97800; }
.ficha-t { display: block; font-family: var(--redondo); font-weight: 800; font-size: 20px; line-height: 1.15; padding-right: 58px; }
.ficha-q { display: block; font-size: 12px; font-weight: 700; color: var(--suave); margin-top: 2px; }
.ficha-c { margin: 6px 0 0; font-size: 14px; line-height: 1.35; }
.ficha-pw { margin-top: 8px; border: 2px dashed var(--tinta); border-radius: 12px; background: var(--lila); padding: 6px 9px; }
.ficha-pw b { display: block; font: 800 10px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--suave); }
.ficha-pw code { font: 600 12.5px/1.35 ui-monospace, Menlo, monospace; white-space: normal; overflow-wrap: anywhere; }
.ficha-x { position: absolute; right: 6px; top: 6px; border: 2px solid var(--tinta); border-radius: 999px; background: var(--caja); color: var(--tinta); font-weight: 800; font-size: 12px; padding: 1px 8px; pointer-events: auto; }
.ficha-barra { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--banana); transform-origin: 0 50%; }
@keyframes ficha-barra { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.conceptos { margin-top: 10px; border-top: 2px dashed var(--suave); padding-top: 8px; font-size: 13px; }
.conceptos summary { font-weight: 800; cursor: pointer; font-family: var(--redondo); }
.conceptos ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; max-height: 240px; overflow: auto; }
.conceptos li b { display: block; } .conceptos li span { display: block; color: var(--suave); }
.conceptos li code { display: block; margin-top: 3px; font: 600 12px/1.35 ui-monospace, Menlo, monospace; background: var(--lila); border-radius: 8px; padding: 4px 7px; white-space: normal; overflow-wrap: anywhere; }
.vista { border: 3px solid var(--tinta); border-radius: 999px; background: var(--caja); color: var(--tinta); font-weight: 800; padding: 4px 12px; }
.blancos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.blancos button { border: 2px solid var(--tinta); border-radius: 999px; background: var(--caja); color: var(--tinta); padding: 3px 10px; font-weight: 700; font-size: 13px; }
.blancos button.sel { background: var(--rojo); color: #fff; }
.abajo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-top: 12px; }
.caja { background: var(--caja); border: 3px solid var(--tinta); border-radius: 18px; padding: 14px; box-shadow: 4px 4px 0 var(--tinta); }
.caja h2 { margin: 0 0 8px; font-family: var(--redondo); font-size: 19px; }
.suave { color: var(--suave); margin: 0 0 10px; }
.equipos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eq { border: 3px solid var(--tinta); border-radius: 16px; padding: 12px; text-align: left; color: var(--tinta); box-shadow: 4px 4px 0 var(--tinta); }
.eq b { display: block; font-family: var(--redondo); font-size: 19px; }
.eq.t { background: var(--rojo-claro); } .eq.s { background: var(--verde-claro); }
.eq:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--tinta); }
.botones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.bt { border: 3px solid var(--tinta); border-radius: 14px; padding: 10px; font-weight: 800; background: var(--banana); color: #1b1f3b; box-shadow: 0 5px 0 var(--tinta); }
.bt.rojo { background: var(--rojo); color: #fff; } .bt.verde { background: var(--verde); color: #fff; }
.bt:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.bt:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
.bt small { display: block; font-weight: 600; font-size: 11px; opacity: .9; }
.estado { border-radius: 12px; padding: 10px; margin-bottom: 10px; font-weight: 700; }
.estado.ok { background: var(--verde-claro); } .estado.caido { background: var(--rojo-claro); } .estado.neutro { background: var(--lila); }
.estado ul { margin: 6px 0 0; padding-left: 18px; font-weight: 600; }
.prompts { display: grid; gap: 6px; margin-top: 10px; }
.prompt { text-align: left; border: 2px dashed var(--tinta); border-radius: 12px; background: var(--lila); color: var(--tinta); padding: 8px 10px; font-size: 13px; }
.prompt b { display: block; font-size: 11px; letter-spacing: .08em; color: var(--suave); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow: auto; font-size: 13px; }
.feed li { border-left: 4px solid var(--suave); padding: 2px 8px; }
.feed li.ataque { border-color: var(--rojo); } .feed li.defensa { border-color: var(--verde); } .feed li.puntos, .feed li.fase { border-color: var(--banana); font-weight: 700; }
.staff { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--suave); }
.aviso { min-height: 1.3em; font-weight: 700; color: var(--rojo); margin: 8px 0 0; }
.ok-msg { color: var(--verde); }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .arena { grid-template-columns: 1fr; grid-template-rows: auto 26px auto; }
  .valla { background: repeating-linear-gradient(0deg, transparent 0 4px, var(--madera) 4px 10px, transparent 10px 14px), repeating-linear-gradient(90deg, transparent 0 8px, var(--madera) 8px 20px, transparent 20px 26px); }
  .valla::before, .valla::after { display: none; }
  .abajo { grid-template-columns: 1fr; }
  .equipos { grid-template-columns: 1fr; }
  .escenario { height: 62vw; min-height: 260px; }
  .luna { width: 52px; height: 52px; left: 12px; top: 10px; }
  .escena-wrap { padding-bottom: 176px; }
  .escena-wrap::after { content: "Aquí salen los conceptos y los prompts de la partida"; position: absolute; left: 0; right: 0; bottom: 0; height: 166px; display: grid; place-items: center; text-align: center; padding: 0 18px; border: 3px dashed var(--suave); border-radius: 14px; color: var(--suave); font-size: 13px; font-weight: 700; }
  .ficha { left: 0; bottom: 0; width: 100%; height: 166px; padding: 7px 9px 9px; gap: 8px; border-radius: 14px; box-shadow: 3px 3px 0 #1b1f3b; z-index: 9; }
  .ficha-ic { font-size: 26px; } .ficha-t { font-size: 16px; }
  .ficha-c { font-size: 12.5px; line-height: 1.3; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ficha-pw { margin-top: 4px; padding: 3px 7px; } .ficha-pw b { display: none; }
  .ficha-pw code { font-size: 11px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) { .sacudir, .cura { animation: none; } }
/* Terminal de juguete (terminal.js). La pantalla es oscura en los dos temas; el marco sigue al tema. */
.vista[aria-expanded="true"] { background: var(--tinta); color: var(--crema); }
.term-abrir { display: block; width: 100%; margin-top: 12px; padding: 10px 14px; border: 3px dashed var(--tinta); border-radius: 14px; background: #12152b; color: #e6f3df; font: 600 14px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-align: left; cursor: pointer; }
.term-abrir b { color: #ffc93c; }
.term-abrir:focus-visible { outline: 3px solid var(--banana); outline-offset: 2px; }
.term { margin-top: 12px; border: 3px solid var(--tinta); border-radius: 16px; background: #12152b; color: #e6f3df; box-shadow: 4px 4px 0 var(--tinta); overflow: hidden; font: 13.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.term:focus-within { outline: 3px solid var(--banana); outline-offset: 2px; }
.term-barra { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; background: #262b52; color: #c9cdea; font-size: 12px; }
.term-barra b { color: #ffc93c; }
.term-barra span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.term-barra button, .term-ok { border: 2px solid #c9cdea; border-radius: 999px; background: transparent; color: #fff; font: 700 13px/1 system-ui, sans-serif; min-width: 34px; min-height: 30px; padding: 0 9px; }
.term-barra button:focus-visible, .term-ok:focus-visible { outline: 3px solid #ffc93c; outline-offset: 1px; }
.term-sal { height: 216px; overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.term-sal p { margin: 0; }
.term-sal .yo { color: #fff; font-weight: 700; } .term-sal .ok { color: #7ee2a8; } .term-sal .mal { color: #ffa3a6; } .term-sal .ent { color: #ffc93c; } .term-sal .ia { color: #c3b5ff; } .term-sal .dim { color: #a9add0; }
.term-fila { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 12px; }
.term-fila label { color: #7ee2a8; font-weight: 700; white-space: nowrap; }
.term-fila input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; caret-color: #ffc93c; font: inherit; padding: 7px 0; }
.term-fila input::placeholder { color: #8d91b5; }
@media (max-width: 760px) {
  .term-sal { height: 170px; }
  .term-u, .term-barra span { display: none; }
  .term-barra b { flex: 1; }
  .term-fila input { font-size: 16px; }
}
</style>
</head>
<body>
<div class="top">
  <div class="marca"><small>LABORATORIO DE CAOS</small>Arena del monito</div>
  <div class="fase"><span class="pill" id="fase">Esperando</span><span class="reloj" id="reloj"></span><span id="ronda" class="suave" style="margin:0"></span></div>
  <button class="vista" id="vista" type="button" hidden>Vista 2D</button>
  <button class="vista" id="term-btn" type="button" hidden aria-expanded="false" aria-controls="term">⌨️ Terminal</button>
  <div class="marcador"><div class="m-t">🐒 Tumba Server<b id="pt">0</b></div><div class="m-s">🛡️ Server<b id="ps">0</b></div></div>
</div>

<div class="escena-wrap">
<section class="escenario" id="escenario3d" hidden aria-label="Arena en 3D: los monitos a la izquierda de la valla y los servidores a la derecha. Ema, el Rey Mono, cuida los servidores; el Ozaru crece con la luna en el turno de ataque">
  <canvas id="lienzo3d"></canvas>
  <div class="luna" id="luna3d" aria-hidden="true"></div>
  <div id="etiquetas3d"></div>
  <div class="cine-barra a" aria-hidden="true"></div><div class="cine-barra b" aria-hidden="true"></div>
  <div class="cartel" id="cartel3d" hidden><span id="cartel3d-txt"></span></div>
</section>

<section class="arena" id="arena">
  <div class="zona"><h3>🐒 Barrio de los monitos</h3><div class="barrio" id="barrio"></div></div>
  <div class="valla" aria-hidden="true"></div>
  <div class="zona"><h3>🖥️ Granja de servidores</h3><div class="granja" id="granja"></div></div>
  <div class="cartel" id="cartel" hidden><span id="cartel-txt"></span></div>
</section>
<aside class="ficha" id="ficha" hidden aria-live="polite">
  <div class="ficha-ic" id="ficha-ic" aria-hidden="true"></div>
  <div>
    <small class="ficha-k" id="ficha-k"></small>
    <b class="ficha-t" id="ficha-t"></b>
    <span class="ficha-q" id="ficha-q"></span>
    <p class="ficha-c" id="ficha-c"></p>
    <div class="ficha-pw" id="ficha-pw"><b>EL PROMPT QUE LO LOGRA</b><code id="ficha-p"></code></div>
  </div>
  <button class="ficha-x" id="ficha-x" type="button" aria-label="Pasar a la siguiente">Saltar</button>
  <i class="ficha-barra" id="ficha-barra" aria-hidden="true"></i>
</aside>
