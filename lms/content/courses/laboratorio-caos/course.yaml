id: laboratorio-caos
title: "Laboratorio de caos · Suelta al monito"
description: >
  Ingeniería del caos en vivo y por turnos. El equipo Monito Tumba Server ataca con botones: apaga la app,
  llena el disco, borra la base o atasca el servidor. El equipo Monito Server cuida un servidor real en su
  aula y lo cura con botones y con prompts en DeepSeek Harness. Aprendes por qué los respaldos se prueban,
  qué es un health check y cómo se recupera un sistema caído, sin que ningún servidor de verdad salga herido.
cohorts: [laboratorio-caos-1]
proyecto_final: >
  Tu servidor sigue en pie al final de la arena y puedes explicar qué hiciste para curar cada ataque.
requisitos:
  - Celular o laptop (el equipo Monito Server necesita laptop con Chrome o Edge)
  - Ganas de romper cosas y de arreglarlas; no hace falta experiencia previa
dedicacion: "1 sesión en vivo: martes 17 de noviembre de 2026, de 7:30 a 9:00 p. m. (hora de Lima)"
modules:
  - id: lc
    title: "Laboratorio de caos"
    lessons: [lc-01]
agenda: {nombre: "Laboratorio de caos · Suelta al monito", grupo: "Grupo 1", area: agentica, minutos: 90}
