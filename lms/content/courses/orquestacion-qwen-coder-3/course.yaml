id: orquestacion-qwen-coder-3
title: "Orquestación con Qwen Coder · Grupo 3"
description: >
  Nuestro curso más avanzado: orquesta varios agentes con Qwen Coder corriendo en tu máquina. Planificador, ejecutores y verificador que se reparten un proyecto real, con contexto acotado, pruebas ocultas que atrapan los falsos positivos y costos medidos. Dos sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 22 de noviembre de 8:00 a. m. a 9:15 a. m.; domingo 29 de noviembre de 8:00 a. m. a 9:15 a. m. Inversión: S/ 50.
cohorts: [orquestacion-qwen-coder-3-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un sistema de agentes orquestados con Qwen Coder que construye y verifica un módulo real de punta a punta, con su bitácora de tareas y métricas de costo.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "2 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 50.

