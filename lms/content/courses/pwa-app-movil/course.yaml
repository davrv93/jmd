id: pwa-app-movil
title: "PWA: app móvil ágil"
description: >
  Construye una app móvil instalable (PWA) con metodología ágil y un agente de IA: funciona sin conexión, envía notificaciones y se publica sin tiendas de apps. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 13 de diciembre de 8:00 a. m. a 9:15 a. m.; martes 15 de diciembre de 9:15 p. m. a 10:30 p. m.; miércoles 16 de diciembre de 9:15 p. m. a 10:30 p. m.. Inversión: S/ 35.
cohorts: [pwa-app-movil-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu app móvil instalable (PWA) publicada en una URL, con modo sin conexión, notificaciones y su tablero ágil de historias terminadas.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 35.

modules:
  - id: s1
    title: "Sesión 1 · Historias de usuario y tu primera PWA instalable"
    lessons: [pwa-01]
  - id: s2
    title: "Sesión 2 · Sin conexión, datos locales y notificaciones"
    lessons: [pwa-02]
  - id: s3
    title: "Sesión 3 · Pruebas, publicación y mejora continua"
    lessons: [pwa-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "PWA: app móvil ágil", grupo: "Grupo 1", area: agentica, minutos: 75}
