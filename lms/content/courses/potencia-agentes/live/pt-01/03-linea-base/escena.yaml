id: 03-linea-base
titulo: "Tu línea base: cuánto lee tu agente hoy"
fase: experiencia
paso: medir
duracion_min: 10
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Caracteres de git log -n 15 (Mac, Linux, WSL, Git Bash)", cmd: "git log -n 15 | wc -c"}
  - {titulo: "Lo mismo en PowerShell", cmd: "(git log -n 15 | Out-String).Length"}
  - {titulo: "¿Sin repositorio? Clona uno de prueba", cmd: "git clone --depth 50 https://github.com/rtk-ai/rtk && cd rtk"}
