id: 07-instala
titulo: "Instala Cortex y Graphify en tu proyecto"
fase: experimentacion
paso: memoria
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 70
compuerta: lo_logre
comandos:
  - {titulo: "Graphify (con uv)", cmd: "uv tool install graphifyy"}
  - {titulo: "Graphify (con pipx)", cmd: "pipx install graphifyy"}
  - {titulo: "Skill /graphify en tu agente", cmd: "graphify install"}
  - {titulo: "Grafo del código, sin LLM", cmd: "graphify update ."}
  - {titulo: "Cortex: crear la memoria", cmd: "npx cortexboard init"}
  - {titulo: "Cortex: tablero", cmd: "npx cortexboard start"}
  - {titulo: "Cortex en Claude Code", cmd: "claude mcp add cortex -- npx cortexboard mcp --actor ai-agent"}
