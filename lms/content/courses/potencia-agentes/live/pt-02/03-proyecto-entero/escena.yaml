id: 03-proyecto-entero
titulo: "¿Cuánto pesa leer tu proyecto entero?"
fase: experiencia
paso: medir
duracion_min: 8
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Caracteres de todo el proyecto (Mac, Linux, WSL, Git Bash)", cmd: "git ls-files | xargs cat 2>/dev/null | wc -c"}
  - {titulo: "Lo mismo en PowerShell", cmd: "(git ls-files | ForEach-Object { Get-Content -Raw $_ } | Out-String).Length"}
