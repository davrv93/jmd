id: 09-consulta
titulo: "Consulta en vez de leer: tu antes → después"
fase: experimentacion
paso: entregar
duracion_min: 5
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "¿Qué se rompe si toco esta función?", cmd: "graphify affected \"NombreDeTuFuncion\""}
  - {titulo: "Cuánto pesa esa respuesta", cmd: "graphify affected \"NombreDeTuFuncion\" | wc -c"}
  - {titulo: "Los centros de tu proyecto", cmd: "graphify god-nodes"}
