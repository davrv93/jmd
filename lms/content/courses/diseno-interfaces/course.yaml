id: diseno-interfaces
title: "Diseño de interfaces · Pantallas que se entienden solas"
description: >
  Tres sesiones en vivo para diseñar interfaces que la gente usa sin preguntar: jerarquía, tipografía,
  espacio y color con criterio; componentes con todos sus estados y un prototipo que se recorre; y el
  paso del diseño al código con tokens, responsive y accesibilidad, con un agente de IA al lado que
  propone variantes y escribe el CSS. Martes 17 y 24 de noviembre y 1 de diciembre de 2026,
  de 9:15 a 10:45 p. m. (Lima).
cohorts: [diseno-interfaces-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un módulo real de tres pantallas (lista, detalle y formulario) rediseñado de punta a punta: sistema de
  tokens, biblioteca de componentes con estados, prototipo navegable probado con tres personas y la versión
  en código (HTML + CSS, o React) publicada en una URL, que pasa contraste AA, se usa con teclado y cabe
  en 393 px.
requisitos:
  - Una laptop con Chrome, Edge o Firefox actual y conexión a internet
  - Una cuenta gratuita de Figma (o Penpot) creada antes de la sesión 1
  - Tu cuenta en jmd-learn.online (aula LIVE con el agente JMD; no instalas nada)
  - "Una pantalla real que quieras mejorar: captura de tu sistema, de tu app o de un competidor"
  - No hace falta saber programar ni haber diseñado antes
dedicacion: "3 sesiones en vivo de 90 minutos (martes 17 y 24 de noviembre y 1 de diciembre), 9:15 a 10:45 p. m. · S/ 40 las tres sesiones"
# Inscripción: jmd-learn.online/inscripcion/diseno-interfaces-1/ · WhatsApp 986 149 476 («DISEÑO UI»).

modules:
  - id: s1
    title: "Sesión 1 · Fundamentos que se ven: jerarquía, tipografía, espacio y color"
    lessons: [di-01]
  - id: s2
    title: "Sesión 2 · Componentes, estados y flujos: el prototipo que se recorre"
    lessons: [di-02]
  - id: s3
    title: "Sesión 3 · Del diseño al código: tokens, responsive y accesibilidad"
    lessons: [di-03]
