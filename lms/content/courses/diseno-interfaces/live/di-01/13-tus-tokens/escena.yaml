id: 13-tus-tokens
titulo: "Tus tokens con el agente: tokens.json y variables"
fase: experimentacion
paso: tokens
duracion_min: 9
lo_logre: true
evidencia: ninguna
umbral_pct: 60
compuerta: lo_logre
dsh: true
# La escena arma el pedido 1 con la escala y la paleta que el alumno eligió en las escenas 7 y 11. Aquí van los
# mismos pedidos con los valores de la clase (16 · 1,25 y la paleta de la ferretería), para el panel del LIVE.
comandos:
  - titulo: "DeepSeek Harness · pedido 1: tu tokens.json, revisado"
    cmd: "Crea la carpeta /trabajo/diseno y dentro el archivo tokens.json con mi sistema de diseño, en el formato Design Tokens (DTCG 2025.10), con estos valores: escala tipográfica base 16 px, razón 1.25: 12, 14, 16, 20, 25, 31 y 39 px (xs, sm, base, md, lg, xl y 2xl en el grupo «tamano»); espacios (retícula de 8) 4, 8, 12, 16, 24, 32, 48 y 64 px en «espacio»; radios sm 4, md 8 y lg 12 px en «radio»; sombras suave (0 1px 3px, negro al 12 %) y alta (0 8px 24px, negro al 18 %) en «sombra»; colores en «color»: acento #0b63ce, texto #1a1d23, texto suave #5b6270, borde #8a919e, línea #d5d9e0, fondo #ffffff, superficie #f5f6f8, éxito #1f7a3e, aviso #a15c00, error #b3261e; fuente Inter en «fuente»; y en «tipografia» título (31 px, 600) y cuerpo (16 px, 400, interlineado 1,5). Reglas: cada token con $type, $value y $description en español; colores como objeto {\"colorSpace\": \"srgb\", \"components\": [r, g, b] de 0 a 1, \"alpha\": 1, \"hex\": \"#rrggbb\"}; medidas como {\"value\": N, \"unit\": \"px\"}. Después mide el contraste de texto, texto suave, acento, éxito, aviso y error sobre el fondo y la superficie, y del borde sobre el fondo, con la fórmula de WCAG 2.2 (python3, sin redondear). Meta: 4,5:1 para texto y 3:1 para el borde. Si algo no pasa, oscurécelo sin cambiar su tono, actualiza tokens.json y dime qué cambiaste. Termina con una tabla: color · sobre qué · razón · ¿pasa?"
  - titulo: "DeepSeek Harness · pedido 2: el archivo para copiar"
    cmd: "Muéstrame /trabajo/diseno/tokens.json completo en un solo bloque de código, sin comentarios, para copiarlo tal cual. Antes, compruébalo con python3 -m json.tool; si no es JSON válido, corrígelo. Después explícame en una línea para qué sirve cada grupo: color, tamano, espacio, radio, sombra y tipografia."
  - titulo: "DeepSeek Harness · si un color de tu pantalla no pasa"
    cmd: "Este color de mi pantalla no pasa AA: texto #______ sobre fondo #______. Calcula su contraste con la fórmula de WCAG 2.2 en python3 y dame tres versiones del mismo tono que pasen 4,5:1, de la más parecida a la más oscura, con su razón."
