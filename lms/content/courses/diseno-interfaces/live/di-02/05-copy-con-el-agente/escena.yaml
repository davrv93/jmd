id: 05-copy-con-el-agente
titulo: "Copy UX con el agente: dos tonos y tres variantes"
fase: conceptualizacion
paso: variantes
duracion_min: 10
lo_logre: true
evidencia: ninguna
umbral_pct: 60
compuerta: presentes
dsh: true
comandos:
  - titulo: "DeepSeek Harness · microcopy en dos tonos"
    cmd: "Necesito microcopy para una app. Dame 2 variantes del texto (A y B) para: (1) un mensaje de error de conexión al guardar un formulario; (2) un mensaje de sin permiso; (3) el texto del botón principal. Parámetros: tono [formal|cercano], persona [asistente|gerente], longitud máxima 120 caracteres por mensaje, español neutro, sin tecnicismos, y cada variante debe incluir qué pasó + qué hacer. Devuélvelo en una tabla: pieza · A · B."
  - titulo: "DeepSeek Harness · tres variantes de un formulario"
    cmd: "Propón 3 variantes de un formulario de 'Crear pedido' para una ferretería: 1) simple, 2) guiado, 3) rápido. Para cada una, lista los campos mínimos, el orden, y el estado vacío/cargando/error/éxito/sin permiso. No inventes funciones raras; piensa en un negocio pequeño."
