<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Portada sesión 2: Componentes, estados y flujos">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="1" stop-color="#1a1d23"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="url(#g)"/>
  <rect width="1400" height="800" fill="url(#grid)"/>

  <g transform="translate(90 96)">
    <text x="0" y="38" fill="#ff9e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="800" letter-spacing=".18em">DISEÑO DE INTERFACES · SESIÓN 2</text>
    <text x="0" y="128" fill="#ffffff" font-family="ui-serif, Georgia, 'Iowan Old Style', Charter, serif" font-size="78" font-weight="800">Componentes, estados</text>
    <text x="0" y="208" fill="#ffffff" font-family="ui-serif, Georgia, 'Iowan Old Style', Charter, serif" font-size="78" font-weight="800">y flujos</text>
    <text x="0" y="270" fill="#cfcad8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="650">El prototipo que se recorre (y se prueba)</text>
  </g>

  <g transform="translate(90 362)" filter="url(#shadow)">
    <rect x="0" y="0" width="1220" height="340" rx="46" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10"/>
    <g transform="translate(44 46)">
      <g>
        <rect x="0" y="0" width="340" height="248" rx="26" fill="#ffffff"/>
        <rect x="18" y="18" width="304" height="44" rx="14" fill="#f5f6f8"/>
        <rect x="18" y="78" width="210" height="20" rx="10" fill="#e7e9ee"/>
        <rect x="18" y="110" width="280" height="20" rx="10" fill="#e7e9ee"/>
        <rect x="18" y="142" width="160" height="20" rx="10" fill="#e7e9ee"/>
        <rect x="18" y="190" width="160" height="40" rx="20" fill="#0b63ce"/>
        <text x="42" y="217" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800">Crear</text>
        <text x="18" y="-14" fill="#ff9e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" letter-spacing=".12em">BIBLIOTECA MÍNIMA</text>
      </g>
      <g transform="translate(402 0)">
        <rect x="0" y="0" width="340" height="248" rx="26" fill="#ffffff"/>
        <rect x="18" y="18" width="304" height="44" rx="14" fill="#f5f6f8"/>
        <rect x="18" y="86" width="96" height="26" rx="13" fill="#eaf2ff"/>
        <text x="36" y="105" fill="#0b63ce" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="800">VACÍO</text>
        <rect x="18" y="122" width="260" height="20" rx="10" fill="#e7e9ee"/>
        <rect x="18" y="154" width="220" height="20" rx="10" fill="#e7e9ee"/>
        <rect x="18" y="190" width="140" height="40" rx="20" fill="#0b63ce"/>
        <text x="42" y="217" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800">Acción</text>
        <text x="18" y="-14" fill="#ff9e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" letter-spacing=".12em">5 ESTADOS</text>
      </g>
      <g transform="translate(804 0)">
        <rect x="0" y="0" width="340" height="248" rx="26" fill="#ffffff"/>
        <rect x="18" y="18" width="304" height="44" rx="14" fill="#f5f6f8"/>
        <rect x="18" y="78" width="304" height="70" rx="18" fill="#fff4f1" stroke="#b3261e" stroke-opacity=".25"/>
        <text x="38" y="110" fill="#b3261e" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="900">No se pudo guardar</text>
        <text x="38" y="134" fill="#5b6270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="650">Reintenta en 10 s</text>
        <path d="M30 186H310" stroke="#e7e9ee" stroke-width="10" stroke-linecap="round"/>
        <path d="M30 214H250" stroke="#e7e9ee" stroke-width="10" stroke-linecap="round"/>
        <text x="18" y="-14" fill="#ff9e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" letter-spacing=".12em">FLUJO + PRUEBA</text>
      </g>
    </g>
  </g>
</svg>
