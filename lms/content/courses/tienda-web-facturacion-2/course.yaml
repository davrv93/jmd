id: tienda-web-facturacion-2
title: "Tienda web con facturación electrónica · Grupo 2"
description: >
  Curso 1 de 2 de JMD Learning (S/ 25, antes S/ 50). Vende por internet y entrega tu comprobante
  electrónico: arma tu catálogo, recibe pedidos y pagos con Yape o transferencia, y entiende boleta,
  factura, nota de crédito e IGV (la boleta y la factura se practican en el ambiente de pruebas de
  SUNAT) y las cuentas de tu día. Tres sesiones en vivo de 45 minutos los sábados
  21 y 28 de noviembre y 5 de diciembre de 2026, de 9:45 a 10:30 p. m. (hora de Lima). Para dueños de negocio:
  no hace falta saber programar. El grupo cierra en 10 alumnos.
cohorts: [tienda-web-2]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu kit de tienda: 10 fichas de producto listas para subir (foto, nombre con su presentación, precio,
  stock y categoría), tus 5 mensajes de cobro para WhatsApp con tus datos de Yape y transferencia, y
  tu regla para elegir boleta o factura (practicada en el ambiente de pruebas de SUNAT).
requisitos:
  - Una cuenta en jmd-learn.online
  - Un celular con WhatsApp (y, si puedes, una laptop o PC)
  - Tener un negocio o una idea de negocio; no hace falta saber programar
  - Si tienes RUC, tenlo a mano para la sesión 3
dedicacion: "3 sesiones en vivo de 45 min (sábados 21 y 28 de noviembre y 5 de diciembre, 9:45 a 10:30 p. m.) y unos 30 min de práctica por semana · S/ 25"
# Inscripción y dudas: WhatsApp 986 149 476.

modules:
  - id: s1
    title: "Sesión 1 · Tu tienda y tu catálogo"
    lessons: [tw2-01]
  - id: s2
    title: "Sesión 2 · Pedidos y pagos por WhatsApp"
    lessons: [tw2-02]
  - id: s3
    title: "Sesión 3 · Facturación, cuentas y reportes"
    lessons: [tw2-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Tienda web con facturación", grupo: "Grupo 2", area: datos, minutos: 45}
