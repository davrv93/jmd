id: tienda-web-facturacion-2
title: "Tienda web con facturación electrónica · Grupo 2"
description: >
  Curso 1 de 2 de JMD Learning (S/ 25, antes S/ 50). Vende por internet y entrega tu comprobante
  electrónico: arma tu catálogo, recibe pedidos y pagos con Yape o transferencia, y entiende boleta,
  factura, nota de crédito e IGV (la boleta y la factura se practican en el ambiente de pruebas de
  SUNAT) y las cuentas de tu día. Dos sesiones en vivo de 50 minutos los domingos
  6 y 13 de diciembre de 2026, de 9:00 a 9:50 a. m. (hora de Lima). Para dueños de negocio:
  no hace falta saber programar. El grupo cierra en 10 alumnos.
cohorts: [tienda-web-2]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu kit de tienda: 10 fichas de producto listas para subir (foto, nombre con su presentación, precio,
  stock y categoría), tus 5 mensajes de cobro para WhatsApp con tus datos de Yape y transferencia, y
  tu regla para elegir boleta o factura (practicada en el ambiente de pruebas de SUNAT).
requisitos:
  - Una cuenta en jmd-learn.online
  - Un celular con WhatsApp (y, si puedes, una laptop o PC)
  - Tener un negocio o una idea de negocio; no hace falta saber programar
  - Si tienes RUC, tenlo a mano para la sesión 2
dedicacion: "2 sesiones en vivo de 50 min (domingos 6 y 13 de diciembre, 9:00 a 9:50 a. m.) y unos 30 min de práctica por semana · S/ 25"
# Inscripción y dudas: WhatsApp 986 149 476.

modules:
  - id: s1
    title: "Sesión 1 · Tu tienda, tu catálogo, pedidos y pagos"
    lessons: [tw2-01, tw2-02]
  - id: s3
    title: "Sesión 2 · Facturación, cuentas y reportes"
    lessons: [tw2-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Tienda web con facturación", grupo: "Grupo 2", area: datos, minutos: 50}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: ambar
  icono: store
  nivel: "Desde cero"
  frase: "Vende por internet y entrega tu comprobante electrónico: catálogo, pedidos, pagos con Yape y facturación."
  resultado:
    - "Armar tu catálogo con fichas de producto listas para subir"
    - "Cobrar por WhatsApp con Yape o transferencia"
    - "Elegir entre boleta y factura, practicado en el ambiente de pruebas de SUNAT"
