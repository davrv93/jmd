id: web-qa-bots
title: "QA Bots: explora, vigila y repara con IA (modalidad web)"
description: >
  Curso a tu ritmo, en video. Bots que usan tu sistema como personas reales y encuentran lo que nadie
  escribió, un robot y un vigía que avisan cuando algo se rompe, la IA que propone la corrección y, como
  proyecto final, tu propio WhatsApp de QA con Evolution Go: le escribes un fallo y te responde con el
  código sugerido por una IA inyectada (DeepSeek, un modelo local u otra API). Los mismos comandos en
  Windows y en Mac, con un repositorio listo para levantar con Docker.
cohorts: [web-qa-bots]
proyecto_final: >
  Tu WhatsApp de QA: Evolution Go vinculado a tu número y un bot que recibe los fallos (los que le escribes
  y los que encuentran los bots) y responde con el archivo, el parche y la prueba sugeridos por la IA que tú
  eliges en .env, con sus pruebas automáticas usando una IA falsa inyectada.
requisitos:
  - Laptop con Windows 10/11 o Mac, Chrome o Edge y conexión estable
  - Docker Desktop (el repositorio explica cómo instalarlo, paso a paso)
  - Para el proyecto final, dos números de WhatsApp: uno para el bot y otro para escribirle (un segundo chip sirve)
  - Un asistente de código (Claude Code, OpenCode u otro) para los prompts
  - Opcional, una llave de DeepSeek u otra API compatible con OpenAI; sin llave funciona con la IA falsa o con Ollama
dedicacion: "Modalidad web: 8 videos cortos y un repositorio con todos los ejemplos. Avanzas a tu ritmo."

modules:
  - id: m1
    title: "Parte 1 · Explora: usuarios sintéticos"
    lessons: [wqb-01]
  - id: m2
    title: "Parte 2 · Vigila: avisos con evidencia"
    lessons: [wqb-02]
  - id: m3
    title: "Parte 3 · Repara: la IA propone, tú apruebas"
    lessons: [wqb-03]
  - id: m4
    title: "Proyecto final · Tu WhatsApp de QA con Evolution Go y la IA inyectada"
    lessons: [wqb-04]

