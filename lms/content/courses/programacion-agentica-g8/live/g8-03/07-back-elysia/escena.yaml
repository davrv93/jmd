id: 07-back-elysia
titulo: "Datos y API: Postgres + Elysia"
fase: experiencia
paso: "webhook"
duracion_min: 18
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "★ Paso a paso: el agente lo hace y se comprueba"
    cmd: "aula paso hacer"
  - titulo: "★ ¿En qué paso voy?"
    cmd: "aula paso"
  - titulo: "F3-T1: pedir la base de datos"
    cmd: "jmd chat \"/skill s3-postgres crea db.ts y corre la migración\""
  - titulo: "F3-T2: pedir el back en Elysia"
    cmd: "jmd chat \"/skill s3-back-elysia crea negocio.json con mis datos, bot.ts mínimo y servidor.ts; arranca con chatbot.sh\""
  - titulo: "Arrancar o reiniciar el back"
    cmd: "sh /trabajo/chatbot/chatbot.sh reiniciar"
  - titulo: "Comprobar la salud"
    cmd: "curl -s localhost:8766/api/salud"
  - titulo: "F3-T3: ¿llegó tu «hola»?"
    cmd: "curl -s localhost:8766/api/conversaciones"
  - titulo: "Entrar a la base (psql)"
    cmd: "aula db"
  - titulo: "Ver el log del back"
    cmd: "sh /trabajo/chatbot/chatbot.sh log"

oculta: true
