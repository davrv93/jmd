id: 04-docker
titulo: Instalar Docker
fase: experiencia
paso: docker
duracion_min: 9
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Windows: instalar WSL (PowerShell como administrador)", cmd: "wsl --install"}
  - {titulo: "Linux: usar Docker sin sudo (luego cierra sesión)", cmd: "sudo usermod -aG docker $USER"}
  - {titulo: Comprobar Docker, cmd: "docker --version"}
  - {titulo: Probar el primer contenedor, cmd: "docker run --rm hello-world"}
