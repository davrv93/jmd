id: 12-skills
titulo: Tu primera skill
fase: experimentacion
paso: skill
duracion_min: 12
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: Crear la carpeta de la skill, cmd: "mkdir -p .opencode/skills/saludo"}
  - {titulo: "Crear SKILL.md de una vez (pega en la terminal y Enter)", cmd: "cat > .opencode/skills/saludo/SKILL.md <<'FIN'\n---\nname: saludo\ndescription: Saluda al alumno por su nombre y le dice qué clase toca. Úsala cuando pidan «salúdame» o «qué toca hoy».\n---\nPregunta el nombre si no lo sabes. Responde en español, en dos líneas:\n1. Un saludo con el nombre.\n2. La clase de hoy, leída de clases.md si existe; si no, di que no hay archivo.\nFIN"}
  - {titulo: Abrir el agente y probarla (escribe «salúdame»), cmd: "opencode"}
