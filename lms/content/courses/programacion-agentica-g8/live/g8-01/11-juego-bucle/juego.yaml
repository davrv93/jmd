# Arena de conceptos (E11) de la clase 1 del Grupo 8 (g8-01): la clave de respuestas del minijuego.
# La lee el servidor (lms/api/internal/httpapi/live_juego.go) y nunca llega al navegador.
# Cada concepto va a un solo contenedor; todos salen de las escenas de la clase g8-01.
# «Ronda nueva» relee este archivo, así que se puede corregir entre rondas.
contenedores:
  - {id: agente,      nombre: "Agente · bucle"}
  - {id: herramienta, nombre: "Herramientas"}
  - {id: modelo,      nombre: "Proveedor y modelo"}
  - {id: extension,   nombre: "MCP y skills"}
conceptos:
  # Agente: modelo + herramientas + bucle; propone y tú decides.
  - {texto: "Modelo + herramientas + bucle", contenedor: agente}
  - {texto: "Mira el resultado y repite",    contenedor: agente}
  - {texto: "Lee, escribe y ejecuta",        contenedor: agente}
  - {texto: "Propone; tú decides",           contenedor: agente}
  - {texto: "Un chat responde; él hace",     contenedor: agente}
  - {texto: "Revisa el diff antes",          contenedor: agente}
  # Herramientas de la clase: VS Code, Docker y OpenCode.
  - {texto: "VS Code",                       contenedor: herramienta}
  - {texto: "code --version",                contenedor: herramienta}
  - {texto: "Docker",                        contenedor: herramienta}
  - {texto: "docker run --rm hello-world",   contenedor: herramienta}
  - {texto: "npm i -g opencode-ai",          contenedor: herramienta}
  - {texto: "Terminal con Ctrl+ñ",           contenedor: herramienta}
  # Proveedor y modelo (y lo que se gasta).
  - {texto: "clase/auto",                    contenedor: modelo}
  - {texto: "GATEWAY_API_KEY",               contenedor: modelo}
  - {texto: "Error 401: clave mal copiada",  contenedor: modelo}
  - {texto: "temperature",                   contenedor: modelo}
  - {texto: "max_tokens",                    contenedor: modelo}
  - {texto: "Cobra por tokens",              contenedor: modelo}
  # MCP y skills: lo que se le enchufa o se le enseña al agente.
  - {texto: "Enchufe estándar",              contenedor: extension}
  - {texto: "list_courses",                  contenedor: extension}
  - {texto: "Clave «mcp» en opencode.json",  contenedor: extension}
  - {texto: "SKILL.md",                      contenedor: extension}
  - {texto: ".opencode/skills/saludo/",      contenedor: extension}
  - {texto: "Se abre cuando el pedido encaja", contenedor: extension}
