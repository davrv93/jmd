<!--
  PLANTILLA DE ESCENA DEL MODO LIVE
  Copia este archivo a live/<lección>/<NN-nombre>/escena.html y cambia SOLO tres cosas:
    1. <title>, la fase (data-ph y el texto de .esc-fase), el número (.esc-num).
    2. El contenido de <main class="esc-cuerpo"> (usa las clases de abajo).
    3. Estilos propios de la escena, dentro de <style id="esc-propio"> (nada fuera de ese bloque).
  Reglas: sin recursos externos (nada de http, CDN, fuentes ni imágenes remotas; el CSS común va en ../../comun/escena.css), menos de 300
  elementos y 1 MB, animaciones solo con CSS o SVG animado, y todo se apaga con prefers-reduced-motion.
  Escala: se diseña a 1920x1080; el texto usa clamp() y se ve bien desde 1366x768.
-->
<link rel="stylesheet" href="../../comun/escena.css">
<style id="esc-propio">

.q-cuerpo { display: grid; gap: 2.4vh; }
.q-svg { width: 100%; max-height: 54vh; height: auto; display: block; overflow: visible; }
.q-svg text { font-family: inherit; fill: var(--fg); }
.q-caja { fill: var(--s1); stroke: var(--line2); stroke-width: 2.5; }
.q-caja.mod { stroke: var(--accent); stroke-width: 3.5; }
.q-caja.her { stroke: var(--est-o); stroke-width: 3.5; }
.q-n { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
.q-nt { font-size: 22px; font-weight: 800; text-anchor: middle; fill: var(--accent) !important; }
.q-t { font-size: 23px; font-weight: 800; }
.q-d { font-size: 18px; fill: var(--muted) !important; }
.q-chipr { fill: var(--gold-bg); stroke: var(--est-o); stroke-width: 1.6; }
.q-chipt { font-size: 17px; font-weight: 700; text-anchor: middle; fill: var(--gold) !important; }
.q-fl { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.q-bucle { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: esc-trazo 1.2s ease-out forwards; animation-delay: var(--d, 0s); }
.q-etq { font-size: 21px; font-weight: 700; text-anchor: middle; fill: var(--ok) !important; }
.q-listo { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 2.5; }
.q-listot { font-size: 20px; font-weight: 700; text-anchor: middle; fill: var(--ok) !important; }
.q-punto { fill: var(--est-o); filter: drop-shadow(0 0 8px var(--est-o)); offset-path: path("M445 195 H755 H1065 V325 H445 Z"); offset-rotate: 0deg; animation: esc-viaja 9s linear 5s infinite; offset-distance: 0%; opacity: 0; }
@keyframes q-punto-op { to { opacity: 1; } }
.q-punto { animation: esc-viaja 7s linear 4.6s infinite, q-punto-op .3s ease-out 4.6s forwards; }
.q-formula { display: flex; align-items: center; justify-content: center; gap: .55em; flex-wrap: wrap; font-size: 1.5em; font-weight: 800; }
.q-formula .op { color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .q-bucle { stroke-dashoffset: 0 !important; } }
.q-pill { padding: .15em .7em; border-radius: 999px; border: 2px solid var(--line2); background: var(--s1); box-shadow: var(--card-shadow); }
.q-pill.ag { border-color: var(--fg); }
.q-pill.mo { border-color: var(--accent); color: var(--accent); }
.q-pill.he { border-color: var(--est-o); color: var(--gold); }
.q-pill.bu { border-color: var(--ok); color: var(--ok); }

</style>
</head>
