<title>Bienvenida</title>
<!--
  PLANTILLA DE ESCENA DEL MODO LIVE
  Copia este archivo a live/<lección>/<NN-nombre>/escena.html y cambia SOLO tres cosas:
    1. <title>, la fase (data-ph y el texto de .esc-fase), el número (.esc-num).
    2. El contenido de <main class="esc-cuerpo"> (usa las clases de abajo).
    3. Estilos propios de la escena, dentro de <style id="esc-propio"> (nada fuera de ese bloque).
  Reglas: sin recursos externos (nada de http, CDN, fuentes ni imágenes remotas; el CSS común va en ../../comun/escena.css), menos de 300
  elementos y 1 MB, animaciones solo con CSS o SVG animado, y todo se apaga con prefers-reduced-motion.
  Escala: se diseña a 1920x1080; el texto usa clamp() y se ve bien desde 1366x768.
-->
<link rel="stylesheet" href="../../comun/escena.css">
<style id="esc-propio">

.bv-fila { display: grid; grid-template-columns: 1.15fr 1fr; gap: 2.4vw; align-items: center; min-height: 0; flex: 1; }
.bv-izq { display: grid; gap: 2.4vh; align-content: center; }
.bv-letras { width: 100%; height: auto; display: block; overflow: visible; }
.bv-linea { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.bv-tenue { stroke: var(--line2); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; animation: esc-trazo var(--t, 1s) ease-out forwards; animation-delay: var(--d, 0s); }
.bv-viva { stroke: var(--est-o); stroke-width: 6; filter: drop-shadow(0 0 7px var(--est-o)); animation: esc-entra-op .4s ease-out both; animation-delay: var(--d, 0s); }
.bv-est { fill: var(--est); animation: esc-pop .4s cubic-bezier(.2,.8,.3,1.2) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
.bv-halo { fill: var(--est-o); opacity: .0; animation: bv-enciende .4s ease-out both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
.bv-halo { opacity: .55; }
@keyframes esc-entra-op { from { opacity: 0; } to { opacity: 1; } }
@keyframes bv-enciende { from { opacity: 0; transform: scale(.2); } to { opacity: .55; transform: scale(1); } }
.bv-saludo { margin: 0; font-size: 3.1em; line-height: 1.05; font-weight: 800; letter-spacing: -.025em; }
.bv-saludo em { font-style: normal; background: linear-gradient(100deg, var(--accent), var(--est-g)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bv-lienzo { position: relative; width: 100%; height: 66vh; border-radius: 1.2em; background: radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--s1); border: 1px solid var(--line); box-shadow: var(--card-shadow); overflow: hidden; }
.bv-lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bv-lienzo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

</style>

<script>
/* Tema: ?tema=dark|light fuerza el tema del LMS; si no, manda el del sistema. */
(function () {
  try {
    var t = new URLSearchParams(location.search).get("tema");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
<script type="module">
import { montarAvatar } from "/api/v1/live/g8-02/comun/avatar.js";
const canvas = document.getElementById("lienzo");
const respaldo = document.getElementById("respaldo");
let av = { soportado: false };
try { av = montarAvatar(canvas, "robot"); } catch (e) {}
if (!av.soportado) { canvas.hidden = true; respaldo.hidden = false; }
else setTimeout(() => av.saludar && av.saludar(), 4600); // saluda cuando aparece el recuadro
</script>
