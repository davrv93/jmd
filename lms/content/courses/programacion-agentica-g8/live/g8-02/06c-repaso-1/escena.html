<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso relámpago 1</title>
<!-- Pregunta de recuperación 1 de g8-02 (~min 55, antes de construir el chat). Retoma las cartas de la E04b
     unos 25 minutos después. Voto con respuesta correcta y explicación (g801.js, POST/GET …/voto[s]). -->
<link rel="stylesheet" href="../../comun/escena.css">
<link rel="stylesheet" href="../../comun/g801.css">
<style id="esc-propio">
.esc-cielo { opacity: calc(var(--cielo) * .3); }
.esc-titulo { font-size: 1.9em; }
.rp-centro { width: min(100%, 44em); margin: 0 auto; display: grid; gap: 1.6vh; }
.rp-centro .k-caja { padding: 1em 1.2em; gap: .8em; }
.rp-centro .k-q { font-size: 1.05em; }
.rp-centro .k-ops { grid-template-columns: 1fr 1fr; }
.rp-centro .k-voto button { font-size: .82em; text-align: left; line-height: 1.3; min-height: 3.2em; }
.rp-centro .k-explica { font-size: .8em; }
.rp-chip { justify-self: start; }
@media (max-width: 760px) {
  body { overflow: auto; }
  .rp-centro .k-ops { grid-template-columns: 1fr; }
}
.esc .k-voto button .n { white-space: nowrap; }
</style>
</head>
<body>
<svg class="esc-cielo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <path class="t" pathLength="1" d="M92 612 L168 560 L236 598 L296 524"/>
  <g>
    <circle class="e" cx="92" cy="612" r="3.5"/><circle class="eg" cx="168" cy="560" r="4.5"/><circle class="e" cx="236" cy="598" r="3"/><circle class="eo" cx="296" cy="524" r="5"/>
    <circle class="e p" style="--p:1.3s" cx="1210" cy="400" r="1.6"/><circle class="eg p" style="--p:2.9s" cx="1090" cy="560" r="1.7"/>
  </g>
</svg>

<div class="esc">
  <header class="esc-cab">
    <span class="esc-fase" data-ph="ca">Conceptualización</span>
    <span class="esc-num">Grupo 8 · E06c</span>
  </header>

  <main class="esc-cuerpo">
    <div class="rp-centro">
      <span class="esc-chip rp-chip a-in">Repaso relámpago 1 de 2 · sin mirar atrás</span>
      <h1 class="esc-titulo a-in" style="--d:.1s">¿Qué hace que algo sea un <em>skill</em> y no un simple prompt?</h1>
      <div class="k-caja k-voto" data-voto="g802-repaso-1" data-correcta="procedimiento"
           data-explica="Un skill empaqueta un procedimiento que se repite igual y se comprueba. Leer archivos es cosa de una herramienta (un skill puede usarla), y no depende del tamaño del modelo: lo usas con el que tengas.">
        <p class="k-q">Elige una. Ves la respuesta y al grupo después de votar.</p>
        <div class="k-ops">
          <button data-op="largo">Es un prompt más largo y con más detalles</button>
          <button data-op="procedimiento">Empaqueta pasos reutilizables: entradas, salidas, validaciones y qué hacer si falla</button>
          <button data-op="nube">Solo funciona con un modelo grande en la nube</button>
          <button data-op="archivos">Puede leer archivos; un prompt no</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="esc-pie">
    <span class="esc-nota">Si fallaste, no pasa nada: recordar con esfuerzo es lo que fija la idea. Lo viste en las cartas de la E04b.</span>
  </footer>
</div>

<script>
/* Tema: ?tema=dark|light fuerza el tema del LMS; si no, manda el del sistema. */
(function () {
  try {
    var t = new URLSearchParams(location.search).get("tema");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
<script src="../../comun/g801.js"></script>
</body>
</html>
