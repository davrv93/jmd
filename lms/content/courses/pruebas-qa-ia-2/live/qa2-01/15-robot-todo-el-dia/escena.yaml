id: "15-robot-todo-el-dia"
titulo: "Tu robot prueba todo el día"
fase: experimentacion
paso: monitoreo
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 100
compuerta: lo_logre
comandos:
  - titulo: "El robot en tu laptop (cada 10 min, página en localhost:3200)"
    cmd: "node robot/robot.mjs"
  - titulo: "El robot en un servidor con Docker (Lightpanda + runner), contra la tienda web"
    cmd: "cd robot && BASE_URL=https://jmd-learn.online/tienda-sol/ docker compose up -d --build"
  - titulo: "El robot en GitHub Actions + Pages (cada 30 min, sin servidor)"
    cmd: "git push   # .github/workflows/e2e-robot.yml ya está en el kit"
