id: pruebas-qa-ia-2
title: Automatización de pruebas y QA con inteligencia artificial
description: >
  Aprende a automatizar tus pruebas E2E con IA y mejora la calidad de tu software, con monitoreo y alertas
  ante caídas, usando el patrón de pruebas más usado: Page Object Model. Playwright, Lightpanda, Obscura y
  Grafana. Taller en vivo por Zoom el domingo 20 de diciembre de 2026, de 2:30 a 6:30 p. m. (Lima).
cohorts: [qa-ia-3]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Pruebas E2E que simulan a tu usuario (login, ventas, formularios y reportes), un portal con la matriz de
  pruebas por módulo y la reproducción paso a paso de cada caso, un dashboard del estado de tus servicios en
  Grafana y un cuadro de disponibilidad con notificación automática ante incidentes.
requisitos:
  - Laptop con navegador Chrome
  - Conocimientos básicos de JavaScript o de cualquier lenguaje
  - Conexión a internet estable
dedicacion: "Taller en vivo de 4 horas (domingo 20 de diciembre de 2026), 2:30 a 6:30 p. m., hora de Lima"

modules:
  - id: s1
    title: "Taller · Pruebas E2E con IA, Page Object Model y monitoreo"
    lessons: [qa2-01]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
