id: deepseek-harness
title: DeepSeek Harness · Optimiza recursos y documenta tus sistemas
description: >
  Tres sesiones prácticas para usar un agente sobre un repositorio real: entender el sistema por etapas,
  medir y reducir lo que consume cada tarea, y crear documentación que se comprueba contra el código.
  Clases en vivo por Zoom los martes 17 y 24 de noviembre y 1 de diciembre de 2026, de 7:30 a 9:00 pm (Lima).
cohorts: [deepseek-harness-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un repositorio con instrucciones de trabajo para el agente, un informe comparativo del consumo
  antes y después, y un paquete de documentación validada: README, mapa de componentes, flujos
  principales y guía de ejecución y diagnóstico.
requisitos:
  - Conocimientos básicos de terminal
  - Un repositorio de práctica (se entrega uno de ejemplo a quien no tenga)
  - Una cuenta en jmd-learn.online
dedicacion: "3 clases en vivo de 90 minutos (17 y 24 de noviembre, 1 de diciembre), 7:30 a 9:00 pm · 4 h 30 min"

modules:
  - id: s1
    title: "Sesión 1 · Entiende tu sistema con DeepSeek Harness"
    lessons: [dh-01]
  - id: s2
    title: "Sesión 2 · Mide y reduce el consumo"
    lessons: [dh-02]
  - id: s3
    title: "Sesión 3 · Documenta y valida el sistema"
    lessons: [dh-03]
