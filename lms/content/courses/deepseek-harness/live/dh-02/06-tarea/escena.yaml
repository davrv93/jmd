id: 06-tarea
titulo: "Pregunta, entrega e insignia"
fase: experimentacion
paso: entregar
duracion_min: 5
lo_logre: false
evidencia: ninguna
compuerta: ninguna
comandos:
  - titulo: "Tarea: las dos corridas con su tiempo"
    cmd: "time dsh --profile headless \"<tu tarea de referencia>\" > antes.md; time dsh --profile headless \"<tu tarea de referencia>\" > despues.md"
  - titulo: "Subir el informe y la rutina a tu repo"
    cmd: "git add INFORME.md RUTINA.md antes.md despues.md && git commit -m \"sesión 2: consumo medido antes y después\" && git push"
