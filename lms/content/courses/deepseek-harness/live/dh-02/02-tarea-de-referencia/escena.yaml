id: 02-tarea-de-referencia
titulo: "Simulador: registra una tarea de referencia"
fase: experiencia
paso: referencia
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Corrida no interactiva con tiempo medido (guarda la respuesta)"
    cmd: "time dsh --profile headless \"Agrega validación de correo a register() y corre las pruebas\" > antes.md"
  - titulo: "CPU y RAM máxima del proceso local (Linux; en macOS usa -l)"
    cmd: "/usr/bin/time -v dsh --profile headless \"Resume en 5 líneas qué hace este repositorio\" > /dev/null"
  - titulo: "Abrir la Web UI para ver los pasos de la sesión"
    cmd: "npx @deepseek-ai/dsh web"
