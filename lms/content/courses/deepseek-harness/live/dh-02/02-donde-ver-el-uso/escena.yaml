id: 02-donde-ver-el-uso
titulo: "Dónde se ve el consumo real y la ficha de la corrida base"
fase: experiencia
paso: donde-ver
duracion_min: 14
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "La clave para el perfil headless (no lee la guardada en Settings)"
    cmd: "read -s DEEPSEEK_API_KEY && export DEEPSEEK_API_KEY"
  - titulo: "Tiempo y memoria máxima de un proceso en macOS"
    cmd: "/usr/bin/time -l node skills/foto-del-sistema/motor/foto.mjs . --silencio"
  - titulo: "Lo mismo en Linux (Elapsed y Maximum resident set size)"
    cmd: "/usr/bin/time -v node skills/foto-del-sistema/motor/foto.mjs ."
  - titulo: "Sumar el uso por paso de una corrida guardada con --json"
    cmd: "jq -s '[.[]|select(.type==\"status\" and .phase==\"step_end\" and .usage)|.usage]|{llamadas:length,entrada_fallo:(map(.inputTokens//0)|add//0),entrada_acierto:(map(.cacheReadTokens//0)|add//0),salida:(map(.outputTokens//0)|add//0)}' docs/medicion/A.jsonl"
