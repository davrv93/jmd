id: 06-acotar-el-contexto
titulo: "Acotar el contexto: cinco palancas y un aviso de calidad"
fase: conceptualizacion
paso: palancas
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Buscar con alcance y salida acotados"
    cmd: "grep -rn -i \"rol\\|permis\" js/ | head -40"
  - titulo: "Contar cuántas líneas devolvería la búsqueda sin recorte"
    cmd: "grep -rn -i \"rol\\|permis\" js/ | wc -l"
  - titulo: "Ver un tramo en vez del archivo entero"
    cmd: "sed -n '180,200p' js/config.js"
