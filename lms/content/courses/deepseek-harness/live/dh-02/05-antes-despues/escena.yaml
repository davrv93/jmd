id: 05-antes-despues
titulo: "Antes y después, con la misma vara"
fase: conceptualizacion
paso: comparar
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Segunda corrida, misma instrucción, con tu rutina aplicada"
    cmd: "time dsh --profile headless \"Agrega validación de correo a register() y corre las pruebas\" > despues.md"
  - titulo: "Comparar las dos respuestas lado a lado"
    cmd: "diff -y --width=160 antes.md despues.md | less"
