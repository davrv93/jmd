id: 04-acotar-contexto
titulo: "Acota el contexto: cuatro palancas y un freno"
fase: conceptualizacion
paso: acotar
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Recortar la salida de las pruebas antes de que entre al contexto"
    cmd: "python -m pytest -q 2>&1 | tail -40"
  - titulo: "Buscar solo donde hace falta"
    cmd: "grep -rn \"register\" flaskr/ --include=\"*.py\" | head -30"
