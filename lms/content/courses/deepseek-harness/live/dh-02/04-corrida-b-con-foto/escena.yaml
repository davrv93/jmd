id: 04-corrida-b-con-foto
titulo: "Corrida B, con foto: leer poco y verificar"
fase: reflexion
paso: corrida-b
duracion_min: 14
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Corrida B en la carpeta de tu sistema (con FOTO y AGENTS.md)"
    cmd: "time npx @deepseek-ai/dsh --profile headless --json \"Lee AGENTS.md y FOTO/FOTO.md primero. Describe qué puede hacer cada rol de este sistema. Abre solo los archivos que necesites para verificar. Cita archivo:línea y marca «por verificar» lo que no hayas comprobado.\" > docs/medicion/B.jsonl"
  - titulo: "Tomar la foto de nuevo y medir su costo local (macOS)"
    cmd: "/usr/bin/time -l node skills/foto-del-sistema/motor/foto.mjs ."
  - titulo: "En el aula (Ruta B): la foto con el tiempo medido"
    cmd: "time aula sistema foto"
