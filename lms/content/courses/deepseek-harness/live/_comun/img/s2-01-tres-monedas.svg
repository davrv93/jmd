<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Las tres monedas de un agente</title><desc id="d">Tokens que cobra la API, tiempo que gastas tú y CPU y RAM que gasta tu máquina, con la herramienta que mide cada una.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<text x="40" y="62" font-size="44" font-weight="800" fill="#1f2a37" text-anchor="start" >Las tres monedas de un agente</text><text x="40" y="100" font-size="24" font-weight="400" fill="#4a5565" text-anchor="start" >La misma tarea se paga en tres cuentas distintas</text><rect x="40" y="130" width="410" height="470" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><rect x="40" y="130" width="410" height="92" rx="14" fill="#eef2ff" stroke="#b9c4ff" stroke-width="2" /><ellipse cx="96" cy="188" rx="26" ry="9" fill="#3b57e8" stroke="#fff" stroke-width="2"/><ellipse cx="96" cy="177" rx="26" ry="9" fill="#3b57e8" stroke="#fff" stroke-width="2"/><ellipse cx="96" cy="166" rx="26" ry="9" fill="#3b57e8" stroke="#fff" stroke-width="2"/><ellipse cx="96" cy="154" rx="26" ry="9" fill="#7d8cf0" stroke="#fff" stroke-width="2"/><text x="144" y="168" font-size="36" font-weight="800" fill="#1f2a37" text-anchor="start" >Tokens</text><text x="144" y="206" font-size="22" font-weight="600" fill="#4a5565" text-anchor="start" >Cobra: la API de DeepSeek</text><text x="66" y="262" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Entrada: lo que lee el modelo</text><text x="66" y="298" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >(archivos, salidas, historial)</text><text x="66" y="334" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Salida: lo que escribe</text><text x="66" y="370" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Caché: acierto barato, fallo caro</text><rect x="60" y="424" width="370" height="150" rx="12" fill="#eef2ff" stroke="#b9c4ff" stroke-width="2" /><text x="76" y="458" font-size="21" font-weight="700" fill="#4a5565" text-anchor="start" >Cómo lo mido</text><text x="76" y="492" font-size="21" font-weight="600" fill="#1f2a37" text-anchor="start" >Se mide en: Usage (plataforma)</text><text x="76" y="522" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >y en el uso por paso de dsh</text><rect x="474" y="130" width="410" height="470" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><rect x="474" y="130" width="410" height="92" rx="14" fill="#fff3e6" stroke="#f0c89a" stroke-width="2" /><circle cx="530" cy="176" r="28" fill="#fff" stroke="#e08a2e" stroke-width="5"/><path d="M530 160 L530 176 L544 184" fill="none" stroke="#e08a2e" stroke-width="5" stroke-linecap="round"/><text x="578" y="168" font-size="36" font-weight="800" fill="#1f2a37" text-anchor="start" >Tiempo</text><text x="578" y="206" font-size="22" font-weight="600" fill="#4a5565" text-anchor="start" >Lo gastas: tú, esperando</text><text x="500" y="262" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Desde que envías la tarea</text><text x="500" y="298" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >hasta que llega la respuesta.</text><text x="500" y="334" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Cada llamada al modelo</text><text x="500" y="370" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >y cada comando suman.</text><rect x="494" y="424" width="370" height="150" rx="12" fill="#f2f4f8" stroke="#c9d2de" stroke-width="2" /><text x="510" y="458" font-size="21" font-weight="700" fill="#4a5565" text-anchor="start" >Cómo lo mido</text><text x="510" y="492" font-size="21" font-weight="600" fill="#1f2a37" text-anchor="start" >Se mide con: time</text><text x="510" y="522" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >en la terminal</text><rect x="908" y="130" width="410" height="470" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><rect x="908" y="130" width="410" height="92" rx="14" fill="#e7f6ef" stroke="#9fd6bb" stroke-width="2" /><rect x="942" y="154" width="44" height="44" rx="6" fill="#fff" stroke="#2b9a6a" stroke-width="5" /><path d="M954 154 v-9 M954 198 v9 M942 166 h-9 M986 166 h9" stroke="#2b9a6a" stroke-width="4"/><path d="M974 154 v-9 M974 198 v9 M942 186 h-9 M986 186 h9" stroke="#2b9a6a" stroke-width="4"/><rect x="955" y="167" width="18" height="18" rx="3" fill="#2b9a6a" stroke="#2b9a6a" stroke-width="1" /><text x="1012" y="168" font-size="36" font-weight="800" fill="#1f2a37" text-anchor="start" >CPU y RAM</text><text x="1012" y="206" font-size="22" font-weight="600" fill="#4a5565" text-anchor="start" >Lo gasta: tu máquina</text><text x="934" y="262" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >Procesos que lanza el agente:</text><text x="934" y="298" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >buscar, probar, compilar.</text><text x="934" y="334" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >No sale en ninguna factura,</text><text x="934" y="370" font-size="24" font-weight="400" fill="#1f2a37" text-anchor="start" >pero frena tu laptop.</text><rect x="928" y="424" width="370" height="150" rx="12" fill="#f2f4f8" stroke="#c9d2de" stroke-width="2" /><text x="944" y="458" font-size="21" font-weight="700" fill="#4a5565" text-anchor="start" >Cómo lo mido</text><text x="944" y="492" font-size="21" font-weight="600" fill="#1f2a37" text-anchor="start" >Se mide con: /usr/bin/time</text><text x="944" y="522" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >-l macOS · -v Linux</text><text x="944" y="552" font-size="21" font-weight="400" fill="#4a5565" text-anchor="start" >Monitor de actividad · htop</text><rect x="40" y="628" width="1286" height="92" rx="16" fill="#fff" stroke="#3b57e8" stroke-width="3" /><text x="70" y="672" font-size="32" font-weight="800" fill="#1f2a37" text-anchor="start" >La factura de DeepSeek solo ve una de las tres: los tokens.</text><text x="70" y="706" font-size="24" font-weight="400" fill="#4a5565" text-anchor="start" >El tiempo y la CPU/RAM no se cobran, pero también cuestan. Medir es mirar las tres.</text><rect x="40" y="730" width="273.5" height="38" rx="19" fill="#fff4d6" stroke="#e0b44c" stroke-width="2" /><text x="58" y="757" font-size="21" font-weight="700" fill="#7a5a00" text-anchor="start" >Esquema ilustrativo</text>
</svg>
