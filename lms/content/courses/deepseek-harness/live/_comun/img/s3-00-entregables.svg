<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Esquema: la foto del sistema alimenta cuatro documentos y se repite cuando el sistema cambia">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2a37}
.t{font-size:26px;font-weight:700}.s{font-size:19px;fill:#4a5565}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:600}
.box{fill:#fff;stroke:#c9d2de;stroke-width:2.5}.foto{fill:#eaf0ff;stroke:#3b57e8;stroke-width:3}.ar{fill:none;stroke:#3b57e8;stroke-width:3.5}
.loop{fill:none;stroke:#b07a00;stroke-width:3;stroke-dasharray:9 7}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b57e8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b07a00"/></marker></defs>
<rect width="960" height="600" rx="18" fill="#f6f8fb"/>
<rect class="box" x="30" y="150" width="210" height="150" rx="14"/>
<text class="t" x="50" y="190">Tu sistema</text><text class="m" x="50" y="228">index.html</text><text class="m" x="50" y="254">css/  js/</text><text class="s" x="50" y="284">el que elegiste</text>
<path class="ar" d="M240 225H300" marker-end="url(#f)"/>
<rect class="foto" x="300" y="130" width="230" height="190" rx="14"/>
<text class="t" x="320" y="170">FOTO/</text><text class="m" x="320" y="210">FOTO.md</text><text class="m" x="320" y="238">FOTO.json</text><text class="m" x="320" y="266">hashes.txt</text><text class="s" x="320" y="300">pistas, no veredictos</text>
<g class="ar"><path d="M530 225C575 225 570 70 615 70" marker-end="url(#f)"/><path d="M530 225C575 225 570 165 610 165" marker-end="url(#f)"/><path d="M530 225C575 225 570 290 610 290" marker-end="url(#f)"/><path d="M530 225C575 225 570 385 610 385" marker-end="url(#f)"/></g>
<rect class="box" x="610" y="30" width="330" height="80" rx="12"/><text class="m" x="628" y="62">docs/</text><text class="t" x="628" y="94" style="font-size:20px">DESCRIPCION_POR_ROLES.md</text>
<rect class="box" x="610" y="125" width="330" height="80" rx="12"/><text class="m" x="628" y="157">docs/</text><text class="t" x="628" y="189" style="font-size:20px">AUDITORIA_SEGURIDAD.md</text>
<rect class="box" x="610" y="250" width="330" height="80" rx="12"/><text class="m" x="628" y="282">docs/</text><text class="t" x="628" y="314" style="font-size:20px">MAPA_DEL_SISTEMA.md</text>
<rect class="box" x="610" y="345" width="330" height="80" rx="12"/><text class="m" x="628" y="377">docs/</text><text class="t" x="628" y="409" style="font-size:20px">DUDAS_VERIFICABLES.md</text>
<text class="s" x="775" y="232" text-anchor="middle">y diagramas Mermaid</text>
<path class="loop" d="M775 428C775 515 410 515 410 332" marker-end="url(#g)"/>
<text class="t" x="410" y="535" style="font-size:21px;fill:#7a5a00">Cambió el sistema: foto nueva,</text><text class="t" x="410" y="580" style="font-size:21px;fill:#7a5a00">diff de hashes.txt y revisa solo lo afectado</text>
<text class="s" x="30" y="580">Esquema ilustrativo</text>
</svg>
