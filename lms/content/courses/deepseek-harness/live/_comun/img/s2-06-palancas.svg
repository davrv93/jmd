<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Cinco palancas para acotar el contexto</title><desc id="d">Archivos, líneas por comando, alcance de la búsqueda, resumen reutilizado y tareas divididas por rol, con un comando de ejemplo para cada una.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<text x="40" y="56" font-size="44" font-weight="800" fill="#1f2a37" text-anchor="start" >Cinco palancas para acotar el contexto</text><text x="40" y="92" font-size="24" font-weight="400" fill="#4a5565" text-anchor="start" >Se mueven con comandos concretos; el efecto lo mides en tu sistema</text><rect x="40" y="120" width="1286" height="90" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="165" r="26" fill="#3b57e8"/><text x="86" y="175" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="132" y="158" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >Menos archivos completos</text><text x="132" y="190" font-size="22" font-weight="400" fill="#4a5565" text-anchor="start" >Abre config.js, no todo js/</text><rect x="640" y="134" width="666" height="62" rx="10" fill="#14122b" stroke="#14122b" stroke-width="1" /><text x="660" y="174" font-size="22" font-weight="600" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >sed -n '180,200p' js/config.js</text><rect x="40" y="224" width="1286" height="90" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="269" r="26" fill="#3b57e8"/><text x="86" y="279" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="132" y="262" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >Líneas por comando</text><text x="132" y="294" font-size="22" font-weight="400" fill="#4a5565" text-anchor="start" >Lo que no se imprime no entra</text><rect x="640" y="238" width="666" height="62" rx="10" fill="#14122b" stroke="#14122b" stroke-width="1" /><text x="660" y="278" font-size="22" font-weight="600" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >grep -n "rol" js/*.js | head -40</text><rect x="40" y="328" width="1286" height="90" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="373" r="26" fill="#3b57e8"/><text x="86" y="383" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="132" y="366" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >Alcance de la búsqueda</text><text x="132" y="398" font-size="22" font-weight="400" fill="#4a5565" text-anchor="start" >Donde hace falta, no en la raíz</text><rect x="640" y="342" width="666" height="62" rx="10" fill="#14122b" stroke="#14122b" stroke-width="1" /><text x="660" y="382" font-size="22" font-weight="600" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >grep -rn "permis" js/   (no  .)</text><rect x="40" y="432" width="1286" height="90" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="477" r="26" fill="#3b57e8"/><text x="86" y="487" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="132" y="470" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >Resumen reutilizado</text><text x="132" y="502" font-size="22" font-weight="400" fill="#4a5565" text-anchor="start" >La foto en vez del código</text><rect x="640" y="446" width="666" height="62" rx="10" fill="#14122b" stroke="#14122b" stroke-width="1" /><text x="660" y="486" font-size="22" font-weight="600" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >FOTO.md §1, §7 y §8 (≈ 860 tokens)</text><rect x="40" y="536" width="1286" height="90" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><circle cx="86" cy="581" r="26" fill="#3b57e8"/><text x="86" y="591" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="132" y="574" font-size="29" font-weight="800" fill="#1f2a37" text-anchor="start" >Una tarea por rol</text><text x="132" y="606" font-size="22" font-weight="400" fill="#4a5565" text-anchor="start" >Contextos chicos, no uno enorme</text><rect x="640" y="550" width="666" height="62" rx="10" fill="#14122b" stroke="#14122b" stroke-width="1" /><text x="660" y="590" font-size="22" font-weight="600" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >5 tareas de un rol, no 1 de cinco roles</text><rect x="40" y="652" width="1286" height="66" rx="14" fill="#e7f6ec" stroke="#4fa36a" stroke-width="3" /><text x="70" y="694" font-size="28" font-weight="800" fill="#1d6b3a" text-anchor="start" >Regla de oro: cada recorte se comprueba con los 5 criterios de calidad.</text><rect x="1040" y="726" width="273.5" height="38" rx="19" fill="#fff4d6" stroke="#e0b44c" stroke-width="2" /><text x="1058" y="753" font-size="21" font-weight="700" fill="#7a5a00" text-anchor="start" >Esquema ilustrativo</text>
</svg>
