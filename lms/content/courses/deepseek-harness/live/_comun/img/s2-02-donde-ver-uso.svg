<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Dónde ver el consumo real</title><desc id="d">Esquema de la página Usage con filtros de tiempo y clave, la página Billing y la terminal con time y el uso por paso de dsh.</desc>
