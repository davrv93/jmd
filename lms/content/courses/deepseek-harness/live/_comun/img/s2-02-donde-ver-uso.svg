to</text><text x="510" y="309" font-size="19" font-weight="700" fill="#4a5565" text-anchor="start" >Entrada · fallo</text><text x="690" y="309" font-size="19" font-weight="700" fill="#4a5565" text-anchor="start" >Salida</text><text x="70" y="364" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >08:11</text><text x="160" y="364" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >deepseek-flash</text><text x="330" y="364" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >9 400</text><text x="510" y="364" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >6 800</text><text x="690" y="364" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >310</text><path d="M70 376 H810" stroke="#eef1f6" stroke-width="2"/><text x="70" y="410" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >08:13</text><text x="160" y="410" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >deepseek-flash</text><text x="330" y="410" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >31 200</text><text x="510" y="410" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >4 100</text><text x="690" y="410" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >180</text><path d="M70 422 H810" stroke="#eef1f6" stroke-width="2"/><text x="70" y="456" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >08:16</text><text x="160" y="456" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >deepseek-flash</text><text x="330" y="456" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >52 800</text><text x="510" y="456" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >3 900</text><text x="690" y="456" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >260</text><path d="M70 468 H810" stroke="#eef1f6" stroke-width="2"/><text x="70" y="502" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >08:19</text><text x="160" y="502" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" >deepseek-flash</text><text x="330" y="502" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >60 100</text><text x="510" y="502" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >2 600</text><text x="690" y="502" font-size="21" font-weight="400" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >1 450</text><path d="M70 514 H810" stroke="#eef1f6" stroke-width="2"/><rect x="70" y="530" width="740" height="50" rx="10" fill="#e7f6ec" stroke="#4fa36a" stroke-width="2" /><text x="86" y="563" font-size="22" font-weight="800" fill="#1f2a37" text-anchor="start" >Total</text><text x="330" y="563" font-size="22" font-weight="800" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >153 500</text><text x="510" y="563" font-size="22" font-weight="800" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >17 400</text><text x="690" y="563" font-size="22" font-weight="800" fill="#1f2a37" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >2 200</text><text x="70" y="606" font-size="19" font-weight="400" fill="#4a5565" text-anchor="start" >Columnas y nombres exactos: verifica en tu pantalla.</text><rect x="870" y="116" width="456" height="150" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2" /><text x="892" y="156" font-size="28" font-weight="800" fill="#1f2a37" text-anchor="start" >Billing</text><text x="892" y="194" font-size="21" font-weight="600" fill="#4a5565" text-anchor="start" >Saldo restante</text><rect x="892" y="206" width="200" height="44" rx="10" fill="#eef2ff" stroke="#b9c4ff" stroke-width="2" /><text x="906" y="237" font-size="16" font-weight="400" fill="#4a5565" text-anchor="start" >verifica en tu pantalla</text><text x="1110" y="236" font-size="20" font-weight="400" fill="#4a5565" text-anchor="start" >Aquí ves si queda saldo.</text><rect x="870" y="284" width="456" height="332" rx="14" fill="#14122b" stroke="#14122b" stroke-width="2" /><text x="892" y="322" font-size="25" font-weight="800" fill="#e9e6ff" text-anchor="start" >dsh · laptop (--json)</text><text x="892" y="358" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >$ time dsh --profile headless \</text><text x="892" y="387" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >    --json "TAREA" &gt; A.jsonl</text><text x="892" y="416" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >$ jq -s '...usage...' A.jsonl</text><text x="892" y="445" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >{ "llamadas": 16,</text><text x="892" y="474" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >  "entrada_acierto": …,</text><text x="892" y="503" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >  "entrada_fallo": …,</text><text x="892" y="532" font-size="19" font-weight="400" fill="#e9e6ff" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" >  "salida": … }</text><text x="892" y="590" font-size="19" font-weight="400" fill="#b9b5e8" text-anchor="start" >En el aula, aula dsh "…" ya imprime el resumen</text><rect x="40" y="640" width="1286" height="78" rx="16" fill="#fff" stroke="#3b57e8" stroke-width="3" /><text x="70" y="683" font-size="27" font-weight="700" fill="#1f2a37" text-anchor="start" >Plataforma = lo que cobra la API. dsh = el mismo uso, paso a paso. time = tu espera.</text><text x="70" y="709" font-size="20" font-weight="400" fill="#4a5565" text-anchor="start" >La CPU y la RAM no están en ninguna factura: se miden en tu máquina.</text><rect x="40" y="726" width="611.0" height="38" rx="19" fill="#fff4d6" stroke="#e0b44c" stroke-width="2" /><text x="58" y="753" font-size="21" font-weight="700" fill="#7a5a00" text-anchor="start" >Esquema ilustrativo · tu pantalla puede variar</text>
</svg>
