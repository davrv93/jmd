<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Esquema: cinco pasos para mantener la documentación al día tras un cambio">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2a37}
.t{font-size:24px;font-weight:700}.s{font-size:18px;fill:#4a5565}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#4a5565}
.n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700}
.box{fill:#fff;stroke:#c9d2de;stroke-width:2.5}.act{fill:#fff4d6;stroke:#e0b44c;stroke-width:2.5}.cyl{fill:#e7f6ec;stroke:#4fa36a;stroke-width:2.5}
.ar{fill:none;stroke:#3b57e8;stroke-width:3}.ad{fill:none;stroke:#8a96a8;stroke-width:2.5;stroke-dasharray:8 6}
.lb{font-size:16px;font-weight:600;fill:#3b57e8}
</style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b57e8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a8"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fb"/>
<rect class="box" x="22" y="120" width="164" height="190" rx="14"/>
<circle cx="104" cy="120" r="26" fill="#3b57e8"/><text x="104" y="130" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">1</text>
<text class="t" x="104" y="185" text-anchor="middle" style="font-size:21px">Guarda la</text><text class="t" x="104" y="212" text-anchor="middle" style="font-size:21px">foto vieja</text>
<text class="m" x="104" y="258" text-anchor="middle" style="font-size:13px">cp -R FOTO</text>
<text class="m" x="104" y="280" text-anchor="middle" style="font-size:13px">../FOTO-anterior</text>
<path class="ar" d="M190 215H216" marker-end="url(#f)"/>
<rect class="box" x="220" y="120" width="164" height="190" rx="14"/>
<circle cx="302" cy="120" r="26" fill="#3b57e8"/><text x="302" y="130" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">2</text>
<text class="t" x="302" y="185" text-anchor="middle" style="font-size:21px">Cambia y toma</text><text class="t" x="302" y="212" text-anchor="middle" style="font-size:21px">la foto nueva</text>
<text class="m" x="302" y="258" text-anchor="middle" style="font-size:13px">node …/foto.mjs .</text>
<path class="ar" d="M388 215H414" marker-end="url(#f)"/>
<rect class="box" x="418" y="120" width="164" height="190" rx="14"/>
<circle cx="500" cy="120" r="26" fill="#3b57e8"/><text x="500" y="130" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">3</text>
<text class="t" x="500" y="185" text-anchor="middle" style="font-size:21px">Compara los</text><text class="t" x="500" y="212" text-anchor="middle" style="font-size:21px">hashes</text>
<text class="m" x="500" y="258" text-anchor="middle" style="font-size:13px">diff de</text>
<text class="m" x="500" y="280" text-anchor="middle" style="font-size:13px">hashes.txt</text>
<path class="ar" d="M586 215H612" marker-end="url(#f)"/>
<rect class="box" x="616" y="120" width="164" height="190" rx="14"/>
<circle cx="698" cy="120" r="26" fill="#3b57e8"/><text x="698" y="130" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">4</text>
<text class="t" x="698" y="185" text-anchor="middle" style="font-size:21px">Cruza archivo</text><text class="t" x="698" y="212" text-anchor="middle" style="font-size:21px">con documento</text>
<text class="m" x="698" y="258" text-anchor="middle" style="font-size:13px">tabla módulo →</text>
<text class="m" x="698" y="280" text-anchor="middle" style="font-size:13px">documento</text>
<path class="ar" d="M784 215H810" marker-end="url(#f)"/>
<rect class="box" x="814" y="120" width="164" height="190" rx="14"/>
<circle cx="896" cy="120" r="26" fill="#3b57e8"/><text x="896" y="130" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">5</text>
<text class="t" x="896" y="185" text-anchor="middle" style="font-size:21px">Actualiza y</text><text class="t" x="896" y="212" text-anchor="middle" style="font-size:21px">registra</text>
<text class="m" x="896" y="258" text-anchor="middle" style="font-size:13px">fecha, huella</text>
<text class="m" x="896" y="280" text-anchor="middle" style="font-size:13px">y commit</text>
<path class="ad" d="M896 314C896 440 104 440 104 316" marker-end="url(#g)"/>
<text class="s" x="500" y="425" text-anchor="middle">Cada cambio vuelve a empezar en el paso 1</text>
<text class="s" x="30" y="500">Esquema ilustrativo · FOTO-anterior vive fuera de la carpeta del sistema</text>
</svg>