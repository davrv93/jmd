id: 04-comprobar-rutas-y-comandos
titulo: "Comprobar rutas y comandos: la guía se ejecuta"
fase: experimentacion
paso: comprobar
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Rutas citadas en la documentación que no existen en el repo"
    cmd: "for f in $(grep -ohE '(src|docs|scripts)/[A-Za-z0-9_./-]+' README.md docs/*.md | sort -u); do [ -e \"$f\" ] || echo \"NO EXISTE: $f\"; done"
  - titulo: "Scripts npm que la guía menciona y package.json no define"
    cmd: "grep -ohE 'npm run [a-z:-]+' README.md docs/*.md | sort -u"
