id: 04-diagramas-mermaid
titulo: "Diagramas Mermaid: cada nodo es algo que existe"
fase: conceptualizacion
paso: mapa
duracion_min: 14
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Comprobar que un componente existe y en qué línea"
    cmd: "grep -n \"Seg.puede = \" js/*.js"
  - titulo: "Listar los archivos del sistema (los nodos válidos)"
    cmd: "ls index.html css/ js/"
  - titulo: "Ver las líneas que citas en un nodo"
    cmd: "sed -n '419,423p' js/40-datos.js"
