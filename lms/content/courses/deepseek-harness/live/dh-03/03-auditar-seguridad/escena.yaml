id: 03-auditar-seguridad
titulo: "Audita la seguridad: pista automática no es hallazgo"
fase: reflexion
paso: auditar
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Dónde se hashea la contraseña"
    cmd: "grep -n \"hashClave\\|iterado\" js/*.js"
  - titulo: "Dónde se decide el bloqueo por intentos"
    cmd: "grep -n \"intentos\\|bloque\" js/30-seguridad.js"
  - titulo: "Dónde expira la sesión"
    cmd: "grep -n \"sesionMin\\|vigencia\" js/*.js"
  - titulo: "Cómo se arma el HTML (¿con datos?)"
    cmd: "grep -n \"innerHTML\\|insertAdjacentHTML\\|eval(\" js/*.js"
  - titulo: "La política de contenido de la página"
    cmd: "grep -n \"Content-Security-Policy\" index.html"
