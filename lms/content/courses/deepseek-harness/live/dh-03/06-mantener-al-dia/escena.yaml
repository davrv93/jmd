id: 06-mantener-al-dia
titulo: "Mantén la documentación al día: compara dos fotos"
fase: conceptualizacion
paso: mantener
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "1 · Guarda la foto vieja FUERA de la carpeta del sistema"
    cmd: "cp -R FOTO ../FOTO-anterior"
  - titulo: "2 · Toma la foto nueva (laptop)"
    cmd: "node skills/foto-del-sistema/motor/foto.mjs ."
  - titulo: "2 · Toma la foto nueva (aula)"
    cmd: "aula sistema foto"
  - titulo: "3 · ¿Qué archivos cambiaron?"
    cmd: "diff ../FOTO-anterior/hashes.txt FOTO/hashes.txt"
  - titulo: "3 · ¿Qué secciones de la foto cambiaron?"
    cmd: "diff ../FOTO-anterior/FOTO.md FOTO/FOTO.md | head -40"
  - titulo: "Comprobar la carpeta actual contra una foto vieja"
    cmd: "shasum -a 256 -c ../FOTO-anterior/hashes.txt"
