id: 06-tarea
titulo: "Entrega, certificado e insignia"
fase: experimentacion
paso: entregar
duracion_min: 7
lo_logre: false
evidencia: ninguna
compuerta: ninguna
comandos:
  - titulo: "Borrador del README con citas y supuestos marcados (sesión no interactiva)"
    cmd: "dsh --profile headless \"Escribe docs/README-borrador.md solo con lo que verifiques en este repo; cita archivo y línea en cada afirmación y marca [SUPUESTO] lo que no puedas comprobar\""
  - titulo: "Rutas citadas en la documentación que no existen"
    cmd: "for f in $(grep -ohE '(src|docs|scripts)/[A-Za-z0-9_./-]+' README.md docs/*.md | sort -u); do [ -e \"$f\" ] || echo \"NO EXISTE: $f\"; done"
  - titulo: "Subir el paquete y entregar URL + commit en el LMS"
    cmd: "git add README.md docs/ && git commit -m \"docs: paquete validado sesión 3\" && git push"
