id: 05-elige-tu-sistema
titulo: "Elige tu sistema y úsalo en 5 minutos"
fase: reflexion
paso: sistema
duracion_min: 13
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Ver la lista de los 15 sistemas"
    cmd: "aula sistema"
  - titulo: "Copiar tu sistema a /trabajo/sistema (cambia <id>)"
    cmd: "aula sistema muebleria"
  - titulo: "Reiniciar la web de dsh para que trabaje en /trabajo/sistema (si ya la habías abierto)"
    cmd: "aula dsh web parar && aula dsh web"
