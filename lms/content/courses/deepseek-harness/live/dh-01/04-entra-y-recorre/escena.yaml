comandos:
  - titulo: "Pedido · Entrar y recorrer con los dos roles (cambia {caso} y {url} por los tuyos)"
    cmd: "Usa el skill documenta-sistema: lee /trabajo/.agents/skills/documenta-sistema/SKILL.md y síguelo paso a paso. Caso: {caso} Sistema: {url} Cuentas de prueba: cajero / cajero123 (rol cajero) y admin / admin123 (rol administrador). Es un sistema de práctica y tengo permiso. Solo navega y lee: no registres ventas ni cambies datos. Haz solo los pasos 1 a 4 del skill: abre el navegador, entra, recorre según el caso y saca una captura de cada pantalla importante, primero con un rol y luego con el otro. Al terminar muéstrame la bitácora y dime qué pantallas y capturas quedaron y en qué se diferencian los dos roles."
