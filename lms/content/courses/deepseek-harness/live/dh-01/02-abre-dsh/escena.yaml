compuerta: lo_logre
dsh: true
comandos:
  - titulo: "Pedido · Preparar el aula para la clase"
    cmd: "Prepara mi aula para la clase. Instala o actualiza el skill documenta-sistema con: mkdir -p /trabajo/.agents/skills && curl -fsSL -o /tmp/kit.zip raw.githubusercontent.com/davrv93/jmd/main/lms/content/courses/deepseek-harness/materials/kit-documenta-sistema.zip && unzip -oq /tmp/kit.zip -d /trabajo/.agents/skills && rm /tmp/kit.zip. Después corre: python3 /trabajo/.agents/skills/documenta-sistema/herramientas/generar.py --prueba. Dime en una línea si quedó listo."
