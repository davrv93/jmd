id: 04-abrir-dsh
titulo: "Abrir DeepSeek Harness, paso a paso"
fase: experiencia
paso: dsh
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Comprobar la versión de Node (debe ser 24.9 o mayor)"
    cmd: "node -v"
  - titulo: "Abrir la interfaz web de dsh (127.0.0.1:3080; la primera vez tarda 5 a 6 min)"
    cmd: "npx @deepseek-ai/dsh web"
  - titulo: "Lo mismo sin abrir el navegador solo (imprime la dirección con su token: no la compartas)"
    cmd: "npx @deepseek-ai/dsh web --no-open"
