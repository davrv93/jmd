id: 06-tarea
titulo: "Pregunta, tarea e insignia"
fase: experimentacion
paso: entregar
duracion_min: 5
lo_logre: false
evidencia: ninguna
compuerta: ninguna
comandos:
  - titulo: "Tarea: guardar el primer resumen del agente"
    cmd: "dsh --profile headless \"Summarize this repository and identify its main packages\" > resumen.txt"
  - titulo: "Subir el mapa, las dudas y las instrucciones"
    cmd: "git add MAPA.md DUDAS.md AGENTS.md resumen.txt && git commit -m \"sesión 1: mapa inicial del sistema\" && git push"
