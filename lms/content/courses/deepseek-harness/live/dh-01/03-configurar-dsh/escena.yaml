id: 03-configurar-dsh
titulo: "Configurar DeepSeek Harness: ordena los pasos"
fase: experiencia
paso: configurar
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Comprobar Node.js (hace falta para npx)"
    cmd: "node --version"
  - titulo: "Arrancar la interfaz web de dsh (abre http://127.0.0.1:3080)"
    cmd: "npx @deepseek-ai/dsh web"
  - titulo: "Lo mismo sin abrir el navegador solo"
    cmd: "npx @deepseek-ai/dsh web --no-open"
  - titulo: "Sesión sin interfaz: imprime la respuesta en la terminal"
    cmd: "dsh --profile headless \"Summarize this repository and identify its main packages\""
