id: 07-agents-y-tarea
titulo: "AGENTS.md, la skill y tu tarea"
fase: experimentacion
paso: instrucciones
duracion_min: 10
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Comprobar que nada cambió desde la foto (macOS: shasum -a 256 -c)"
    cmd: "sha256sum -c FOTO/hashes.txt"
  - titulo: "Subir la foto y tus dudas verificables"
    cmd: "git add FOTO docs && git commit -m \"sesión 1: foto del sistema y 5 afirmaciones verificadas\" && git push"
  - titulo: "Alternativa: empaquetar la entrega en un zip"
    cmd: "zip -r entrega-s1.zip FOTO docs"
