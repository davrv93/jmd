id: bi-clickhouse
title: "Dashboards y BI con IA · ClickHouse + Claude"
description: >
  Conecta tu Excel, tus macros, OneDrive, Access y tus bases de datos a ClickHouse, límpialos y
  estructúralos con Claude como copiloto, y termina con un dashboard publicado en la web que se
  actualiza solo. Reportería automática sin programar.
cohorts: [bi-clickhouse-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu dashboard con datos reales o de ejemplo, conectado a tus fuentes, con refresco automático y
  publicado en la web en un enlace.
requisitos:
  - Laptop con Chrome o Edge y conexión estable
  - Zoom instalado
  - Un Excel tuyo para practicar (opcional; también hay datos de ejemplo)
  - Sin conocimientos previos de programación ni de bases de datos
dedicacion: "2 sesiones en vivo de 2 horas: domingos 22 y 29 de noviembre, de 3:00 a 5:00 pm"
# Inscripción: por WhatsApp al 986 149 476 (lo dice el flyer de noviembre).

modules:
  - id: s1
    title: "Sesión 1 · Conecta, limpia y estructura tus datos"
    lessons: [ch-01]
  - id: s2
    title: "Sesión 2 · Dashboards, refresco automático y publicación"
    lessons: [ch-02]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Dashboards y BI con IA", grupo: "Grupo 1", area: datos, minutos: 120}
