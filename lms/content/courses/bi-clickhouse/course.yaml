id: bi-clickhouse
title: "Dashboards y BI con IA · ClickHouse + Claude"
description: >
  Adjunta tu archivo y obtén tu dashboard. Llevas tu Excel, CSV o Access a ClickHouse con Docker,
  lo limpias con Claude o DeepSeek comprobando filas y totales, y terminas con un dashboard
  ejecutivo de ventas que lees de un vistazo y compartes con tu equipo. Sin programar.
cohorts: [bi-clickhouse-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu dashboard de ventas hecho a partir de tu archivo (o del de ejemplo): cifras clave, ventas por
  mes, sede y categoría, alerta de caída y el SQL para cargarlo en tu servidor ClickHouse.
requisitos:
  - Laptop con Windows, Mac o Linux, Chrome o Edge y conexión estable
  - Docker Desktop instalado (en clase se muestra cómo, paso a paso)
  - Zoom instalado
  - Un archivo tuyo de ventas en Excel, CSV, PDF o Word (opcional; también hay datos de ejemplo)
  - Sin conocimientos previos de programación ni de bases de datos
dedicacion: "2 sesiones en vivo de 2 horas: domingo 29 de noviembre y domingo 6 de diciembre, de 3:00 a 5:00 p. m. (hora de Lima). Inversión: S/ 35"
# Inscripción: por WhatsApp al 986 149 476 (lo dice el flyer de noviembre).

modules:
  - id: s1
    title: "Sesión 1 · De tu archivo a datos confiables"
    lessons: [ch-01]
  - id: s2
    title: "Sesión 2 · De tus datos al dashboard ejecutivo"
    lessons: [ch-02]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Dashboards y BI con IA", grupo: "Grupo 1", area: datos, minutos: 120}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: azul
  icono: chart
  frase: "Adjunta tu archivo y obtén tu dashboard: de Excel, CSV o Access a ClickHouse, limpio con IA y listo para decidir."
  resultado:
    - "Levantar ClickHouse con Docker en Windows, Mac o Linux"
    - "Limpiar tu archivo con reglas de IA y comprobar filas y totales"
    - "Obtener tu dashboard ejecutivo de ventas y compartirlo"
