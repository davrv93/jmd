id: docker-vs-podman
title: "Docker vs Podman: el versus DevOps"
description: >
  El versus DevOps: el mismo proyecto con Docker y con Podman. Imágenes, compose, rootless, seguridad y despliegue, comparados con números. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 13 de diciembre de 9:00 p. m. a 10:15 p. m.; sábado 19 de diciembre de 10:00 p. m. a 11:15 p. m.; domingo 20 de diciembre de 11:45 a. m. a 1:00 p. m.. Inversión: S/ 30.
cohorts: [docker-vs-podman-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un proyecto desplegado con Docker y con Podman, con la comparación medida (tamaño, arranque, seguridad) y la recomendación para tu caso.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 30.

