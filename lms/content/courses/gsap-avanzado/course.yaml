id: gsap-avanzado
title: "GSAP avanzado: animaciones web"
description: >
  Animaciones web profesionales con GSAP y un agente de IA: líneas de tiempo, scroll, texto cinético, SVG y transiciones fluidas que no traban la página. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 13 de diciembre de 7:30 p. m. a 8:45 p. m.; sábado 19 de diciembre de 8:30 p. m. a 9:45 p. m.; domingo 20 de diciembre de 8:00 a. m. a 9:15 a. m.. Inversión: S/ 20.
cohorts: [gsap-avanzado-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Una landing animada con GSAP (scroll, texto cinético y transiciones) publicada y con buen rendimiento en celular.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 20.

modules:
