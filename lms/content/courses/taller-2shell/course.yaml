id: taller-2shell
title: "Taller 2Shell · PHP2Shell, Node2Shell y Java4Shell en Docker"
description: >
  Taller defensivo sobre las tres ejecuciones remotas de código críticas de fines de 2026: PHP2Shell
  (CVE-2026-109618 y CVE-2026-109619), Node2Shell (CVE-2026-111497) y Java4Shell (CVE-2026-114938).
  En un laboratorio Docker blindado comparas un contenedor vulnerable con uno parchado, ves sus consolas en vivo
  y aprendes a saber si estás expuesto, a mitigar hoy y a detectar un ataque. Sin exploits: se practica defensa.
cohorts: [taller-2shell-1]
requisitos:
  - Una cuenta en jmd-learn.online
  - Saber abrir una terminal; no hace falta experiencia en seguridad
dedicacion: "Una sesión de 2 horas en vivo por Zoom"

modules:
  - id: taller
    title: "Taller · Prevenir, detectar y mitigar las 2Shell"
    lessons: [t2s-01]
