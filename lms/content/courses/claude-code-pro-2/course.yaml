id: claude-code-pro-2
title: "Claude Code PRO · Grupo 2"
description: >
  Opus 5.5 con un plan de $20. Un solo proyecto de punta a punta, un dashboard BI con IA
  (DuckDB + API + frontend + chat que convierte preguntas en SQL), construido midiendo tokens
  en cada paso. Cuatro sesiones en vivo los domingos 15, 22 y 29 de noviembre y 6 de diciembre
  de 2026, de 2:00 a 3:00 p.m. (hora de Lima), por Zoom.
cohorts: [claude-code-pro-2]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un dashboard BI con IA publicado en una URL: modelo estrella en DuckDB, API de métricas con
  pruebas, tablero legible en claro y oscuro, chat de solo lectura que responde preguntas en SQL,
  suite E2E verde y el reporte de tokens de todo el curso.
requisitos:
  - Una cuenta Claude Pro activa
  - Una laptop con Docker o Podman
  - Una cuenta en jmd-learn.online
dedicacion: "4 sesiones en vivo de 1 hora: domingos 15, 22 y 29 de noviembre y 6 de diciembre, 2:00 a 3:00 p.m."
