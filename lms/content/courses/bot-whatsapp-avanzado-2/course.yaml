id: bot-whatsapp-avanzado-2
title: Bot de WhatsApp avanzado · Grupo 2
description: >
  Lleva tu bot de WhatsApp al siguiente nivel: un modelo de lenguaje local, un motor de decisiones
  donde el código decide y el modelo solo redacta, y embeddings para entender lo que pide el cliente.
  Clases en vivo los domingos 22 y 29 de noviembre, de 9:30 a 11:00 pm.
cohorts: [bot-avanzado-2]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un bot de WhatsApp que decide con reglas y una tabla de decisión, redacta con un modelo pequeño
  que corre en tu propia máquina y busca por significado con embeddings.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "2 clases en vivo (domingos 22 y 29 de noviembre de 2026), 9:30 a 11:00 pm, hora de Lima"

