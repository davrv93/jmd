id: deepseek-turbo-local
title: "DeepSeek Turbo Local · Grupo 1 · Acelera y entrena tu IA en tu computadora"
description: >
  Corre DeepSeek en tu propia computadora, sin nube y sin pagar por token. Lo haces más rápido con
  decodificación especulativa, lo sirves con una API compatible con OpenAI y Anthropic en 127.0.0.1 y lo
  entrenas con LoRA usando el historial de git de tu propio proyecto. Cada mejora se mide: tokens por segundo,
  respuestas iguales y código que aplica y compila. Funciona en Mac con chip Apple (MLX) y en Windows
  (llama.cpp o LM Studio para correrlo; Unsloth con GPU NVIDIA o Google Colab para entrenarlo). Tres clases
  en vivo de 90 minutos por Zoom (hora de Lima): miércoles 6, 13 y 20 de enero de 2027, de 7:30 a 9:00 p. m.
cohorts: [deepseek-turbo-local-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu modelo local acelerado y servido en 127.0.0.1, con su tabla de velocidad medida en tu equipo, y un
  adaptador LoRA entrenado con tu repositorio junto con su evaluación: cuántos cambios aplican, compilan y se
  parecen a los que hiciste tú.
requisitos:
  - "Mac con chip Apple (M1 o superior) y 16 GB de RAM, o PC con Windows 10/11 de 64 bits y 16 GB de RAM"
  - "Unos 15 GB libres en disco para los modelos"
  - "Para entrenar en Windows: GPU NVIDIA con 6 GB de VRAM o más, o una cuenta de Google para usar Colab"
  - "Un repositorio git propio con historial (si no tienes uno, usamos uno de práctica)"
  - Conocimientos básicos de terminal y una cuenta en jmd-learn.online
dedicacion: "3 clases en vivo de 90 minutos: miércoles 6, 13 y 20 de enero de 2027, 7:30 a 9:00 p. m. (Lima) · 4 h 30 min"
# Inscripción: WhatsApp 986 149 476. Precio: por definir.

modules:
  - id: s1
    title: "Sesión 1 · Más tokens por segundo sin cambiar la respuesta"
    lessons: [dtl-01]
  - id: s2
    title: "Sesión 2 · Tu servidor local compatible con OpenAI y Anthropic"
    lessons: [dtl-02]
  - id: s3
    title: "Sesión 3 · Entrena el modelo con el historial de tu repositorio"
    lessons: [dtl-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "DeepSeek Turbo Local", grupo: "Grupo 1", area: agentica, minutos: 90}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: petroleo
  icono: zap
  nivel: Avanzado
  frase: "DeepSeek en tu computadora: más rápido, con tu propia API y entrenado con tu código."
  resultado:
    - "Medir tokens por segundo de forma honesta y acelerar con decodificación especulativa"
    - "Servir el modelo en 127.0.0.1 con una API compatible con OpenAI y Anthropic"
    - "Entrenar un adaptador LoRA con tus commits y comprobar si de verdad mejora"
