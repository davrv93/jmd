id: 03-plan
titulo: "Plan de trabajo del chatbot"
fase: conceptualizacion
paso: "plan"
duracion_min: 8
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "★ Paso a paso (recomendado): ver qué toca"
    cmd: "aula paso"
  - titulo: "★ El agente hace el paso y se comprueba solo"
    cmd: "aula paso hacer"
  - titulo: "★ Ver la lista de pasos"
    cmd: "aula paso lista"
  - titulo: "Crear el plan del chatbot"
    cmd: "aula nuevo plan-chatbot"
  - titulo: "Ver el prompt para el agente"
    cmd: "cat /trabajo/plan-chatbot/PROMPT_ARMAR_CHATBOT.md"
  - titulo: "Abrir el agente y pegar el prompt"
    cmd: "jmd"
  - titulo: "F0-T2: preparar la carpeta del chatbot"
    cmd: "jmd chat \"/skill s3-chatbot-aula crea /trabajo/chatbot con package.json, chatbot.sh, api.js, index.html con mi color y copia recursos y pruebas\""
  - titulo: "¿Quedan marcadores sin llenar?"
    cmd: "grep -c '<<[A-Z0-9_]*>>' /trabajo/plan-chatbot/PLAN_TRABAJO.md"
tareas:
  - {id: F0, titulo: "Preparar el aula"}
  - {id: F1, titulo: "Diseñar: wireframe y prototipo"}
  - {id: F2, titulo: "Vincular WhatsApp (QR)"}
  - {id: F3, titulo: "Datos y API: Postgres + Elysia"}
  - {id: F4, titulo: "La bandeja en Lit"}
  - {id: F5, titulo: "El bot responde y una persona toma"}
  - {id: F6, titulo: "Probar"}

oculta: true
