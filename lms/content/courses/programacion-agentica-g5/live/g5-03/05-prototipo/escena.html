<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E05 · Del wireframe al prototipo</title>
<!--
  PLANTILLA DE ESCENA DEL MODO LIVE
  Copia este archivo a live/<lección>/<NN-nombre>/escena.html y cambia SOLO tres cosas:
    1. <title>, la fase (data-ph y el texto de .esc-fase), el número (.esc-num).
    2. El contenido de <main class="esc-cuerpo"> (usa las clases de abajo).
    3. Estilos propios de la escena, dentro de <style id="esc-propio"> (nada fuera de ese bloque).
  Reglas: sin recursos externos (nada de http, CDN, fuentes ni imágenes remotas; el CSS común va en ../../comun/escena.css), menos de 300
  elementos y 1 MB, animaciones solo con CSS o SVG animado, y todo se apaga con prefers-reduced-motion.
  Escala: se diseña a 1920x1080; el texto usa clamp() y se ve bien desde 1366x768.
-->
<link rel="stylesheet" href="../../comun/escena.css">
<style id="esc-propio">

/* ---- Común de la clase 3 (chatbot de WhatsApp) ---- */
:root { --wa: #0b7a40; --wa-bg: rgba(11,122,64,.12); --wa-cab: #0b7a40; --burb: #d9fdd3; --burb-fg: #10291a; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="light"]) { --wa: #4ade80; --wa-bg: rgba(74,222,128,.15); --wa-cab: #166c3f; --burb: #1d5a39; --burb-fg: #e6ffef; } }
:root[data-tema="dark"] { --wa: #4ade80; --wa-bg: rgba(74,222,128,.15); --wa-cab: #166c3f; --burb: #1d5a39; --burb-fg: #e6ffef; }
.esc-chip.wa { background: var(--wa-bg); color: var(--wa); border-color: color-mix(in srgb, var(--wa) 30%, transparent); }
.esc-svg text.m { fill: var(--muted); }
.esc-svg text.ac { fill: var(--accent); }
.esc-svg text.ok { fill: var(--ok); }
.esc-svg text.wa { fill: var(--wa); }
.esc-svg text.mono { font-family: var(--mono); }
.esc-svg text.b { font-weight: 700; }
.nodo { fill: var(--s1); stroke: var(--line2); stroke-width: 2.5; }
.nodo.ac { stroke: var(--accent); }
.nodo.wa { stroke: var(--wa); }
.carril { fill: none; stroke: var(--line2); stroke-width: 3; stroke-linecap: round; }
.carril.ac { stroke: var(--accent); }
.carril.wa { stroke: var(--wa); }
.punta { fill: var(--line2); }
.punta.ac { fill: var(--accent); }
.punta.wa { fill: var(--wa); }
.tel { fill: var(--s1); stroke: var(--fg); stroke-width: 6; }
.tel-pant { fill: var(--s2); }
.tel-cab { fill: var(--wa-cab); }
.esc-svg text.tel-t { fill: #fff; font-weight: 700; }
.bu-in { fill: var(--s1); stroke: var(--line2); stroke-width: 1.5; }
.bu-out { fill: var(--burb); }
.esc-svg text.bo { fill: var(--burb-fg); }
.gris { fill: var(--s3); }
.gris2 { fill: var(--line2); }
.marco { fill: var(--s1); stroke: var(--line2); stroke-width: 2.5; }
.c3-cmd { font-size: .74em; }
.c3-cmd .ok { color: #7ef0a4; }
.c3-cmd .no { color: #ff9b9b; }
.c3-cmd .w { color: #ffd479; }

.p5-svg { max-height: 56vh; }
.p5-av1 { fill: var(--accent); } .p5-av2 { fill: var(--wa); } .p5-av3 { fill: var(--warn); }
.p5-badge { fill: var(--wa); }
.p5-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 2; }
.p5-sel { fill: var(--accent-bg); }
.p5-abajo { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.6vw; align-items: center; }

/* ---- Teléfono (390 px): una columna y se puede desplazar ---- */
@media (max-width: 760px) {
  html, body { height: auto; }
  body { overflow: visible; }
  .esc { padding: 14px 16px; gap: 14px; }
  .esc-titulo { font-size: 1.7em; }
  .esc-sub { font-size: 1em; }
  .esc-grid-2, .esc-grid-3, .c3-col { grid-template-columns: 1fr !important; gap: 12px; }
  .c3-cmd { font-size: .7em; }
}
</style>
</head>
<body>

    <circle class="eo" cx="262" cy="764" r="4.5"/><circle class="e" cx="120" cy="760" r="3"/><circle class="e" cx="404" cy="760" r="3"/><circle class="eg" cx="262" cy="838" r="3.5"/>

  <g>
    <circle class="e p" style="--p:.2s" cx="320" cy="140" r="1.8"/><circle class="eg p" style="--p:1.1s" cx="520" cy="80" r="1.6"/><circle class="e p" style="--p:2.3s" cx="700" cy="190" r="1.8"/>
    <circle class="eo p" style="--p:.7s" cx="860" cy="70" r="1.7"/><circle class="e p" style="--p:3.1s" cx="1010" cy="210" r="1.6"/><circle class="eg p" style="--p:1.8s" cx="1500" cy="300" r="1.8"/>
    <circle class="e p" style="--p:2.7s" cx="1540" cy="470" r="1.6"/><circle class="eo p" style="--p:.4s" cx="1440" cy="620" r="1.8"/><circle class="e p" style="--p:3.6s" cx="1380" cy="820" r="1.7"/>
    <circle class="eg p" style="--p:1.5s" cx="760" cy="840" r="1.6"/><circle class="e p" style="--p:2.1s" cx="560" cy="760" r="1.8"/><circle class="eo p" style="--p:.9s" cx="40" cy="380" r="1.6"/>
    <circle class="e p" style="--p:3.3s" cx="150" cy="260" r="1.7"/><circle class="eg p" style="--p:2.6s" cx="470" cy="330" r="1.5"/><circle class="e p" style="--p:1.3s" cx="1210" cy="400" r="1.6"/>
    <circle class="eo p" style="--p:4.1s" cx="880" cy="560" r="1.5"/><circle class="e p" style="--p:.6s" cx="640" cy="620" r="1.6"/><circle class="eg p" style="--p:2.9s" cx="1090" cy="560" r="1.7"/>
  </g>
</svg>

<div class="esc">
  <header class="esc-cab">
    <span class="esc-fase" data-ph="ec">Experiencia</span>
    <span class="esc-num">Grupo 5 · E05</span>
  </header>

  <main class="esc-cuerpo">
    <h1 class="esc-titulo a-in">Del gris a un <em>prototipo</em> que se toca</h1>
    <svg class="esc-svg p5-svg" viewBox="0 0 1600 520" role="img" aria-label="A la izquierda el wireframe en gris; una flecha con el skill s3-prototipo; a la derecha el prototipo en color de la bandeja a 393 píxeles, con tres chats de ejemplo y el estado conectado.">
      <g class="a-pop" style="--d:.2s">
        <rect class="marco" x="160" y="30" width="260" height="460" rx="30"/>
        <rect class="gris" x="180" y="52" width="220" height="48" rx="10"/>
        <circle class="gris2" cx="214" cy="146" r="22"/><rect class="gris2" x="248" y="130" width="120" height="13" rx="6"/><rect class="gris" x="248" y="152" width="140" height="11" rx="5"/>
        <circle class="gris2" cx="214" cy="216" r="22"/><rect class="gris2" x="248" y="200" width="100" height="13" rx="6"/><rect class="gris" x="248" y="222" width="130" height="11" rx="5"/>
        <circle class="gris2" cx="214" cy="286" r="22"/><rect class="gris2" x="248" y="270" width="110" height="13" rx="6"/><rect class="gris" x="248" y="292" width="120" height="11" rx="5"/>
        <rect class="gris2" x="200" y="430" width="180" height="34" rx="17"/>
        <text class="m" x="290" y="20" font-size="22" text-anchor="middle">wireframe</text>
      </g>
      <path class="carril ac a-draw" pathLength="1" style="--d:.6s;--t:.6s" d="M470 260 H850"/><path class="punta ac a-in" style="--d:1.1s" d="M866 260 l-18 -10 v20 z"/>
      <text class="a-in ac mono b" style="--d:.9s" x="660" y="240" font-size="24" text-anchor="middle">s3-prototipo</text>
      <text class="a-in m" style="--d:1s" x="660" y="296" font-size="20" text-anchor="middle">tu color · tus preguntas · sin JavaScript</text>
      <g class="a-pop" style="--d:1.2s">
        <rect class="tel" x="900" y="10" width="290" height="500" rx="38"/>

        <circle class="p5-badge" cx="1150" cy="147" r="13"/><text x="1150" y="153" font-size="16" text-anchor="middle" fill="#fff" class="b">2</text>
        <text class="m" x="1150" y="227" font-size="14" text-anchor="middle">Bot</text><text class="ac" x="1150" y="297" font-size="14" text-anchor="middle">Persona</text>
        <circle class="p5-av2" cx="948" cy="217" r="22"/><text x="982" y="211" font-size="18" class="b">Luis Ramos</text><text class="m" x="982" y="236" font-size="16">¿hacen delivery?</text>
        <circle class="p5-av3" cx="948" cy="287" r="22"/><text x="982" y="281" font-size="18" class="b">Carla Mena</text><text class="m" x="982" y="306" font-size="16">¡gracias!</text>
        <rect class="p5-ok" x="944" y="436" width="202" height="38" rx="19"/><text class="ok" x="1045" y="461" font-size="17" text-anchor="middle">WhatsApp conectado</text>
      </g>
      <g class="a-in" style="--d:1.6s">
        <path class="carril" d="M1200 147 H1250"/><text x="1262" y="154" font-size="22">tus 3 preguntas</text>
        <path class="carril" d="M1200 287 H1250"/><text x="1262" y="294" font-size="22">enlaces #ancla</text>
        <path class="carril" d="M1200 455 H1250"/><text x="1262" y="462" font-size="22">393 px sin desborde</text>
      </g>
    </svg>
    <div class="p5-abajo c3-col a-in" style="--d:1.4s">
      <pre class="esc-cmd c3-cmd"><span class="p">$ </span>jmd chat "/skill s3-prototipo pasa el
  wireframe a prototipo con mi color"</pre>
      <p class="esc-fila" style="margin:0;font-size:.85em"><span class="esc-chip">Visor</span>Abre chatbot/prototipo, recórrelo con Tab y pulsa «Móvil».</p>
    </div>
  </main>

  <footer class="esc-pie">
    <span class="esc-nota">Pulsa «Lo logré» en el panel cuando termines</span>
  </footer>
</div>

<script>
/* Tema: ?tema=dark|light fuerza el tema del LMS; si no, manda el del sistema. */
(function () {
  try {
    var t = new URLSearchParams(location.search).get("tema");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
</body>
</html>
