<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mide tu consumo</title>
<!--
  PLANTILLA DE ESCENA DEL MODO LIVE
  Copia este archivo a live/<lección>/<NN-nombre>/escena.html y cambia SOLO tres cosas:
    1. <title>, la fase (data-ph y el texto de .esc-fase), el número (.esc-num).
    2. El contenido de <main class="esc-cuerpo"> (usa las clases de abajo).
    3. Estilos propios de la escena, dentro de <style id="esc-propio"> (nada fuera de ese bloque).
  Reglas: sin recursos externos (nada de http, CDN, fuentes ni imágenes remotas; el CSS común va en ../../comun/escena.css), menos de 300
  elementos y 1 MB, animaciones solo con CSS o SVG animado, y todo se apaga con prefers-reduced-motion.
  Escala: se diseña a 1920x1080; el texto usa clamp() y se ve bien desde 1366x768.
-->
<link rel="stylesheet" href="../../comun/escena.css">
<style id="esc-propio">
.esc-cielo { opacity: calc(var(--cielo) * .22); }
.esc-titulo { font-size: 1.75em; }
.s5 { display: grid; grid-template-columns: 2.1fr 1fr; gap: 2vw; align-items: stretch; min-height: 0; }
.s5-graf { padding: .8em 1.1em .5em; min-width: 0; }
.s5-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: .2em; }
.s5-tit { font-weight: 700; font-size: .85em; color: var(--muted); }
#s5-svg text { font-size: 19px; }
.s5-grid line { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 4 6; }
.yl, .xl { fill: var(--muted) !important; font-size: 18px !important; }
.s5-area { fill: var(--accent-bg); stroke: none; }
.s5-linea { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.pt { fill: var(--s1); stroke: var(--accent); stroke-width: 3.5; }
.s5-marca line { stroke-width: 3; stroke-dasharray: 8 6; }
.s5-marca text { font-weight: 800; font-size: 20px !important; }
.s5-m-piedra line { stroke: var(--gold); } .s5-m-piedra text { fill: var(--gold) !important; }
.s5-m-rtk line { stroke: var(--ok); } .s5-m-rtk text { fill: var(--ok) !important; }
.s5-der { display: flex; flex-direction: column; gap: 1.6vh; justify-content: center; }
.s5-num { padding: .8em 1.1em; }
.s5-et { font-size: .78em; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.s5-v { margin: .12em 0 0; color: var(--accent); font-variant-numeric: tabular-nums; }
.s5-v2 { color: var(--gold); }
.s5-un { font-size: .78em; color: var(--muted); }
.s5-barra { height: .6em; border-radius: 99px; background: var(--s3); overflow: hidden; margin-top: .5em; }
.s5-barra i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transform-origin: left; animation: s5-barra .9s cubic-bezier(.2,.7,.2,1) .9s both; }
@keyframes s5-barra { from { transform: scaleX(0); } to { transform: none; } }
.s5-caida { display: flex; align-items: center; gap: .6em; flex-wrap: wrap; }
.s5-msj { margin: 0; font-size: 1.5em; font-weight: 800; letter-spacing: -.01em; padding-left: .7em; border-left: 5px solid var(--accent); }
.s5-msj em { font-style: normal; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .s5-barra i { transform: none !important; } }
</style>
</head>
<body>
<!-- Cielo: 3 constelaciones que se dibujan, un libro abierto trazado con estrellas y polvo que parpadea. -->
<svg class="esc-cielo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <path class="t" pathLength="1" d="M1180 92 L1252 130 L1318 104 L1384 168 L1440 146"/>
  <path class="t" pathLength="1" d="M92 612 L168 560 L236 598 L296 524"/>
  <path class="tb" pathLength="1" d="M1010 760 L1086 708 L1162 744 L1230 690 L1300 722"/>
  <path class="t" pathLength="1" d="M120 760 C170 730 220 730 262 764 C304 730 354 730 404 760 M262 764 L262 838 M120 760 L124 836 C174 806 220 806 262 838 C304 806 350 806 400 836 L404 760"/>
  <g>
    <circle class="e" cx="1180" cy="92" r="4"/><circle class="eo" cx="1252" cy="130" r="5"/><circle class="e" cx="1318" cy="104" r="3.5"/><circle class="eg" cx="1384" cy="168" r="4"/><circle class="e" cx="1440" cy="146" r="3"/>
    <circle class="e" cx="92" cy="612" r="3.5"/><circle class="eg" cx="168" cy="560" r="4.5"/><circle class="e" cx="236" cy="598" r="3"/><circle class="eo" cx="296" cy="524" r="5"/>
    <circle class="e" cx="1010" cy="760" r="3.5"/><circle class="eg" cx="1086" cy="708" r="4"/><circle class="e" cx="1162" cy="744" r="3"/><circle class="eo" cx="1230" cy="690" r="4.5"/><circle class="e" cx="1300" cy="722" r="3.5"/>
    <circle class="eo" cx="262" cy="764" r="4.5"/><circle class="e" cx="120" cy="760" r="3"/><circle class="e" cx="404" cy="760" r="3"/><circle class="eg" cx="262" cy="838" r="3.5"/>
  </g>
  <g>
    <circle class="e p" style="--p:.2s" cx="320" cy="140" r="1.8"/><circle class="eg p" style="--p:1.1s" cx="520" cy="80" r="1.6"/><circle class="e p" style="--p:2.3s" cx="700" cy="190" r="1.8"/>
    <circle class="eo p" style="--p:.7s" cx="860" cy="70" r="1.7"/><circle class="e p" style="--p:3.1s" cx="1010" cy="210" r="1.6"/><circle class="eg p" style="--p:1.8s" cx="1500" cy="300" r="1.8"/>
    <circle class="e p" style="--p:2.7s" cx="1540" cy="470" r="1.6"/><circle class="eo p" style="--p:.4s" cx="1440" cy="620" r="1.8"/><circle class="e p" style="--p:3.6s" cx="1380" cy="820" r="1.7"/>
    <circle class="eg p" style="--p:1.5s" cx="760" cy="840" r="1.6"/><circle class="e p" style="--p:2.1s" cx="560" cy="760" r="1.8"/><circle class="eo p" style="--p:.9s" cx="40" cy="380" r="1.6"/>
    <circle class="e p" style="--p:3.3s" cx="150" cy="260" r="1.7"/><circle class="eg p" style="--p:2.6s" cx="470" cy="330" r="1.5"/><circle class="e p" style="--p:1.3s" cx="1210" cy="400" r="1.6"/>
    <circle class="eo p" style="--p:4.1s" cx="880" cy="560" r="1.5"/><circle class="e p" style="--p:.6s" cx="640" cy="620" r="1.6"/><circle class="eg p" style="--p:2.9s" cx="1090" cy="560" r="1.7"/>
  </g>
</svg>

<div class="esc">
  <header class="esc-cab">
    <span class="esc-fase" data-ph="or">Reflexión</span>
    <span class="esc-num">Grupo 5 · E05</span>
  </header>

  <main class="esc-cuerpo">
    <h1 class="esc-titulo a-in">Tus tokens de los <em>últimos 10 minutos</em></h1>
    <div class="s5" id="datos-vivos" data-fuente="/api/v1/mi-uso">
      <section class="esc-card s5-graf a-in" style="--d:.15s" aria-label="Gráfico de tokens por minuto">
        <div class="s5-cab"><span class="s5-tit">Tokens por minuto</span><span class="esc-chip warn" id="s5-estado">ejemplo</span></div>
        <svg class="esc-svg" id="s5-svg" viewBox="0 0 1000 440" role="img" aria-label="Línea de tokens por minuto que cae tras activar piedra y RTK">
          <g class="s5-grid">
          <line x1="90" x2="960" y1="360" y2="360"/>
          <line x1="90" x2="960" y1="267" y2="267"/>
          <line x1="90" x2="960" y1="173" y2="173"/>
          <line x1="90" x2="960" y1="80" y2="80"/>
          </g>
          <text class="yl" x="76" y="366" text-anchor="end">0</text>
          <text class="yl" x="76" y="273" text-anchor="end">1 000</text>
          <text class="yl" x="76" y="179" text-anchor="end">2 000</text>
          <text class="yl" x="76" y="86" text-anchor="end">3 000</text>
          <path class="s5-area" id="s5-area" d="M90,360 L90,136 L187,122 L283,129 L380,117 L477,234 L573,257 L670,250 L767,308 L863,315 L960,318 L960,360 Z"/>
          <polyline class="s5-linea a-draw" id="s5-linea" pathLength="1" style="--d:.5s;--t:1.6s" points="90,136 187,122 283,129 380,117 477,234 573,257 670,250 767,308 863,315 960,318"/>
          <g id="s5-pts">
          <circle class="pt a-pop" style="--d:0.70s" cx="90" cy="136" r="6"/>
          <circle class="pt a-pop" style="--d:0.85s" cx="187" cy="122" r="6"/>
          <circle class="pt a-pop" style="--d:1.00s" cx="283" cy="129" r="6"/>
          <circle class="pt a-pop" style="--d:1.15s" cx="380" cy="117" r="6"/>
          <circle class="pt a-pop" style="--d:1.30s" cx="477" cy="234" r="6"/>
          <circle class="pt a-pop" style="--d:1.45s" cx="573" cy="257" r="6"/>
          <circle class="pt a-pop" style="--d:1.60s" cx="670" cy="250" r="6"/>
          <circle class="pt a-pop" style="--d:1.75s" cx="767" cy="308" r="6"/>
          <circle class="pt a-pop" style="--d:1.90s" cx="863" cy="315" r="6"/>
          <circle class="pt a-pop" style="--d:2.05s" cx="960" cy="318" r="6"/>
          </g>
          <g class="s5-marca s5-m-piedra a-in" id="s5-mp" style="--d:1.2s">
            <line id="s5-mp-l" x1="428" x2="428" y1="56" y2="360"/>
            <text id="s5-mp-t" x="438" y="40">piedra activado</text>
          </g>
          <g class="s5-marca s5-m-rtk a-in" id="s5-mr" style="--d:1.75s">
            <line id="s5-mr-l" x1="718" x2="718" y1="56" y2="360"/>
            <text id="s5-mr-t" x="728" y="40">RTK activado</text>
          </g>
          <text class="xl" x="90" y="402" text-anchor="start">hace 10 min</text>
          <text class="xl" x="525" y="402" text-anchor="middle">hace 5 min</text>
          <text class="xl" x="960" y="402" text-anchor="end">ahora</text>
        </svg>
      </section>
      <section class="s5-der">
        <div class="esc-card s5-num a-in" style="--d:.45s">
          <div class="s5-et" id="s5-et-tot">Total de la clase</div>
          <div class="esc-big s5-v" id="s5-tot">184 300</div>
          <div class="s5-un">tokens hoy</div>
        </div>
        <div class="esc-card s5-num a-in" style="--d:.65s">
          <div class="s5-et">Cuota diaria usada</div>
          <div class="esc-big s5-v s5-v2"><span id="s5-pct">23</span> %</div>
          <div class="s5-barra" aria-hidden="true"><i id="s5-barra" style="width:23%"></i></div>
        </div>
        <div class="s5-caida a-in" style="--d:.85s"><span class="esc-chip ok" id="s5-caida">-80 % por minuto</span> <span class="s5-un">desde que se activó piedra</span></div>
      </section>
    </div>
    <p class="s5-msj a-in" style="--d:1.9s">Menos tokens, <em>más consultas por día</em> con la misma cuota gratis.</p>
  </main>

  <footer class="esc-pie">
    <span class="esc-nota">Sigue la explicación del instructor</span>
  </footer>
</div>

<script>
/* Tema: ?tema=dark|light fuerza el tema del LMS; si no, manda el del sistema. */
(function () {
  try {
    var t = new URLSearchParams(location.search).get("tema");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
<script>
(function () {
  var cont = document.getElementById("datos-vivos");
  var fuente = cont.getAttribute("data-fuente");
  var X0 = 90, X1 = 960, Y0 = 80, Y1 = 360;
  var $ = function (id) { return document.getElementById(id); };
  var miles = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0"); };
  function pintar(vals, marcas, tot, pct, propio) {
    var max = Math.max.apply(null, vals.concat([100]));
    var tope = Math.max(300, Math.ceil(max * 1.15 / 300) * 300);
    var n = vals.length, pts = [];
    vals.forEach(function (v, i) {
      var x = X0 + (X1 - X0) * i / (n - 1), y = Y1 - (Y1 - Y0) * v / tope;
      pts.push(x.toFixed(0) + "," + y.toFixed(0));
      var c = $("s5-pts").children[i]; if (c) { c.setAttribute("cx", x.toFixed(0)); c.setAttribute("cy", y.toFixed(0)); }
    });
    $("s5-linea").setAttribute("points", pts.join(" "));
    $("s5-area").setAttribute("d", "M" + X0 + "," + Y1 + " L" + pts.join(" L") + " L" + X1 + "," + Y1 + " Z");
    var yl = document.querySelectorAll(".yl");
    for (var k = 0; k < yl.length; k++) {
      var val = tope * k / 3; yl[k].textContent = miles(val);
      yl[k].setAttribute("y", (Y1 - (Y1 - Y0) * val / tope + 6).toFixed(0));
    }
    var gl = document.querySelectorAll(".s5-grid line");
    for (var g = 0; g < gl.length; g++) { var yy = (Y1 - (Y1 - Y0) * (tope * g / 3) / tope).toFixed(0); gl[g].setAttribute("y1", yy); gl[g].setAttribute("y2", yy); }
    [["piedra", "s5-mp"], ["rtk", "s5-mr"]].forEach(function (p) {
      var m = marcas[p[0]], g = $(p[1]);
      if (m == null) { g.style.display = "none"; return; }
      g.style.display = "";
      var x = X0 + (X1 - X0) * m / (n - 1);
      var l = $(p[1] + "-l"), t = $(p[1] + "-t");
      l.setAttribute("x1", x.toFixed(0)); l.setAttribute("x2", x.toFixed(0));
      t.setAttribute("x", (x + 10).toFixed(0));
      t.setAttribute("text-anchor", x > 700 ? "end" : "start");
      if (x > 700) t.setAttribute("x", (x - 10).toFixed(0));
    });
    var mi = marcas.piedra != null ? marcas.piedra : marcas.rtk;
    if (mi != null) {
      var a = vals.slice(0, Math.max(1, Math.floor(mi))), b = vals.slice(-3);
      var pa = a.reduce(function (s, v) { return s + v; }, 0) / a.length, pb = b.reduce(function (s, v) { return s + v; }, 0) / b.length;
      if (pa > 0) $("s5-caida").textContent = (pb <= pa ? "-" : "+") + Math.abs(Math.round((pb - pa) / pa * 100)) + " % por minuto";
    }
    $("s5-tot").textContent = miles(tot);
    $("s5-et-tot").textContent = propio ? "Tus tokens de hoy" : "Total de la clase";
    $("s5-pct").textContent = Math.round(pct);
    $("s5-barra").style.width = Math.min(100, Math.max(2, pct)) + "%";
  }
  function indiceDe(serie, t) {
    var ts = Date.parse(t); if (isNaN(ts)) return null;
    for (var i = 0; i < serie.length; i++) { var s = Date.parse(serie[i].t); if (!isNaN(s) && s >= ts) return i - 0.5; }
    return null;
  }
  function usar(d) {
    if (!d || !Array.isArray(d.serie) || d.serie.length < 2) return false;
    var serie = d.serie.slice(-10);
    var vals = serie.map(function (p) { return (+p.entrada || 0) + (+p.salida || 0); });
    while (vals.length < 10) vals.unshift(0);
    var falta = 10 - serie.length, marcas = { piedra: null, rtk: null };
    (d.marcas || []).forEach(function (m) {
      var tipo = String(m.tipo || "").toLowerCase(), i = indiceDe(serie, m.t);
      if (i != null && i >= -0.5 && (tipo === "piedra" || tipo === "rtk")) marcas[tipo] = i + falta;
    });
    var hoy = d.hoy || {};
    var tot = (+hoy.tokens_entrada || 0) + (+hoy.tokens_salida || 0);
    pintar(vals, marcas, tot, d.cuota && d.cuota.pct != null ? +d.cuota.pct : 0, true);
    var e = $("s5-estado"); e.textContent = "en vivo"; e.className = "esc-chip ok";
    return true;
  }
  function traer() {
    try {
      fetch(fuente, { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(usar)
        .catch(function () {});
    } catch (e) {}
  }
  traer();
  setInterval(traer, 10000);
})();
</script>
</body>
</html>
