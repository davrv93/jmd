# Arena de conceptos (11b): la clave de respuestas del minijuego. La lee el servidor
# (lms/api/internal/httpapi/live_juego.go) y NUNCA se envía al navegador: la ruta de archivos de
# escena no sirve .yaml. Cada concepto va a un solo contenedor; todos salen de la clase g5-02.
# Se puede corregir entre rondas: «Ronda nueva» relee este archivo.
contenedores:
  - {id: llm,      nombre: "LLM · texto"}
  - {id: difusion, nombre: "Difusión · imagen"}
  - {id: voz,      nombre: "Voz · STT/TTS"}
  - {id: skills,   nombre: "Código · skills"}
conceptos:
  # Modelo de lenguaje (Ollama): produce texto.
  - {texto: "qwen3:1.7b",                  contenedor: llm}
  - {texto: "Ollama",                      contenedor: llm}
  - {texto: "ollama run",                  contenedor: llm}
  - {texto: "eval rate (tokens/s)",        contenedor: llm}
  - {texto: "Saca fecha, hora y precio",   contenedor: llm}
  - {texto: "Responde el chat sin wifi",   contenedor: llm}
  # Difusión: pinta imágenes, no sabe escribir.
  - {texto: "sd-turbo",                    contenedor: difusion}
  - {texto: "sdxl-turbo",                  contenedor: difusion}
  - {texto: "FLUX.2 Klein",                contenedor: difusion}
  - {texto: "mflux",                       contenedor: difusion}
  - {texto: "Pinta el fondo del flyer",    contenedor: difusion}
  - {texto: "Letras como garabatos",       contenedor: difusion}
  # Voz: micrófono a texto (STT) y texto a voz (TTS).
  - {texto: "Whisper",                     contenedor: voz}
  - {texto: "faster-whisper",              contenedor: voz}
  - {texto: "Micrófono → texto",           contenedor: voz}
  - {texto: "Parlante: texto → voz",       contenedor: voz}
  - {texto: "Grabar 3 segundos",           contenedor: voz}
  - {texto: "Micrófono solo en localhost", contenedor: voz}
  # Código y skills: lo que guía al agente y verifica el plan.
  - {texto: "SKILL.md",                    contenedor: skills}
  - {texto: "instalar.sh",                 contenedor: skills}
  - {texto: "AGENTS.md",                   contenedor: skills}
  - {texto: "Modo piedra",                 contenedor: skills}
  - {texto: "PLAN_TRABAJO.md",             contenedor: skills}
  - {texto: "obra.py paso",                contenedor: skills}
