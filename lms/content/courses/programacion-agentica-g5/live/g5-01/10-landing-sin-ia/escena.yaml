id: 10-landing-sin-ia
titulo: "Landing sin IA: reglas y modelo local"
fase: experiencia
paso: landing-sin-ia
duracion_min: 8
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - { titulo: Carpeta de trabajo y texto del cliente, cmd: "mkdir -p /trabajo/landing && cd /trabajo/landing && cat > cliente.txt" }
  - { titulo: "Del texto al JSON (reglas; el modelo local solo redacta si está)", cmd: "bun /opt/skills-curso/s1-landing-estilos/motor/extraer.mjs cliente.txt --modelo auto --salida negocio.json" }
  - { titulo: Construir la landing sin imágenes generadas, cmd: "bun /opt/skills-curso/s1-landing-estilos/motor/construir.mjs --negocio negocio.json --estilo apple --imagenes no" }
oculta: false
