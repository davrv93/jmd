id: 02-instalar-modelo
titulo: "Simulador: instalar un modelo local"
fase: experiencia
paso: instalar
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Instalar Ollama (macOS y Linux)"
    cmd: "curl -fsSL https://ollama.com/install.sh | sh"
  - titulo: "Bajar Qwen3-0.6B (unos 500 MB)"
    cmd: "ollama pull qwen3:0.6b"
  - titulo: "Probarlo y ver tokens/s"
    cmd: "ollama run qwen3:0.6b --verbose \"Explica en una línea qué es un token\""
