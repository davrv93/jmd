id: programacion-agentica-g2
title: Programación agéntica (vibecoding) · Grupo 2
description: >
  Programar con agentes de IA (empezando por OpenCode): instalar las herramientas, entender qué
  hay detrás (proveedores, modelos, parámetros, MCP, skills) y construir proyectos reales con un
  agente al lado.
cohorts: [grupo-2]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un chatbot de WhatsApp para un negocio tuyo: responde con un modelo de lenguaje, guarda cada
  conversación en PostgreSQL y tiene una bandeja web donde una persona puede tomar el control. Lo
  pruebas con un teléfono real y mides sus tiempos de respuesta.
requisitos:
  - Una laptop con Windows, macOS o Linux (el instalador del curso prepara las tres)
  - Una cuenta de GitHub, GitLab o Forgejo para entregar los proyectos
  - Un número de WhatsApp de pruebas para la clase 3
# dedicacion: "3 clases en vivo de 2 h y unas [X] h de práctica por semana"   # completar y descomentar

modules:
  - id: fundamentos
    title: "Módulo 1 · Fundamentos: herramientas y conceptos"
    lessons: [g2-01]
  - id: construir
    title: "Módulo 2 · Construir un asistente con skills y Edge AI"
    lessons: [g2-02]
  - id: producto
    title: "Módulo 3 · Producto: WhatsApp, pruebas y despliegue"
    lessons: [g2-03]
