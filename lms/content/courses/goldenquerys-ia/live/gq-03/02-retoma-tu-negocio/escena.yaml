  - titulo: "Terminal · ¿responde tu API?"
    cmd: "curl -s localhost:8766/api/salud"
  - titulo: "Terminal · arrancar (o reiniciar) la API"
    cmd: "sh /trabajo/goldenquerys/arrancar.sh"
  - titulo: "Terminal · ver tus consultas"
    cmd: "ls /trabajo/goldenquerys/consultas/ && head -n 3 /trabajo/goldenquerys/consultas/*.sql"
