id: 02-retoma-tu-negocio
titulo: "Tu negocio y tus tres consultas"
fase: experiencia
paso: "retomar"
duracion_min: 5
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · vine a la sesión 1: retoma tu negocio"
    cmd: "Retoma GoldenQuerys, sesión 2. Si no existe /trabajo/goldenquerys (tu aula puede ser nueva), no lo busques más: pregúntame cuál era mi negocio (botica, polleria, ferreteria, academia o courier) y, cuando te responda con BASE, ejecuta curl -fsSL -o /tmp/gq.zip https://raw.githubusercontent.com/davrv93/jmd/main/lms/content/courses/goldenquerys-ia/materials/goldenquerys-kit.zip && unzip -oq /tmp/gq.zip -d /trabajo && echo BASE > /trabajo/goldenquerys/MI_NEGOCIO.txt (cambiando BASE por mi respuesta). Cuando exista: corre sh /trabajo/goldenquerys/arrancar.sh, comprueba curl -s localhost:8766/api/salud, lee goldenquerys/MI_NEGOCIO.txt y goldenquerys/PLAN_TRABAJO.md y lista goldenquerys/consultas/*.sql. Dime en una tabla corta cada consulta con su «-- Pregunta:», su número y si ya tiene «-- Verificado:». Si tengo menos de 3 consultas, dímelo y no escribas nada todavía."
  - titulo: "DeepSeek Harness · tengo una o dos consultas: completa mis tres"
    cmd: "Tengo menos de 3 consultas en goldenquerys/consultas/. Propón las que faltan para llegar a 3 preguntas de oro de mi negocio, cada una con la decisión que permite tomar. Escribe su SQL, pruébala con curl contra /api/consulta, contrástala con una consulta independiente más simple (filas base, otra ruta, bordes: anuladas, fechas con hora, JOIN que duplica) y guárdala en goldenquerys/consultas/<negocio>-<tema>.sql con «-- Pregunta:», «-- Decisión:» y «-- Contrastado:» arriba. NO escribas «-- Verificado:»: lo escribo yo cuando revise tus números."
  - titulo: "Me perdí la sesión 1 · Botica (pedido para DeepSeek Harness)"
    cmd: "Me perdí la sesión 1. Mi negocio es: Botica (base botica). 1) Ejecuta este comando y dime qué imprimió: curl -fsSL -o /tmp/gq.zip https://raw.githubusercontent.com/davrv93/jmd/main/lms/content/courses/goldenquerys-ia/materials/goldenquerys-kit.zip && unzip -oq /tmp/gq.zip -d /trabajo && echo botica > /trabajo/goldenquerys/MI_NEGOCIO.txt && sh /trabajo/goldenquerys/arrancar.sh . 2) Lee goldenquerys/AGENTS.md y goldenquerys/skill-dashboard/SKILL.md, reemplaza <<NEGOCIO>> en goldenquerys/PLAN_TRABAJO.md y haz T1 con curl -s \"localhost:8766/api/esquema?db=botica\". 3) Propón 3 preguntas de oro para el dueño, cada una con su decisión; escribe su SQL, pruébala con curl contra /api/consulta y contrástala con una consulta más simple (filas base, otra ruta y bordes: anuladas, fechas con hora, JOIN que duplica). 4) Guárdalas en goldenquerys/consultas/<negocio>-<tema>.sql con «-- Pregunta:», «-- Decisión:» y «-- Contrastado:» arriba. NO escribas «-- Verificado:» ni marques T2: eso lo hago yo. Termina con una tabla: pregunta, número y prueba."
