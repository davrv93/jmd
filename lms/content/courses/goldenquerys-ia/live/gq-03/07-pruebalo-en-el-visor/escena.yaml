id: 07-pruebalo-en-el-visor
titulo: "Pruébalo en el visor"
fase: experimentacion
paso: "construir"
duracion_min: 6
lo_logre: true
evidencia: ninguna
umbral_pct: 60
compuerta: ninguna
dsh: true
comandos:
  - titulo: "Abrir en el visor: goldenquerys/dashboard/index.html"
    cmd: "goldenquerys/dashboard/index.html"
  - titulo: "DeepSeek Harness · arregla mi tablero (T3, T4 y T4b)"
    cmd: "Revisa goldenquerys/dashboard/index.html contra el criterio de T3, T4 y T4b del plan: 1) que todas las llamadas usen la ruta absoluta /api/…; 2) que al cambiar cualquier filtro se vuelvan a consultar TODOS los widgets (destruye cada gráfico antes de volver a crearlo); 3) que el filtro de fechas use date(fecha) para que el último día entre completo; 4) que la caja de pregunta muestre su SQL. Corrige lo que falle y dime en 3 líneas qué cambiaste."
  - titulo: "DeepSeek Harness · cambia un gráfico (cambia los __)"
    cmd: "En mi tablero, el widget de la pregunta «__» debe ser __ (tarjeta, barras, línea o tabla), porque su consulta devuelve __. Cámbialo sin tocar su SQL y dime qué cambiaste."
  - titulo: "Terminal · si el visor no muestra datos: ver el log de la API"
    cmd: "tail -n 20 /trabajo/goldenquerys.log"
