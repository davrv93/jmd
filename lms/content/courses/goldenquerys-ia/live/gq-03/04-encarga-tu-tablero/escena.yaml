id: 04-encarga-tu-tablero
titulo: "Encarga tu tablero"
fase: experimentacion
paso: "construir"
duracion_min: 4
lo_logre: true
evidencia: ninguna
umbral_pct: 60
# La IA tarda de 3 a 6 minutos: mientras trabaja, la clase juega en la 05.
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · tareas T3, T4 y T4b: tu tablero"
    cmd: "Tareas T3, T4 y T4b del plan. Lee goldenquerys/skill-dashboard/SKILL.md y síguelo al pie de la letra. Construye goldenquerys/dashboard/index.html con mis 3 consultas de goldenquerys/consultas/ como centro: 1) usa el SQL de cada una tal cual y solo agrégale los filtros (fecha desde y hasta, y sede o local si mi base lo tiene); 2) elige el widget por la forma del resultado: un solo número → tarjeta KPI; pocas categorías para comparar → barras ordenadas que empiezan en cero; fechas en orden → línea; una lista para actuar (nombres, teléfonos, montos) → tabla; 3) completa lo que pide el skill (3 KPI, 2 gráficos, la tabla y la caja de pregunta con /api/pregunta); 4) encima de cada widget, su pregunta en una línea; 5) por defecto, las fechas del periodo de mis consultas (si no tienen fechas, del 2025-01-01 al 2026-10-31). Prueba cada consulta con curl antes de usarla y marca T3 y T4 solo si cumplen su criterio. Al terminar dime en 4 líneas qué widget responde cada pregunta y por qué, y qué escribir en el visor."
  - titulo: "Terminal · ver tus consultas"
    cmd: "ls /trabajo/goldenquerys/consultas/ && head -n 3 /trabajo/goldenquerys/consultas/*.sql"
  - titulo: "Terminal · ver el plan"
    cmd: "cat /trabajo/goldenquerys/PLAN_TRABAJO.md"
