id: 08-cuadra-cada-numero
titulo: "Cada número cuadra con su SQL"
fase: experimentacion
paso: "cuadrar"
duracion_min: 5
lo_logre: true
evidencia: hallazgo
umbral_pct: 60
# La escena registra la evidencia «hallazgo» al tocar qué encontró; la compuerta cuenta eso o «Lo logré».
compuerta: evidencia
dsh: true
comandos:
  - titulo: "DeepSeek Harness · tarea T5 con tus tres preguntas"
    cmd: "Tarea T5 con mis tres preguntas. Para cada widget de goldenquerys/dashboard/index.html: 1) dime qué consulta de goldenquerys/consultas/ usa y qué fechas pone el filtro; 2) con las fechas de su «-- Verificado:» (o de su «-- Contrastado:» si aún no lo firmé), ejecuta con curl el MISMO SQL que manda el tablero; 3) muéstrame una tabla: widget | número por curl | número verificado | ¿cuadra?; 4) si alguno no cuadra, explícame en una línea por qué (filtro de fecha que corta el día, JOIN que duplica, anuladas u otra pregunta) y corrígelo en el tablero. NO marques T5: lo marco yo cuando vea el mismo número en el visor."
  - titulo: "DeepSeek Harness · ya vi que cuadran: marca T5"
    cmd: "Ya vi en el visor los mismos números que tus curl y que mis «-- Verificado:». Marca T5 hecha en goldenquerys/PLAN_TRABAJO.md y muéstrame el plan completo."
  - titulo: "Terminal · ver el plan"
    cmd: "cat /trabajo/goldenquerys/PLAN_TRABAJO.md"
