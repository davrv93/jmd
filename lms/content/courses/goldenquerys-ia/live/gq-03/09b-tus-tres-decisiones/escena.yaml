id: 09b-tus-tres-decisiones
titulo: "Tus tres decisiones"
fase: experimentacion
paso: "decidir"
duracion_min: 5
lo_logre: true
evidencia: ninguna
umbral_pct: 60
# La escena arma el pedido «decisiones» con las frases del alumno; aquí va la plantilla con __.
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · mis números y su referencia"
    cmd: "Para cada una de mis 3 preguntas de oro de goldenquerys/consultas/, dame en una tabla el número que muestra hoy mi tablero y una referencia para compararlo (el mes anterior, el promedio de los meses anteriores o el mismo mes del año pasado: la que tenga sentido), sacada con curl. NO escribas decisiones: te las dicto yo en el siguiente mensaje."
  - titulo: "DeepSeek Harness · mis decisiones al tablero (cambia los __)"
    cmd: "Mis decisiones: 1) Si __, entonces __. 2) Si __, entonces __. 3) Si __, entonces __. Agrégalas a goldenquerys/dashboard/index.html: debajo del widget de cada pregunta, un recuadro «Decisión» con la frase y un semáforo que se recalcula con los filtros: ámbar si con los datos filtrados se cumple el «si» (toca actuar) y verde si no. Guárdalas también como «-- Decisión:» en su consulta. No cambies ningún SQL; si una condición no se puede calcular con los datos, pregúntame antes de inventar. Al terminar dime qué semáforo está en ámbar hoy."
