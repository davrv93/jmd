id: 11-clasifica-tu-lote
titulo: "Clasifica tu lote y llévalo a tu tablero"
fase: experimentacion
paso: lote
duracion_min: 6
lo_logre: true
# Reglas primero; solo los «por decidir» con texto van a /entender. Exporta lote.csv o lote.json en el navegador.
# El pedido «lote» lo arma la escena con el CSV del alumno en lugar de <<LOTE>>. Voto gq03-cuantos-ia.
evidencia: ninguna
umbral_pct: 60
compuerta: ninguna
dsh: true
comandos:
  - titulo: "DeepSeek Harness · guarda tu lote como la base misarchivos (la escena lo copia con tu lote en lugar de <<LOTE>>)"
    cmd: "Guarda tal cual, sin cambiar nada, este lote de mis archivos (lo exporté en la clase de GoldenQuerys) en goldenquerys/archivos/lote.csv: <<LOTE>> Luego, con python3 y sqlite3 (sin instalar nada), crea goldenquerys/bases/misarchivos.sqlite con una tabla archivos que tenga esas mismas columnas (total_soles y confianza como números). Comprueba con curl -s \"localhost:8766/api/consulta?db=misarchivos\" --get --data-urlencode \"sql=SELECT categoria, origen, COUNT(*) AS archivos, SUM(total_soles) AS soles FROM archivos GROUP BY categoria, origen\" y muéstrame el resultado en una tabla. Si curl no responde, corre antes sh /trabajo/goldenquerys/arrancar.sh; si no existe /trabajo/goldenquerys, crea solo la carpeta goldenquerys/archivos y dame la tabla con python3. NO inventes filas ni completes celdas vacías."
  - titulo: "DeepSeek Harness · suma «Mis archivos» a tu tablero"
    cmd: "Con la base misarchivos (tabla archivos), agrega a mi tablero goldenquerys/dashboard/index.html una tarjeta «Mis archivos» que responda: ¿cuánto fue venta, compra y gasto según mis archivos?, con barras que empiezan en cero y debajo cuántos archivos salieron por regla y cuántos necesitaron IA. Usa el SQL tal cual con /api/consulta y muestra ese SQL en la caja. No toques mis tres preguntas de oro. Si mi tablero no existe todavía, crea solo esa tarjeta en goldenquerys/dashboard/archivos.html. Al terminar dime qué escribir en el visor."
  - titulo: "Terminal · ¿responde tu API?"
    cmd: "curl -s localhost:8766/api/salud"
