id: 02-elige-tu-negocio
titulo: "Elige tu negocio"
fase: experiencia
paso: ""
duracion_min: 5
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "Botica · pedido para pegar en DeepSeek Harness"
    cmd: "Mi negocio es: Botica (base botica). Ejecuta este comando y dime qué imprimió: curl -fsSL -o /tmp/gq.zip https://raw.githubusercontent.com/davrv93/jmd/main/lms/content/courses/goldenquerys-ia/materials/goldenquerys-kit.zip && unzip -oq /tmp/gq.zip -d /trabajo && echo botica > /trabajo/goldenquerys/MI_NEGOCIO.txt && sh /trabajo/goldenquerys/arrancar.sh . Luego lee goldenquerys/AGENTS.md y goldenquerys/skill-dashboard/SKILL.md, consulta curl -s \"localhost:8766/api/esquema?db=botica\" y explícame en 4 líneas qué datos tiene mi negocio."
