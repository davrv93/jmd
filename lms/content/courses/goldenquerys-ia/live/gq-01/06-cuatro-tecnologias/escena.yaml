id: 06-cuatro-tecnologias
titulo: "El mismo dato, cuatro tecnologías"
fase: reflexion
paso: ""
duracion_min: 10
lo_logre: true
evidencia: ninguna
umbral_pct: 60
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · pega este pedido"
    cmd: "Toma /trabajo/goldenquerys/consultas/top10-botica.sql y renderízala en 3 tecnologías con los renderers de /trabajo/goldenquerys/renderers: Python (HTML con gráfico SVG), Bun (Markdown y CSV) y Node (JSON). Dime en qué archivo quedó cada salida y qué tecnología usarías para enviarle el reporte a un gerente."
  - titulo: "Python · HTML con gráfico SVG"
    cmd: "cd /trabajo/goldenquerys && python3 renderers/reporte.py botica"
  - titulo: "Bun · Markdown y CSV"
    cmd: "cd /trabajo/goldenquerys && bun renderers/reporte.ts botica"
  - titulo: "Node · JSON"
    cmd: "cd /trabajo/goldenquerys && node renderers/reporte.mjs botica"
