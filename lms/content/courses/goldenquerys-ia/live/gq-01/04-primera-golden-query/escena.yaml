comandos:
  - titulo: "DeepSeek Harness · pega este pedido"
    cmd: "Lee /trabajo/goldenquerys/AGENTS.md. Con la base botica.sqlite responde: ¿qué 10 productos dejaron más soles en 2026 y en qué sede se vendieron más? Escribe la consulta SQL, pruébala con curl contra http://127.0.0.1:8766/api/consulta y guárdala en /trabajo/goldenquerys/consultas/top10-botica.sql con un comentario que explique la pregunta."
  - titulo: "Probar una consulta a mano"
    cmd: "curl -s 'localhost:8766/api/consulta?db=botica&sql=SELECT%20name%20FROM%20sqlite_master%20WHERE%20type%3D%27table%27'"
