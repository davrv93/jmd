id: 02-tu-negocio
titulo: "Tu negocio en marcha"
fase: experiencia
paso: retomar
duracion_min: 5
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · retoma tu negocio de la charla"
    cmd: "Retoma GoldenQuerys. Si no existe /trabajo/goldenquerys, dímelo y no hagas nada más. Si existe: corre sh /trabajo/goldenquerys/arrancar.sh, comprueba curl -s localhost:8766/api/salud, lee goldenquerys/MI_NEGOCIO.txt y goldenquerys/PLAN_TRABAJO.md y dime en 3 líneas: mi negocio, sus 3 tablas clave y qué tareas ya están hechas."
  - titulo: "Nuevo · Botica (pedido para DeepSeek Harness)"
    cmd: "Mi negocio es: Botica (base botica). Ejecuta este comando y dime qué imprimió: curl -fsSL -o /tmp/gq.zip https://raw.githubusercontent.com/davrv93/jmd/main/lms/content/courses/goldenquerys-ia/materials/goldenquerys-kit.zip && unzip -oq /tmp/gq.zip -d /trabajo && echo botica > /trabajo/goldenquerys/MI_NEGOCIO.txt && sh /trabajo/goldenquerys/arrancar.sh . Luego lee goldenquerys/AGENTS.md y goldenquerys/skill-dashboard/SKILL.md, consulta curl -s \"localhost:8766/api/esquema?db=botica\" y explícame en 4 líneas qué datos tiene mi negocio."
