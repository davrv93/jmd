id: 03-preguntas-de-oro
titulo: "Cinco preguntas, eliges tres"
fase: experiencia
paso: preguntas
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "DeepSeek Harness · pedido 1: cinco preguntas de oro"
    cmd: "Tarea T2, primera parte. Lee goldenquerys/MI_NEGOCIO.txt y el esquema con /api/esquema. Propónme 5 preguntas de oro para el dueño de mi negocio, numeradas, una por línea, cada una con la decisión que permite tomar (formato: ¿pregunta?, para decisión). No escribas SQL todavía: espera a que yo elija 3."
  - titulo: "Pedido 2 · elige tres (cambia los __ por tus números)"
    cmd: "Elijo las preguntas __, __ y __. Escribe su SQL, pruébala con curl contra /api/consulta, explícame cada consulta en una línea y guárdalas en goldenquerys/consultas/<negocio>-<tema>.sql con «-- Pregunta:» arriba. Todavía no marques T2: primero la verificamos."
  - titulo: "Terminal · ver tus consultas"
    cmd: "ls /trabajo/goldenquerys/consultas/ && head -n 3 /trabajo/goldenquerys/consultas/*.sql"
