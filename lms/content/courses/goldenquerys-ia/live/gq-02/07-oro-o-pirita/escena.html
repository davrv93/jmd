<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escena · ¿Oro o pirita? La mina de los números</title>
<link rel="icon" href="data:,">
<!--
  «¿Oro o pirita?» · juego de la sesión 1 de GoldenQuerys, sobre el motor Arena JMD (docs/ARENA_JMD.md).
  Cada alumno es un robot minero en la misma mina y ve a los demás moverse en vivo. Las pepitas traen un
  número de la IA con su SQL: brillan igual, sean oro o pirita. Si es oro, llévala a la Bóveda; si es pirita,
  a la Mesa de ensayo, y ahí tocas la línea con la impureza (+5 g). Un error vale 0 g (nunca resta) y la lupa
  te muestra por qué y el número real. Las vagonetas solo te hacen soltar la pepita. La bóveda de la clase
  suma el oro de todos. Al final: tu título, la reflexión al muro (gq02-juego) y tu fotito.
  Servidor: la sala /patio (live_patio.go). Sin instructor (grabación), «Practicar solo» juega en local.
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
  Números reales de las bases del kit (consultas hechas sobre materials/kit/goldenquerys/bases/*.sqlite).
-->
<style>
  html, body { margin: 0; height: 100%; background: #14122b; }
  .sin-motor { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #f3f1ff; font: 500 16px/1.5 system-ui, sans-serif; }
  .sin-motor b { display: block; font-size: 22px; color: #f2c14e; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="juego"><div class="sin-motor"><div><b>Cargando la mina…</b>Si no aparece en unos segundos, recarga la escena.</div></div></div>
<script src="../../arena/arena-jmd.js"></script>
<script>
(function () {
  "use strict";
  if (!window.ArenaJMD) {
    document.getElementById("juego").innerHTML = '<div class="sin-motor"><div><b>El juego se está actualizando</b>Recarga la escena en un minuto. Si sigue igual, avísale al instructor.</div></div>';
    return;
  }

  var NEG = {
    botica: { n: "Botica", c: "#0b8a5f" }, polleria: { n: "Pollería", c: "#c2410c" }, ferreteria: { n: "Ferretería", c: "#475569" },
    academia: { n: "Academia", c: "#5a49d6" }, courier: { n: "Courier", c: "#a4185c" },
  };
  var TIPOS = { anuladas: "lo anulado", join: "el JOIN que duplica", fecha: "la fecha que corta el día", contar: "filas, no personas", orden: "top sin orden", pregunta: "la pregunta cambiada" };

  // ---------- la baraja: b = línea culpable (desde 0) o -1 si es oro; r = el número real ----------
  var CARTAS = [
    { id: "c1", neg: "polleria", q: "¿Cuánto vendimos en 2026?", n: "S/ 423 689,00", b: 2, t: "anuladas", r: "S/ 417 961,30",
      sql: ["SELECT ROUND(SUM(total), 2) AS ventas", "FROM pedidos", "WHERE fecha >= '2026-01-01';"],
      x: "Suma también los 64 pedidos anulados de 2026. Falta: AND estado = 'entregado'." },
    { id: "c2", neg: "botica", q: "¿Cuánto vendimos en agosto de 2026?", n: "S/ 21 076,24", b: 2, t: "join", r: "S/ 9 439,28",
      sql: ["SELECT ROUND(SUM(v.total), 2) AS ventas", "FROM ventas v", "JOIN venta_detalle d ON d.venta_id = v.id", "WHERE v.estado = 'emitida'", "  AND v.fecha >= '2026-08-01' AND v.fecha < '2026-09-01';"],
      x: "Cada venta se suma una vez por cada producto de la boleta. Suma en ventas, sin unirla al detalle." },
    { id: "c3", neg: "botica", q: "¿Cuántas ventas hubo en octubre de 2026?", n: "385", b: 3, t: "fecha", r: "400",
      sql: ["SELECT COUNT(*) AS ventas", "FROM ventas", "WHERE estado = 'emitida'", "  AND fecha BETWEEN '2026-10-01' AND '2026-10-31';"],
      x: "La fecha trae hora: '2026-10-31 18:14' es mayor que '2026-10-31' y el último día se queda fuera. Usa date(fecha)." },
    { id: "c4", neg: "botica", q: "¿Cuántos clientes compraron en octubre de 2026?", n: "241", b: 0, t: "contar", r: "217",
      sql: ["SELECT COUNT(cliente_id) AS clientes", "FROM ventas", "WHERE estado = 'emitida'", "  AND date(fecha) BETWEEN '2026-10-01' AND '2026-10-31';"],
      x: "Cuenta compras, no clientes: quien compró 3 veces suma 3. Usa COUNT(DISTINCT cliente_id)." },
    { id: "c5", neg: "polleria", q: "¿Cuál es el plato más pedido?", n: "1 pollo familiar · 2 560 u.", b: 4, t: "orden", r: "½ pollo con papas · 4 100 u.",
      sql: ["SELECT pl.nombre, SUM(d.cantidad) AS unidades", "FROM pedido_detalle d", "JOIN platos pl ON pl.id = d.plato_id", "GROUP BY pl.nombre", "LIMIT 1;"],
      x: "LIMIT sin ORDER BY corta en cualquier orden (aquí, el alfabético). Falta ORDER BY unidades DESC." },
    { id: "c6", neg: "polleria", q: "¿Cuántos pedidos a domicilio entregamos en octubre?", n: "195", b: 3, t: "pregunta", r: "248",
      sql: ["SELECT COUNT(*) AS pedidos", "FROM pedidos", "WHERE estado = 'entregado'", "  AND canal = 'delivery'", "  AND fecha >= '2026-10-01';"],
      x: "A domicilio también llegan los pedidos de la app. Usa canal IN ('delivery', 'app')." },
    { id: "c7", neg: "ferreteria", q: "¿Cuánto nos deben los clientes a crédito?", n: "S/ 1 760 514,10", b: 0, t: "pregunta", r: "S/ 163 897,15",
      sql: ["SELECT ROUND(SUM(total), 2) AS deuda", "FROM ventas", "WHERE condicion = 'crédito'", "  AND estado = 'emitida';"],
      x: "Suma todo lo vendido a crédito, no lo que falta cobrar. Hay que restar los pagos (la vista v_cuentas_por_cobrar ya lo hace)." },
    { id: "c8", neg: "academia", q: "¿Cuántas cuotas vencidas siguen sin pagar? (al 31-10-2026)", n: "1 641", b: 2, t: "pregunta", r: "723",
      sql: ["SELECT COUNT(*) AS cuotas", "FROM pensiones", "WHERE fecha_pago IS NULL;"],
      x: "Cuenta también las cuotas que aún no vencen. Falta: AND fecha_vencimiento < '2026-10-31'." },
    { id: "c9", neg: "academia", q: "¿Cuántos alumnos tenemos?", n: "2 350", b: 0, t: "contar", r: "1 209",
      sql: ["SELECT COUNT(*) AS alumnos", "FROM matriculas;"],
      x: "Cuenta matrículas: quien siguió 2 ciclos aparece 2 veces. Usa COUNT(DISTINCT alumno_id)." },
    { id: "o1", neg: "botica", q: "¿Qué medio de pago usan más?", n: "Efectivo · 3 565 ventas", b: -1,
      sql: ["SELECT medio_pago, COUNT(*) AS ventas", "FROM ventas", "WHERE estado = 'emitida'", "GROUP BY medio_pago", "ORDER BY ventas DESC;"],
      x: "Filtra lo emitido, agrupa y ordena antes de leer el primero. Es oro." },
    { id: "o2", neg: "polleria", q: "¿Cuál fue el ticket promedio en salón en octubre de 2026?", n: "S/ 71,92", b: -1,
      sql: ["SELECT ROUND(AVG(total), 2) AS ticket", "FROM pedidos", "WHERE estado = 'entregado'", "  AND canal = 'salón'", "  AND date(fecha) BETWEEN '2026-10-01' AND '2026-10-31';"],
      x: "Estado, canal y date(fecha): el 31 entra completo. Es oro." },
    { id: "o3", neg: "courier", q: "¿Cuál es la calificación promedio de los envíos?", n: "4,38 de 5", b: -1,
      sql: ["SELECT ROUND(AVG(puntaje), 2) AS promedio", "FROM calificaciones;"],
      x: "Una calificación por envío, sin repetidos (3 205 filas, 3 205 envíos): AVG promedia bien. Es oro." },
    { id: "o4", neg: "ferreteria", q: "¿Cuánto vendimos al contado en octubre de 2026?", n: "S/ 134 907,73", b: -1,
      sql: ["SELECT ROUND(SUM(total), 2) AS contado", "FROM ventas", "WHERE estado = 'emitida'", "  AND condicion = 'contado'", "  AND date(fecha) BETWEEN '2026-10-01' AND '2026-10-31';"],
      x: "Sin JOIN, con estado y la fecha bien cortada. Es oro." },
    { id: "o5", neg: "academia", q: "¿Cuántos alumnos distintos se matricularon?", n: "1 209", b: -1,
      sql: ["SELECT COUNT(DISTINCT alumno_id) AS alumnos", "FROM matriculas;"],
      x: "DISTINCT cuenta a cada alumno una vez aunque repita ciclo. Es oro." },
    { id: "o6", neg: "botica", q: "¿Cuánto vendimos en septiembre de 2026?", n: "S/ 7 404,90", b: -1,
      sql: ["SELECT ROUND(SUM(total), 2) AS ventas", "FROM ventas", "WHERE estado = 'emitida'", "  AND fecha >= '2026-09-01' AND fecha < '2026-10-01';"],
      x: "Suma en ventas, sin unirla a sus productos, y corta el mes con «menor que» el 1 del siguiente. Es oro." },
    { id: "o7", neg: "courier", q: "¿Qué zona entregó más envíos?", n: "Lima Moderna · 1 449", b: -1,
      sql: ["SELECT z.nombre, COUNT(*) AS envios", "FROM envios e", "JOIN zonas z ON z.id = e.zona_id", "WHERE e.estado = 'entregado'", "GROUP BY z.nombre", "ORDER BY envios DESC;"],
      x: "Este JOIN no duplica: cada envío tiene una sola zona. No todo JOIN es pirita. Es oro." },
  ];
  var VETAS = 9; // pepitas en la mina a la vez

  // ---------- el mapa: 1800 × 1100 ----------
  var ANCHO = 1800, ALTO = 1100;
  var BOVEDA = { id: "boveda", x: 1470, y: 70, w: 270, h: 250, nombre: "Bóveda · oro", color: "#c48709", colorTexto: "#1c1300" };
  var MESA = { id: "mesa", x: 1470, y: 780, w: 270, h: 250, nombre: "Mesa de ensayo · pirita", color: "#6a58e8" };
  var MINA = { x: 70, y: 90, w: 1300, h: 940 }; // donde brotan las pepitas

  function pintarBoveda(g, z, t, resalta) {
    var pulso = resalta ? (Math.sin(t * 5) + 1) / 2 : 0;
    g.save();
    var luz = g.createRadialGradient(z.x + z.w / 2, z.y + z.h / 2, 10, z.x + z.w / 2, z.y + z.h / 2, z.w * .8);
    luz.addColorStop(0, "rgba(242,193,78," + (.28 + pulso * .25) + ")"); luz.addColorStop(1, "rgba(242,193,78,0)");
    g.fillStyle = luz; g.fillRect(z.x - 80, z.y - 80, z.w + 160, z.h + 160);
    g.fillStyle = "#2c2a33"; g.strokeStyle = resalta ? "#ffe27a" : "#c48709"; g.lineWidth = resalta ? 7 : 5;
    rr(g, z.x, z.y, z.w, z.h, 22); g.fill(); g.stroke();
    var cx = z.x + z.w * .42, cy = z.y + z.h * .55, r = 70;
    g.fillStyle = "#4a4652"; g.beginPath(); g.arc(cx, cy, r + 10, 0, 7); g.fill();
    var gr = g.createLinearGradient(cx - r, cy - r, cx + r, cy + r); gr.addColorStop(0, "#ffe9a3"); gr.addColorStop(.5, "#e0a820"); gr.addColorStop(1, "#8a5c00");
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.strokeStyle = "#5c3d00"; g.lineWidth = 4; g.stroke();
    g.save(); g.translate(cx, cy); g.rotate(resalta ? t * 1.5 : 0);
    g.strokeStyle = "#5c3d00"; g.lineWidth = 6; g.lineCap = "round";
    for (var i = 0; i < 6; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(14, 0); g.lineTo(r - 14, 0); g.stroke(); }
    g.fillStyle = "#5c3d00"; g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill();
    g.restore();
    for (var b = 0; b < 3; b++) lingote(g, z.x + z.w - 54, z.y + z.h - 40 - b * 22, 70);
    g.restore();
  }
  function lingote(g, cx, cy, w) {
    var h = w * .34, t = w * .18;
    var gr = g.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2); gr.addColorStop(0, "#ffe9a3"); gr.addColorStop(.5, "#f2c14e"); gr.addColorStop(1, "#a06b00");
    g.fillStyle = gr; g.strokeStyle = "#6b4700"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx - w / 2 + t, cy - h / 2); g.lineTo(cx + w / 2 - t, cy - h / 2); g.lineTo(cx + w / 2, cy + h / 2); g.lineTo(cx - w / 2, cy + h / 2); g.closePath(); g.fill(); g.stroke();
  }
  function pintarMesa(g, z, t, resalta) {
    var pulso = resalta ? (Math.sin(t * 5) + 1) / 2 : 0;
    g.save();
    var luz = g.createRadialGradient(z.x + z.w / 2, z.y + z.h / 2, 10, z.x + z.w / 2, z.y + z.h / 2, z.w * .8);
    luz.addColorStop(0, "rgba(169,156,255," + (.22 + pulso * .25) + ")"); luz.addColorStop(1, "rgba(169,156,255,0)");
    g.fillStyle = luz; g.fillRect(z.x - 80, z.y - 80, z.w + 160, z.h + 160);
    g.fillStyle = "#6b4a2e"; g.strokeStyle = resalta ? "#c3b9ff" : "#6a58e8"; g.lineWidth = resalta ? 7 : 5;
    rr(g, z.x, z.y, z.w, z.h, 22); g.fill(); g.stroke();
    g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 3;
    for (var y = z.y + 30; y < z.y + z.h; y += 34) { g.beginPath(); g.moveTo(z.x + 10, y); g.lineTo(z.x + z.w - 10, y); g.stroke(); }
    // lupa grande
    var cx = z.x + z.w * .45, cy = z.y + z.h * .5;
    g.save(); g.translate(cx, cy); g.rotate(resalta ? Math.sin(t * 3) * .15 : 0);
    g.strokeStyle = "#2b2342"; g.lineWidth = 16; g.lineCap = "round"; g.beginPath(); g.moveTo(40, 40); g.lineTo(88, 88); g.stroke();
    g.fillStyle = "rgba(200,230,255,.35)"; g.beginPath(); g.arc(0, 0, 56, 0, 7); g.fill();
    g.strokeStyle = "#c9ced6"; g.lineWidth = 10; g.stroke();
    g.fillStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.arc(-18, -20, 12, 0, 7); g.fill();
    g.restore();
    // pirita: cubitos grises
    [[z.x + z.w - 60, z.y + 58], [z.x + z.w - 40, z.y + 80], [z.x + 48, z.y + z.h - 48]].forEach(function (p) {
      g.fillStyle = "#c9ced6"; g.strokeStyle = "#4b515c"; g.lineWidth = 2; g.fillRect(p[0] - 11, p[1] - 11, 22, 22); g.strokeRect(p[0] - 11, p[1] - 11, 22, 22);
      g.fillStyle = "#e6e9ee"; g.beginPath(); g.moveTo(p[0] - 11, p[1] - 11); g.lineTo(p[0] - 4, p[1] - 18); g.lineTo(p[0] + 18, p[1] - 18); g.lineTo(p[0] + 11, p[1] - 11); g.closePath(); g.fill(); g.stroke();
    });
    g.restore();
  }
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  // ---------- mi ronda ----------
  var mio = { oro: 0, pirita: 0, coladas: {}, firmadas: 0 };
  function cartaDe(ob) { return CARTAS[ob.carta]; }

  var juego = ArenaJMD.crear({
    raiz: "#juego",
    titulo: "¿Oro o pirita?",
    subtitulo: "La mina de los números: la IA te trae cifras que brillan. Tú decides cuál firmar.",
    curso: "GoldenQuerys con IA",
    sesion: "Sesión 1 · Tus tres preguntas de oro",
    fecha: "Martes 10 de noviembre de 2026",
    hashtag: "#GoldenQuerys",
    duracion: 180, duraciones: [180, 300], duracionPractica: 120,
    mundo: { ancho: ANCHO, alto: ALTO, tema: "mina" },
    jugador: { accesorio: "casco" },
    salida: { x: 80, y: 470, w: 220, h: 200 },
    reglas: [
      "Pasa sobre una pepita: trae un número de la IA y su SQL.",
      "¿Oro? Llévala a la Bóveda. ¿Pirita? A la Mesa de ensayo.",
      "En la mesa, toca la línea con la impureza (+5 g). Errar no resta: la lupa te enseña.",
    ],
    anuncio: "a la mina",
    muros: [
      { x: 470, y: 200, w: 150, h: 110 }, { x: 880, y: 250, w: 120, h: 150 }, { x: 760, y: 790, w: 170, h: 110 },
      { x: 300, y: 830, w: 140, h: 100 }, { x: 1290, y: 470, w: 70, h: 180 },
    ],
    zonas: [Object.assign({ pintar: pintarBoveda }, BOVEDA), Object.assign({ pintar: pintarMesa }, MESA)],
    peligros: [
      { tipo: "vagoneta", nombre: "la vagoneta", ruta: [[1185, 110], [1185, 1000]], vel: 150, radio: 30,
        aviso: "¡La vagoneta te hizo soltar la pepita! Volvió a su veta: búscala otra vez.", avisoSinCarga: "¡Uy, la vagoneta! Cruza el riel cuando pase." },
      { tipo: "vagoneta", nombre: "la vagoneta", ruta: [[360, 600], [1110, 600]], vel: 125, radio: 30,
        aviso: "¡La vagoneta te hizo soltar la pepita! Volvió a su veta.", avisoSinCarga: "¡Uy, la vagoneta! Mira el riel antes de cruzar." },
      { tipo: "roca", nombre: "la roca", ruta: [[1430, 420], [1430, 700]], vel: 110, radio: 24,
        aviso: "¡La roca rodante te hizo soltar la pepita! Rodea por el otro lado.", avisoSinCarga: "¡Cuidado con la roca rodante!" },
    ],
    decor: [
      { tipo: "farol", x: 190, y: 120 }, { tipo: "farol", x: 700, y: 120 }, { tipo: "farol", x: 1100, y: 980 }, { tipo: "farol", x: 520, y: 1010 },
      { tipo: "farol", x: 1600, y: 560 }, { tipo: "cristal", x: 640, y: 300, color: "#7fd8ff" }, { tipo: "cristal", x: 1010, y: 410, color: "#c3a6ff", s: 1.2 },
      { tipo: "cristal", x: 940, y: 900, color: "#7fd8ff", s: .9 }, { tipo: "cristal", x: 440, y: 930, color: "#ffd27a" },
      { tipo: "roca", x: 1060, y: 160 }, { tipo: "roca", x: 230, y: 760, s: 1.3 }, { tipo: "roca", x: 1240, y: 1040 },
      { tipo: "texto", x: 190, y: 720, texto: "ENTRADA", px: 30, color: "rgba(255,230,170,.32)" },
    ],
    objetos: {
      cantidad: VETAS, prefijo: "veta",
      crear: function (i, v, rnd, M) {
        var base = (juego ? juego.ronda().semilla : 0) % CARTAS.length;
        var k = (i * 5 + v * 3 + base) % CARTAS.length;
        var p = M.lugarLibre(rnd, 40, MINA);
        return { x: p.x, y: p.y, forma: "pepita", carta: k, texto: CARTAS[k].n.length > 16 ? CARTAS[k].n.slice(0, 15) + "…" : CARTAS[k].n };
      },
    },
    tarjeta: function (ob) {
      var c = cartaDe(ob), n = NEG[c.neg];
      return { etiqueta: n.n, color: n.c, titulo: c.q, destacadoEtiqueta: "La IA dice", destacado: c.n, lineas: c.sql,
        pie: "¿Oro? → Bóveda (arriba a la derecha). ¿Pirita? → Mesa de ensayo (abajo). Espacio o «Soltar» la deja." };
    },
    entregar: function (ob, zona) {
      var c = cartaDe(ob), esOro = c.b < 0, dijoOro = zona.id === "boveda";
      if (dijoOro) mio.firmadas++;
      if (esOro && dijoOro) { mio.oro++; return { ok: true, puntos: 10, titulo: "¡Oro de verdad! +10 g", explicacion: c.x, feed: "firmó oro en la bóveda" }; }
      if (!esOro && !dijoOro) {
        mio.pirita++;
        return { ok: true, puntos: 10, titulo: "¡Pirita cazada! +10 g", feed: "cazó pirita en la mesa",
          bonus: { pregunta: "Bono: ¿qué línea tiene la impureza?", opciones: c.sql, correcta: c.b, puntos: 5, codigo: true, segundos: 14,
            explicacion: "Impureza: " + TIPOS[c.t] + ". " + c.x + " El número real: " + c.r + (/\.$/.test(c.r) ? "" : ".") } };
      }
      if (esOro) return { ok: false, puntos: 0, titulo: "Era oro", explicacion: c.x + " No todo número raro es pirita.", feed: "revisó oro en la mesa" };
      mio.coladas[c.t] = (mio.coladas[c.t] || 0) + 1;
      return { ok: false, puntos: 0, titulo: "¡Era pirita! Brillaba igual", explicacion: "Impureza: " + TIPOS[c.t] + ". " + c.x, real: "El número real: " + c.r, feed: "aprendió de una pirita" };
    },
    meta: { contador: "boveda", texto: "Bóveda de la clase", unidad: "g", objetivo: function (n) { return Math.max(120, n * 40); }, logro: "la bóveda de la clase está llena" },
    reflexion: { clave: "gq02-juego", pregunta: "¿Qué vas a revisar siempre antes de firmar un número?", placeholder: "Siempre voy a revisar…", porDefecto: "Antes de firmar un número, reviso su SQL." },
    alRonda: function () { mio = { oro: 0, pirita: 0, coladas: {}, firmadas: 0 }; },
    resultado: function (s) {
      var g = juego.puntos, justos = mio.oro + mio.pirita, total = s.entregas;
      var titulo = mio.pirita >= 3 && s.bonus >= 2 ? "Cazapiritas de la mina" : justos >= 5 && s.fallos <= 1 ? "Ojo de ensayador" : justos >= 2 ? "Lupa en mano" : total ? "Primera veta" : "Explorador de la mina";
      var peor = "", n = 0;
      Object.keys(mio.coladas).forEach(function (k) { if (mio.coladas[k] > n) { n = mio.coladas[k]; peor = k; } });
      return { etiqueta: "Mi ronda en la mina", titulo: titulo, resultado: g + " g de oro",
        detalle: justos + " veredictos justos de " + total + " · " + s.bonus + " impurezas cazadas" + (peor ? " · te coló " + TIPOS[peor] : "") };
    },
  });
})();
</script>
</body>
</html>
