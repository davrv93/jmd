id: 08-verifica-tus-tres
titulo: "Tus tres, verificadas"
fase: experimentacion
paso: verificar
duracion_min: 8
lo_logre: true
# La escena registra la evidencia «hallazgo» al tocar qué encontró; la compuerta cuenta eso o «Lo logré».
evidencia: hallazgo
umbral_pct: 60
compuerta: evidencia
dsh: true
comandos:
  - titulo: "DeepSeek Harness · verifica tus tres consultas"
    cmd: "Tarea T2 con verificación. Para cada una de mis 3 consultas de goldenquerys/consultas/: 1) ejecútala con curl contra /api/consulta y dime filas y total; 2) aplica las 3 pruebas: cuenta las filas base sin agrupar, compara el total con una consulta independiente más simple y revisa los bordes (anuladas, fechas con hora, JOIN que duplica, DISTINCT); 3) si una prueba falla, corrige el SQL y explícame en una línea qué impureza tenía; 4) agrega arriba de cada archivo «-- Decisión:» y «-- Contrastado:» con la prueba y su número. NO escribas «-- Verificado:» ni marques T2: eso lo hago yo después de revisar tus números. Termina diciéndome qué debo mirar en cada consulta."
  - titulo: "Terminal · prueba 1: filas base (cambia ventas por tu tabla)"
    cmd: "curl -s \"localhost:8766/api/consulta?db=$(cat /trabajo/goldenquerys/MI_NEGOCIO.txt)\" --get --data-urlencode \"sql=SELECT COUNT(*) FROM ventas\""
  - titulo: "Terminal · prueba 3: ¿hay anuladas?"
    cmd: "curl -s \"localhost:8766/api/consulta?db=$(cat /trabajo/goldenquerys/MI_NEGOCIO.txt)\" --get --data-urlencode \"sql=SELECT estado, COUNT(*) FROM ventas GROUP BY estado\""
  - titulo: "Terminal · ver el plan"
    cmd: "cat /trabajo/goldenquerys/PLAN_TRABAJO.md"
