id: deepseek-orquestador
title: "DeepSeek, el orquestador"
description: >
  Dirige un equipo de agentes de IA con DeepSeek como si fueras director de orquesta: creas subagentes, les
  delegas responsabilidades, reutilizas IA externa cuando conviene, mides el trabajo de cada uno, armas un flujo
  y entregas software de calidad a un buen costo. Dos sesiones en vivo de 75 minutos por Zoom (hora de Lima):
  miércoles 25 de noviembre y miércoles 2 de diciembre de 2026, de 6:30 a 7:45 p. m.
cohorts: [deepseek-orquestador-1]
agenda: {nombre: "DeepSeek, el orquestador", grupo: "Grupo 1", area: agentica, minutos: 75}
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un flujo orquestado con DeepSeek que construye una pieza de software real: subagentes con roles claros, una
  tarea delegada a una IA externa, métricas de tiempo, costo y calidad de cada paso, y el resultado verificado
  con pruebas.
requisitos:
  - Una laptop con internet
  - Una cuenta de DeepSeek con saldo para su API (unos pocos dólares alcanzan)
  - Saber moverte en una terminal (cd, ls, correr un comando)
dedicacion: "2 sesiones en vivo de 75 minutos: mié 25 nov y mié 2 dic, 6:30 a 7:45 p. m. · 2 h 30 min"
# Inscripción: WhatsApp 986 149 476 y /inscripcion/deepseek-orquestador-1/. Precio: S/ 40 (ruleta de descuento en /sorteo-orquestador/).

modules:
  - id: s1
    title: "Sesión 1 · Tu orquesta: subagentes, delegación e IA externa"
    lessons: [dso-01]
  - id: s2
    title: "Sesión 2 · Mide, encadena y entrega software de calidad"
    lessons: [dso-02]
