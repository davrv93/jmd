id: orquestacion-qwen-coder
title: "Orquestación con Qwen Coder"
description: >
  Nuestro curso más avanzado: orquesta varios agentes con Qwen Coder corriendo en tu máquina. Planificador, ejecutores y verificador que se reparten un proyecto real, con contexto acotado y costos medidos. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 15 de noviembre de 8:00 a. m. a 9:15 a. m.; domingo 22 de noviembre de 8:00 a. m. a 9:15 a. m.; domingo 29 de noviembre de 8:00 a. m. a 9:15 a. m.. Inversión: S/ 50.
cohorts: [orquestacion-qwen-coder-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un sistema de agentes orquestados con Qwen Coder que construye y verifica un módulo real de punta a punta, con su bitácora de tareas y métricas de costo.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 50.

modules:
  - id: s1
    title: "Sesión 1 · Arquitectura de orquestación: planificador, ejecutores y verificador con Qwen Coder"
    lessons: [oq-01]
  - id: s2
    title: "Sesión 2 · Herramientas, memoria y contexto acotado: agentes que no se pisan"
    lessons: [oq-02]
  - id: s3
    title: "Sesión 3 · Un proyecto real orquestado de punta a punta, medido y verificado"
    lessons: [oq-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
