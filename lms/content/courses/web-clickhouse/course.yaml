id: web-clickhouse
title: "Dashboards y BI con IA · ClickHouse (modalidad web)"
description: >
  Curso a tu ritmo, en video. Llevas un Excel, CSV, PDF o Word a ClickHouse con Docker, lo limpias
  con reglas de IA comprobando filas y totales, y terminas con un dashboard ejecutivo de ventas.
  Los mismos comandos en Windows y en Mac, con un repositorio listo para levantar.
cohorts: [web-clickhouse]
proyecto_final: >
  Tu dashboard de ventas hecho a partir de tu archivo (o del de ejemplo): cifras clave, ventas por
  mes, sede y categoría, alerta de caída, refresco automático y un usuario de solo lectura para compartirlo.
requisitos:
  - Laptop con Windows 10/11 o Mac, Chrome o Edge y conexión estable
  - Docker Desktop (el video 1 muestra cómo instalarlo, paso a paso)
  - Un archivo tuyo de ventas en Excel, CSV, PDF o Word (opcional; el repositorio trae datos de ejemplo)
  - Sin conocimientos previos de programación ni de bases de datos
dedicacion: "Modalidad web: 15 videos cortos (de 2 a 9 minutos) y un repositorio con todos los ejemplos. Avanzas a tu ritmo."

modules:
  - id: m1
    title: "Parte 1 · De tu archivo a datos confiables"
    lessons: [wch-01]
  - id: m2
    title: "Parte 2 · De tus datos al dashboard ejecutivo"
    lessons: [wch-02]

identidad:
  color: azul
  icono: chart
  frase: "A tu ritmo: de Excel, CSV, PDF o Word a ClickHouse, limpio con IA y convertido en un dashboard para decidir."
  resultado:
    - "Levantar ClickHouse con Docker en Windows o Mac"
    - "Limpiar tus datos con reglas de IA y comprobar filas y totales"
    - "Publicar tu dashboard ejecutivo de ventas y compartirlo sin regalar tu clave"
