id: 15-disena-tu-asistente
titulo: Diseña tu asistente y arma el primer prototipo
fase: experimentacion
paso: disenar
duracion_min: 14
lo_logre: true
evidencia: hallazgo
umbral_pct: 70
compuerta: lo_logre
comandos:
  - {titulo: Crear la carpeta de tu asistente, cmd: "mkdir mi-asistente && cd mi-asistente && git init"}
  - {titulo: Abrir el agente (pega el prompt de la escena), cmd: "opencode"}
  - {titulo: Probar el prototipo, cmd: "node asistente.mjs"}
  - {titulo: "Opcional: modelo local gratis con Ollama", cmd: "ollama pull qwen2.5:3b"}
