id: 05-opencode
titulo: OpenCode y el gateway
fase: experiencia
paso: ""
duracion_min: 13
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: Instalar OpenCode, cmd: "npm i -g opencode-ai"}
  - {titulo: Comprobar la versión, cmd: "opencode --version"}
  - {titulo: "Guardar tu clave en macOS, Linux o WSL (cambia el texto por tu clave)", cmd: "export GATEWAY_API_KEY=\"pega-aqui-tu-clave\""}
  - {titulo: "Guardar tu clave en PowerShell (cambia el texto por tu clave)", cmd: "$env:GATEWAY_API_KEY=\"pega-aqui-tu-clave\""}
  - {titulo: Abrir el agente, cmd: "opencode"}
