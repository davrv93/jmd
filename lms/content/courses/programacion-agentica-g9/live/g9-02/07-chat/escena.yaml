id: 07-chat
titulo: "Construir 1: el chat"
fase: experiencia
paso: construir
duracion_min: 15
lo_logre: true
evidencia: automatica
umbral_pct: 80
compuerta: evidencia
comandos:
  - {titulo: "1 · Copia tu asistente (o el ejemplo de la cafetería)", cmd: "mkdir -p /trabajo/negocio && cd /trabajo/negocio && cp /opt/skills-curso/s2-robo-estilos/motor/ejemplos/cafeteria.json asistente.json"}
  - {titulo: "2 · Ármalo con un estilo", cmd: "cd /trabajo/negocio && python3 /opt/skills-curso/s2-robo-estilos/motor/construir.py --asistente asistente.json --estilo neon"}
  - {titulo: "3 · Arráncalo", cmd: "sh /trabajo/mi-robo/robo.sh reiniciar"}
  - {titulo: Comprobar la salud, cmd: "curl -s localhost:8766/api/salud"}
  - {titulo: "Abrir en el visor: mi-robo/neon/index.html", cmd: ""}
