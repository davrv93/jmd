id: programacion-agentica-g9
title: "Programación agéntica · Grupo 9"
description: >
  De una landing real a un chatbot web y, finalmente, el mismo bot respondiendo por WhatsApp.
  Construyes con un agente (OpenCode) y validas cada cambio.
  Cierre: conectas tu backend a Evolution Go y mides tiempos con pruebas reales.
cohorts: [grupo-9]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  La landing de tu negocio con un chatbot web embebido y el mismo chatbot atendiendo por WhatsApp
  con Evolution Go, usando un solo faq.json y un solo backend. Lo pruebas con gente real y mides
  tiempos de respuesta.
requisitos:
  - Una laptop con Windows, macOS o Linux (el instalador del curso prepara las tres)
  - Una cuenta de GitHub, GitLab o Forgejo para entregar los proyectos
  - Un número de WhatsApp de pruebas para la clase 3
# dedicacion: "3 clases en vivo de 2 h y unas [X] h de práctica por semana"   # completar y descomentar

modules:
  - id: fundamentos
    title: "Módulo 1 · Tu landing con IA"
    lessons: [g9-01]
  - id: construir
    title: "Módulo 2 · Chatbot básico web"
    lessons: [g9-02]
  - id: producto
    title: "Módulo 3 · Tu chatbot en WhatsApp con Evolution Go"
    lessons: [g9-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Programación agéntica", grupo: "Grupo 9", area: agentica, minutos: 120}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: violeta
  icono: bot
  nivel: "Desde cero"
  frase: "Construye con un agente de IA al lado: tú decides, el agente escribe y tú verificas con pruebas."
  resultado:
    - "Publicar una landing clara, rápida y lista para celular"
    - "Agregar un chatbot web que responde primero desde tu FAQ"
    - "Conectar el mismo backend a WhatsApp con Evolution Go y medir tiempos"
