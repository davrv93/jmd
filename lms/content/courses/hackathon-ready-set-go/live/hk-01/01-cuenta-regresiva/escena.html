:root { --f: #000; --t: #fff; --disp: "LG", "League Gothic", "Bebas Neue", Impact, "Arial Narrow", sans-serif; --mono: "JB", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-tema="dark"]) { --f: #fff; --t: #000; color-scheme: light; } }
:root[data-tema="light"] { --f: #fff; --t: #000; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--f); color: var(--t); overflow: hidden; font: 700 14px/1.35 var(--mono); }
.fondo, .capa { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.fondo polygon { fill: var(--t); }
.mono { font-family: var(--mono); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
/* El texto va en «difference»: blanco sobre negro y negro sobre blanco, cruce o no el triángulo. */
.dif { mix-blend-mode: difference; color: #fff; }

.esc { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center;
  gap: 2vw; padding: clamp(14px, 4vh, 40px) clamp(16px, 4vw, 56px); }
.txt { position: relative; z-index: 1; min-width: 0; }
.txt p { margin: 0; }
.ante { font-size: clamp(10px, 1.1vw + .6vh, 15px); letter-spacing: .32em; }
h1 { margin: .12em 0 0; font: 400 clamp(46px, min(9.5vw, 21vh), 168px)/.84 var(--disp); letter-spacing: .01em; text-transform: uppercase; }
h1 .sub { display: block; font-size: .5em; letter-spacing: .04em; }
.reto { margin-top: .9em !important; font-size: clamp(10px, .9vw + .5vh, 14px); }
.cuenta { margin-top: clamp(10px, 3.4vh, 30px); }
.estado { font-size: clamp(10px, 1vw + .6vh, 16px); letter-spacing: .3em; }
.reloj { font: 400 clamp(48px, min(8.6vw, 19vh), 150px)/.9 var(--disp); white-space: nowrap; text-transform: uppercase; }
.reloj .u { font-size: .46em; letter-spacing: .04em; margin: 0 .28em 0 .1em; }
.reloj .n { display: inline-block; width: .43em; text-align: center; }
.reloj .s { display: inline-block; width: .2em; text-align: center; }
.ahora { min-height: 1.35em; margin-top: .7em !important; font-size: clamp(10px, .9vw + .45vh, 14px); }
.datos { list-style: none; margin: clamp(8px, 2.4vh, 22px) 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5em .6em; font-size: clamp(10px, .85vw + .45vh, 14px); }
.datos li { border: 2px solid #fff; padding: .45em .6em; }
.req { margin-top: .9em !important; font-size: clamp(9px, .7vw + .4vh, 12px); opacity: .9; }

.ventana { position: relative; z-index: 2; margin: 0; justify-self: center; width: min(100%, 84vh); aspect-ratio: 1; }
.clip { position: absolute; inset: -9%; clip-path: polygon(50% 50%, 50% 50%, 50% 50%); background: #10161a; }
.clip img, .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.clip video { opacity: 0; transition: opacity .3s; }
.clip video.va { opacity: 1; }
.tag { position: absolute; left: 6%; top: 2%; z-index: 3; font-size: clamp(10px, .8vw + .5vh, 14px); padding: .4em .7em; border: 2px solid var(--t); background: var(--f); color: var(--t); }

.capa { z-index: 3; overflow: visible; }
.capa .borde { fill: none; stroke: var(--t); stroke-width: 5; stroke-linejoin: miter; }
.capa .v { fill: var(--t); }
.capa .vi { fill: var(--f); }
.capa text { font: 700 11px var(--mono); fill: var(--t); letter-spacing: .04em; }
.capa .estela { fill: none; stroke: var(--t); stroke-width: 2.5; stroke-dasharray: 3 9; stroke-linecap: round; }
.capa .flecha { stroke: var(--t); stroke-width: 4; fill: none; }
.capa .punta { fill: var(--t); }
.capa .eti rect { fill: var(--f); stroke: var(--t); stroke-width: 2; }
.medida { position: fixed; left: clamp(16px, 4vw, 56px); bottom: clamp(8px, 2vh, 18px); z-index: 1; margin: 0; font-size: 10px; letter-spacing: .06em; padding-bottom: 5px; border-bottom: 2px solid #fff; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Angosto o vertical: la ventana arriba y la cuenta abajo. */
@media (max-aspect-ratio: 11/10), (max-width: 640px) {
  .esc { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-items: start; justify-items: center; text-align: center; gap: 1.6vh; padding-top: 3vh; }
  .ventana { order: -1; width: min(72vw, 40vh); }
  .txt { align-self: center; }
  .ante { letter-spacing: .24em; }
  h1 { font-size: clamp(42px, min(13vw, 9vh), 120px); }
  .reloj { font-size: clamp(42px, min(14vw, 9.5vh), 130px); }
  .datos { justify-content: center; }
  .medida { display: none; }
}
@media (max-aspect-ratio: 11/10) and (max-height: 620px), (max-width: 640px) and (max-height: 620px) { .ante { display: none; } }
@media (max-height: 640px) { .medida { display: none; } }
@media (prefers-reduced-motion: reduce) { .clip video { display: none; } }
</style>

  var marcas = [];
  for (var i = 0; i < 3; i++) {
    var g = document.createElementNS(NS, "g"), r1 = document.createElementNS(NS, "rect"), r2 = document.createElementNS(NS, "rect"), tx = document.createElementNS(NS, "text");
    r1.setAttribute("class", "v"); r1.setAttribute("x", -8); r1.setAttribute("y", -8); r1.setAttribute("width", 16); r1.setAttribute("height", 16);
    r2.setAttribute("class", "vi"); r2.setAttribute("x", -3.5); r2.setAttribute("y", -3.5); r2.setAttribute("width", 7); r2.setAttribute("height", 7);
    g.appendChild(r1); g.appendChild(r2); g.appendChild(tx); verts.appendChild(g); marcas.push([g, tx]);
  }
  function pintar(seg) {
    // 1 · el triángulo grande del fondo, del color contrario, que gira despacio
    var angosto = W / H < 1.1 || W <= 640, R = angosto ? Math.max(W, H) * 0.62 : W * 0.5;
    var gx = angosto ? W * 0.18 : W * 0.12, gy = angosto ? H * 0.98 : H * 0.88;
    gran.setAttribute("points", pts(tri(gx, gy, R, 28 + 7 * Math.sin(seg / 7))));
    // 2 · la ventana triangular con la chilena
    var s = V.width, r = s * 0.57, rot = 6 * Math.sin(seg / 3.1);
    var cx = V.left + s / 2, cy = V.top + s * 0.6;
    var p = tri(cx, cy, r, rot);
    clip.style.clipPath = "polygon(" + p.map(function (q) { return (q[0] - C.left).toFixed(1) + "px " + (q[1] - C.top).toFixed(1) + "px"; }).join(",") + ")";
    borde.setAttribute("points", pts(p));
    for (var k = 0; k < 3; k++) {
      var m = marcas[k], x = p[k][0], y = p[k][1], dx = x - cx, dy = y - cy;
      m[0].setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");
      // la etiqueta, afuera del triángulo: el vértice de arriba la lleva a su derecha; los de abajo, debajo y hacia el centro
      var abajo = dy > 0, der = abajo ? dx < 0 : x < W - 170;
      m[1].setAttribute("x", abajo ? (der ? -6 : 6) : (der ? 14 : -14)); m[1].setAttribute("y", abajo ? 24 : -10);
      m[1].setAttribute("text-anchor", der ? "start" : "end");
      m[1].textContent = "ABC"[k] + (angosto ? " " : "(" + Math.round(x) + "," + Math.round(y) + ") ") + "60.0°";
    }
    medida.textContent = "[13] r = " + Math.round(r) + "  L = " + Math.round(r * Math.sqrt(3)) + " px";
  }

  // El balón: sale del pie en el instante del remate (lo marca el clip) y deja su estela.
  var balon = $("balon"), gajos = $("gajos"), estela = $("estela"), vec = $("vec"), flecha = $("flecha"), punta = $("punta"), eti = $("eti");
  var GOLPE = 1.6, VUELO = 1.15, salida = -1, tPrevio = 0;
  function curva(u) {
    var sx = C.left + C.width * 0.5, sy = C.top + C.height * 0.3;
    var ex = W + 80, ey = Math.min(H * 0.9, sy + H * 0.12);
    var kx = sx + (ex - sx) * 0.45, ky = sy - H * 0.28;
    var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * sx + b * kx + c * ex, a * sy + b * ky + c * ey];
  }
  function vuelo(u) {
    if (u < 0 || u > 1) { balon.setAttribute("opacity", 0); vec.setAttribute("opacity", 0); estela.setAttribute("d", ""); return; }
    var e = 1 - Math.pow(1 - u, 1.6), b = curva(e), d = "M";
    for (var i = 0; i <= 16; i++) { var q = curva(e * i / 16); d += (i ? " L" : "") + q[0].toFixed(1) + " " + q[1].toFixed(1); }
    estela.setAttribute("d", d);
    balon.setAttribute("opacity", 1);
    balon.setAttribute("transform", "translate(" + b[0].toFixed(1) + "," + b[1].toFixed(1) + ")");
    gajos.setAttribute("transform", "rotate(" + (e * 540).toFixed(0) + ")");
    // el vector de velocidad, como en el video, en la primera mitad del vuelo
    var o = curva(Math.max(0, e - 0.04)), ang = Math.atan2(b[1] - o[1], b[0] - o[0]), L = 70 + 40 * (1 - u);
    var fx = b[0] + Math.cos(ang) * (24 + L), fy = b[1] + Math.sin(ang) * (24 + L);
    flecha.setAttribute("x1", (b[0] + Math.cos(ang) * 24).toFixed(1)); flecha.setAttribute("y1", (b[1] + Math.sin(ang) * 24).toFixed(1));
    flecha.setAttribute("x2", fx.toFixed(1)); flecha.setAttribute("y2", fy.toFixed(1));
    punta.setAttribute("points", pts([[fx + Math.cos(ang) * 14, fy + Math.sin(ang) * 14], [fx + Math.cos(ang + 2.5) * 14, fy + Math.sin(ang + 2.5) * 14], [fx + Math.cos(ang - 2.5) * 14, fy + Math.sin(ang - 2.5) * 14]]));
    // la etiqueta va sobre la punta de la flecha, lejos del balón y del vértice de arriba
    eti.setAttribute("transform", "translate(" + Math.min(W - 64, Math.max(64, fx)).toFixed(1) + "," + Math.min(H - 20, Math.max(20, fy + (fy < 70 ? 36 : -32))).toFixed(1) + ")");
    vec.setAttribute("opacity", u < 0.75 ? 1 : Math.max(0, (1 - u) * 4));
  }

  medir();
  addEventListener("resize", function () { medir(); if (quieto) quietud(); });
  function quietud() { pintar(0); vuelo(0.42); }
  if (quieto) { quietud(); return; }

  // El clip va como material de la sesión; si no carga, queda el póster y el balón sale con su propio reloj.
  var clipOk = false;
  vid.addEventListener("playing", function () { clipOk = true; vid.classList.add("va"); });
  vid.addEventListener("loadedmetadata", function () { vid.playbackRate = 0.62; });
  vid.addEventListener("error", function () { clipOk = false; vid.remove(); });
  vid.src = "/files/hackathon-ready-set-go/materials/chilena-loop.mp4";
  var p = vid.play(); if (p && p.catch) p.catch(function () {});

  var t0 = performance.now();
  function cuadro(now) {
    var seg = (now - t0) / 1000;
    pintar(seg);
    if (clipOk) {
      var ct = vid.currentTime;
      if (tPrevio < GOLPE && ct >= GOLPE) salida = seg;
      tPrevio = ct;
    } else if (seg > 1.6 && (salida < 0 || seg - salida > 3.4)) salida = seg;
    vuelo(salida < 0 ? -1 : (seg - salida) / VUELO);
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
})();
</script>
