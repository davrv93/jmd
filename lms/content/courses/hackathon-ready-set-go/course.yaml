id: hackathon-ready-set-go
title: "⚽ Hackathon Ready Set Go! — videojuegos con IA"
description: >
  Una tarde para crear, probar y presentar tu videojuego de fútbol hecho con IA. Domingo 13 de
  diciembre, de 1:30 a 7:15 p. m. (hora de Lima). El mejor juego se lleva S/ 280. Entra a la
  sesión para ver la cuenta regresiva, el cronograma y las bases.
cohorts: [hackathon-rsg-1]
# Portada del curso: la cuenta regresiva con los triángulos y la chilena. Solo la muestra un LMS que ya
# soporte «portada:» (requiere build + reinicio); los anteriores ignoran la clave. Mientras tanto, la
# misma página va embebida en la sesión hk-01 y es la primera escena de su LIVE.
portada: live/hk-01/01-cuenta-regresiva/escena.html
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu videojuego de fútbol hecho con IA, probado y presentado ante el jurado, con su código en un
  repositorio público.
requisitos:
  - Haber llevado un curso con JMD Learning (si te inscribiste a Curso + Hackathon, ya lo cumples)
  - Tu propia IA (se permite usar IA; cada participante usa la suya)
  - Una laptop con navegador y una cuenta en jmd-learn.online
dedicacion: "Domingo 13 de diciembre, 1:30 a 7:15 p. m. (hora de Lima) · premio S/ 280"
# Inscripción: jmd-learn.online/readysetgo/ (hackathon S/ 30, curso + hackathon S/ 40), por WhatsApp al +51 939 602 914.

modules:
  - id: h1
    title: "Hackathon · domingo 13 de diciembre"
    lessons: [hk-01]

