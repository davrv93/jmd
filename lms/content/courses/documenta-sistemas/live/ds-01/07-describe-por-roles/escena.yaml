id: 07-describe-por-roles
titulo: "Describe por roles y levanta la matriz"
fase: experimentacion
paso: roles
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "Aula · dejar la skill junto a tu sistema (si no está)"
    cmd: "mkdir -p /trabajo/sistema/skills && cp -R /opt/skills-curso/foto-del-sistema /trabajo/sistema/skills/"
  - titulo: "Pedido para DeepSeek Harness (web o aula dsh)"
    cmd: "Lee AGENTS.md y skills/foto-del-sistema/SKILL.md. Abre la foto (FOTO/FOTO.md y FOTO/FOTO.json), no releas el árbol. Copia motor/plantillas/DESCRIPCION_POR_ROLES.md a docs/DESCRIPCION_POR_ROLES.md y llénala con la matriz de permisos de la foto (seccion 8): por cada rol, incluido el auditor de solo lectura, que pantallas ve, que crea, edita, elimina, emite, anula o ejecuta, y que NO puede. Cita cada afirmacion con archivo:linea. Lo que salga solo de un patron, marcalo «por verificar». No inventes rutas ni permisos. No imprimas ninguna clave."
  - titulo: "Lo mismo desde la terminal del aula"
    cmd: "aula dsh \"Lee AGENTS.md y skills/foto-del-sistema/SKILL.md, abre la foto y llena docs/DESCRIPCION_POR_ROLES.md con la matriz (seccion 8), rol por rol, citando archivo:linea. No inventes.\""
