id: 06-verifica-cinco
titulo: "Verifica 5 afirmaciones del banco"
fase: experimentacion
paso: verificar
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Ver el banco de verificación de tu foto"
    cmd: "sed -n '/Banco de verificación/,$p' FOTO/FOTO.md"
  - titulo: "Comprobar una afirmación (cambia el rango y el archivo)"
    cmd: "sed -n '20,26p' js/seguridad.js"
  - titulo: "Anotar lo que coincidió"
    cmd: "$EDITOR docs/DUDAS_VERIFICABLES.md"
