id: 08-audita-seguridad
titulo: "Audita los 14 mecanismos de seguridad"
fase: experimentacion
paso: seguridad
duracion_min: 10
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "Pedido para DeepSeek Harness (web o aula dsh)"
    cmd: "Lee AGENTS.md y skills/foto-del-sistema/SKILL.md. Copia motor/plantillas/AUDITORIA_SEGURIDAD.md a docs/AUDITORIA_SEGURIDAD.md. Para cada uno de los 14 mecanismos de la foto (seccion 10), abre el archivo:linea de la evidencia y confirma o corrige su estado (presente / debil / no encontrado), con riesgo, recomendacion y como verificarlo. Revisa los hallazgos (seccion 12): descarta los falsos positivos y di por que. Cita archivo:linea en cada fila. No inventes. No imprimas ninguna clave."
  - titulo: "Comprobar a mano un mecanismo (ej. eval / new Function)"
    cmd: "grep -n 'eval(\\|new Function' js/*.js"
  - titulo: "Comprobar la CSP del index"
    cmd: "grep -ni 'content-security-policy' index.html"
