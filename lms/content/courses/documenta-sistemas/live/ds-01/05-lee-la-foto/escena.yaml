id: 05-lee-la-foto
titulo: "Lee la foto por secciones (no el árbol)"
fase: conceptualizacion
paso: leer
duracion_min: 9
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Abrir la foto"
    cmd: "sed -n '1,40p' FOTO/FOTO.md"
  - titulo: "Saltar a una sección sin leer todo (ej. la matriz)"
    cmd: "grep -n '## ' FOTO/FOTO.md"
  - titulo: "Sacar un dato exacto del JSON (ej. las fórmulas)"
    cmd: "grep -n 'formula' FOTO/FOTO.json"
