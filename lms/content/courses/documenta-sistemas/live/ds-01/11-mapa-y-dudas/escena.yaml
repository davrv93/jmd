id: 11-mapa-y-dudas
titulo: "Dibuja el mapa y anota dudas verificables"
fase: experimentacion
paso: mapa
duracion_min: 7
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
dsh: true
comandos:
  - titulo: "Pedido para DeepSeek Harness (web o aula dsh)"
    cmd: "Lee la foto (FOTO/FOTO.md). Copia motor/plantillas/MAPA_DEL_SISTEMA.md a docs/MAPA_DEL_SISTEMA.md y complétalo con las capas, los modulos y un diagrama Mermaid del flujo principal (login -> guardia de ruta -> pantalla -> capa de datos -> almacenamiento). Luego copia motor/plantillas/DUDAS_VERIFICABLES.md a docs/DUDAS_VERIFICABLES.md y anota hasta 10 afirmaciones dudosas, cada una con como comprobarla (un sed -n o grep -n) y su resultado. Cita archivo:linea. Una duda sin forma de comprobarse no va. No inventes."
  - titulo: "Ver las rutas y su archivo:linea en la foto"
    cmd: "grep -n 'Rutas\\|#/' FOTO/FOTO.md"
