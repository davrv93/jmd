id: documenta-sistemas
title: "Documenta y audita sistemas con IA · la foto del sistema"
description: >
  Heredas un sistema web (una SPA de HTML, CSS y JavaScript) que nadie documentó y tienes que entenderlo,
  describirlo y auditarlo sin leerte todo el código. Aprendes el método de la «foto del sistema»: un script
  deja un inventario verificable y reproducible —el mismo resultado con el mismo código— y tú lees la foto,
  no el árbol, para ahorrar contexto. Describes el sistema por roles, levantas la matriz de permisos, auditas
  los 14 mecanismos de seguridad con evidencia archivo:línea, dibujas el mapa del sistema, verificas cada
  afirmación contra el código y distingues hecho, pista y opinión. En clase documentas uno de los 15 sistemas
  de práctica desde tu aula del LIVE, sin instalar ni crear cuentas. Es el paso siguiente natural después de
  tomar tu primera foto en DeepSeek Harness, pero aquí el tema es el oficio de documentar y auditar, no la
  cuenta ni el consumo.
cohorts: [documenta-sistemas-1]

# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  El paquete de documentación comprobable de un sistema de práctica: su «foto» (FOTO.md, FOTO.json y
  hashes.txt), la descripción por roles con su matriz de permisos, la auditoría de los 14 mecanismos de
  seguridad con estado y evidencia archivo:línea, el mapa del sistema con diagramas Mermaid y una lista de
  dudas verificables, cada afirmación citada contra el código y marcada como hecho, pista u opinión.
requisitos:
  - Saber moverte en una terminal (cd, ls, correr un comando)
  - "Un navegador para entrar a tu aula del LIVE: trae Node 24, DeepSeek Harness y los 15 sistemas de práctica; no instalas nada"
  - Leer código con calma y curiosidad; no hace falta dominar ningún framework
  - Haber tomado una «foto» antes ayuda, pero no es obligatorio
dedicacion: "1 clase en vivo de 90 minutos (horario por confirmar) · trabajo de documentación en casa sobre tu sistema de práctica"

modules:
  - id: s1
    title: "Sesión 1 · La foto, la lectura por secciones y la auditoría con evidencia"
    lessons: [ds-01]
  - id: s2
    title: "Sesión 2 · (por confirmar) Describe por roles y audita a fondo un sistema más grande"
    lessons: []
  - id: s3
    title: "Sesión 3 · (por confirmar) Mantén la documentación: vuelve a fotografiar y compara huellas"
    lessons: []

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Documenta sistemas", grupo: "Grupo 1", area: agentica, minutos: 90}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: petroleo
  icono: search
  frase: "Entiende, describe y audita un sistema web que nadie documentó, sin leerte todo el código."
  resultado:
    - "Sacar la «foto» verificable de un sistema"
    - "Describirlo por roles con su matriz de permisos"
    - "Auditar sus mecanismos de seguridad con evidencia archivo:línea"
