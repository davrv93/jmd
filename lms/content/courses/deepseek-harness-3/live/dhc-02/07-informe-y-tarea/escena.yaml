id: 07-informe-y-tarea
titulo: "Tarea: informe de consumo y rutina"
fase: experimentacion
paso: entregar
duracion_min: 8
lo_logre: false
evidencia: ninguna
compuerta: ninguna
comandos:
  - titulo: "Aula · Corrida real con su RESUMEN DE USO guardado (tiempo, llamadas y tokens)"
    cmd: "cd /trabajo/sistema && aula dsh \"<tu tarea>\" | tee docs/medicion/B.txt"
  - titulo: "Laptop · Medir también CPU y RAM de una corrida real (macOS; en Linux usa -v)"
    cmd: "/usr/bin/time -l npx @deepseek-ai/dsh --profile headless --json \"<tu tarea>\" > docs/medicion/B.jsonl 2> docs/medicion/B.time.txt"
  - titulo: "Subir el informe, la rutina y las mediciones a tu repo"
    cmd: "git add docs/ && git commit -m \"sesión 2: consumo medido A/B y rutina\""
