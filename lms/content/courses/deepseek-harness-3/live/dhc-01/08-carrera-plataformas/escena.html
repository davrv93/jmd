<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla Gomita · carrera de plataformas</title>
<!-- Carrera de plataformas multijugador del modo LIVE (hasta 15). Juego original de JMD Learning.
     Red: la API de carrera del LMS (/api/v1/live/<lección>/carrera…). El servidor guarda quién corre,
     su avance (dist 0–840) y su llegada; cada cliente simula su personaje. La API cierra el estado a los
     60 s, pero /paso y /fin siguen aceptando datos: la duración real la manda el cliente (hasta 7 min).
     Autocontenida: para usarla en otra lección basta copiar esta carpeta (la lección sale de la URL).
     ?demo=1 juega sin red con bots (&auto=1 piloto automático, &vel=N acelera, &ver=espera|gane|podio). -->
<style>
:root { --tinta:#3b2f4a; --suave:#7a6a8c; --rosa:#ff8fb1; --menta:#7fe0b8; --lila:#b9a6ff; --crema:#fff8ef; --sol:#ffd166; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:linear-gradient(180deg,#f3ecff 0%,#ffeef3 100%); color:var(--tinta); font-family:"Nunito","Avenir Next",system-ui,-apple-system,sans-serif; overflow:hidden; }
.app { height:100%; display:flex; flex-direction:column; gap:8px; padding:10px; }
.cab { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.cab h1 { font-size:clamp(16px,2.4vw,24px); font-weight:900; letter-spacing:-.01em; }
.cab h1 em { font-style:normal; color:#e5609a; }
.cab .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.chip { background:#fff; border:2px solid #eadff7; border-radius:99px; padding:4px 10px; font-weight:800; font-size:13px; white-space:nowrap; }
.chip.btn { cursor:pointer; }
/* mapa de progreso */
.mapa { position:relative; height:54px; background:#fff; border:2px solid #eadff7; border-radius:16px; padding:0 34px; flex:0 0 auto; }
.mapa .via { position:absolute; left:34px; right:34px; top:30px; height:8px; border-radius:99px; background:repeating-linear-gradient(90deg,#ffd6e6 0 14px,#ffe9f1 14px 28px); }
.mapa .ini, .mapa .fin { position:absolute; top:18px; font-size:20px; }
.mapa .ini { left:8px; } .mapa .fin { right:6px; }
.mapa .cabeza { position:absolute; top:6px; width:30px; height:30px; transform:translateX(-50%); transition:left .9s linear; }
.mapa .cabeza canvas { width:30px; height:30px; display:block; filter:drop-shadow(0 2px 2px rgba(80,40,90,.25)); }
.mapa .cabeza b { position:absolute; top:31px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:900; background:#fff; border-radius:6px; padding:0 3px; white-space:nowrap; color:var(--suave); }
.mapa .cabeza.yo { z-index:5; } .mapa .cabeza.yo canvas { outline:3px solid #e5609a; border-radius:50%; background:#fff; }
.mapa .cabeza.yo b { color:#e5609a; }
/* escenario */
.marco { position:relative; flex:1 1 auto; min-height:0; display:grid; place-items:center; }
.marco canvas#cv { display:block; border-radius:18px; box-shadow:0 10px 30px -12px rgba(120,70,140,.45); background:#cfe8ff; touch-action:none; }
.capa { position:absolute; inset:0; display:grid; place-items:center; padding:12px; pointer-events:none; }
.capa > .tarjeta { pointer-events:auto; }
.tarjeta { background:rgba(255,248,239,.96); border:3px solid #fff; border-radius:24px; box-shadow:0 16px 40px -14px rgba(120,70,140,.5); padding:18px 20px; text-align:center; max-width:560px; width:100%; max-height:100%; overflow:auto; }
.tarjeta h2 { font-size:clamp(20px,3.2vw,30px); font-weight:900; margin-bottom:4px; }
.tarjeta p { color:var(--suave); font-weight:700; font-size:14px; margin-bottom:10px; }
.avatares { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px auto 12px; max-width:420px; }
.avatares button { aspect-ratio:1; border:3px solid #eadff7; border-radius:16px; background:#fff; cursor:pointer; padding:2px; }
.avatares button canvas { width:100%; height:100%; display:block; }
.avatares button[aria-pressed="true"] { border-color:#e5609a; background:#ffeef5; transform:translateY(-2px); }
.boton { font:900 16px/1 inherit; font-family:inherit; padding:13px 20px; min-height:48px; border:0; border-radius:14px; background:linear-gradient(180deg,#ff9cbd,#ff7aa6); color:#fff; cursor:pointer; box-shadow:0 4px 0 #d9547f; }
.boton:active { transform:translateY(2px); box-shadow:0 2px 0 #d9547f; }
.boton.sec { background:#fff; color:var(--tinta); box-shadow:0 4px 0 #e2d6f2; border:2px solid #eadff7; }
.boton:focus-visible, .chip.btn:focus-visible, .avatares button:focus-visible { outline:3px solid #6d5bd0; outline-offset:2px; }
.acciones { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.lista { list-style:none; display:grid; gap:4px; margin:6px auto 12px; max-width:340px; text-align:left; font-weight:800; font-size:14px; }
.lista li { display:grid; grid-template-columns:26px 28px 1fr auto; gap:8px; align-items:center; background:#fff; border-radius:10px; padding:4px 8px; }
.lista li.yo { background:#ffe3ee; }
.lista li canvas { width:28px; height:28px; }
.fichas { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:4px auto 12px; max-width:480px; }
.ficha { display:inline-flex; align-items:center; gap:4px; background:#fff; border-radius:99px; padding:2px 10px 2px 3px; font-weight:800; font-size:13px; border:2px solid #eadff7; }
.ficha.yo { border-color:#e5609a; color:#e5609a; }
.ficha canvas { width:22px; height:22px; }
.lista em { font-style:normal; color:var(--suave); font-size:12px; }
.podio { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:6px 0 10px; }
.podio div { width:88px; text-align:center; font-weight:900; font-size:12px; }
.podio canvas { width:56px; height:56px; display:block; margin:0 auto 2px; }
.podio i { display:block; border-radius:12px 12px 4px 4px; color:#fff; font-style:normal; font-size:22px; padding-top:6px; }
.premio { background:linear-gradient(135deg,#fff3c4,#ffe0ee); border:2px dashed #ffb3c9; border-radius:16px; padding:12px; margin:8px 0 12px; font-weight:900; }
.premio big { display:block; font-size:30px; color:#e5609a; }
.grande { font-size:clamp(60px,12vw,120px); font-weight:900; color:#e5609a; line-height:1; text-shadow:0 6px 0 #fff; }
/* controles táctiles */
.tactil { display:none; justify-content:space-between; gap:10px; flex:0 0 auto; }
.tactil .grupo { display:flex; gap:10px; }
.tactil button { width:76px; height:64px; border-radius:18px; border:3px solid #fff; background:#ffffffcc; font-size:28px; font-weight:900; color:var(--tinta); box-shadow:0 4px 0 #e2d6f2; touch-action:none; user-select:none; -webkit-user-select:none; }
.tactil button.saltar { width:120px; background:linear-gradient(180deg,#ffb3cb,#ff8fb1); color:#fff; }
@media (pointer:coarse), (max-width:760px) { .tactil { display:flex; } }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="cab">
    <h1>Isla Gomita · <em>carrera de plataformas</em></h1>
    <div class="chips">
      <span class="chip" id="c-vidas" aria-label="Vidas">❤️❤️❤️</span>
      <span class="chip" id="c-estrellas">⭐ 0</span>
      <span class="chip" id="c-tiempo">0:00</span>
      <span class="chip" id="c-puesto" role="status" aria-live="polite">—</span>
      <button class="chip btn" id="c-sonido" aria-label="Sonido">🔊</button>
    </div>
  </div>
  <div class="mapa" id="mapa" aria-label="Mapa de progreso">
    <span class="ini">🌱</span><div class="via"></div><span class="fin">🌈</span>
  </div>
  <div class="marco" id="marco">
    <canvas id="cv" aria-label="Juego de plataformas"></canvas>
    <div class="capa" id="capa"><div class="tarjeta" id="tarjeta"></div></div>
  </div>
  <div class="tactil" id="tactil">
    <div class="grupo"><button id="t-izq" aria-label="Izquierda">◀</button><button id="t-der" aria-label="Derecha">▶</button></div>
    <button class="saltar" id="t-saltar" aria-label="Saltar">SALTA</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const DEMO = Q.has('demo'), AUTO = Q.has('auto'), VEL = Math.max(1, Math.min(40, +Q.get('vel') || 1));
  const leccion = (location.pathname.match(/\/live\/([^/]+)\//) || [])[1] || 'rsg-01';
  const LARGO = 840;               // la API mide el avance de 0 a 840
  const LIMITE_MS = 7 * 60 * 1000; // la carrera se da por cerrada a los 7 min de la salida
  const ESPERA_S = 30, VIDAS = 3;

  // ---------------------------------------------------------------- personajitos
  const AVATARES = [
    { id: 'gatito', nombre: 'Gatito', c: '#ffb36b', c2: '#fff1df', orejas: 'gato' },
    { id: 'osito', nombre: 'Osito', c: '#c99a74', c2: '#f5e1cc', orejas: 'oso' },
    { id: 'conejita', nombre: 'Conejita', c: '#fbd4e4', c2: '#ffffff', orejas: 'conejo' },
    { id: 'pollito', nombre: 'Pollito', c: '#ffe066', c2: '#fff6c9', orejas: 'pluma' },
    { id: 'ranita', nombre: 'Ranita', c: '#8fdc8a', c2: '#e7f9dc', orejas: 'rana' },
    { id: 'panda', nombre: 'Panda', c: '#ffffff', c2: '#ffffff', orejas: 'panda' },
    { id: 'zorrito', nombre: 'Zorrito', c: '#ff9a5c', c2: '#ffffff', orejas: 'zorro' },
    { id: 'pinguino', nombre: 'Pingüino', c: '#5b6fa8', c2: '#ffffff', orejas: 'ping' },
    { id: 'ajolote', nombre: 'Ajolote', c: '#ffb3cb', c2: '#ffe3ee', orejas: 'ajolote' },
    { id: 'pulpito', nombre: 'Pulpito', c: '#b9a6ff', c2: '#ece5ff', orejas: 'pulpo' },
  ];
  const AV = Object.fromEntries(AVATARES.map((a) => [a.id, a]));
  const avDe = (id) => AV[id] || AVATARES[0];

  // Dibuja un personajito redondo. x,y = centro de los pies. s = alto en px. dir = 1/-1.
  function dibujaAvatar(g, id, x, y, s, dir = 1, fase = 0, o = {}) {
    const a = avDe(id), r = s * 0.5;
    const sq = o.squash || 0;               // aplastado (+) o estirado (−)
    const sx = 1 + sq * 0.25, sy = 1 - sq * 0.25;
    g.save();
    g.translate(x, y);
    if (o.alfa != null) g.globalAlpha = o.alfa;
    g.scale(dir * sx, sy);
    const cy = -r;
    // patitas
    if (!o.soloCara) {
      const paso = Math.sin(fase) * (o.camina ? r * 0.28 : 0);
      g.fillStyle = sombra(a.c, -.25);
      ovalo(g, -r * 0.38 + paso, -r * 0.08, r * 0.26, r * 0.16);
      ovalo(g, r * 0.38 - paso, -r * 0.08, r * 0.26, r * 0.16);
    }
    // orejas detrás
    orejas(g, a, r, cy, fase);
    // cuerpo
    g.fillStyle = a.c;
    g.strokeStyle = '#3b2f4a'; g.lineWidth = Math.max(1.5, s * 0.045);
    g.beginPath(); g.ellipse(0, cy, r * 0.92, r * 0.9, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    // panza / máscara
    g.fillStyle = a.c2;
    if (a.orejas === 'ping') { g.beginPath(); g.ellipse(r * 0.05, cy + r * 0.12, r * 0.62, r * 0.66, 0, 0, Math.PI * 2); g.fill(); }
    else if (a.orejas === 'zorro') { g.beginPath(); g.ellipse(r * 0.18, cy + r * 0.28, r * 0.55, r * 0.42, 0, 0, Math.PI * 2); g.fill(); }
    else if (a.orejas !== 'panda') { g.beginPath(); g.ellipse(r * 0.1, cy + r * 0.32, r * 0.5, r * 0.36, 0, 0, Math.PI * 2); g.fill(); }
    // parches de panda
    if (a.orejas === 'panda') {
      g.fillStyle = '#3b2f4a';
      g.beginPath(); g.ellipse(-r * 0.2, cy - r * 0.08, r * 0.2, r * 0.25, -0.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(r * 0.42, cy - r * 0.08, r * 0.2, r * 0.25, 0.4, 0, Math.PI * 2); g.fill();
    }
    // ojos
    const parpadeo = o.parpadea ? 0.15 : 1;
    const ojo = (ex) => {
      g.fillStyle = a.orejas === 'panda' ? '#ffffff' : '#3b2f4a';
      if (o.triste) { g.strokeStyle = '#3b2f4a'; g.lineWidth = s * 0.05; g.beginPath(); g.arc(ex, cy - r * 0.02, r * 0.11, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); return; }
      g.beginPath(); g.ellipse(ex, cy - r * 0.08, r * 0.11, r * 0.14 * parpadeo, 0, 0, Math.PI * 2); g.fill();
      if (parpadeo > .5) { g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + r * 0.04, cy - r * 0.14, r * 0.045, 0, Math.PI * 2); g.fill(); }
    };
    if (a.orejas === 'panda') { g.fillStyle = '#3b2f4a'; }
    ojo(-r * 0.2); ojo(r * 0.42);
    // mejillas
    g.fillStyle = 'rgba(255,120,150,.55)';
    ovalo(g, -r * 0.42, cy + r * 0.14, r * 0.13, r * 0.08);
    ovalo(g, r * 0.66, cy + r * 0.14, r * 0.12, r * 0.08);
    // boca / pico
    if (a.orejas === 'pluma' || a.orejas === 'ping') {
      g.fillStyle = '#ff9f43'; g.beginPath(); g.moveTo(r * 0.08, cy + r * 0.06); g.lineTo(r * 0.3, cy + r * 0.12); g.lineTo(r * 0.08, cy + r * 0.2); g.closePath(); g.fill();
    } else {
      g.strokeStyle = '#3b2f4a'; g.lineWidth = Math.max(1.2, s * 0.04); g.beginPath();
      if (o.triste) g.arc(r * 0.11, cy + r * 0.26, r * 0.09, Math.PI * 1.15, Math.PI * 1.85);
      else if (o.feliz) { g.arc(r * 0.11, cy + r * 0.1, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); }
      else { g.arc(r * 0.02, cy + r * 0.12, r * 0.07, 0.1 * Math.PI, 0.9 * Math.PI); g.moveTo(r * 0.3, cy + r * 0.12); g.arc(r * 0.2, cy + r * 0.12, r * 0.07, 0.1 * Math.PI, 0.9 * Math.PI); }
      g.stroke();
    }
    g.restore();
  }
  function ovalo(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
  function sombra(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = (v) => Math.max(0, Math.min(255, Math.round(v + v * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  function orejas(g, a, r, cy, fase) {
    g.strokeStyle = '#3b2f4a'; g.lineWidth = Math.max(1.5, r * 0.09);
    const lleno = (fill) => { g.fillStyle = fill; g.fill(); g.stroke(); };
    switch (a.orejas) {
      case 'gato': case 'zorro':
        for (const k of [-1, 1]) { g.beginPath(); g.moveTo(k * r * 0.62 + r * 0.1, cy - r * 0.55); g.lineTo(k * r * 0.5 + r * 0.1, cy - r * 1.18); g.lineTo(k * r * 0.12 + r * 0.1, cy - r * 0.78); g.closePath(); lleno(a.c); }
        break;
      case 'oso': case 'panda':
        for (const k of [-1, 1]) { g.beginPath(); g.arc(k * r * 0.6 + r * 0.1, cy - r * 0.72, r * 0.26, 0, Math.PI * 2); lleno(a.orejas === 'panda' ? '#3b2f4a' : a.c); }
        break;
      case 'conejo':
        for (const k of [-1, 1]) { g.beginPath(); g.ellipse(k * r * 0.32 + r * 0.1, cy - r * 1.2, r * 0.18, r * 0.5, k * 0.15 + Math.sin(fase) * 0.06, 0, Math.PI * 2); lleno(a.c); }
        break;
      case 'pluma':
        g.beginPath(); g.ellipse(r * 0.05, cy - r * 1.0, r * 0.1, r * 0.22, -0.3, 0, Math.PI * 2); lleno('#ffb703');
        break;
      case 'rana':
        for (const k of [-1, 1]) { g.beginPath(); g.arc(k * r * 0.38 + r * 0.1, cy - r * 0.78, r * 0.28, 0, Math.PI * 2); lleno(a.c); }
        break;
      case 'ajolote':
        for (const k of [-1, 1]) for (let i = 0; i < 3; i++) { g.beginPath(); g.ellipse(k * r * 0.95, cy - r * 0.35 + i * r * 0.25, r * 0.22, r * 0.09, k * (0.5 - i * 0.35), 0, Math.PI * 2); lleno('#ff7aa6'); }
        break;
      case 'pulpo':
        for (let i = -2; i <= 2; i++) { g.beginPath(); g.ellipse(i * r * 0.32, cy + r * 0.86, r * 0.14, r * 0.22 + Math.sin(fase + i) * r * 0.04, 0, 0, Math.PI * 2); lleno(a.c); }
        break;
      case 'ping': break;
    }
  }
  function lienzoAvatar(id, px, op = {}) {
    const c = document.createElement('canvas'); c.width = px * 2; c.height = px * 2;
    const g = c.getContext('2d'); g.scale(2, 2);
    const cara = op.triste ? { triste: true } : { feliz: true };
    if (op.soloCara) dibujaAvatar(g, id, px / 2, px * 1.02, px * 0.92, 1, 0, { soloCara: true, ...cara });
    else dibujaAvatar(g, id, px / 2, px * 0.95, px * 0.62, 1, 0, cara);
    return c;
  }

  // ---------------------------------------------------------------- sonido (Web Audio sintetizado)
  let ac = null, mudo = false, musica = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tono(f, d = 0.12, tipo = 'square', vol = 0.06, desliz = 0, cuando = 0) {
    if (mudo || DEMO && VEL > 1) return; const a = audio(); if (!a) return;
    const t0 = a.currentTime + cuando, o = a.createOscillator(), g = a.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t0); if (desliz) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + desliz), t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }
  const SFX = {
    salto: () => tono(420, 0.16, 'square', 0.045, 380),
    estrella: () => { tono(988, 0.08, 'square', 0.04); tono(1318, 0.14, 'square', 0.04, 0, 0.07); },
    pisar: () => tono(300, 0.12, 'triangle', 0.08, -200),
    caja: () => tono(523, 0.1, 'triangle', 0.07, 200),
    ay: () => { tono(392, 0.14, 'sawtooth', 0.05, -120); tono(262, 0.3, 'sawtooth', 0.05, -100, 0.14); },
    bandera: () => [523, 659, 784, 1046].forEach((f, i) => tono(f, 0.14, 'square', 0.04, 0, i * 0.09)),
    cuenta: () => tono(660, 0.15, 'square', 0.05),
    sale: () => tono(990, 0.35, 'square', 0.05),
    meta: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tono(f, 0.18, 'square', 0.045, 0, i * 0.12)),
  };
  const MELODIA = [523, 0, 659, 784, 659, 0, 587, 523, 440, 0, 523, 587, 659, 0, 523, 0, 587, 0, 698, 880, 698, 0, 659, 587, 523, 0, 587, 659, 523, 0, 0, 0];
  const BAJO = [131, 131, 165, 165, 147, 147, 131, 131];
  function musicaOn() {
    if (musica || mudo || DEMO) return; const a = audio(); if (!a) return;
    let i = 0; musica = setInterval(() => {
      if (mudo) return; const n = MELODIA[i % MELODIA.length];
      if (n) tono(n, 0.16, 'triangle', 0.022);
      if (i % 4 === 0) tono(BAJO[(i >> 2) % BAJO.length], 0.3, 'sine', 0.035);
      i++;
    }, 190);
  }
  function musicaOff() { clearInterval(musica); musica = null; }
  $('c-sonido').onclick = () => { mudo = !mudo; $('c-sonido').textContent = mudo ? '🔇' : '🔊'; if (mudo) musicaOff(); else if (corriendo) musicaOn(); };

  // ---------------------------------------------------------------- nivel (mismo para todos: semilla de la sala)
  const T = 32, H = 17, VH = 540;
  let rnd = Math.random;
  function sembrar(s) { let x = (Math.abs(s | 0) % 2147483646) + 1; rnd = () => { x = (x * 48271) % 2147483647; return (x - 1) / 2147483646; }; }
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  let N = null; // nivel
  function generar(seed) {
    sembrar(seed * 7 + 13);
    const W = 880, grid = new Uint8Array(W * H), gh = new Int16Array(W).fill(14);
    const nubes = [], moviles = [], estrellas = [], enemigos = [], banderas = [], flores = [];
    let cx = 0, base = 14;
    const llano = (n, b = base) => { for (let i = 0; i < n && cx < W; i++) gh[cx++] = b; };

    const { ok, datos } = await pedir('/unir', { avatar });
    if (!ok) { firmaCapa = ''; pintaCapa(); const p = document.createElement('p'); p.textContent = (datos.error && datos.error.message) || 'No se pudo entrar a la sala.'; $('tarjeta').appendChild(p); return; }
    yo = datos.id || yo; refrescar();
  }
  async function iniciar() { audio(); const { ok, datos } = await pedir('/iniciar', {}); if (ok) { salidaMs = datos.salida_ms; seed = datos.seed; nuevaCarrera(); estado = 'cuenta'; } refrescar(); }
  async function reiniciarSala() { await pedir('/reiniciar', {}); yo = null; estado = 'lobby'; salidaMs = 0; cerrada = false; corriendo = false; llegada = 0; firmaCapa = ''; refrescar(); }

  // ---------------------------------------------------------------- entrada
  const teclas = { ArrowLeft: 'izq', a: 'izq', A: 'izq', ArrowRight: 'der', d: 'der', D: 'der', ' ': 'salto', ArrowUp: 'salto', w: 'salto', W: 'salto' };
  addEventListener('keydown', (e) => { const k = teclas[e.key]; if (k) { e.preventDefault(); K[k] = true; audio(); } });
  addEventListener('keyup', (e) => { const k = teclas[e.key]; if (k) K[k] = false; });
  const tactil = (id, k) => { const b = $(id); const on = (e) => { e.preventDefault(); K[k] = true; audio(); }, off = (e) => { e.preventDefault(); K[k] = false; }; b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off); };
  tactil('t-izq', 'izq'); tactil('t-der', 'der'); tactil('t-saltar', 'salto');

  // ---------------------------------------------------------------- bucle
  let tAnt = performance.now(), tMundo = 0, acum = 0;
  function bucle(ahora) {
    let dt = Math.min(0.05, (ahora - tAnt) / 1000) * VEL; tAnt = ahora;
    if (!N) { N = generar(seed); spawn(); }
    const jugando = corriendo && enCarrera() && yo;
    if (estado === 'cuenta') { const s = Math.ceil((salidaMs - ahoraSrv()) / 1000); if (s !== cuentaPrev) { cuentaPrev = s; if (s > 0 && s <= 3) SFX.cuenta(); if (s <= 0) { SFX.sale(); } } pintaCapa(); }
    if (jugando && estado === 'corre' && !musica && !llegada) musicaOn();
    acum += dt; const DT = 1 / 120;
    while (acum >= DT) { tMundo += DT; mundo(DT, tMundo); if (jugando) paso(DT); acum -= DT; }
    if (P.espera > 0 || (jugando && P.muerto === 0)) pintaCapa();
    // cámara
    const objetivo = P.x + P.w / 2 - VWM * 0.38 + P.dir * 30;
    camX += (Math.max(0, Math.min(N.ancho - VWM, objetivo)) - camX) * Math.min(1, dt * 6);
    const objY = Math.max(0, Math.min(H * T - VHM - 4, P.y - VHM * 0.55));
    camY += (objY - camY) * Math.min(1, dt * 4);
    cielo(tMundo);
    g.setTransform(Z, 0, 0, Z, 0, -camY * Z);
    dibujaAgua(tMundo); dibujaTiles(); dibujaCosas(tMundo); dibujaRivales(tMundo); dibujaYo(tMundo); dibujaParts();
    g.setTransform(1, 0, 0, 1, 0, 0);
    dibujaConfeti(tMundo);
    // HUD
    $('c-vidas').textContent = P.espera > 0 ? '💤' : '❤️'.repeat(Math.max(0, P.vidas)) + '🤍'.repeat(Math.max(0, VIDAS - Math.max(0, P.vidas)));
    $('c-estrellas').textContent = '⭐ ' + P.estrellas;
    $('c-tiempo').textContent = salidaMs && ahoraSrv() > salidaMs ? mmss((llegada || Math.min(LIMITE_MS, ahoraSrv() - salidaMs)) / 1000 * (DEMO ? VEL : 1)) : '0:00';
    requestAnimationFrame(bucle);
  }

  // ---------------------------------------------------------------- arranque
  ajustar();
  if (DEMO) {
    // atajos para revisar pantallas sin jugar 4 minutos
    const ver = Q.get('ver');
    (async () => {
      await pedir('/unir', { avatar: Q.get('av') || avatar }); yo = simu.yo; miNombre = 'Tú (demo)';
      if (ver === 'lobby') { refrescar(); return; }
      await iniciar(); simu.salida = Date.now() - 1; salidaMs = simu.salida; simu.estado = 'corre';
      await refrescar();
      if (ver === 'espera') { P.vidas = 0; P.espera = 27.4; }
      if (ver === 'gane' || ver === 'podio') {
        const m = simu.corr.get(simu.yo); if (ver === 'gane') { m.fin_ms = 212345; m.dist = LARGO; llegada = 212345; miPuesto = 1; lluviaConfeti(); }
        for (const b of simu.corr.values()) if (b.id !== simu.yo) { b.dist = 840 * (0.4 + Math.random() * 0.6); if (ver === 'podio' && b.id === 'b0') { b.fin_ms = 198000; b.dist = LARGO; } }
        if (ver === 'podio') { m.dist = 600; P.max = N.metaX * 0.71; }
        cerrada = ver === 'podio'; refrescar();
      }
      if (ver === 'mitad') { const x = N.metaX * 0.45; N.banderas.forEach((b, i) => { if (b.x <= x) { b.activa = true; P.cp = i + 1; } }); spawn(); P.max = x; for (const b of simu.corr.values()) if (b.id !== simu.yo) b.v = 1.4 + Math.random(); }
    })();
  } else refrescar();
  requestAnimationFrame(bucle);
  window.__gomita = { P, get N() { return N; }, get llegada() { return llegada; }, get estado() { return estado; }, get t() { return tMundo; } };
})();
</script>
