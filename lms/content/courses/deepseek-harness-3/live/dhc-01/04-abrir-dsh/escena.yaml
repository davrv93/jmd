id: 04-abrir-dsh
titulo: "Abrir DeepSeek Harness, paso a paso"
fase: experiencia
paso: dsh
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Aula · 1. Guardar tu API key (no se ve al escribir; solo en la memoria del aula)"
    cmd: "aula dsh clave"
  - titulo: "Aula · 2. Abrir la interfaz web de dsh (imprime tu enlace: no lo compartas)"
    cmd: "aula dsh web"
  - titulo: "Aula · Ver qué hay: versión, clave, internet e interfaz web"
    cmd: "aula dsh estado"
  - titulo: "Aula · Parar la interfaz web"
    cmd: "aula dsh web parar"
  - titulo: "Laptop · Comprobar la versión de Node (debe ser 24.9 o mayor)"
    cmd: "node -v"
  - titulo: "Laptop · Abrir la interfaz web de dsh (127.0.0.1:3080; la primera vez tarda 5 a 6 min)"
    cmd: "npx @deepseek-ai/dsh web"
  - titulo: "Laptop · Lo mismo sin abrir el navegador solo (imprime la dirección con su token: no la compartas)"
    cmd: "npx @deepseek-ai/dsh web --no-open"
