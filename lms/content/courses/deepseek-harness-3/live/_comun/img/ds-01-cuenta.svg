<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Esquema: crear la cuenta</title><desc id="d">Esquema ilustrativo del registro en la plataforma de DeepSeek: abrir platform.deepseek.com, elegir método, escribir correo, introducir código.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4D6BFE"/></marker></defs><text x="40" y="62" font-size="40" font-weight="800" fill="#1f2a37">1 · Crear la cuenta</text><text x="40" y="98" font-size="22" fill="#5b6675">Plataforma de desarrolladores (API) · no es lo mismo que el chat</text><rect x="40" y="130" width="640" height="560" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2"/>
<path d="M40 144a14 14 0 0 1 14-14h612a14 14 0 0 1 14 14v38h-640z" fill="#e8edf4"/>
<circle cx="64" cy="156" r="6" fill="#d6dde8"/><circle cx="84" cy="156" r="6" fill="#d6dde8"/><circle cx="104" cy="156" r="6" fill="#d6dde8"/>
<rect x="130" y="140" width="530" height="32" rx="16" fill="#fff" stroke="#c9d2de"/>
<text x="150" y="163" font-size="19" fill="#5b6675">platform.deepseek.com</text><rect x="80" y="220" width="200" height="26" rx="13.0" fill="#d3dcea"/><rect x="80" y="262" width="360" height="14" rx="7.0" fill="#e3e9f1"/><rect x="80" y="310" width="560" height="48" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="341.0" font-size="24" fill="#5b6675">Correo electrónico</text><rect x="80" y="376" width="360" height="48" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="407.0" font-size="24" fill="#5b6675">Código de verificación</text><rect x="456" y="376" width="184" height="48" rx="8" fill="#7a8cff"/><text x="548.0" y="408.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Enviar</text><rect x="80" y="442" width="560" height="48" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="473.0" font-size="24" fill="#5b6675">Contraseña (si la pide)</text><rect x="80" y="520" width="560" height="54" rx="8" fill="#4D6BFE"/><text x="360.0" y="555.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Continuar / Registrarme</text><text x="80" y="620" font-size="20" fill="#5b6675">Otras formas posibles: teléfono o Google</text><text x="80" y="646" font-size="20" fill="#5b6675">(según tu país y tu pantalla)</text><circle cx="760" cy="162" r="22" fill="#4D6BFE"/><text x="760" y="171" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><text x="800" y="170" font-size="28" font-weight="700" fill="#1f2a37">Abre la plataforma</text><text x="800" y="200" font-size="24" fill="#5b6675">Escribe la dirección tú mismo.</text><text x="800" y="226" font-size="24" fill="#5b6675">No uses enlaces de anuncios.</text><path d="M735 170L640 152" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="760" cy="302" r="22" fill="#4D6BFE"/><text x="760" y="311" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><text x="800" y="310" font-size="28" font-weight="700" fill="#1f2a37">Escribe tu correo</text><text x="800" y="340" font-size="24" fill="#5b6675">Mejor uno internacional: Gmail,</text><text x="800" y="366" font-size="24" fill="#5b6675">Outlook, Hotmail o Yahoo.</text><path d="M735 310L650 334" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="760" cy="422" r="22" fill="#4D6BFE"/><text x="760" y="431" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="800" y="430" font-size="28" font-weight="700" fill="#1f2a37">Pon el código</text><text x="800" y="460" font-size="24" fill="#5b6675">Llega por correo; puede tardar.</text><text x="800" y="486" font-size="24" fill="#5b6675">Mira también la carpeta spam.</text><path d="M735 430L650 400" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="760" cy="542" r="22" fill="#4D6BFE"/><text x="760" y="551" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">4</text><text x="800" y="550" font-size="28" font-weight="700" fill="#1f2a37">Cuida tu cuenta</text><text x="800" y="580" font-size="24" fill="#5b6675">Contraseña propia; no la compartas.</text><text x="800" y="606" font-size="24" fill="#5b6675">Una cuenta por persona.</text><text x="1326" y="741" text-anchor="end" font-size="19" fill="#5b6675">Fuente: FAQ oficial de DeepSeek, 31-10-2026</text><rect x="40" y="716" width="620" height="36" rx="18" fill="#fff4d6" stroke="#e0b44c"/><text x="60" y="741" font-size="22" font-weight="600" fill="#7a5a00">Esquema ilustrativo · tu pantalla puede variar</text></svg>