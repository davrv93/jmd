<text x="150" y="163" font-size="19" fill="#5b6675">platform.deepseek.com › Top Up</text><text x="80" y="236" font-size="24" font-weight="700" fill="#1f2a37">Saldo actual</text><rect x="80" y="252" width="260" height="64" rx="10" fill="#eef2ff" stroke="#b9c4ff"/><text x="100" y="294" font-size="26" fill="#1f2a37">verifica en tu pantalla</text><text x="80" y="356" font-size="24" font-weight="700" fill="#1f2a37">Medio de pago</text><rect x="80" y="376" width="280" height="52" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="410" font-size="23" fill="#1f2a37">PayPal</text><rect x="380" y="376" width="280" height="52" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="396" y="410" font-size="23" fill="#1f2a37">Tarjeta bancaria</text><rect x="80" y="440" width="280" height="52" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="474" font-size="23" fill="#1f2a37">Alipay</text><rect x="380" y="440" width="280" height="52" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="396" y="474" font-size="23" fill="#1f2a37">WeChat Pay</text><text x="80" y="528" font-size="20" fill="#5b6675">Lista según la FAQ oficial; tu pantalla</text><text x="80" y="552" font-size="20" fill="#5b6675">puede mostrar menos (p. ej. por país).</text><rect x="80" y="576" width="330" height="48" rx="8" fill="#fff" stroke="#aeb9c8" stroke-width="2"/><text x="96" y="607.0" font-size="24" fill="#5b6675">Monto (verifica el mínimo)</text><rect x="430" y="576" width="270" height="48" rx="8" fill="#4D6BFE"/><text x="565.0" y="608.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Pagar</text><path d="M790 262L350 284" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="250" r="22" fill="#4D6BFE"/><text x="830" y="259" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><path d="M790 420L672 420" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="420" r="22" fill="#4D6BFE"/><text x="830" y="429" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><path d="M790 600L710 600" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="600" r="22" fill="#4D6BFE"/><text x="830" y="609" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><g>
<text x="870" y="240" font-size="28" font-weight="700" fill="#1f2a37">Mira tu saldo</text>
<text x="870" y="270" font-size="24" fill="#5b6675">Sin saldo, la API responde 402.</text>
<text x="870" y="414" font-size="28" font-weight="700" fill="#1f2a37">Elige cómo pagar</text>
<text x="870" y="444" font-size="24" fill="#5b6675">Lee el total ANTES de confirmar:</text>
<text x="870" y="470" font-size="24" fill="#5b6675">moneda, comisiones, tipo de cambio.</text>
<text x="870" y="594" font-size="28" font-weight="700" fill="#1f2a37">Paga y comprueba</text>
<text x="870" y="624" font-size="24" fill="#5b6675">Revisa el resultado en «Billing».</text>
<text x="870" y="650" font-size="24" fill="#5b6675">El saldo recargado no caduca.</text>
</g><text x="1326" y="741" text-anchor="end" font-size="19" fill="#5b6675">Fuente: FAQ oficial de DeepSeek (EN), 31-10-2026</text><rect x="40" y="716" width="620" height="36" rx="18" fill="#fff4d6" stroke="#e0b44c"/><text x="60" y="741" font-size="22" font-weight="600" fill="#7a5a00">Esquema ilustrativo · tu pantalla puede variar</text></svg>