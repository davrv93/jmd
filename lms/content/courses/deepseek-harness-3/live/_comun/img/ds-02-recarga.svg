<title id="t">Esquema: recargar saldo</title><desc id="d">Esquema ilustrativo de la página de recarga y de facturación de la plataforma de DeepSeek.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4D6BFE"/></marker></defs><text x="40" y="62" font-size="40" font-weight="800" fill="#1f2a37">2 · Recargar saldo</text><text x="40" y="98" font-size="22" fill="#5b6675">Página «Top Up» (recarga) y página «Billing» (resultado)</text><rect x="40" y="130" width="700" height="560" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2"/>
