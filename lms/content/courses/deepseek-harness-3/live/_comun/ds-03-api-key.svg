<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Esquema: crear la API key</title><desc id="d">Esquema ilustrativo de la página API keys: crear una clave, copiarla una vez y guardarla en un gestor de contraseñas.</desc>
<rect width="1366" height="768" fill="#f6f8fb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4D6BFE"/></marker></defs><text x="40" y="62" font-size="40" font-weight="800" fill="#1f2a37">3 · Crear y guardar la API key</text><text x="40" y="98" font-size="22" fill="#5b6675">Página «API keys» de la plataforma</text><rect x="40" y="130" width="700" height="560" rx="14" fill="#fff" stroke="#c9d2de" stroke-width="2"/>
<path d="M40 144a14 14 0 0 1 14-14h672a14 14 0 0 1 14 14v38h-700z" fill="#e8edf4"/>
<circle cx="64" cy="156" r="6" fill="#d6dde8"/><circle cx="84" cy="156" r="6" fill="#d6dde8"/><circle cx="104" cy="156" r="6" fill="#d6dde8"/>
<rect x="130" y="140" width="590" height="32" rx="16" fill="#fff" stroke="#c9d2de"/>
<text x="150" y="163" font-size="19" fill="#5b6675">platform.deepseek.com › API keys</text><rect x="80" y="220" width="260" height="50" rx="8" fill="#4D6BFE"/><text x="210.0" y="253.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Crear clave nueva</text><text x="80" y="310" font-size="22" font-weight="700" fill="#1f2a37">Tus claves</text><rect x="80" y="326" width="600" height="2" rx="1.0" fill="#c9d2de"/><text x="80" y="362" font-size="20" fill="#5b6675">Nombre</text><text x="300" y="362" font-size="20" fill="#5b6675">Clave</text><text x="560" y="362" font-size="20" fill="#5b6675">Acción</text><text x="80" y="406" font-size="23" fill="#1f2a37">curso-dsh</text><text x="300" y="406" font-size="21" font-family="monospace" fill="#1f2a37">sk-xxxx…xxxx</text><text x="560" y="406" font-size="24" fill="#5b6675">🗑</text><rect x="80" y="460" width="600" height="150" rx="10" fill="#fff8e6" stroke="#e0b44c" stroke-width="2"/><text x="100" y="496" font-size="21" font-weight="700" fill="#7a5a00">Ejemplo de clave (RELLENO, no es real)</text><rect x="100" y="512" width="470" height="44" rx="6" fill="#fff" stroke="#e0b44c"/><text x="116" y="542" font-size="22" font-family="monospace" fill="#1f2a37">sk-xxxxxxxxxxxxxxxx</text><rect x="582" y="512" width="86" height="44" rx="8" fill="#8a8f98"/><text x="625.0" y="542.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Copiar</text><text x="100" y="590" font-size="19" fill="#7a5a00">Cópiala ahora: después puede no volver a mostrarse.</text><path d="M790 245L350 245" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="240" r="22" fill="#4D6BFE"/><text x="830" y="249" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><path d="M790 420L612 402" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="425" r="22" fill="#4D6BFE"/><text x="830" y="434" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><path d="M790 540L680 540" stroke="#4D6BFE" stroke-width="3" fill="none" marker-end="url(#ah)"/><circle cx="830" cy="540" r="22" fill="#4D6BFE"/><text x="830" y="549" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><g>
<text x="870" y="232" font-size="28" font-weight="700" fill="#1f2a37">Crea una clave</text>
<text x="870" y="262" font-size="24" fill="#5b6675">Ponle un nombre que reconozcas.</text>
<text x="870" y="392" font-size="28" font-weight="700" fill="#1f2a37">Una clave por uso</text>
<text x="870" y="422" font-size="24" fill="#5b6675">Si se filtra, borras solo esa</text>
<text x="870" y="448" font-size="24" fill="#5b6675">(icono de papelera) y creas otra.</text>
<text x="870" y="520" font-size="28" font-weight="700" fill="#1f2a37">Cópiala y guárdala</text>
<text x="870" y="550" font-size="24" fill="#5b6675">Gestor de contraseñas. No en el</text>
<text x="870" y="576" font-size="24" fill="#5b6675">chat, ni en un repo de git.</text>
</g><text x="1326" y="741" text-anchor="end" font-size="19" fill="#5b6675">Fuente: FAQ oficial (revocar clave), 31-10-2026</text><rect x="40" y="716" width="620" height="36" rx="18" fill="#fff4d6" stroke="#e0b44c"/><text x="60" y="741" font-size="22" font-weight="600" fill="#7a5a00">Esquema ilustrativo · tu pantalla puede variar</text></svg>