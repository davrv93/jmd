id: qa-bots
title: "QA Bots: explora, vigila y repara con IA"
description: >
  Continuación del Taller de Automatización de Pruebas y QA. Bots sintéticos recorren tu sistema como
  usuarios reales y encuentran lo que nadie escribió; cada fallo llega a tu WhatsApp con la evidencia
  exacta; la IA propone la corrección y abre el pull request, y tú solo apruebas. Tres sesiones en vivo
  los domingos 15, 22 y 29 de noviembre de 2026, de 3:00 a 4:30 p. m. (hora de Lima), por Zoom.
cohorts: [qa-bots-1]
# Inscripción por WhatsApp: 986 149 476, escribe «QA BOTS».
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu sistema bajo vigilancia: cuatro usuarios sintéticos que lo recorren, un robot que corre la suite
  todo el día con su página de estado, alertas a WhatsApp con captura y pasos, y un pull request con
  la corrección propuesta por la IA y la prueba que lo demuestra, más el tablero de indicadores.
requisitos:
  - Haber llevado el Taller de Pruebas y QA con IA, o saber correr una prueba de Playwright
  - Laptop con Chrome y Node 20 o superior
  - Una cuenta de GitHub y un asistente de código (Claude Code u OpenCode)
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 90 minutos: domingos 15, 22 y 29 de noviembre, 3:00 a 4:30 p. m."

modules:
  - id: s1
    title: "Sesión 1 · Explora: usuarios sintéticos"
    lessons: [qab-01]
  - id: s2
    title: "Sesión 2 · Vigila: alertas con evidencia"
    lessons: [qab-02]
  - id: s3
    title: "Sesión 3 · Repara: la IA abre el pull request"
    lessons: [qab-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "QA Bots", grupo: "Grupo 1", area: qa, minutos: 90}
