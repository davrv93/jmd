id: 05-reproducelo
titulo: "Reprodúcelo con Playwright"
fase: experimentacion
paso: reproducir
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: lo_logre
comandos:
  - titulo: "Copia la spec que descargaste del panel a las pruebas del kit"
    cmd: "cp ~/Downloads/reproducir-*.spec.ts qa-taller-kit/pruebas/specs/"
  - titulo: "Córrela contra tu Tienda Sol (debe fallar en rojo por el mismo motivo)"
    cmd: "cd qa-taller-kit/pruebas && BASE_URL=https://jmd-learn.online/tienda-sol/TU_CODIGO npx playwright test specs/reproducir-*.spec.ts"
  - titulo: "Mira la película paso a paso del fallo"
    cmd: "npx playwright show-report"
