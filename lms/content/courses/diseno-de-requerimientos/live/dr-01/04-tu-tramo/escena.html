<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elige el tramo y mide a la IA · Requerimientos con IA</title>
<link rel="stylesheet" href="../../comun/escena.css">
<link rel="stylesheet" href="../../comun/es.css">
</head>
<body>
<main class="es">
  <p class="es-paso">Paso 4 de 4 · 8 minutos</p>
  <h1>El tramo que <em>más duele</em></h1>
  <p class="es-sub">Toca la nota donde empieza y la nota donde termina. Ese tramo es el módulo que en la sesión 2 se vuelve un pitch de Shape Up.</p>

  <section class="es-panel">
    <div class="es-fila" style="justify-content:space-between">
      <h2 id="queToca">Toca la nota donde empieza el tramo</h2>
      <button type="button" class="btn chico" id="reiniciar">Elegir de nuevo</button>
    </div>
    <div class="linea" id="linea"></div>
  </section>

  <div class="es-2">
    <section class="es-panel">
      <label>Frase de impacto: qué cambia si este tramo se resuelve<input type="text" id="frase" maxlength="140" placeholder="Ej.: Ninguna venta del día queda sin comprobante válido al cierre de caja."></label>
      <label>¿Cuántos huecos encontraste tú, o el grupo, que la IA no vio?<input type="number" id="propios" min="0" max="50" step="1" placeholder="0"></label>
      <div class="metrica" id="metrica"></div>
      <div class="es-fila">
        <button type="button" class="btn pri" id="publicar">Publicar mi tramo al grupo</button>
        <button type="button" class="btn" id="copiar">Copiar todo para la sesión 2</button>
      </div>
      <p class="estado" id="estado" role="status" aria-live="polite"></p>
    </section>
    <section class="es-panel">
      <h2>Los tramos del grupo</h2>
      <ol class="ranking" id="muro"></ol>
    </section>
  </div>
</main>
<script src="../../comun/es.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var s = ES.cargar();
  $("frase").value = s.tramo.frase || ""; $("propios").value = s.tramo.propios || "";

  function idx(id) { for (var k = 0; k < s.notas.length; k++) if (s.notas[k].id === id) return k; return -1; }
  function rango() {
    var a = idx(s.tramo.desde), b = idx(s.tramo.hasta);
    if (a < 0) return null;
    if (b < 0) return [a, a];
    return a <= b ? [a, b] : [b, a];
  }

  function pintar() {
    var L = $("linea"); L.innerHTML = "";
    if (!s.notas.length) L.appendChild(ES.h("p", { class: "linea-vacia", text: "Tu mapa está vacío: vuelve a la escena «Tu mapa»." }));
    var r = rango();
    s.notas.forEach(function (n, k) {
      var dentro = r && k >= r[0] && k <= r[1];
      var el = ES.nota(n, { sinAviso: true, sel: dentro, onclick: function () { tocar(n.id); } });
      if (r && !dentro) el.style.opacity = ".45";
      L.appendChild(el);
    });
    $("queToca").textContent = !s.tramo.desde ? "Toca la nota donde empieza el tramo" : !s.tramo.hasta ? "Ahora toca la nota donde termina" : "Tramo elegido: " + (r[1] - r[0] + 1) + " notas";
    // métricas de la IA en el dominio del alumno
    var ia = s.ia, dec = ia.aceptadas + ia.descartadas, prop = parseInt($("propios").value, 10) || 0;
    var P = dec ? ia.aceptadas / dec : NaN, E = ia.aceptadas + prop ? ia.aceptadas / (ia.aceptadas + prop) : NaN;
    var M = $("metrica"); M.innerHTML = "";
    [[isNaN(P) ? "—" : ES.fmt(P), "precisión de la IA"], [isNaN(E) ? "—" : ES.fmt(E), "exhaustividad de la IA"], [ia.aceptadas + "/" + ia.propuestas, "sugerencias aceptadas"]].forEach(function (x) {
      M.appendChild(ES.h("div", null, [ES.h("b", { text: x[0] }), ES.h("span", { text: x[1] })]));
    });
  }

  function tocar(id) {
    s = ES.cargar();
    if (!s.tramo.desde || s.tramo.hasta) { s.tramo.desde = id; s.tramo.hasta = ""; }
    else s.tramo.hasta = id;
    ES.guardar(s); pintar();
  }
  $("reiniciar").addEventListener("click", function () { s = ES.cargar(); s.tramo.desde = ""; s.tramo.hasta = ""; ES.guardar(s); pintar(); });
  $("frase").addEventListener("input", function () { s = ES.cargar(); s.tramo.frase = $("frase").value.trim(); ES.guardar(s); });
  $("propios").addEventListener("input", function () { s = ES.cargar(); s.tramo.propios = $("propios").value; ES.guardar(s); pintar(); });

  function resumen() {
    var r = rango();
    if (!r || !s.tramo.hasta) return "";
    var a = s.notas[r[0]].texto, b = s.notas[r[1]].texto;
    return (a === b ? a : a + " → " + b) + " · «" + (s.tramo.frase || "") + "»";
  }

  $("publicar").addEventListener("click", function () {
    var txt = resumen();
    if (!txt) { $("estado").className = "estado mal"; $("estado").textContent = "Elige el inicio y el fin del tramo."; return; }
    if ((s.tramo.frase || "").length < 10) { $("estado").className = "estado mal"; $("estado").textContent = "Escribe la frase de impacto."; $("frase").focus(); return; }
    ES.muroPublicar(txt).then(function (x) {
      if (x.estado === 200 || x.estado === 201) {
        $("estado").className = "estado bien"; $("estado").textContent = "Publicado. Ahora toca «Lo logré».";
        var ia = s.ia, dec = ia.aceptadas + ia.descartadas;
        ES.evidencia("tramo: " + txt.slice(0, 120) + " · IA P=" + (dec ? ES.fmt(ia.aceptadas / dec) : "—"));
        leerMuro();
      } else { $("estado").className = "estado mal"; $("estado").textContent = "No se pudo publicar (" + ((x.b && x.b.message) || x.estado) + ")."; }
    });
  });
  $("copiar").addEventListener("click", function () {
    var extra = "\n\n## Exhaustividad\nHuecos que la IA no vio: " + (parseInt(s.tramo.propios, 10) || 0);
    ES.copiar(ES.aTexto(s) + extra).then(function () { ES.toast("Copiado: pégalo en tus notas para la sesión 2."); });
  });

  function leerMuro() {
    ES.muroLeer().then(function (ent) {
      var ol = $("muro"); ol.innerHTML = "";
      if (!ent.length) ol.appendChild(ES.h("li", null, [ES.h("span", { text: "Nadie ha publicado su tramo todavía." })]));
      ent.forEach(function (e) { ol.appendChild(ES.h("li", { class: e.mia ? "mia" : "" }, [ES.h("b", { text: e.nombre }), ES.h("span", { text: e.texto })])); });
    });
  }
  pintar(); leerMuro(); setInterval(leerMuro, 6000);
})();
</script>
</body>
</html>
