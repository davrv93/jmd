id: diseno-de-requerimientos
title: Ingeniería de Requerimientos · Implementa módulos con IA
description: >
  Diseña o solicita módulos y asegúrate de que funcionen como lo deseas. Tú decides, la IA construye y tú
  compruebas: mapeas el proceso con Event Storming, le das forma al módulo con Shape Up y lo implementas y
  verificas con un agente en DeepSeek Harness. Clases en vivo por Zoom los lunes 16, 23 y 30 de noviembre
  de 2026, de 7:30 a 9:00 pm (Lima).
cohorts: [requerimientos-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un módulo real de tu negocio o de tu trabajo llevado de punta a punta: su mapa de eventos, su propuesta
  con apetito y límites (pitch de Shape Up), sus criterios de aceptación comprobables y el módulo construido
  por el agente y verificado contra esos criterios.
requisitos:
  - Una laptop con navegador actual y conexión a internet
  - Una cuenta en jmd-learn.online
  - "Un proceso real que quieras convertir en módulo: ventas, inventario, citas, cobranzas…"
  - "Para la sesión 3, saldo en tu cuenta de DeepSeek (unos pocos dólares alcanzan)"
dedicacion: "3 clases en vivo de 90 minutos (lunes 16, 23 y 30 de noviembre de 2026), 7:30 a 9:00 pm, hora de Lima"

modules:
  - id: s1
    title: "Sesión 1 · Del pedido al mapa: Event Storming con IA"
    lessons: [dr-01]
  - id: s2
    title: "Sesión 2 · Darle forma al módulo con Shape Up"
    lessons: [dr-02]
  - id: s3
    title: "Sesión 3 · La IA construye, tú compruebas"
    lessons: [dr-03]
