id: 10-python-en-el-servidor
titulo: "Python en el servidor: sesión, páginas y pausas"
fase: experimentacion
paso: extraer
duracion_min: 30
lo_logre: true
evidencia: automatica
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Crear la carpeta de trabajo"
    cmd: "mkdir -p scraping && cd scraping"
  - titulo: "Correr el extractor"
    cmd: 'CONTACTO="tu-correo@ejemplo.com" python3 extractor.py'
  - titulo: "Ver las primeras filas del CSV"
    cmd: "head -5 frases.csv"
  - titulo: "Contar las filas del JSON"
    cmd: "python3 -c \"import json; print(len(json.load(open('frases.json'))), 'filas')\""
  - titulo: "Guardar tu token sin dejarlo en el historial"
    cmd: "read -rs TOKEN && export TOKEN"
