id: design-thinking-claude
title: "Design Thinking con Claude"
description: >
  Convierte una idea en un producto, servicio o experiencia que la gente quiere, con las 5 fases del Design Thinking y Claude como copiloto. Dictado por ponente certificado en Design Thinking DTPC®. Incluye práctica con simulador del examen DTPC® (40 preguntas, 60 minutos, se aprueba con 32/40). Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): viernes 27 de noviembre, 4 y 11 de diciembre, de 3:00 p. m. a 4:15 p. m. Inversión: S/ 40.
cohorts: [design-thinking-claude-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu propia idea llevada por las 5 fases: entrevista, reto «¿Cómo podríamos…?», ideas, un MVP (maqueta, servicio o app sencilla) y su prueba con personas reales.
requisitos:
  - Una laptop o un celular con internet
  - Una idea, un negocio o un problema que quieras resolver (no tiene que ser software)
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 40. Brochure: ~/Downloads/brochures-jmd/Design-Thinking-con-Claude.pdf

modules:
  - id: s1
    title: "Sesión 1 · Empatizar y definir: el problema real"
    lessons: [dtc-01]
  - id: s2
    title: "Sesión 2 · Idear y prototipar: tu primer MVP"
    lessons: [dtc-02]
  - id: s3
    title: "Sesión 3 · Evaluar con personas y simulador DTPC®"
    lessons: [dtc-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Design Thinking con Claude", grupo: "Grupo 1", area: diseno, minutos: 75}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: coral
  icono: target
  nivel: "Desde cero"
  frase: "Convierte tu idea en algo que la gente quiere: las 5 fases del Design Thinking con Claude como copiloto."
  resultado:
    - "Entrevistar y encontrar el problema real"
    - "Idear y armar un MVP en horas, no en meses"
    - "Probar con personas y prepararte para el examen DTPC®"
