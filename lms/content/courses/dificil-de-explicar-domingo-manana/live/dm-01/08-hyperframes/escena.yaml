id: 08-hyperframes
titulo: "HyperFrames: de HTML a video"
fase: "conceptualizacion"
paso: "hyperframes"
duracion_min: 10
lo_logre: true
evidencia: "captura"
umbral_pct: 60
compuerta: "lo_logre"
comandos:
  - { titulo: "Crear un proyecto de video", cmd: "npx hyperframes init mi-video && cd mi-video" }
  - { titulo: "Verlo y editarlo en el navegador", cmd: "npx hyperframes preview" }
  - { titulo: "Revisar y renderizar a MP4", cmd: "npx hyperframes check && npx hyperframes render -o renders/mi-pieza.mp4" }
oculta: false
