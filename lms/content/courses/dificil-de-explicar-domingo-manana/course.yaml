id: dificil-de-explicar-domingo-manana
title: "¿Difícil de explicar? ¡No! · Diseño y edición con IA · Grupo del domingo en la mañana"
description: >
  Prompts, web, app iOS, animación y video con un agente de IA al lado. Tres domingos, un entregable
  por sesión: un prototipo que se recorre, una landing publicada y un video hecho con HTML. Tú
  decides qué se hace y cómo debe verse; el agente escribe el código. Nivel de programación bajo.
cohorts: [diseno-ia-domingo-manana]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un solo proyecto atraviesa las tres sesiones: el prototipo de tu negocio o de tu idea (sesión 1),
  su landing publicada en una URL con WhatsApp real (sesión 2) y su video en MP4 con flyer y estado
  (sesión 3). Cada pieza se construye con herramientas abiertas y capas gratuitas, pidiéndoselo a un
  agente con pedidos de seis partes.
requisitos:
  - Una laptop con Chrome, Edge o Firefox actual y conexión a internet
  - Tu cuenta en jmd-learn.online (modo LIVE, aula con el agente JMD y visor)
  - "Para la sesión 2, el texto de un negocio real: un mensaje, un correo, unas notas"
  - Tu teléfono, para probar el prototipo, la landing y el estado de WhatsApp
dedicacion: "3 sesiones en vivo de 1 h 30 min (domingos 15, 22 y 29 de noviembre de 2026, 10:00 a 11:30 a. m., hora de Lima)"

modules:
  - id: s1
    title: "Sesión 1 · Del prompt al prototipo"
    lessons: [dm-01]
  - id: s2
    title: "Sesión 2 · Web y landing que funcionan"
    lessons: [dm-02]
  - id: s3
    title: "Sesión 3 · Animación y video con HyperFrames"
    lessons: [dm-03]
