id: analisis-sentimiento-ia
title: "Análisis de sentimiento con IA"
description: >
  Descubre qué sienten tus clientes, alumnos, colaboradores y hasta los personajes de un libro: la IA lee
  encuestas, reseñas y mensajes, mide la polaridad y las emociones, arma el árbol de emociones y encuentra
  patrones. Sin programar. Tres sesiones en vivo de 1 hora por Zoom (hora de Lima): lunes 23 de noviembre,
  domingo 29 de noviembre y domingo 6 de diciembre de 2026, a las 10:15 p. m. La primera sesión es gratis.
cohorts: [analisis-sentimiento-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  El análisis de sentimiento de tus propios datos (una encuesta, reseñas o mensajes): indicadores, árbol de
  emociones, patrones y una decisión concreta que tomarías con ellos.
requisitos:
  - Una laptop o un celular con internet
  - Una encuesta, reseñas o mensajes tuyos en Excel o CSV (opcional; hay datos de ejemplo)
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 hora: lun 23 nov, dom 29 nov y dom 6 dic, 10:15 p. m."
# Inscripción: WhatsApp 986 149 476 y /inscripcion/analisis-sentimiento-1/. Precio: 1.ª sesión gratis; el resto, por definir.

modules:
  - id: s1
    title: "Sesión 1 · Qué sienten tus datos"
    lessons: [as-01]
  - id: s2
    title: "Sesión 2 · Métricas, encuestas y patrones"
    lessons: [as-02]
  - id: s3
    title: "Sesión 3 · Dashboard y árbol de emociones con tus datos"
    lessons: [as-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Análisis de sentimiento con IA", grupo: "Grupo 1", area: datos, minutos: 60}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: azul
  icono: chart
  nivel: "Desde cero"
  frase: "Lee lo que sienten tus clientes, alumnos y colaboradores: polaridad, emociones y patrones con IA."
  resultado:
    - "Medir polaridad y emociones en encuestas, reseñas y mensajes"
    - "Leer un árbol de emociones y encontrar patrones"
    - "Tomar decisiones con indicadores como el NPS"
