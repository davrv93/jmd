id: conta-tributacion-ia
title: "Contabilidad y tributación con IA · Módulo I"
description: >
  Dos sesiones en vivo para practicar contabilidad y tributación usando IA como copiloto, sin inventar datos ni normas:
  registros de ventas/compras con validación y export a Excel, liquidación de IGV, renta (Régimen General vs RMT) y
  casos inmobiliarios (qué verificar). Caso ficticio: Inmobiliaria Altos del Sur SAC.
cohorts: [conta-tributacion-ia-1]

# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un paquete mensual reproducible (plantilla) con: registro de ventas, registro de compras, liquidación IGV y un
  mini-informe ejecutivo con supuestos y citas, exportado en .xlsx.
requisitos:
  - Una laptop con Chrome, Edge o Firefox actual
  - Tu cuenta en jmd-learn.online (aula LIVE con el agente JMD)
  - No necesitas internet durante la práctica (el motor de hoja corre local)
dedicacion: "2 sesiones en vivo de 90 minutos"

modules:
  - id: s1
    title: "Sesión 1 · Registros de ventas y compras (SIRE) con hoja + IA"
    lessons: [cti-01]
  - id: s2
    title: "Sesión 2 · IGV + renta y casos inmobiliarios (con base legal verificada)"
    lessons: [cti-02]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Contabilidad y tributación con IA", grupo: "Grupo 1", area: finanzas, minutos: 90}

identidad:
  color: verde
  icono: receipt
  frase: "Registra, valida y sustenta: IGV y renta con IA como copiloto, sin inventar." 
  resultado:
    - "Registrar ventas y compras con consistencia base/IGV/total y evidencias"
    - "Liquidar IGV del periodo (débito, crédito, saldo) con sustento"
    - "Comparar Régimen General vs RMT con tasas verificadas y supuestos explícitos"
