id: claude-code-pro
title: Claude Code PRO
description: >
  Opus 5.5 con un plan de $20. Aprendes a conducir a Claude midiendo tokens en cada paso:
  un tablero de ventas hecho en claude.ai y un editor de video que programas con Claude,
  renderizas con HyperFrames y compruebas con QA y pruebas. Cuatro sesiones en vivo los sábados 7, 14, 21 y 28 de noviembre de 2026,
  de 7:30 a 9:30 p.m. (hora de Lima), por Zoom.
cohorts: [claude-code-pro-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un tablero de ventas publicado desde claude.ai, con sus cifras comprobadas, y un editor de video
  programado con Claude que renderiza con HyperFrames, con su informe de QA, sus pruebas en verde
  y el reporte de tokens de todo el curso.
requisitos:
  - Una cuenta Claude Pro activa
  - Una laptop con Node.js 22 o superior y Google Chrome (para la sesión 4)
  - Una cuenta en jmd-learn.online
dedicacion: "4 sesiones en vivo de 2 horas: sábados 7, 14, 21 y 28 de noviembre, 7:30 a 9:30 p.m."

modules:
  - id: s1
    title: "Sesión 1 · Presupuesto de tokens"
    lessons: [ccp-01]
  - id: s2
    title: "Sesión 2 · Reglas, plantillas y prompts: tu primer render con pocos tokens"
    lessons: [ccp-02]
  - id: s3
    title: "Sesión 3 · Conducir a Claude para hacer un tablero"
    lessons: [ccp-03]
  - id: s4
    title: "Sesión 4 · Un editor de video con Claude: HyperFrames, QA y pruebas"
    lessons: [ccp-04]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Claude Code PRO", grupo: "Grupo 1", area: agentica, minutos: 120}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: violeta
  icono: terminal
  nivel: "Intermedio"
  frase: "Opus con un plan de 20 dólares: un proyecto de punta a punta construido midiendo los tokens en cada paso."
  resultado:
    - "Medir y recortar el gasto de tokens con /context y /usage"
    - "Repartir el trabajo entre subagentes, hooks y skills propias"
    - "Publicar un dashboard BI con IA, con pruebas E2E y desplegado con Docker"
