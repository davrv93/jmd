id: claude-code-pro
title: Claude Code PRO
description: >
  Opus 5.5 con un plan de $20. Un solo proyecto de punta a punta, un dashboard BI con IA
  (DuckDB + API + frontend + chat que convierte preguntas en SQL), construido midiendo tokens
  en cada paso. Cuatro sesiones en vivo los sábados 7, 14, 21 y 28 de noviembre de 2026,
  de 7:30 a 9:30 p.m. (hora de Lima), por Zoom.
cohorts: [claude-code-pro-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Un dashboard BI con IA publicado en una URL: modelo estrella en DuckDB, API de métricas con
  pruebas, tablero legible en claro y oscuro, chat de solo lectura que responde preguntas en SQL,
  suite E2E verde y el reporte de tokens de todo el curso.
requisitos:
  - Una cuenta Claude Pro activa
  - Una laptop con Docker o Podman
  - Una cuenta en jmd-learn.online
dedicacion: "4 sesiones en vivo de 2 horas: sábados 7, 14, 21 y 28 de noviembre, 7:30 a 9:30 p.m."

modules:
  - id: s1
    title: "Sesión 1 · Presupuesto de tokens"
    lessons: [ccp-01]
  - id: s2
    title: "Sesión 2 · Plan recursivo y cerebro de proyecto"
    lessons: [ccp-02]
  - id: s3
    title: "Sesión 3 · Multiagente y contexto acotado"
    lessons: [ccp-03]
  - id: s4
    title: "Sesión 4 · Pruebas medidas y despliegue"
    lessons: [ccp-04]
