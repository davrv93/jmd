<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena · ¿En qué se fue el contexto?</title>
<!-- Escena del modo LIVE (Claude Code PRO, sesión ccp-02). Reflexión sobre la línea base: voto + muro. Las tres
     tarjetas se voltean con un toque (qué se olvida → qué lo arregla) y anticipan el resto de la clase. -->
<link rel="stylesheet" href="../../comun/escena.css">
<link rel="stylesheet" href="../../comun/ccp.css">
<style id="esc-propio">
.r4-olvidos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vw; }
.r4-carta { position: relative; min-height: 9.5em; border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit; text-align: left; perspective: 900px; touch-action: manipulation; }
.r4-carta:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 1em; }
.r4-cara { position: absolute; inset: 0; border-radius: 1em; padding: .9em 1em; display: grid; align-content: start; gap: .35em; backface-visibility: hidden; transition: transform .5s cubic-bezier(.2,.7,.2,1); box-shadow: var(--card-shadow); }
.r4-frente { background: var(--s1); border: 1px solid var(--line); }
.r4-dorso { background: linear-gradient(150deg, color-mix(in srgb, var(--c) 18%, var(--s1)), var(--s1)); border: 2px solid var(--c); transform: rotateY(180deg); }
.r4-carta[aria-pressed="true"] .r4-frente { transform: rotateY(-180deg); }
.r4-carta[aria-pressed="true"] .r4-dorso { transform: rotateY(0); }
.r4-ic { font-size: 1.6em; line-height: 1; }
.r4-cara h3 { margin: 0; font-size: .92em; }
.r4-cara p { margin: 0; font-size: .7em; color: var(--muted); line-height: 1.35; }
.r4-cara .k { font: 800 .58em var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.r4-toca { position: absolute; right: .9em; bottom: .7em; font-size: .56em; font-weight: 700; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .r4-carta[aria-pressed="true"] .r4-frente { visibility: hidden; } }
@media (max-width: 860px) { .r4-olvidos { grid-template-columns: 1fr; gap: 10px; } .r4-carta { min-height: 8.5em; } .r4-cara p { font-size: .9em; } }
</style>
</head>
<body>
<svg class="esc-cielo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <path class="t" pathLength="1" d="M120 120 L190 80 L260 130 L330 90"/>
  <g><circle class="e" cx="120" cy="120" r="4"/><circle class="eo" cx="190" cy="80" r="5"/><circle class="e" cx="260" cy="130" r="3.5"/><circle class="eg" cx="330" cy="90" r="4"/></g>
  <g><circle class="e p" style="--p:.4s" cx="1320" cy="140" r="1.8"/><circle class="eg p" style="--p:1.6s" cx="1480" cy="380" r="1.6"/><circle class="eo p" style="--p:.9s" cx="1260" cy="820" r="1.7"/></g>
</svg>
<div class="esc">
  <header class="esc-cab">
    <span class="esc-fase" data-ph="or">Reflexión</span>
    <span class="esc-num">Claude Code PRO · S2 · 04/12</span>
  </header>
  <main class="esc-cuerpo">
    <div>
      <h1 class="esc-titulo a-in">¿En qué se fue <em>el contexto</em>?</h1>
      <p class="esc-sub a-in" style="--d:.1s">Sin plan ni notas, Claude paga tres veces lo mismo. Toca cada carta.</p>
    </div>
    <div class="r4-olvidos">
      <button type="button" class="r4-carta a-in" style="--d:.2s;--c:var(--ph-ca)" aria-pressed="false">
        <span class="r4-cara r4-frente"><span class="r4-ic">🧭</span><span class="k">Olvido 1</span><h3>Qué hay que hacer</h3><p>Relee todo para adivinar el siguiente paso… y a veces no para.</p><span class="r4-toca">toca ↻</span></span>
        <span class="r4-cara r4-dorso"><span class="r4-ic">🌳</span><span class="k">Lo arregla</span><h3>PLAN.md recursivo</h3><p>Fases, hojas y criterio de parada: sabe qué sigue y cuándo detenerse.</p></span>
      </button>
      <button type="button" class="r4-carta a-in" style="--d:.3s;--c:var(--ph-or)" aria-pressed="false">
        <span class="r4-cara r4-frente"><span class="r4-ic">🤔</span><span class="k">Olvido 2</span><h3>Qué decidimos</h3><p>Te vuelve a preguntar, o peor: decide otra cosa.</p><span class="r4-toca">toca ↻</span></span>
        <span class="r4-cara r4-dorso"><span class="r4-ic">🧠</span><span class="k">Lo arregla</span><h3>Cerebro: CLAUDE.md + Cortex</h3><p>Reglas y decisiones que duran, a mano en cada sesión.</p></span>
      </button>
      <button type="button" class="r4-carta a-in" style="--d:.4s;--c:var(--ph-ea)" aria-pressed="false">
        <span class="r4-cara r4-frente"><span class="r4-ic">🔦</span><span class="k">Olvido 3</span><h3>Dónde está el código</h3><p>Abre archivo tras archivo para encontrar una función.</p><span class="r4-toca">toca ↻</span></span>
        <span class="r4-cara r4-dorso"><span class="r4-ic">🕸️</span><span class="k">Lo arregla</span><h3>Graphify</h3><p>El grafo del código: se pregunta, no se lee.</p></span>
      </button>
    </div>
    <div class="cc-g2">
      <section class="esc-card a-in" style="--d:.5s" id="voto"></section>
      <section class="esc-card a-in" style="--d:.6s" id="muro"></section>
    </div>
  </main>
  <footer class="esc-pie"><span>Tu pregunta o respuesta en el muro cuenta para el paso «Preguntar o responder».</span></footer>
</div>
<script src="../../comun/ccp.js"></script>
<script>
(function () {
  Array.prototype.forEach.call(document.querySelectorAll(".r4-carta"), function (b) {
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
  });
  CC.votos(document.getElementById("voto"), "04-que-se-perdio", "En tu línea base, ¿qué gastó más?", [
    { id: "que-hacer", t: "🧭 Adivinar qué hacer" },
    { id: "decisiones", t: "🤔 Reconstruir decisiones" },
    { id: "donde", t: "🔦 Buscar dónde está el código" },
    { id: "chat", t: "💬 Repasar el chat anterior" }
  ]);
  CC.muro(document.getElementById("muro"), "04-que-se-perdio", "¿Qué tuvo que releer o preguntarte Claude?", { placeholder: "Releyó los 3 routers para encontrar…" });
})();
</script>
</body>
</html>
