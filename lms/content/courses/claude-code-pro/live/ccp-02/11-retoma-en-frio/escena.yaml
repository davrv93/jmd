id: 11-retoma-en-frio
titulo: "Retoma en frío, con cerebro"
fase: experimentacion
paso: entregar
duracion_min: 10
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Pedir el traspaso (pégalo en Claude Code)", cmd: "Escribe HANDOFF.md en menos de 300 palabras: fase y hoja actual, lo último que decidimos, lo que falta y el comando para verificar. Sin logs ni código."}
  - {titulo: "Caracteres del traspaso (÷ 4 = tokens)", cmd: "wc -c HANDOFF.md"}
  - {titulo: "Retomar después de /clear (pégalo en Claude Code)", cmd: "Lee HANDOFF.md y PLAN.md. ¿Qué hace este proyecto, en qué quedamos y cuál es el siguiente paso? Responde en 5 líneas."}
