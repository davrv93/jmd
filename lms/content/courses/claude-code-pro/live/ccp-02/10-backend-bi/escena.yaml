id: 10-backend-bi
titulo: "Backend BI, hoja por hoja"
fase: experimentacion
paso: construir
duracion_min: 22
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Proyecto Python con DuckDB, FastAPI y pytest", cmd: "uv init bi && cd bi && uv add duckdb fastapi uvicorn pytest httpx"}
  - {titulo: "Correr las pruebas", cmd: "uv run pytest -q"}
  - {titulo: "Levantar la API (si tu app está en main.py)", cmd: "uv run uvicorn main:app --reload"}
  - {titulo: "La vuelta de una hoja (pégalo en Claude Code)", cmd: "Toma la siguiente hoja sin marcar de PLAN.md. Escribe primero su prueba, luego el código mínimo y corre la prueba. Si pasa, marca [x] en PLAN.md y detente: no sigas con otra hoja."}
