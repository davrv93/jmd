<title>Escena · Hasta la hoja: la Partidora</title>
<link rel="icon" href="data:,">
<!--
  «Hasta la hoja» · juego de la sesión 2 de Claude Code PRO, sobre el motor Arena JMD (docs/ARENA_JMD.md).
  Cada alumno es un robot con casco en la misma obra y ve a los demás moverse en vivo.
  Las piedras son tareas del plan «Dashboard BI con IA» (19 tareas: 7 se parten, 12 son hojas). La grande sale de
  la Cantera. Si tiene más de una cosa o más de una prueba, va a la Partidora: se parte y su primera parte cae
  junto a la máquina; las hermanas esperan en la pila y salen cuando termina la rama (recorrido en profundidad,
  igual que un agente con un PLAN.md recursivo). Si ya es hoja (1 cosa, 1 sesión, 1 prueba), va a la Obra.
  Las notas son datos del proyecto: al Cerebro (CLAUDE.md · Cortex), al Grafo (Graphify) o a «No se guarda».
  Cada ranura de piedra (pz0…pz11) es una copia del plan que avanza una tarea por versión: el contenido de la
  versión v es la tarea (inicio + v) del recorrido, así que todos ven lo mismo sin estado propio en el servidor.
  El «Árbol del grupo» (arriba) y las ventanas de la Obra se calculan de las versiones de las ranuras: crecen
  con lo que la clase ya resolvió. Errar vale 0 (nunca resta), la lupa explica y la tarea sigue su camino.
  El dron /compact solo te hace soltar lo que llevas.
  Al final: título, reflexión al muro (07-juego-hasta-la-hoja) y la fotito. Deja ccp-02-juego en localStorage
  ({pts, hojas, total, aciertos, decididas, mejor, rondas}) para la insignia de la escena 12.
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->

<script>
(function () {

  var cuenta = { t: -1, n: {}, hojas: 0, partidas: 0, planes: 0 };
  function inicioDe(i) { var s = juego ? juego.ronda().semilla >>> 0 : 0; return INICIOS[(i + s % INICIOS.length) % INICIOS.length]; }

  }
  function llevo() { // "tarea", "dato" o ""

  // ---------- arte de las zonas ----------
  function pintarArbol(g, z, t) {
    var c = contar(t);
    g.save();
    g.fillStyle = "rgba(255,255,255,.78)"; g.strokeStyle = "rgba(43,138,85,.55)"; g.lineWidth = 3; rr(g, z.x, z.y, z.w, z.h, 22); g.fill(); g.stroke();
    // posiciones: hojas repartidas a lo ancho, cada padre al centro de sus hijos
    if (!pintarArbol.p) {
      var p = {}, paso = (z.w - 90) / (HOJAS.length - 1);
      HOJAS.forEach(function (id, i) { p[id] = { x: z.x + 45 + i * paso }; });
      ORDEN.slice().reverse().forEach(function (id) { var n = N[id]; if (n.hijos) p[id] = { x: (p[n.hijos[0]].x + p[n.hijos[n.hijos.length - 1]].x) / 2 }; });

        g.textAlign = n.prof === 0 ? "left" : lado < 0 ? "right" : "left"; g.fillText(n.corto, tx, q.y - (n.prof ? 14 : 0)); g.textAlign = "center";
      }

    // cuerpo

    // marca de salida: las partes caen alrededor
    g.strokeStyle = "rgba(90,73,214,.28)"; g.lineWidth = 3; g.setLineDash([10, 12]); g.lineDashOffset = REDUCIDO ? 0 : -t * 12;
    g.beginPath(); g.ellipse(cx, cy, z.w * .95, z.h * 1.05, 0, 0, 7); g.stroke(); g.setLineDash([]);
    g.restore();
  }
  function pintarObra(g, z, t, resalta) {
    var c = contar(t), pulso = resalta && !REDUCIDO ? (Math.sin(t * 5) + 1) / 2 : 0;
    g.save();
    var luz = g.createRadialGradient(z.x + z.w / 2, z.y + z.h / 2, 10, z.x + z.w / 2, z.y + z.h / 2, z.w * .85);
    luz.addColorStop(0, "rgba(47,163,95," + (.16 + pulso * .22) + ")"); luz.addColorStop(1, "rgba(47,163,95,0)");
    g.fillStyle = luz; g.fillRect(z.x - 80, z.y - 80, z.w + 160, z.h + 160);
    g.fillStyle = "#f3efe2"; g.strokeStyle = resalta ? "#f2c14e" : "#2fa35f"; g.lineWidth = resalta ? 6 : 4;
    rr(g, z.x, z.y, z.w, z.h, 20); g.fill(); g.stroke();

    var bx = z.x + 34, by = z.y + 44, bw = z.w - 68, bh = z.h - 70, cols = 4, filas = 6, n = c.hojas % (cols * filas), pisos = Math.floor(c.hojas / (cols * filas));

    for (var y = by + 20; y < by + bh; y += 48) { g.beginPath(); g.moveTo(bx - 14, y); g.lineTo(bx + bw + 14, y); g.stroke(); }

      if (lit) { g.fillStyle = "#2fa35f"; g.beginPath(); g.ellipse(bx + 7 + k * ww + ww / 2, by + 7 + f * wh + wh / 2, 4, 7, -.5, 0, 7); g.fill(); }
    }

    g.fillText(c.hojas + (c.hojas === 1 ? " hoja construida" : " hojas construidas"), z.x + z.w / 2, z.y + z.h - 14);
    g.restore();
  }
  function pintarCaja(g, z, t, resalta) {
    var b = BINS[z.id], pulso = resalta && !REDUCIDO ? (Math.sin(t * 5) + 1) / 2 : 0, cx = z.x + z.w / 2;
    g.save();
    g.fillStyle = rgba(b.c, .14 + pulso * .14); g.strokeStyle = resalta ? "#f2c14e" : b.c; g.lineWidth = resalta ? 5 : 3.5;
    rr(g, z.x, z.y, z.w, z.h, 20); g.fill(); g.stroke();
    g.textAlign = "center"; g.textBaseline = "middle";
    if (z.id === "grafo") { // red de nodos
      var pts = [[-50, -10], [-12, -38], [30, -18], [52, 22], [0, 18], [-40, 34]];
      g.strokeStyle = rgba(b.c, .6); g.lineWidth = 2.5;
      [[0, 1], [1, 2], [2, 3], [2, 4], [4, 5], [0, 4], [1, 4]].forEach(function (e) { g.beginPath(); g.moveTo(cx + pts[e[0]][0], z.y + 80 + pts[e[0]][1]); g.lineTo(cx + pts[e[1]][0], z.y + 80 + pts[e[1]][1]); g.stroke(); });
      pts.forEach(function (p, i) { g.fillStyle = i === 4 ? "#f2c14e" : b.c; g.beginPath(); g.arc(cx + p[0], z.y + 80 + p[1], i === 4 ? 9 : 7, 0, 7); g.fill(); });
    } else if (z.id === "cerebro") { // frasco con el cerebro
      g.fillStyle = "rgba(255,255,255,.75)"; g.strokeStyle = b.c; g.lineWidth = 3; rr(g, cx - 42, z.y + 36, 84, 86, 18); g.fill(); g.stroke();
      g.font = "46px " + FUENTE; g.fillText("🧠", cx, z.y + 80);
    } else { // viento: lo que se regenera se va
      g.strokeStyle = rgba(b.c, .7); g.lineWidth = 4; g.lineCap = "round";
      for (var k = 0; k < 3; k++) {
        var off = REDUCIDO ? 0 : ((t * 30 + k * 23) % 40) - 20;
        g.beginPath(); g.moveTo(cx - 60 + off, z.y + 52 + k * 26); g.bezierCurveTo(cx - 10 + off, z.y + 40 + k * 26, cx + 30 + off, z.y + 66 + k * 26, cx + 56 + off, z.y + 50 + k * 26); g.stroke();
      }
    }
    g.font = "800 13px " + FUENTE; g.fillStyle = tono(b.c, -.3); g.fillText(b.sub, cx, z.y + z.h - 22);
    g.restore();
  }

  // ---------- arte de los objetos ----------
  var RADIO = [46, 38, 31, 26, 22]; // la piedra crece con lo alto que está en el plan, no con lo que falta partir
  function pintarPiedra(g, x, y, s, t, d) {
    var r = RADIO[N[d.k].prof] * s, col = RAMAS[N[d.k].rama].c;
    g.save(); g.translate(x, y);
    if (s === 1) { g.fillStyle = "rgba(30,20,60,.22)"; g.beginPath(); g.ellipse(0, r * .55, r * .95, r * .3, 0, 0, 7); g.fill(); }
    g.beginPath();
    for (var k = 0; k < d.vert.length; k++) { var a = k / d.vert.length * Math.PI * 2 - Math.PI / 2, q = r * d.vert[k]; g.lineTo(Math.cos(a) * q, Math.sin(a) * q * .82 - r * .1); }
    g.closePath();
    var gr = g.createLinearGradient(-r, -r, r, r); gr.addColorStop(0, tono(col, .55)); gr.addColorStop(.55, tono(col, .15)); gr.addColorStop(1, tono(col, -.35));
    g.fillStyle = gr; g.fill(); g.strokeStyle = tono(col, -.55); g.lineWidth = 2.5; g.stroke();
    g.fillStyle = "rgba(255,255,255,.45)"; g.beginPath(); g.ellipse(-r * .3, -r * .42, r * .28, r * .13, -.4, 0, 7); g.fill();
    // vetas: una marca por nivel del plan
    g.strokeStyle = rgba("#1b2350", .35); g.lineWidth = 2;
    for (var v = 0; v <= N[d.k].prof; v++) { g.beginPath(); g.moveTo(-r * .35 + v * r * .22, r * .12); g.lineTo(-r * .25 + v * r * .22, r * .36); g.stroke(); }
    if (!REDUCIDO && s === 1) { var br = (Math.sin(t * 3 + d.i * 1.3) + 1) / 2; g.globalAlpha = br * .8; g.fillStyle = "#fff"; g.beginPath(); g.arc(r * .45, -r * .4, 2.5, 0, 7); g.fill(); g.globalAlpha = 1; }
    g.restore();
  }
  function pintarNota(g, x, y, s, t, d) {
    var fl = REDUCIDO || s < 1 ? 0 : Math.sin(t * 2.4 + d.i) * 3;
    g.save(); g.translate(x, y + fl); g.scale(s, s); g.rotate(d.giro);
    if (s === 1) { g.fillStyle = "rgba(30,20,60,.2)"; g.beginPath(); g.ellipse(0, 22 - fl, 18, 5, 0, 0, 7); g.fill(); }
    g.fillStyle = "#fffdf3"; g.strokeStyle = "#1b2350"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-16, -19); g.lineTo(9, -19); g.lineTo(16, -12); g.lineTo(16, 19); g.lineTo(-16, 19); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#e9e3c8"; g.beginPath(); g.moveTo(9, -19); g.lineTo(9, -12); g.lineTo(16, -12); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#f2c14e"; g.fillRect(-11, -12, 16, 4);
    g.fillStyle = "#8a83b8"; g.fillRect(-11, -3, 22, 3); g.fillRect(-11, 4, 17, 3); g.fillRect(-11, 11, 20, 3);
    g.restore();
  }

  // ---------- mi ronda y lo que guarda la insignia ----------
  var mio = { hojas: 0, partidas: 0, datos: 0, sobre: 0, falta: 0, bonus: 0 };
  var LECCION = (location.pathname.match(/\/live\/([^/]+)\//) || [])[1] || "ccp-02";
  if (!/^[a-z0-9-]+$/.test(LECCION)) LECCION = "ccp-02";
  function guardarInsignia() {
    if (!juego) return;
    var s = juego.stats, r = juego.ronda(), clave = r.n + ":" + (r.semilla >>> 0);
    if (!s.entregas) return;
    var k = LECCION + "-juego", prev = {};
    try { prev = JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) {}
    var rec = { pts: juego.puntos, hojas: mio.hojas, total: HOJAS.length, partidas: mio.partidas, datos: mio.datos, aciertos: s.aciertos, decididas: s.entregas,
      racha: 0, vivo: !juego.yo().practica, mejor: Math.max(prev.mejor || 0, juego.puntos), rondas: (prev.rondas || 0) + (prev.ronda === clave ? 0 : 1), ronda: clave, juego: "partidora" };
    try { localStorage.setItem(k, JSON.stringify(rec)); } catch (e) {}
  }

  // ---------- el bono al partir: ¿qué sale directamente de esta tarea? ----------
  function bonoPartir(n, sem) {
    var r = ArenaJMD.rng(sem >>> 0), hijo = n.hijos[Math.floor(r() * n.hijos.length)];
    var fuera = ORDEN.filter(function (id) { return id !== n.id && N[id].padre !== n.id && !desciende(n.id, id) && !desciende(id, n.id); });
    var nietos = ORDEN.filter(function (id) { return desciende(id, n.id) && N[id].padre !== n.id; });
    var pool = fuera.length >= 2 ? fuera : nietos;
    var otros = [];
    while (otros.length < 2 && pool.length) { var j = Math.floor(r() * pool.length); otros.push(pool.splice(j, 1)[0]); }
    var ops = [hijo].concat(otros), pos = Math.floor(r() * ops.length);
    ops.splice(0, 1); ops.splice(pos, 0, hijo);
    return { pregunta: "Bono: ¿cuál sale directamente de «" + n.t + "»?", opciones: ops.map(function (id) { return N[id].t; }), correcta: pos, puntos: 5, segundos: 14,
      explicacion: "De «" + n.t + "» salen: " + nombres(n.hijos.map(function (id) { return N[id].t; })) + "." + (pool === nietos ? " Las demás salen un nivel más abajo." : "") };
  }

  var juego = ArenaJMD.crear({
    raiz: "#juego",
    titulo: "Hasta la hoja",
    subtitulo: "La Partidora: parte cada tarea hasta que sea una hoja, constrúyela en la Obra y guarda en el cerebro solo lo que dura.",
    curso: "Claude Code PRO",
    sesion: "Sesión 2 · Plan recursivo y cerebro de proyecto",
    fecha: "Sábado 14 de noviembre de 2026",
    hashtag: "#ClaudeCodePRO",
    duracion: 180, duraciones: [180, 300], duracionPractica: 120,
    mundo: { ancho: ANCHO, alto: ALTO, tema: "patio" },
    jugador: { accesorio: "casco" },
    salida: { x: 110, y: 660, w: 280, h: 170 },
    reglas: [
      "Recoge una piedra (tarea) o una nota (dato) pasando encima.",
      "¿La tarea tiene más de 1 cosa o más de 1 prueba? A la ✂️ Partidora. ¿Es hoja: 1 cosa, 1 sesión, 1 prueba? A la 🍃 Obra.",
      "Las notas van al 🧠 Cerebro, al 🕸️ Grafo o a 💨 No se guarda. Errar no resta: la lupa te enseña.",
    ],
    anuncio: "a partir hasta la hoja",
    muros: [
      { x: 505, y: 440, w: 40, h: 100 }, { x: 1290, y: 650, w: 44, h: 130 },
      { x: 640, y: 790, w: 150, h: 36 }, { x: 1060, y: 790, w: 150, h: 36 },
    ],
    zonas: [
      Object.assign({ pintar: pintarArbol }, Z.arbol),
      Object.assign({ pintar: pintarPartidora }, Z.partidora),
      Object.assign({ pintar: pintarObra }, Z.obra),
      Object.assign({ pintar: pintarCaja }, Z.cerebro),
      Object.assign({ pintar: pintarCaja }, Z.grafo),
      Object.assign({ pintar: pintarCaja }, Z.nada),
    ],
    peligros: [
      { tipo: "dron", nombre: "el dron /compact", ruta: [[610, 334], [1250, 334]], vel: 135, radio: 26,
        aviso: "¡El dron /compact pasó y se te cayó lo que llevabas! Volvió a su lugar: recógelo otra vez. Por eso lo que dura va al cerebro.",
        avisoSinCarga: "¡Cuidado con el dron /compact!" },
      { tipo: "dron", nombre: "el dron /compact", ruta: [[1405, 110], [1405, 840]], vel: 120, radio: 26,
        aviso: "¡El dron /compact te hizo soltarla! Volvió a su lugar: búscala de nuevo.", avisoSinCarga: "¡Cuidado con el dron /compact!" },
    ],
    decor: [
      { tipo: "planta", x: 540, y: 300 }, { tipo: "planta", x: 1300, y: 300, s: 1.2 }, { tipo: "planta", x: 1460, y: 650 },
      { tipo: "planta", x: 470, y: 1040 }, { tipo: "planta", x: 1320, y: 1050, s: .9 }, { tipo: "planta", x: 1760, y: 300 },
      { tipo: "texto", x: 260, y: 600, texto: "CANTERA", px: 34, color: "rgba(122,90,52,.35)" },
      { tipo: "texto", x: 1610, y: 670, texto: "OBRA", px: 30, color: "rgba(47,163,95,.3)" },
    ],
    fondo: function (g, M, rnd) {
      // la cantera: tierra y piedritas
      g.save();
      g.fillStyle = "#e6dcc8"; g.beginPath();
      var cx = CANTERA.x + CANTERA.w / 2, cy = CANTERA.y + CANTERA.h / 2;
      for (var k = 0; k <= 20; k++) { var a = k / 20 * Math.PI * 2, q = .9 + rnd() * .12; g.lineTo(cx + Math.cos(a) * CANTERA.w * .56 * q, cy + Math.sin(a) * CANTERA.h * .55 * q); }
      g.closePath(); g.fill(); g.strokeStyle = "#cbb894"; g.lineWidth = 4; g.stroke();
      for (k = 0; k < 40; k++) { g.fillStyle = k % 3 ? "#c9b48e" : "#b59e76"; g.beginPath(); g.ellipse(CANTERA.x + 30 + rnd() * (CANTERA.w - 60), CANTERA.y + 30 + rnd() * (CANTERA.h - 60), 3 + rnd() * 6, 2 + rnd() * 4, rnd() * 3, 0, 7); g.fill(); }
      // camino de la Partidora a la Obra
      g.strokeStyle = "rgba(47,163,95,.28)"; g.lineWidth = 16; g.lineCap = "round"; g.setLineDash([2, 30]);
      g.beginPath(); g.moveTo(1030, 548); g.bezierCurveTo(1200, 548, 1250, 640, 1470, 470); g.stroke();
      g.strokeStyle = "rgba(122,90,52,.25)";
      g.beginPath(); g.moveTo(470, 330); g.bezierCurveTo(620, 360, 700, 440, 780, 520); g.stroke();
      g.setLineDash([]);
      g.restore();
    },
    objetos: {
      cantidad: PIEDRAS + NOTAS, prefijo: "pz",
      crear: function (i, v, rnd, M) {
        if (i < PIEDRAS) {
          var p0 = inicioDe(i) + v, k = ORDEN[p0 % ORDEN.length], n = N[k];
          var area = k === "R" ? CANTERA : v === 0 ? CAMPO : ANILLO;
          var p = M.lugarLibre(rnd, RADIO[n.prof] + 4, area), vert = [];
          for (var j = 0; j < 9; j++) vert.push(.82 + rnd() * .26);
          return { x: p.x, y: p.y, tipo: "tarea", k: k, plan: Math.floor(p0 / ORDEN.length) + 1, vert: vert, pintar: pintarPiedra, texto: n.corto };
        }
        var jn = i - PIEDRAS, s = juego ? juego.ronda().semilla >>> 0 : 0, dd = (jn + v * NOTAS + s % DATOS.length) % DATOS.length;
        var pd = M.lugarLibre(rnd, 26, ZDATOS[(jn + v) % ZDATOS.length]);
        return { x: pd.x, y: pd.y, tipo: "dato", dato: dd, giro: (rnd() - .5) * .5, pintar: pintarNota, texto: "📝 " + DATOS[dd].corto };
      },
    },
    tarjeta: function (ob) {
      if (ob.tipo === "dato") {
        var d = DATOS[ob.dato];
        return { etiqueta: "Dato del proyecto", color: "#9446c1", titulo: d.t, destacadoEtiqueta: "Qué es", destacado: d.s,
          pie: "¿Decisión o regla que dura? 🧠 Cerebro. ¿Pregunta sobre el código? 🕸️ Grafo. ¿Se vuelve a generar? 💨 No se guarda." };
      }
      var n = N[ob.k];
      return { etiqueta: RAMAS[n.rama].n + " · nivel " + n.prof, color: RAMAS[n.rama].c, titulo: n.t,
        destacadoEtiqueta: "Lista cuando", destacado: n.hijos ? n.s : n.prueba,
        pie: "¿Más de 1 cosa o más de 1 prueba? ✂️ Partidora (al centro). ¿1 cosa, 1 sesión, 1 prueba? 🍃 Obra (a la derecha)." };
    },
    entregar: function (ob, zona) {
      if (ob.tipo === "dato") {
        if (!BINS[zona.id]) return { rechazar: true, mensaje: "Es un dato: llévalo al Cerebro, al Grafo o a «No se guarda» (abajo)." };
        var d = DATOS[ob.dato];
        if (zona.id === d.va) { mio.datos++; return { ok: true, puntos: 10, titulo: BINS[d.va].bien, explicacion: d.por, feed: zona.id === "nada" ? "dejó ir «" + d.corto + "»" : "guardó «" + d.corto + "» en " + (zona.id === "grafo" ? "el grafo" : "el cerebro") }; }
        return { ok: false, puntos: 0, titulo: "Iba a " + BINS[d.va].n, explicacion: d.por, feed: "aprendió dónde va «" + d.corto + "»" };
      }
      if (BINS[zona.id]) return { rechazar: true, mensaje: "Es una tarea: va a la ✂️ Partidora o a la 🍃 Obra." };
      var n = N[ob.k], hoja = !n.hijos;
      if (zona.id === "partidora") {
        if (!hoja) {
          mio.partidas++;
          return { ok: true, puntos: 10, titulo: "¡Partida en " + n.hijos.length + "! +10",
            explicacion: "«" + n.t + "» " + n.por + ". Su primera parte ya cayó junto a la Partidora; las demás esperan en la pila.",
            feed: "partió «" + n.corto + "» en " + n.hijos.length, bonus: bonoPartir(n, ArenaJMD.hash(ob.id + "@" + ob.v)) };
        }
        mio.sobre++;
        return { ok: false, puntos: 0, titulo: "Ya era hoja",
          explicacion: "«" + n.t + "» es 1 cosa, cabe en 1 sesión y se prueba con: " + n.prueba + ". Partirla más es una vuelta extra del agente; la Partidora la pasó a la Obra.",
          feed: "aprendió: «" + n.corto + "» ya era hoja" };
      }
      if (hoja) {
        mio.hojas++;
        return { ok: true, puntos: 10, titulo: "¡Hoja construida! +10", explicacion: "1 cosa, 1 sesión, 1 prueba: " + n.prueba + ". Una vuelta del agente y queda en verde.",
          feed: "construyó la hoja «" + n.corto + "»" };
      }
      mio.falta++;
      return { ok: false, puntos: 0, titulo: "Aún no es hoja",
        explicacion: "«" + n.t + "» " + n.por + ": se parte en " + n.hijos.length + ". La Obra la devolvió a la Partidora y su primera parte ya salió.",
        feed: "aprendió: «" + n.corto + "» se parte" };
    },
    meta: { contador: "plan", texto: "Plan del grupo", unidad: "pts", objetivo: function (n) { return Math.max(150, n * 40); }, logro: "el plan del grupo llegó hasta la hoja" },
    reflexion: { clave: "07-juego-hasta-la-hoja", pregunta: "Completa la frase: «Una hoja está lista cuando…»", placeholder: "…es 1 cosa, cabe en 1 sesión y tiene 1 prueba",
      porDefecto: "Una hoja está lista cuando es 1 cosa, cabe en 1 sesión y tiene 1 prueba." },
    alRonda: function () { mio = { hojas: 0, partidas: 0, datos: 0, sobre: 0, falta: 0, bonus: 0 }; cuenta.t = -1; },
    alEntregar: function (ob, zona, res, api) {
      guardarInsignia();
      if (ob.tipo === "tarea" && ob.k === "C" && ob.v >= ORDEN.length - 1) { // un plan recorrido entero en esta ranura
        api.anuncio("¡Plan cerrado!", "un plan llegó a su última hoja");
        api.emitir("plan", "cerró un plan entero", 0);
      }
    },
    alEvento: function (e, api) {
      if (e.tipo === "plan") api.toast("🌳 " + (e.n || "Alguien") + " cerró un plan entero", "bien", 2600);
    },
    resultado: function (s) {
      guardarInsignia();
      var titulo = mio.hojas >= 5 && mio.partidas >= 3 ? "Arquitecto del plan"
        : mio.partidas >= 4 ? "Maestro de la Partidora"
        : mio.hojas >= 4 ? "Constructor de hojas"
        : mio.datos >= 3 ? "Guardián del cerebro"
        : s.entregas ? "Aprendiz de la Partidora" : "Explorador de la cantera";
      var repaso = mio.sobre > mio.falta ? " · ojo: partiste hojas" : mio.falta ? " · ojo: algo grande fue a la Obra" : "";
      return { etiqueta: "Mi ronda en la obra", titulo: titulo, resultado: juego.puntos + " pts · " + mio.hojas + (mio.hojas === 1 ? " hoja" : " hojas"),
        detalle: mio.partidas + (mio.partidas === 1 ? " partida · " : " partidas · ") + mio.datos + (mio.datos === 1 ? " dato en su lugar · " : " datos en su lugar · ") + s.aciertos + " de " + s.entregas + " bien decididas" + repaso };
    },
  });
})();
