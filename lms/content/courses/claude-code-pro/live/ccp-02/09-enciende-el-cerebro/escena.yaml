id: 09-enciende-el-cerebro
titulo: "Enciende el cerebro: CLAUDE.md, Graphify y Cortex"
fase: experimentacion
paso: cerebro
duracion_min: 15
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Líneas de CLAUDE.md (meta: 40 o menos)", cmd: "wc -l CLAUDE.md"}
  - {titulo: "Instalar Graphify (el paquete lleva dos «y»)", cmd: "uv tool install graphifyy"}
  - {titulo: "Sin uv: instalar con pipx", cmd: "pipx install graphifyy"}
  - {titulo: "Armar el grafo del código (sin LLM, 0 tokens)", cmd: "graphify update ."}
  - {titulo: "Preguntarle al grafo", cmd: "graphify query \"ticket promedio\""}
  - {titulo: "Qué se rompe si cambio algo", cmd: "graphify affected \"fact_ventas\""}
