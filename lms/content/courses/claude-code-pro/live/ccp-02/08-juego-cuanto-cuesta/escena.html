<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escena · La carrera del taxímetro</title>
<link rel="icon" href="data:,">
<!--
  «La carrera del taxímetro» · juego de la sesión 2 de Claude Code PRO, sobre el motor Arena JMD (docs/ARENA_JMD.md).
  Cada alumno es un robot taxista en el mismo patio y ve a los demás moverse en vivo. Por el patio flotan pedidos
  (orbes) que alguien le haría a Claude en claude.ai. Recoges uno y decides: ¿hace marcar poco al taxímetro o mucho?
  Lo llevas al Taxímetro bajo (verde) o al Taxímetro alto (rojo). Si aciertas, bono: ¿qué lo encarece o qué lo abarata?
  Un error vale 0 (nunca resta) y la lupa explica. El dron «mochila llena» y la roca «ya que estamos» solo te hacen
  soltar el pedido. La meta del grupo son tokens ahorrados. Al final: título, reflexión al muro (08-juego-cuanto-cuesta)
  y la fotito. El marcador propio queda en localStorage (ccp-02-juego) para la insignia (escena 12).
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->
<style>
  html, body { margin: 0; height: 100%; background: #14122b; }
  .sin-motor { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #f3f1ff; font: 500 16px/1.5 system-ui, sans-serif; }
  .sin-motor b { display: block; font-size: 22px; color: #f2c14e; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="juego"><div class="sin-motor"><div><b>Arrancando el taxi…</b>Si no aparece en unos segundos, recarga la escena.</div></div></div>
<script src="../../arena/arena-jmd.js"></script>
<script>
(function () {
  "use strict";
  if (!window.ArenaJMD) {
    document.getElementById("juego").innerHTML = '<div class="sin-motor"><div><b>El juego se está actualizando</b>Recarga la escena en un minuto. Si sigue igual, avísale al instructor.</div></div>';
    return;
  }

  // Por qué un pedido encarece (c) o abarata (b) el viaje. El bono pregunta por esto.
  var MOTIVOS = {
    vago: "Adjetivo vago: Claude adivina y rehace",
    explica: "Pide explicación: maletas caras",
    todo: "Hace reescribir todo el artefacto",
    pega: "Pega lo que ya está en el proyecto",
    mochila: "Viaja con la mochila llena (chat largo)",
    dos: "Dos pedidos en uno",
    bloque: "Nombra el bloque exacto (DATOS)",
    sin: "Dice «sin explicar» y «nada más»",
    prueba: "Dice qué va a comprobar",
    actualiza: "Pide actualizar el artefacto, no rehacerlo",
    nuevo: "Chat nuevo dentro del Proyecto"
  };
  var CAROS = ["vago", "explica", "todo", "pega", "mochila", "dos"], BARATOS = ["bloque", "sin", "prueba", "actualiza", "nuevo"];
  // Cada pedido: texto, caro (true/false), motivo principal y la explicación de la lupa.
  var PEDIDOS = [
    { t: "Hazme un dashboard bonito y moderno con mis ventas", caro: true, m: "vago", x: "«Bonito» y «moderno» no dicen nada: Claude adivina, escribe todo y casi siempre toca repetir." },
    { t: "En la plantilla, bloque DATOS: Ene 120, Feb 95, Mar 140. Nada más.", caro: false, m: "bloque", x: "Dirección exacta y límite claro: Claude cambia tres líneas y para." },
    { t: "Explícame cada parte del código que generaste", caro: true, m: "explica", x: "La explicación son párrafos de salida: lo que cuesta 5 veces. Si quieres entender, pregunta corto y después." },
    { t: "Sin explicar. Actualiza el artefacto. Compruebo: 6 barras.", caro: false, m: "sin", x: "Dos límites y una comprobación: menos maletas y una sola vuelta." },
    { t: "Vuelve a generar todo el artefacto con el color verde", caro: true, m: "todo", x: "Rehacer todo por un color son 100 líneas de salida otra vez. «Actualiza el artefacto» cuesta diez." },
    { t: "Cambia colorA a #4fd37a. Actualiza el artefacto.", caro: false, m: "actualiza", x: "Un cambio puntual sobre lo que ya existe: la salida es mínima." },
    { t: "Aquí va mi plantilla completa pegada: [120 líneas] ¿qué opinas?", caro: true, m: "pega", x: "La plantilla ya está en el Conocimiento del Proyecto: pegarla es pagar su lectura otra vez, y «¿qué opinas?» abre un ensayo." },
    { t: "Usa la plantilla del proyecto tal como está", caro: false, m: "bloque", x: "Le recuerdas que no parta de cero y de dónde partir." },
    { t: "(mensaje 41 del mismo chat) Ahora ponle título", caro: true, m: "mochila", x: "Es corto, pero viaja con 40 mensajes a la espalda: Claude relee toda la mochila en cada vuelta." },
    { t: "(chat nuevo en el Proyecto) En la plantilla, titulo «Ventas 2025». Nada más.", caro: false, m: "nuevo", x: "Mochila vacía y las reglas ya puestas por las Instrucciones del Proyecto." },
    { t: "Cambia los datos, los colores, agrega leyenda y hazlo responsive", caro: true, m: "dos", x: "Cuatro pedidos en uno: si falla uno, se rehace todo. Un pedido por mensaje." },
    { t: "Compruebo: en el artefacto veo 7 barras y la del jueves es la más alta", caro: false, m: "prueba", x: "Tú verificas en 10 segundos sin otro mensaje. Sin esto, la segunda vuelta es casi segura." },
    { t: "Que se vea profesional e increíble, tú sabes", caro: true, m: "vago", x: "«Tú sabes» es pedirle que adivine. Lo que no dices, lo inventa, y lo inventado se corrige pagando." },
    { t: "Toca solo la función animar(). No cambies el HTML ni el CSS.", caro: false, m: "bloque", x: "Perímetro cerrado: Claude no se pasea por el resto del archivo." },
    { t: "Muéstrame otra vez todo el código con el cambio", caro: true, m: "todo", x: "Repetir el archivo entero son 100 líneas más de salida que ya tenías." },
    { t: "Arréglalo", caro: true, m: "vago", x: "Cortísimo y carísimo: no sabe qué está mal, relee todo, prueba cosas y vuelves a pedir." },
    { t: "En el artefacto las barras no giran; esperaba giro lento. Arregla solo eso.", caro: false, m: "prueba", x: "Dices qué viste y qué esperabas: una vuelta, no tres." },
    { t: "Explícame qué es p5.js desde cero y luego haz el gráfico", caro: true, m: "dos", x: "Una clase de p5 más un gráfico en el mismo mensaje: dos viajes largos. La clase, si la quieres, en otro chat y corta." },
    { t: "Velocidad 0.003 en el bloque DATOS. Sin explicar.", caro: false, m: "sin", x: "Un número en un bloque nombrado, sin párrafos. El taxímetro casi no se mueve." },
    { t: "Reescribe la plantilla con three.js en vez de p5", caro: true, m: "todo", x: "Cambiar de librería a mitad de camino es escribir todo de nuevo: el viaje más caro de la noche." },
    { t: "Agrega un subtítulo bajo el título: «enero a junio». Nada más.", caro: false, m: "sin", x: "Una cosa, un lugar, un límite. Barato." },
    { t: "Hazme algo con mis números, lo que tú veas mejor", caro: true, m: "vago", x: "Sin dirección, el taxi da vueltas. «Lo que tú veas» es la frase más cara del día." },
    { t: "(chat nuevo en el Proyecto) Items Lun 6, Mar 8, Mié 5. Actualiza el artefacto.", caro: false, m: "nuevo", x: "Chat nuevo, Proyecto con reglas, cambio puntual: el combo barato." },
    { t: "Pego el PDF de 30 páginas del manual de la empresa para que lo tengas en cuenta", caro: true, m: "pega", x: "Treinta páginas que Claude relee en cada mensaje del chat. Si hace falta, al Conocimiento del Proyecto y solo lo necesario." }
  ];

  var ANCHO = 1600, ALTO = 1000;
  var ZB = { id: "bajo", x: 1330, y: 90, w: 230, h: 230, nombre: "Taxímetro bajo", color: "#2fa35f", icono: "🚕" };
  var ZA = { id: "alto", x: 1330, y: 690, w: 230, h: 230, nombre: "Taxímetro alto", color: "#e3262e", icono: "🧳" };
  var PATIO = { x: 70, y: 80, w: 1180, h: 860 };

  var mio = { aciertos: 0, fallos: 0, caros: 0, baratos: 0, bonos: 0 };
  function guardar() {
    try { localStorage.setItem("ccp-02-juego", JSON.stringify({ aciertos: mio.aciertos, decididas: mio.aciertos + mio.fallos, rondas: 1, pts: juego ? juego.puntos : 0, bonos: mio.bonos })); } catch (e) {}
  }
  function opcionesBono(p) {
    var lista = p.caro ? CAROS : BARATOS, otros = lista.filter(function (k) { return k !== p.m; });
    var r = ArenaJMD.rng(ArenaJMD.hash(p.t));
    var pick = [], c = otros.slice();
    while (pick.length < 2 && c.length) pick.push(c.splice(Math.floor(r() * c.length), 1)[0]);
    var ops = pick.concat([p.m]); for (var i = ops.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = ops[i]; ops[i] = ops[j]; ops[j] = t; }
    return { opciones: ops.map(function (k) { return MOTIVOS[k]; }), correcta: ops.indexOf(p.m) };
  }

  var juego = ArenaJMD.crear({
    raiz: "#juego",
    titulo: "La carrera del taxímetro",
    subtitulo: "Pedidos que alguien le haría a Claude. Tú decides si hacen marcar poco o mucho al taxímetro.",
    curso: "Claude Code PRO",
    sesion: "Sesión 2 · Reglas, plantillas y prompts",
    fecha: "Sábado 14 de noviembre de 2026",
    hashtag: "#ClaudeCodePRO",
    duracion: 180, duraciones: [180, 300], duracionPractica: 120,
    mundo: { ancho: ANCHO, alto: ALTO, tema: "patio" },
    jugador: { accesorio: "gorra" },
    salida: { x: 90, y: 420, w: 200, h: 200 },
    reglas: [
      "Pasa sobre un pedido para recogerlo y léelo.",
      "¿Gasta poco? Llévalo al Taxímetro bajo (verde). ¿Gasta mucho? Al alto (rojo).",
      "Si aciertas, bono: di por qué (+5). Errar no resta: la lupa te enseña."
    ],
    anuncio: "al patio",
    muros: [
      { x: 520, y: 220, w: 150, h: 100 }, { x: 900, y: 300, w: 110, h: 160 }, { x: 760, y: 760, w: 170, h: 100 },
      { x: 330, y: 780, w: 130, h: 100 }, { x: 1260, y: 440, w: 60, h: 160 }
    ],
    zonas: [ZB, ZA],
    peligros: [
      { tipo: "dron", nombre: "la mochila llena", ruta: [[1150, 110], [1150, 930]], vel: 140, radio: 28,
        aviso: "¡La mochila llena te hizo soltar el pedido! Un chat largo relee todo: vuelve a buscarlo.", avisoSinCarga: "¡El dron de la mochila llena! Pasa cuando se aleje." },
      { tipo: "roca", nombre: "el «ya que estamos»", ruta: [[400, 560], [1050, 560]], vel: 120, radio: 26,
        aviso: "¡El «ya que estamos» te hizo soltar el pedido! Las mejoras extra se pagan.", avisoSinCarga: "¡Cuidado con el «ya que estamos»!" }
    ],
    decor: [
      { tipo: "farol", x: 200, y: 130 }, { tipo: "farol", x: 700, y: 120 }, { tipo: "farol", x: 1100, y: 980 }, { tipo: "farol", x: 500, y: 1000 },
      { tipo: "planta", x: 640, y: 420 }, { tipo: "planta", x: 1000, y: 880, s: 1.2 }, { tipo: "planta", x: 250, y: 900 },
      { tipo: "texto", x: 190, y: 680, texto: "PARADERO", px: 30, color: "rgba(255,230,170,.32)" },
      { tipo: "texto", x: 1445, y: 360, texto: "POCO", px: 26, color: "rgba(127,216,160,.5)" },
      { tipo: "texto", x: 1445, y: 660, texto: "MUCHO", px: 26, color: "rgba(255,140,140,.5)" }
    ],
    objetos: {
      cantidad: 8, prefijo: "pedido",
      crear: function (i, v, rnd, M) {
        var base = (juego ? juego.ronda().semilla : 0) % PEDIDOS.length;
        var k = (i * 7 + v * 3 + base) % PEDIDOS.length;
        var p = M.lugarLibre(rnd, 40, PATIO);
        var t = PEDIDOS[k].t.replace(/^\([^)]*\)\s*/, "");
        return { x: p.x, y: p.y, forma: "orbe", color: "#7b6cf0", pedido: k, texto: t.length > 16 ? t.slice(0, 15) + "…" : t };
      }
    },
    tarjeta: function (ob) {
      var p = PEDIDOS[ob.pedido];
      return { etiqueta: "Pedido a Claude", color: "#5a49d6", titulo: "«" + p.t + "»",
        pie: "¿Gasta poco? → Taxímetro bajo (arriba a la derecha). ¿Gasta mucho? → Taxímetro alto (abajo). Espacio o «Soltar» lo deja." };
    },
    entregar: function (ob, zona) {
      var p = PEDIDOS[ob.pedido], dijoCaro = zona.id === "alto", ok = dijoCaro === p.caro;
      if (ok) {
        mio.aciertos++; if (p.caro) mio.caros++; else mio.baratos++; guardar();
        var b = opcionesBono(p);
        return { ok: true, puntos: 10, titulo: p.caro ? "¡Caro detectado! +10" : "¡Barato! +10", feed: p.caro ? "frenó un pedido caro" : "firmó un pedido barato",
          bonus: { pregunta: p.caro ? "Bono: ¿qué lo encarece?" : "Bono: ¿qué lo abarata?", opciones: b.opciones, correcta: b.correcta, puntos: 5, segundos: 14, explicacion: p.x } };
      }
      mio.fallos++; guardar();
      return { ok: false, puntos: 0, titulo: p.caro ? "Parecía barato, pero no" : "Era barato", explicacion: p.x, feed: p.caro ? "aprendió de un pedido caro" : "revisó un pedido barato" };
    },
    meta: { contador: "ahorro", texto: "Tokens ahorrados por la clase", unidad: "k tokens", objetivo: function (n) { return Math.max(150, n * 50); }, logro: "la clase ahorró su cuota de la semana" },
    reflexion: { clave: "08-juego-cuanto-cuesta", pregunta: "¿Qué frase vas a dejar de decirle a Claude?", placeholder: "Dejo de decir…", porDefecto: "Dejo de decir «hazlo bonito» y digo qué quiero ver." },
    alRonda: function () { mio = { aciertos: 0, fallos: 0, caros: 0, baratos: 0, bonos: 0 }; guardar(); },
    alEvento: function (ev) { if (ev && ev.tipo === "bonus") { mio.bonos++; guardar(); } },
    resultado: function (s) {
      var total = s.entregas, pts = juego.puntos;
      var titulo = mio.aciertos >= 6 && s.fallos <= 1 ? "Taxista con reglas" : mio.aciertos >= 4 ? "Lector de pedidos" : mio.aciertos >= 2 ? "Ya sabes qué sobra" : total ? "Primer viaje" : "Pasajero curioso";
      return { etiqueta: "Mi ronda en el taxi", titulo: titulo, resultado: pts + " puntos",
        detalle: mio.aciertos + " aciertos de " + total + " · " + mio.caros + " caros frenados · " + s.bonus + " porqués" };
    }
  });
  guardar();
})();
</script>
</body>
</html>
