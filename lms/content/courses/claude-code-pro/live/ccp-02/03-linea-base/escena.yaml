id: 03-linea-base
titulo: "Línea base: el render a lo bruto, sin reglas"
fase: experiencia
paso: medir
duracion_min: 8
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Carpeta vacía y sesión nueva", cmd: "mkdir base && cd base && claude"}
  - {titulo: "El pedido a lo bruto (pégalo en Claude Code, tal cual)", cmd: "Haz un gráfico de barras 3D con p5.js en index.html, con 6 meses de ventas inventadas, que gire y se vea bien."}
  - {titulo: "Abrir el resultado (Mac)", cmd: "open index.html"}
  - {titulo: "Abrir el resultado (Windows)", cmd: "start index.html"}
  - {titulo: "Abrir el resultado (Linux)", cmd: "xdg-open index.html"}
  - {titulo: "Cuánto contexto usó (dentro de Claude Code)", cmd: "/context"}
