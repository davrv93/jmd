id: 09-tu-render
titulo: "Tu render: con reglas, plantilla y tu pedido"
fase: experimentacion
paso: render
duracion_min: 20
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Sesión nueva en tu carpeta (con CLAUDE.md e index.html dentro)", cmd: "cd mi-render && claude"}
  - {titulo: "Modelo liviano para cambios pequeños (dentro de Claude Code)", cmd: "/model"}
  - {titulo: "Tu pedido de cinco líneas: el de la escena 7 (cópialo desde la escena)", cmd: "En index.html, bloque DATOS: titulo «…» e items …. Usa la plantilla tal como está. Nada más. Sin explicar. Compruebo: abro index.html y veo …"}
  - {titulo: "Ver el resultado (Mac)", cmd: "open index.html"}
  - {titulo: "Ver el resultado (Windows)", cmd: "start index.html"}
  - {titulo: "Ver el resultado (Linux)", cmd: "xdg-open index.html"}
  - {titulo: "Cuánto contexto usó (dentro de Claude Code)", cmd: "/context"}
  - {titulo: "Copiar tu index.html para pegarlo en el laboratorio (Mac)", cmd: "pbcopy < index.html"}
  - {titulo: "Copiar tu index.html (Windows)", cmd: "Get-Content index.html | Set-Clipboard"}
