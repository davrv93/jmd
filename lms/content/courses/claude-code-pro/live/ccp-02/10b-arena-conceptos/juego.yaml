# Arena de conceptos (10b) de Claude Code PRO, sesión 2: la clave de respuestas del minijuego.
# La lee el servidor (lms/api/internal/httpapi/live_juego.go) y nunca llega al navegador.
# Cada concepto va a un solo contenedor; todos salen de las escenas de la sesión ccp-02.
# «Ronda nueva» relee este archivo, así que se puede corregir entre rondas.
contenedores:
  - {id: taximetro, nombre: "Taxímetro · tokens"}
  - {id: reglas,    nombre: "Reglas · Proyecto"}
  - {id: plantilla, nombre: "Plantilla · DATOS"}
  - {id: pedido,    nombre: "Pedido · 5 líneas"}
conceptos:
  # Taxímetro: qué cobra Claude y cómo se mide.
  - {texto: "Token = 4 letras",                contenedor: taximetro}
  - {texto: "Escribir cuesta 5×",              contenedor: taximetro}
  - {texto: "Las maletas",                     contenedor: taximetro}
  - {texto: "La mochila llena",                contenedor: taximetro}
  - {texto: "Chat nuevo = mochila vacía",      contenedor: taximetro}
  - {texto: "Letras ÷ 4",                      contenedor: taximetro}
  - {texto: "Configuración → Uso",             contenedor: taximetro}
  - {texto: "Medir antes y después",           contenedor: taximetro}
