id: 06-renderizar
titulo: "Renderizar con HyperFrames y mirar los cuadros"
fase: experimentacion
paso: ver
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 70
compuerta: lo_logre
comandos:
  - {titulo: "Revisar la composición", cmd: "npx hyperframes check video"}
  - {titulo: "Renderizar el MP4 (rápido)", cmd: "npx hyperframes render video --quality draft -o salida/mi-video.mp4"}
  - {titulo: "Fotos de 3 instantes", cmd: "npx hyperframes snapshot video --at 2,7,12 -o cuadros"}
  - {titulo: "Un cuadro del MP4", cmd: "ffmpeg -ss 7 -i salida/mi-video.mp4 -frames:v 1 cuadros/mp4-7s.png"}
