id: 08-qa
titulo: "QA: casos por riesgo, probados a mano"
fase: experimentacion
paso: ver
duracion_min: 12
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "Pide los casos de QA", cmd: "Escribe en QA.md entre 6 y 8 casos de QA para mi editor y mi video, ordenados por riesgo, del más alto al más bajo. Para cada caso: qué riesgo cubre, los pasos, el resultado esperado y una columna Resultado vacía. Incluye la duración del MP4, la música hasta el final, textos que se leen completos, imágenes en orden, un archivo que falta y un texto muy largo. No cambies código."}
