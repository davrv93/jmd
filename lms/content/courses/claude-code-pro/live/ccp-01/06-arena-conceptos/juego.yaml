# Arena de conceptos (06) de Claude Code PRO, sesión 1: la clave de respuestas del minijuego.
# La lee el servidor (lms/api/internal/httpapi/live_juego.go) y nunca llega al navegador.
# Cada concepto va a un solo contenedor; todos salen de las escenas y láminas de la sesión ccp-01.
# «Ronda nueva» relee este archivo, así que se puede corregir entre rondas.
contenedores:
  - {id: mcp,    nombre: "MCP · conector"}
  - {id: skill,  nombre: "Skill · receta"}
  - {id: agente, nombre: "Agente · ciclo"}
  - {id: cuota,  nombre: "Cuota · tokens"}
conceptos:
  # MCP: el enchufe que conecta Claude con otras apps.
  - {texto: "Parallel",                    contenedor: mcp}
  - {texto: "OpenRouter",                  contenedor: mcp}
  - {texto: "mcp.parallel.ai/mcp",         contenedor: mcp}
  - {texto: "Personalizar → Conectores",   contenedor: mcp}
  - {texto: "Enchufe tipo USB-C",          contenedor: mcp}
  - {texto: "Autorizar con OAuth",         contenedor: mcp}
  - {texto: "Conecta Drive o calendario",  contenedor: mcp}
  # Skill: instrucciones guardadas que Claude lee cuando las necesita.
  - {texto: "SKILL.md",                    contenedor: skill}
  - {texto: "/research-academy",           contenedor: skill}
  - {texto: "Receta guardada",             contenedor: skill}
  - {texto: "Solo ve la descripción",      contenedor: skill}
  - {texto: "No repites indicaciones",     contenedor: skill}
  - {texto: "Carpeta con instrucciones",   contenedor: skill}
  # Agente: Claude que trabaja en ciclo hasta terminar.
  - {texto: "Claude Code",                 contenedor: agente}
  - {texto: "Planifica y revisa",          contenedor: agente}
  - {texto: "Usa herramientas solo",       contenedor: agente}
  - {texto: "Repite hasta terminar",       contenedor: agente}
  - {texto: "El cocinero",                 contenedor: agente}
  - {texto: "Cada vuelta relee todo",      contenedor: agente}
  # Cuota: lo que se gasta y cómo se mide.
  - {texto: "Sesión de 5 horas",           contenedor: cuota}
  - {texto: "Límite semanal",              contenedor: cuota}
  - {texto: "Salida: 5 veces más cara",    contenedor: cuota}
  - {texto: "Caché leída al 10 %",         contenedor: cuota}
  - {texto: "/usage",                      contenedor: cuota}
  - {texto: "/context",                    contenedor: cuota}
  - {texto: "Max: 5 veces Pro",            contenedor: cuota}
  - {texto: "Chat nuevo por tema",         contenedor: cuota}
