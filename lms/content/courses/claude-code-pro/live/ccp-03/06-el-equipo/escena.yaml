id: 06-el-equipo
titulo: "El equipo: explorador, constructor y revisor"
fase: experimentacion
paso: ver
duracion_min: 25
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "La misma pregunta, con el explorador (después de /clear)", cmd: "Usa el subagente explorador para leer tokens.csv y responder: total de tokens de salida por modelo, el día con más salida y qué porcentaje de la salida hicieron los subagentes. Tú no abras el archivo. Respóndeme en 5 líneas."}
  - {titulo: "El dashboard con el equipo", cmd: "Encarga al subagente constructor un dashboard.html de mis tokens a partir de tokens.csv, con la skill build-dashboard: 4 KPI (tokens de salida, cache leída, % de salida de subagentes, días activos); salida por día en barras apiladas, principal contra subagentes; dona por modelo; tabla por sesión ordenable; filtro por proyecto. Después pide al subagente revisor que lo revise. A mí dame solo el resumen, en 5 líneas."}
