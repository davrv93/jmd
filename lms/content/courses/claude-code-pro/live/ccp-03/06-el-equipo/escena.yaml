id: 06-el-equipo
titulo: "Conducir: 4 pasos para un buen tablero"
fase: experimentacion
paso: ver
duracion_min: 25
lo_logre: true
evidencia: automatica
umbral_pct: 70
compuerta: evidencia
comandos:
  - {titulo: "La misma pregunta, con el explorador (después de /clear)", cmd: "Usa el subagente explorador para leer tokens.csv y responder: total de tokens de salida por modelo, el día con más salida y qué porcentaje de la salida hicieron los subagentes. Tú no abras el archivo. Respóndeme en 5 líneas."}
  - {titulo: "El dashboard con el equipo", cmd: "Pide al subagente constructor un dashboard.html de mis tokens con la skill build-dashboard: 4 KPI (salida, cache leída, % de salida de subagentes, días activos), salida por día apilada principal contra subagentes, dona por modelo, tabla de sesiones ordenable y filtro por proyecto. Luego pide al subagente revisor que lo revise. A mí dame solo 5 líneas."}
