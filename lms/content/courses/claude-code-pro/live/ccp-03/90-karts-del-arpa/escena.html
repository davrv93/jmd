<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Karts del arpa</title>
<!-- Karts del arpa · carrera de karts multijugador del modo LIVE (hasta 20 pilotos; el instructor también corre).
     La pista es el arpa del logo de JMD Learning flotando en el espacio: el cuello es el mango de la Osa Mayor,
     las 7 estrellas son arcos de control (la última, la dorada), las cuerdas son turbos que suenan y la base es
     la recta de meta. 3 vueltas.
     Red: API de karts del LMS (/api/v1/live/<lección>/karts…, ver lms/api/internal/httpapi/live_karts.go).
     Un POST por tick (~8 Hz) con el estado propio; la respuesta trae a todos. El servidor es dueño de la salida,
     las vueltas (con tope de ritmo), la llegada, qué poder sale de cada caja y quién golpeó a quién.
     3D con Three.js r169 de ../../comun/three.module.min.js (sin CDN: la CSP de las escenas no lo permite).
     ?demo=1 juega sin red con bots (&bots=19 para 20 karts) · &auto=1 piloto automático · &fps=1 cuadros por segundo
     · &tactil=1 fuerza los botones del celular. -->
<style>
:root { --fondo:#050817; --panel:rgba(9,14,40,.88); --panel2:rgba(20,28,72,.9); --borde:rgba(130,160,255,.24); --tinta:#eef2ff; --suave:#a4afdc; --azul:#3d6bff; --azul2:#6f93ff; --oro:#d9a441; --oro2:#ffd27a; --ok:#7bf1a8; --mal:#ff6b7a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:radial-gradient(120% 90% at 70% 10%, #111a4a 0%, #050817 60%); color:var(--tinta); font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
canvas#cv { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
[hidden] { display:none !important; }
button { font:inherit; color:inherit; }
.btn { border:1px solid var(--borde); background:rgba(14,20,56,.82); color:var(--tinta); border-radius:12px; padding:10px 16px; font-weight:800; font-size:15px; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:transform .08s ease, background .15s ease, border-color .15s ease; }
.btn:hover { border-color:rgba(160,185,255,.5); background:rgba(26,36,92,.9); }
.btn:active { transform:translateY(1px); }
.btn:focus-visible, .color:focus-visible, summary:focus-visible { outline:3px solid var(--oro2); outline-offset:2px; }
.btn.primario { background:linear-gradient(180deg,#5b84ff,#3d6bff); border-color:#7d9bff; box-shadow:0 6px 22px -8px rgba(61,107,255,.8); }
.btn.oro { background:linear-gradient(180deg,#f2c15f,#d9a441); border-color:#ffd98c; color:#1d1405; box-shadow:0 6px 22px -8px rgba(217,164,65,.8); }
.btn.chico { min-height:36px; padding:6px 12px; font-size:13px; border-radius:10px; }
.btn.peligro { border-color:rgba(255,107,122,.5); }
.btn[disabled] { opacity:.45; cursor:not-allowed; transform:none; }

/* ---------- HUD ---------- */
.hud { position:fixed; pointer-events:none; z-index:5; }
.arriba-izq { top:12px; left:12px; display:flex; gap:8px; align-items:stretch; }
.caja-hud { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:6px 12px; display:flex; flex-direction:column; justify-content:center; min-width:84px; }
.caja-hud .et { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--suave); }
.caja-hud b { font-size:26px; font-weight:900; line-height:1.05; font-variant-numeric:tabular-nums; }
.caja-hud b small { font-size:15px; color:var(--suave); font-weight:800; }
.caja-hud.final b { color:var(--oro2); }
.arriba-der { position:fixed; top:12px; right:12px; display:flex; gap:8px; z-index:7; }
.mapa { position:fixed; left:12px; bottom:12px; width:168px; height:168px; z-index:5; pointer-events:none; background:rgba(5,8,23,.55); border:1px solid var(--borde); border-radius:16px; }
.slot { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--borde); border-radius:18px; padding:8px 16px 8px 8px; z-index:5; pointer-events:none; min-width:250px; }
.slot canvas { width:56px; height:56px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--borde); }
.slot.lleno canvas { border-color:var(--oro2); box-shadow:0 0 18px -2px rgba(255,210,122,.6); }
.slot-tx b { display:block; font-size:16px; font-weight:900; }
.slot-tx span { font-size:13px; color:var(--suave); font-weight:700; }
.slot-tx kbd { font:inherit; font-weight:900; color:var(--tinta); background:rgba(255,255,255,.12); border:1px solid var(--borde); border-bottom-width:3px; border-radius:6px; padding:0 6px; }
.vel { position:fixed; right:14px; bottom:14px; z-index:5; pointer-events:none; text-align:right; background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:6px 12px; }
.vel b { font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; }
.vel span { display:block; font-size:11px; font-weight:800; color:var(--suave); letter-spacing:.08em; }
.feed { position:fixed; right:12px; top:62px; width:min(330px, 42vw); list-style:none; display:flex; flex-direction:column; gap:6px; z-index:5; pointer-events:none; }
.feed li { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:6px 10px; font-size:13px; font-weight:700; line-height:1.25; animation:entra .25s ease-out; transition:opacity .6s ease; }
.feed li.yo { border-color:rgba(255,210,122,.6); }
.feed li img { width:22px; height:22px; flex:0 0 auto; }
.feed li.sale { opacity:0; }
@keyframes entra { from { transform:translateX(16px); opacity:0; } to { transform:none; opacity:1; } }
.centro { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); z-index:6; pointer-events:none; text-align:center; font-weight:900; font-size:clamp(34px,8vw,92px); line-height:1; letter-spacing:-.01em; text-shadow:0 6px 30px rgba(61,107,255,.75), 0 2px 0 rgba(0,0,0,.4); white-space:nowrap; }
.centro small { display:block; font-size:clamp(15px,2.4vw,22px); font-weight:800; color:var(--suave); margin-top:10px; letter-spacing:0; text-shadow:0 2px 10px rgba(0,0,0,.6); white-space:normal; }
.centro.pop { animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
.centro.oro { color:var(--oro2); text-shadow:0 6px 30px rgba(217,164,65,.8), 0 2px 0 rgba(0,0,0,.4); }
.centro.mal { color:#ffd0d5; text-shadow:0 6px 30px rgba(255,80,100,.8); }
@keyframes pop { from { transform:translate(-50%,-50%) scale(.6); opacity:0; } to { transform:translate(-50%,-50%) scale(1); opacity:1; } }
.aviso { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:8; background:var(--panel2); border:1px solid var(--borde); border-radius:99px; padding:8px 16px; font-size:14px; font-weight:800; text-align:center; max-width:min(560px, calc(100vw - 24px)); pointer-events:auto; }
.aviso.mal { border-color:rgba(255,107,122,.6); }
.aviso button { margin-left:8px; }
.fps { position:fixed; left:12px; top:76px; z-index:9; font:700 12px/1 ui-monospace,monospace; background:rgba(0,0,0,.6); padding:4px 6px; border-radius:6px; pointer-events:none; }

/* ---------- controles táctiles ---------- */
.tactil { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:flex-end; z-index:7; pointer-events:none; }
.tactil .grupo { display:flex; gap:10px; pointer-events:auto; }
.tactil button { width:72px; height:72px; border-radius:20px; border:1px solid var(--borde); background:rgba(14,20,56,.72); font-size:28px; font-weight:900; touch-action:none; -webkit-user-select:none; user-select:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.tactil button.apretado { background:rgba(61,107,255,.6); border-color:#9bb3ff; }
.tactil #t-freno { font-size:14px; }
.tactil #t-poder { width:88px; height:88px; border-radius:50%; font-size:15px; background:linear-gradient(180deg,rgba(242,193,95,.85),rgba(217,164,65,.85)); color:#1d1405; border-color:#ffd98c; }
.tactil #t-poder[disabled] { opacity:.4; }

/* ---------- tarjetas: vestíbulo y podio ---------- */
.capa { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:flex-start; padding:16px clamp(16px,4vw,48px); pointer-events:none; }
.capa.centrada { justify-content:center; }
.tarjeta { pointer-events:auto; width:min(470px, 100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--borde); border-radius:22px; padding:20px 20px 18px; box-shadow:0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); scrollbar-width:thin; }
.tarjeta.ancha { width:min(560px, 100%); }
.marca { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.marca svg { width:44px; height:44px; flex:0 0 auto; }
.tarjeta h1 { font-size:clamp(24px,4vw,32px); font-weight:900; letter-spacing:-.02em; line-height:1.05; }
.tarjeta h1 em { font-style:normal; color:var(--oro2); }
.tarjeta .sub { color:var(--suave); font-weight:700; font-size:14px; line-height:1.4; margin:4px 0 14px; }
.tarjeta h2 { font-size:13px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--suave); margin:14px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
.tarjeta h2 b { color:var(--tinta); font-size:15px; letter-spacing:0; text-transform:none; }
.pilotos { list-style:none; display:flex; flex-wrap:wrap; gap:6px; min-height:34px; }
.pilotos li { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.06); border:1px solid var(--borde); border-radius:99px; padding:4px 10px 4px 6px; font-size:13px; font-weight:800; }
.pilotos li i { width:14px; height:14px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(0,0,0,.35) inset; }
.pilotos li.yo { border-color:var(--oro2); }
.pilotos li em { font-style:normal; color:var(--suave); font-weight:700; }
.pilotos .vacio { color:var(--suave); font-weight:700; font-size:13px; padding:6px 0; background:none; border:0; }
.colores { display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; }
.color { aspect-ratio:1; border-radius:10px; border:2px solid rgba(255,255,255,.12); cursor:pointer; position:relative; min-height:28px; }
.color[aria-pressed="true"] { border-color:#fff; box-shadow:0 0 0 2px var(--oro2); transform:translateY(-1px); }
.color[disabled] { cursor:not-allowed; opacity:.28; }
.acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.acciones .btn { flex:1 1 auto; }
.staff { margin-top:12px; padding-top:12px; border-top:1px dashed var(--borde); }
.staff p { font-size:12px; font-weight:800; color:var(--oro2); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
.nota { font-size:13px; color:var(--suave); font-weight:700; line-height:1.45; margin-top:10px; }
.nota b { color:var(--tinta); }
.nota.ok { color:var(--ok); }
.nota.mal { color:var(--mal); }
.poderes { margin-top:12px; }
.poderes summary { cursor:pointer; font-size:13px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); list-style:none; padding:4px 0; }
.poderes summary::before { content:"▸ "; }
.poderes[open] summary::before { content:"▾ "; }
.poderes ul { list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
.poderes li { display:flex; gap:8px; align-items:flex-start; background:rgba(255,255,255,.04); border:1px solid var(--borde); border-radius:12px; padding:6px 8px; }
.poderes li img { width:28px; height:28px; flex:0 0 auto; }
.poderes li b { display:block; font-size:13px; font-weight:900; }
.poderes li span { display:block; font-size:12px; color:var(--suave); font-weight:700; line-height:1.3; }
/* podio */
.podio { display:flex; justify-content:center; align-items:flex-end; gap:8px; margin:8px 0 12px; }
.podio div { flex:1 1 0; max-width:140px; text-align:center; font-weight:900; font-size:13px; }
.podio .nom { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px; }
.podio .tie { display:block; color:var(--suave); font-size:12px; font-weight:800; margin-bottom:6px; font-variant-numeric:tabular-nums; }
.podio .peana { border-radius:14px 14px 6px 6px; font-size:30px; padding-top:8px; color:#1d1405; box-shadow:inset 0 2px 0 rgba(255,255,255,.4); }
.podio i.punto { display:block; width:30px; height:30px; margin:0 auto 6px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 0 18px rgba(255,255,255,.25); }
.tabla { list-style:none; display:grid; gap:4px; counter-reset:p 3; }
.tabla li { display:grid; grid-template-columns:30px 16px 1fr auto; gap:8px; align-items:center; background:rgba(255,255,255,.04); border:1px solid var(--borde); border-radius:10px; padding:5px 10px; font-size:13px; font-weight:800; }
.tabla li.yo { border-color:var(--oro2); }
.tabla li i { width:14px; height:14px; border-radius:50%; }
.tabla li em { font-style:normal; color:var(--suave); font-variant-numeric:tabular-nums; }
.mio { text-align:center; font-size:16px; font-weight:900; background:linear-gradient(90deg, rgba(217,164,65,.18), rgba(61,107,255,.18)); border:1px solid var(--borde); border-radius:14px; padding:10px; margin-bottom:10px; }
.error { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px; text-align:center; background:var(--fondo); }
.error div { max-width:460px; }
.error h1 { font-size:24px; margin-bottom:8px; }
.error p { color:var(--suave); font-weight:700; line-height:1.5; }

@media (max-width: 720px) {
  .capa { justify-content:center; padding:10px; align-items:flex-start; }
  .tarjeta { padding:16px 14px 14px; border-radius:18px; }
  .mapa { width:104px; height:104px; left:auto; right:10px; bottom:auto; top:58px; border-radius:12px; }
  .feed { top:auto; bottom:190px; right:10px; left:10px; width:auto; }
  .feed li { font-size:12px; padding:4px 8px; }
  .feed li:nth-child(n+3) { display:none; }
  .slot { bottom:auto; top:58px; left:10px; transform:none; min-width:0; padding:6px 10px 6px 6px; }
  .slot canvas { width:42px; height:42px; }
  .slot-tx b { font-size:13px; }
  .slot-tx span { font-size:11px; }
  .vel { display:none; }
  .arriba-izq { top:8px; left:8px; gap:6px; }
  .arriba-der { top:8px; right:8px; gap:6px; }
  .arriba-der .btn .tx { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .arriba-der .btn { width:40px; padding:0; }
  .arriba-der .btn.confirma { width:auto; padding:6px 10px; }
  .arriba-der .btn.confirma .tx { position:static; width:auto; height:auto; clip:auto; }
  .centro { white-space:normal; width:92vw; font-size:clamp(28px,9vw,92px); }
  .caja-hud { min-width:0; padding:4px 9px; }
  .caja-hud b { font-size:19px; }
  .caja-hud .et { font-size:9px; }
  .colores { grid-template-columns:repeat(10, 1fr); gap:4px; }
  .color { min-height:24px; border-radius:7px; }
  .poderes ul { grid-template-columns:1fr; }
  .centro { top:38%; }
}
@media (max-width: 720px) and (pointer: coarse) { .feed { bottom:120px; } }
@media (max-width: 430px) { .caja-hud.tiempo { display:none; } }
@media (prefers-reduced-motion: reduce) { .centro.pop, .feed li { animation:none; } }
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Pista de karts en 3D: el arpa de JMD Learning en el espacio"></canvas>

<div class="hud arriba-izq" id="hud-pos" hidden>
  <div class="caja-hud" id="h-caja-puesto"><span class="et">Posición</span><b id="h-puesto">–</b></div>
  <div class="caja-hud" id="h-caja-vuelta"><span class="et">Vuelta</span><b id="h-vuelta">1/3</b></div>
  <div class="caja-hud tiempo"><span class="et">Tiempo</span><b id="h-tiempo">0:00.0</b></div>
</div>
<div class="arriba-der">
  <button class="btn chico peligro" id="b-reiniciar" hidden><span aria-hidden="true">↺</span> <span class="tx">Reiniciar</span></button>
  <button class="btn chico" id="b-sonido" aria-pressed="false"><span class="ic" aria-hidden="true">🔊</span> <span class="tx">Silenciar</span></button>
</div>
<canvas class="mapa" id="mapa" aria-hidden="true"></canvas>
<div class="slot" id="slot" hidden>
  <canvas id="slot-ic" width="112" height="112" aria-hidden="true"></canvas>
  <div class="slot-tx"><b id="slot-nombre">Sin poder</b><span id="slot-ayuda">Toma una caja ?</span></div>
</div>
<div class="vel" id="vel" hidden><b id="h-vel">0</b><span>KM/H</span></div>
<ul class="feed" id="feed" aria-live="polite"></ul>
<div class="centro" id="centro" role="status" aria-live="assertive"></div>
<div class="aviso" id="aviso" role="status" hidden></div>
<div class="fps" id="fps" hidden></div>
<div class="tactil" id="tactil" hidden>
  <div class="grupo"><button id="t-izq" aria-label="Girar a la izquierda">◀</button><button id="t-der" aria-label="Girar a la derecha">▶</button></div>
  <div class="grupo"><button id="t-freno" aria-label="Frenar">Frenar</button><button id="t-poder" aria-label="Usar poder">Poder</button></div>
</div>
<div class="capa" id="capa"><div class="tarjeta" id="tarjeta"><p class="sub">Cargando la pista…</p></div></div>
<div class="error" id="error" hidden><div><h1>No se pudo abrir la pista</h1><p id="error-tx">El motor 3D no cargó. Recarga la página; si sigue igual, activa la aceleración por hardware del navegador o prueba con Chrome.</p></div></div>

<script>
  // Si el módulo no arranca (sin WebGL, sin red), que no quede una pantalla negra muda.
  setTimeout(function () { if (!window.__kartsListo) { var e = document.getElementById('error'); if (e) e.hidden = false; } }, 12000);
</script>
<script type="module">
import * as THREE from '../../comun/three.module.min.js';

'use strict';
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo'), AUTO = Q.has('auto'), VER_FPS = Q.has('fps');
const leccion = (location.pathname.match(/\/live\/([^/]+)\//) || [])[1] || 'ccp-03';
const API = '/api/v1/live/' + encodeURIComponent(leccion) + '/karts';
const VUELTAS = 3, MAXP = 20, DEMORA = 200;
const TACTIL = Q.has('tactil') || matchMedia('(pointer: coarse)').matches;
const REDUCIDO = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDif = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const lerp = (a, b, t) => a + (b - a) * t;
const r1 = (v) => Math.round(v * 10) / 10;
const ord = (n) => n + '.º';
const mmss = (ms) => { ms = Math.max(0, ms); const s = ms / 1000; return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + Math.floor((s * 10) % 10); };
const leer = (k, d) => { try { const v = localStorage.getItem('karts.' + k); return v == null ? d : v; } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem('karts.' + k, v); } catch (e) {} };
const dormirRes = { f: null };
const dormir = (ms) => new Promise((r) => { const t = setTimeout(() => { dormirRes.f = null; r(); }, ms); dormirRes.f = () => { clearTimeout(t); dormirRes.f = null; r(); }; });
const despertar = () => { if (dormirRes.f) dormirRes.f(); };

// ---------------------------------------------------------------- colores y poderes
const COLORES = ['#ff4d5e', '#3d6bff', '#ffb020', '#2fd27a', '#a66bff', '#00c8d7', '#ff6fb5', '#f2efe2', '#ff8a3d', '#8fe388',
  '#6f9bff', '#e8459a', '#c8de45', '#1fb5a8', '#d9a441', '#8e5bd6', '#ff7468', '#5fd8ff', '#9cc23b', '#f6a6c8'];
const NOMBRES_COLOR = ['rojo', 'azul', 'ámbar', 'verde', 'violeta', 'turquesa', 'rosa', 'marfil', 'naranja', 'menta',
  'celeste', 'fucsia', 'lima', 'verde azulado', 'dorado', 'morado', 'coral', 'cielo', 'oliva', 'rosa claro'];
const CODIGOS = ['', 'cache', 'subagente', 'compactar', 'haiku', 'opus', 'tokens', 'plan']; // el mismo orden que el servidor
const PODERES = {

    return ok({ estado: sim.estado, faltan_ms: Math.max(0, sim.sal - ahora), salida_ms: sim.sal, ahora_ms: ahora, cierre_ms: sim.fin1 ? sim.fin1 + 45000 : 0, vueltas: 3, max: 20, yo: 'yo-demo', staff: true, rv: sim.rv,
      pilotos: (sim.estado === 'lobby' ? [...sim.pil.values()].sort((a, b) => a.n - b.n) : lista).map((p, i) => ({ n: p.n, id: p.id, nombre: p.nombre, color: p.color, staff: p.staff, p: p.p, fin_ms: p.fin, puesto: i + 1, presente: true })) });
  }
  // /tick
  if (yoS && !c.sin) {
    yoS.x = c.x; yoS.z = c.z; yoS.a = c.a; yoS.v = c.v;
    if (sim.estado === 'corre' && !yoS.fin) {
      yoS.p = Math.max(0, Math.min(VUELTAS, c.p));
      if (yoS.p >= VUELTAS) { yoS.fin = ahora - sim.sal; if (!sim.fin1) sim.fin1 = ahora; simEv({ tp: 'meta', de: 0, a: [...sim.pil.values()].filter((x) => x.fin).length, ms: yoS.fin }); }
      if (c.caja != null && !yoS.poder) yoS.poder = LISTA_PODERES[Math.floor(Math.random() * LISTA_PODERES.length)];
      if (c.usa && yoS.poder) {
        const pw = yoS.poder; yoS.poder = ''; yoS.pw = pw; yoS.pwHasta = ahora + 5000;
        if (pw === 'subagente') { const obj = simOrden().find((x) => x !== yoS && !x.fin); if (obj) { simEv({ tp: 'poder', pw, de: 0, a: obj.n, ms: 1800 }); obj.lento = ahora + 3400; } }
        else if (pw === 'tokens') { for (const lado of [-5.5, 0, 5.5]) { const q = { x: c.x - Math.cos(c.a) * 9 - Math.sin(c.a) * lado, z: c.z - Math.sin(c.a) * 9 + Math.cos(c.a) * lado }; sim.obs.push([++sim.sigObs, q.x, q.z, ahora + 30000, 0]); } sim.ov++; simEv({ tp: 'poder', pw, de: 0, a: -1 }); }
        else simEv({ tp: 'poder', pw, de: 0, a: -1 });
      }
      if (c.golpe != null && sim.pil.get(c.golpe)) { const v = sim.pil.get(c.golpe); simEv({ tp: 'golpe', de: 0, a: v.n, pw: 'opus' }); v.lento = ahora + 1500; }
      if (c.toma != null) { const o = sim.obs.find((x) => x[0] === c.toma); if (o) { sim.obs = sim.obs.filter((x) => x !== o); sim.ov++; simEv({ tp: 'choque', de: o[4], a: 0, pw: 'tokens' }); } }
    }
  }
  const out = { e: sim.estado, t: ahora, sal: sim.sal, rv: sim.rv, ov: sim.ov, evn: sim.sigEv, orden: lista.map((p) => p.n),
    k: lista.map((p) => [p.n, r1(p.x), r1(p.z), Math.round(p.a * 100) / 100, r1(p.v), p.p, CODIGOS.indexOf(p.pwHasta > ahora ? p.pw : '') | (p.fin ? 16 : 0), 0]) };
  if (sim.fin1) out.cierre = sim.fin1 + 45000;
  if (c.rv !== sim.rv) out.r = [...sim.pil.values()].map((p) => [p.n, p.nombre, p.color, p.staff, p.grilla]);
  if (c.ov !== sim.ov) out.ob = sim.obs.map((o) => [o[0], r1(o[1]), r1(o[2])]);
  if (c.ev >= 0) out.ev = sim.ev.filter((e) => e.id > c.ev);
  if (yoS) out.yo = { n: 0, poder: yoS.poder, activo: '', hasta: 0, p: yoS.p, fin_ms: yoS.fin, puesto: lista.indexOf(yoS) + 1, dueno: true, grilla: yoS.grilla, x: yoS.x, z: yoS.z, a: yoS.a };
  return ok(out);
}

// ---------------------------------------------------------------- bucle principal
const reloj = { prev: performance.now(), cuadros: 0, acum: 0, fps: 60, bajo: 0, mapa: 0, t: 0 };
function redimensionar() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camara.aspect = w / h;
  camara.fov = w < h ? 78 : 68; camara.updateProjectionMatrix(); mapaTam = 0;
}
addEventListener('resize', redimensionar); redimensionar();
function cuadro(tms) {
  requestAnimationFrame(cuadro);
  const dt = Math.min(0.05, Math.max(0, (tms - reloj.prev) / 1000)); reloj.prev = tms; reloj.t += dt;
  // cuadros por segundo y calidad adaptable (si la laptop sufre, baja la resolución interna)
  reloj.cuadros++; reloj.acum += dt;
  if (reloj.acum >= 1) {
    reloj.fps = reloj.cuadros / reloj.acum; reloj.cuadros = 0; reloj.acum = 0;
    if (reloj.fps < 48 && !document.hidden) { if (++reloj.bajo >= 3 && PR > 0.75) { PR = Math.max(0.75, PR - 0.25); renderer.setPixelRatio(PR); redimensionar(); reloj.bajo = 0; } } else reloj.bajo = 0;
    if (VER_FPS) { $('fps').hidden = false; $('fps').textContent = `${Math.round(reloj.fps)} cuadros/s · ${karts.size} karts · ${red.rtt} ms · ${red.ticks} envíos/s · resolución ${PR}`; }
    red.ticksSeg = red.ticks; red.ticks = 0;
  }
  const ahora = ahoraSrv();
  // temporizadores de poderes y golpes
  for (const k of ['turboT', 'padT', 'haikuT', 'opusT', 'escudoT', 'planT', 'lentoT', 'giroT', 'invulT']) if (yo[k] > 0) yo[k] = Math.max(0, yo[k] - dt);
  if (ruleta > 0) { ruleta -= dt; if (ruleta <= 0) { if (cajaEnviada || pend.caja != null) ruleta = 0.05; else { ruleta = 0; poderMano = ruletaRes || poderMano; if (poderMano) SFX.listo(); } } }
  if (enCarrera() || (estado === 'corre' && soyPiloto && colocado && dueno && yo.fin)) fisica(dt, ahora);
  dibujarMundo(dt, ahora, reloj.t);
  moverCamara(dt, ahora);
  pintarHud(ahora, reloj.t);
  if (++reloj.mapa % 2 === 0 && !$('mapa').hidden) dibujarMapa();
  if (motor && AC) {
    const activo = (estado === 'corre' || estado === 'cuenta') && soyPiloto && colocado && dueno && !mudo;
    const v = Math.abs(yo.v), f = 46 + v * 2.1 + (yo.turboT > 0 || yo.padT > 0 ? 28 : 0) - (yo.opusT > 0 ? 14 : 0) + (yo.haikuT > 0 ? 20 : 0), t = AC.currentTime;
    motor.o1.frequency.setTargetAtTime(f, t, 0.05); motor.o2.frequency.setTargetAtTime(f * 0.501, t, 0.05);
    motor.filtro.frequency.setTargetAtTime(240 + v * 22, t, 0.08); motor.g.gain.setTargetAtTime(activo ? 0.035 + Math.min(0.03, v / 1500) : 0, t, 0.15);
  }
  renderer.render(escena, camara);
  window.__karts = { fps: Math.round(reloj.fps), estado, karts: karts.size, puesto: miPuesto, p: Math.round(yo.p * 1000) / 1000, fin: yo.fin, finSrv, poder: poderMano, dueno, soyPiloto, ticks: red.ticksSeg, rtt: red.rtt, pr: PR, obstaculos: obstaculos.length, orden: orden.slice(), colocado };
}
requestAnimationFrame(cuadro);
// para pruebas: dónde ve esta pestaña a cada kart y cuántos eventos recibió
window.__kartsDbg = () => ({ yoN, yo: { x: yo.x, z: yo.z, v: yo.v }, eventos: { ...cuentaEv }, karts: [...karts.values()].map((k) => [k.n, Math.round(k.x * 10) / 10, Math.round(k.z * 10) / 10, k.pw]) });
window.__kartsListo = true;
$('cv').focus({ preventScroll: true });
if (DEMO) { sim.pil.set(0, { n: 0, id: 'yo-demo', nombre: 'Profe (demo)', color: Math.max(0, miColor), staff: true, grilla: 0, x: 0, z: 0, a: 0, v: 0, p: 0, fin: 0, poder: '', pw: '', pwHasta: 0 }); }
bucleRed();
if (DEMO && Q.has('salir')) { setTimeout(() => iniciar(), 600); }
</script>
