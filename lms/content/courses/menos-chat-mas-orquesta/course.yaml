id: menos-chat-mas-orquesta
title: "Menos chat, más orquesta"
description: >
  Clase en vivo para profesionales que ya usan la IA por chat. Chatear con un modelo no es lo mismo que
  orquestar varios agentes: un planificador, tres ejecutores Qwen en local, un verificador por capas con un
  oráculo oculto y un gate final. Con los números y los fallos reales de una orquesta construida hoy.
cohorts: [menos-chat-mas-orquesta-1]
requisitos:
  - Una cuenta en jmd-learn.online
  - Haber usado alguna vez un chat de IA
dedicacion: "Una sesión en vivo por Zoom, miércoles 18 de noviembre de 6:15 a 7:25 pm"

modules:
  - id: clase
    title: "Menos chat, más orquesta"
    lessons: [mco-01]

