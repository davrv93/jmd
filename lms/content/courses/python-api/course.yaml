id: python-api
title: "🐍 Python: de cero a tu API"
description: >
  Curso gratuito en vivo: entorno profesional (varias versiones de Python, venv y Docker),
  sintaxis y estructuras de datos, y tu propia API con FastAPI y Django documentada en Swagger,
  servida con Gunicorn. Tres clases: jueves 12, 19 y 26 de noviembre, de 7:30 a 9:30 pm.
cohorts: [python-api-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Una API de inventario (listar, ver, crear, editar y borrar productos) hecha en FastAPI y en
  Django, documentada en Swagger y corriendo con Gunicorn dentro de Docker.
requisitos:
  - Una laptop con Windows, macOS o Linux (8 GB de RAM recomendado)
  - Python 3 y Docker Desktop instalados
  - No hace falta saber programar
dedicacion: "3 clases en vivo (12, 19 y 26 de noviembre), 7:30 a 9:30 pm · gratis; certificado opcional S/ 15"
# Inscripción: jmd-learn.online/halamadrid (código HALA MADRID) o /inscripcion/python-api-1/.

modules:
  - id: s1
    title: "Clase 1 · Entorno profesional y sintaxis esencial"
    lessons: [py-01]
  - id: s2
    title: "Clase 2 · Estructuras de datos y tu API con FastAPI"
    lessons: [py-02]
  - id: s3
    title: "Clase 3 · Django, Gunicorn y despliegue con Docker"
    lessons: [py-03]
