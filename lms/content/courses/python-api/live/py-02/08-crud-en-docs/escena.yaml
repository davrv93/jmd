id: 08-crud-en-docs
titulo: Tu CRUD en /docs
fase: experimentacion
paso: swagger
duracion_min: 12
lo_logre: true
# La escena registra la evidencia «hallazgo» cuando el alumno publica en el muro lo que dijo el 422.
evidencia: hallazgo
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Body del producto 1", cmd: "{\"nombre\": \"Arroz\", \"precio\": 4.5, \"stock\": 40, \"categoria\": \"abarrotes\"}"}
  - {titulo: "Body del producto 2", cmd: "{\"nombre\": \"Detergente\", \"precio\": 6.5, \"stock\": 2, \"categoria\": \"limpieza\"}"}
  - {titulo: "Body para editar el 1 (PUT)", cmd: "{\"nombre\": \"Arroz\", \"precio\": 5.2, \"stock\": 38, \"categoria\": \"abarrotes\"}"}
  - {titulo: "Body malo (para ver el 422)", cmd: "{\"nombre\": \"Aceite\", \"precio\": -3, \"stock\": \"muchos\", \"categoria\": \"abarrotes\"}"}
