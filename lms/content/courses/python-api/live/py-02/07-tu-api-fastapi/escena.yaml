id: 07-tu-api-fastapi
titulo: Tu API con FastAPI
fase: experimentacion
paso: fastapi
duracion_min: 15
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Windows: carpeta del proyecto", cmd: "mkdir mi-api; cd mi-api"}
  - {titulo: "Windows: crear el venv", cmd: "py -m venv .venv"}
  - {titulo: "Windows: activarlo (PowerShell)", cmd: ".venv\\Scripts\\Activate.ps1"}
  - {titulo: "macOS y Linux: carpeta del proyecto", cmd: "mkdir mi-api && cd mi-api"}
  - {titulo: "macOS y Linux: crear el venv", cmd: "python3 -m venv .venv"}
  - {titulo: "macOS y Linux: activarlo", cmd: "source .venv/bin/activate"}
  - {titulo: "Instalar FastAPI", cmd: "pip install \"fastapi[standard]\""}
  - {titulo: "Crear main.py en VS Code", cmd: "code main.py"}
  - {titulo: "Levantar la API", cmd: "fastapi dev main.py"}
  - {titulo: "Si el puerto 8000 está ocupado", cmd: "fastapi dev main.py --port 8001"}
