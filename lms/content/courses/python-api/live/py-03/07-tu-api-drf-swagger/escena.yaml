id: 07-tu-api-drf-swagger
titulo: Tu API con Django REST Framework y Swagger
fase: experimentacion
paso: drf
duracion_min: 15
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
# Verificado el 26-11-2026 (Django 6.1.3, djangorestframework 3.18.3, drf-spectacular 0.30.0, Python 3.13):
# GET 200, POST 201, GET uno 200, PUT 200, PATCH 200, DELETE 204 (luego 404), body malo 400, /api/docs/ 200.
comandos:
  - {titulo: "Instalar DRF y drf-spectacular", cmd: "pip install djangorestframework drf-spectacular"}
  - {titulo: "Crear serializers.py", cmd: "code inventario/serializers.py"}
  - {titulo: "Levantar el servidor", cmd: "python manage.py runserver"}
  - {titulo: "Swagger de Django", cmd: "http://127.0.0.1:8000/api/docs/"}
  - {titulo: "Body nuevo (POST)", cmd: "{\"nombre\": \"Aceite\", \"precio\": 9.9, \"stock\": 15, \"categoria\": \"abarrotes\"}"}
  - {titulo: "Body para editar el 1 (PUT)", cmd: "{\"nombre\": \"Arroz\", \"precio\": 5.2, \"stock\": 38, \"categoria\": \"abarrotes\"}"}
  - {titulo: "Body malo (para ver el 400)", cmd: "{\"nombre\": \"Aceite\", \"precio\": -3, \"stock\": \"muchos\", \"categoria\": \"abarrotes\"}"}
