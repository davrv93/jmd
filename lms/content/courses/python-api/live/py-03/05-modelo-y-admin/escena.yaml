id: 05-modelo-y-admin
titulo: Tu modelo y el panel de administración
fase: experimentacion
paso: admin
duracion_min: 12
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
# Verificado el 26-11-2026 (Django 6.1.3, Python 3.13): 0001_initial, migrate OK, admin con búsqueda y filtro,
# y precio -3 rechazado con «Asegúrese de que este valor es mayor o igual a 0.01.».
comandos:
  - {titulo: "Abrir el modelo en VS Code", cmd: "code inventario/models.py"}
  - {titulo: "Crear la migración", cmd: "python manage.py makemigrations"}
  - {titulo: "Aplicar las migraciones", cmd: "python manage.py migrate"}
  - {titulo: "Crear tu usuario administrador", cmd: "python manage.py createsuperuser"}
  - {titulo: "Abrir admin.py en VS Code", cmd: "code inventario/admin.py"}
  - {titulo: "Levantar el servidor", cmd: "python manage.py runserver"}
  - {titulo: "Panel de administración", cmd: "http://127.0.0.1:8000/admin/"}
