id: 03-tu-proyecto-django
titulo: Tu proyecto Django
fase: experimentacion
paso: django
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
# Verificado el 26-11-2026 con Python 3.13 (Django 6.1.3) y 3.15. Con Python 3.10 u 3.11, pip instala Django 5.2 LTS.
comandos:
  - {titulo: "Windows: carpeta junto a mi-api", cmd: "mkdir mi-django; cd mi-django"}
  - {titulo: "Windows: crear el venv", cmd: "py -m venv .venv"}
  - {titulo: "Windows: activarlo (PowerShell)", cmd: ".venv\\Scripts\\Activate.ps1"}
  - {titulo: "macOS y Linux: carpeta junto a mi-api", cmd: "mkdir mi-django && cd mi-django"}
  - {titulo: "macOS y Linux: crear el venv", cmd: "python3 -m venv .venv"}
  - {titulo: "macOS y Linux: activarlo", cmd: "source .venv/bin/activate"}
  - {titulo: "Instalar Django", cmd: "pip install django"}
  - {titulo: "Ver la versión", cmd: "django-admin --version"}
  - {titulo: "Crear el proyecto (con el punto)", cmd: "django-admin startproject config ."}
  - {titulo: "Crear la app del inventario", cmd: "python manage.py startapp inventario"}
  - {titulo: "Abrir la carpeta en VS Code", cmd: "code ."}
  - {titulo: "Levantar el servidor de desarrollo", cmd: "python manage.py runserver"}
  - {titulo: "Si el puerto 8000 está ocupado", cmd: "python manage.py runserver 8001"}
