id: 09-gunicorn-y-docker
titulo: Gunicorn y Docker con las dos APIs
fase: experimentacion
paso: servir
duracion_min: 15
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
# Verificado el 26-11-2026 en macOS con Docker Desktop 28.1.1: gunicorn 27.0.1, whitenoise 6.12.0, uvicorn-worker 0.4.0,
# imagen python:3.13-slim. FastAPI en :8000 (/docs 200, POST 201) y Django en :8001 (/api/docs/ 200, POST 201,
# DELETE 204, body malo 400, CSS del admin 200 con DJANGO_DEBUG=0). Gunicorn no corre en Windows nativo (importa fcntl).
comandos:
  - {titulo: "Instalar Gunicorn y WhiteNoise", cmd: "pip install gunicorn whitenoise"}
  - {titulo: "macOS y Linux: servir Django con Gunicorn", cmd: "gunicorn config.wsgi"}
  - {titulo: "Juntar los archivos estáticos", cmd: "python manage.py collectstatic"}
  - {titulo: "Windows (opcional): servidor que sí corre en Windows", cmd: "pip install waitress"}
  - {titulo: "Windows (opcional): servir con waitress", cmd: "waitress-serve --listen=127.0.0.1:8000 config.wsgi:application"}
  - {titulo: "Subir a la carpeta del curso", cmd: "cd .."}
  - {titulo: "Crear el docker-compose.yml", cmd: "code docker-compose.yml"}
  - {titulo: "Levantar las dos APIs", cmd: "docker compose up --build"}
  - {titulo: "Ver los contenedores (otra terminal)", cmd: "docker compose ps"}
  - {titulo: "Swagger de FastAPI", cmd: "http://localhost:8000/docs"}
  - {titulo: "Swagger de Django", cmd: "http://localhost:8001/api/docs/"}
  - {titulo: "Apagar y borrar los contenedores", cmd: "docker compose down"}
