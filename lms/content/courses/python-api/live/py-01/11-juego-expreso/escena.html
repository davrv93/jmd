<!--
  «Fábrica Python» · juego de la clase 1 de «Python: de cero a tu API», sobre el motor Arena JMD (docs/ARENA_JMD.md).
  Cada alumno es un robot JMD en la misma fábrica y ve a los demás moverse en vivo. Por el piso hay bloques de
  código: líneas de programas, de comandos de venv y de Dockerfiles. Hay cuatro talleres (Scripts, Decisiones,
  venv y Docker); cada uno arma UN programa a la vez, entre toda la clase, y lo muestra en su pantalla.
  - Llevas un bloque a su taller y entra si es la línea que sigue (Python lee de arriba abajo). Si todavía no le
    toca, esperas en el taller y entra solo cuando llega la anterior: así se forman las cadenas de robots.
  - Algunos bloques traen un bug (falta «:», sangría, = en vez de ==, el comando del otro sistema…). Si lo metes
    al taller, la lupa te dice por qué fallaría (0 pts, nunca resta). Si lo llevas al Depurador, +10.
  - Cuando se pone la última línea, el programa CORRE: la pantalla muestra su salida, quien lo cerró gana +20 y
    todos los que pusieron una línea, +5. La meta del grupo cuenta programas que corren.
  - Los bugs voladores solo te hacen soltar el bloque.

  Sin estado propio en el servidor: el avance de cada taller sale de las VERSIONES de sus bloques. El bloque de la
  línea j de un taller, en su versión v, es la línea j del programa nº v de ese taller. El programa en curso es la
  versión más baja entre sus bloques; la línea que sigue, el primer bloque que sigue en esa versión. Como solo
  quien lleva un bloque puede consumirlo, dos robots nunca ponen la misma línea. Por eso todos los programas de un
  mismo taller tienen el mismo número de líneas.

  Al final: título, reflexión al muro (py01-juego) y la fotito. Guarda py01-ultimo para la insignia (16-insignia).
  ?demo=1 entra solo; ?sinred=1 fuerza la práctica local; ?fps=1 muestra los cuadros por segundo.
-->

        return { rechazar: true, mensaje: "Sin bug: llévalo al " + T.nombre };
      }
      if (zona.taller !== ob.s) return { rechazar: true, mensaje: "Este bloque va al " + T.nombre + " (" + T.donde + ")" };
      if (ob.bug) {
        mio.metidos[ob.tr.tipo] = (mio.metidos[ob.tr.tipo] || 0) + 1;
        return { ok: false, puntos: 0, meta: false, titulo: "¡Bug! Así no corre", explicacion: TRAMPAS[ob.tr.tipo].n + ": " + ob.tr.por,
          real: "Así sí: " + vis(pr.l[ob.tr.j]), feed: "aprendió de un bug: " + TRAMPAS[ob.tr.tipo].n.toLowerCase() };
      }
      var e = estado(ob.s);
      if (ob.k > e.kc) {
        lupaUnaVez(ob.id + "@" + ob.v, { tipo: "espera", icono: "⏳", titulo: "Ese programa viene después", ms: 5000,
          texto: "El taller está terminando " + corto(e.prog) + ". Quédate aquí y tu bloque entra solo cuando le toque, o suéltalo (Espacio) y ayuda a terminar el actual." });
        return { rechazar: true, mensaje: "⏳ Espera aquí: entra cuando corra " + corto(e.prog) };
      }
      if (ob.j !== e.sig) {
        lupaUnaVez(ob.id + "@" + ob.v, { tipo: "espera", icono: "⏳", titulo: "Todavía no le toca: falta la línea " + (e.sig + 1), ms: 6000,
          texto: ((pr.a && pr.a[e.sig]) || "Python lee de arriba abajo: primero va lo que se necesita.") + " Quédate aquí y tu bloque entra solo cuando llegue la línea " + (e.sig + 1) + ", o suéltalo (Espacio) y búscala tú." });
        return { rechazar: true, mensaje: "⏳ Espera aquí: falta la línea " + (e.sig + 1) };
      }
      var clave = ob.s + ":" + ob.k;
      mio.lineas++; mio.progs[clave] = true;
      if (e.puestas === T.L - 1) {
        mio.cerrados++; VIG.celebrados[clave] = true; VIG.hechos[clave] = true;
        return { ok: true, puntos: 20, meta: 1, titulo: "¡Corrió " + corto(pr) + "! +20", explicacion: "Pusiste la última línea y el programa corrió.",
          real: "Salida › " + pr.o.split("\n").join("  ⏎  "), feed: "¡hizo correr " + corto(pr) + "! 🎉" };
      }
      return { ok: true, puntos: 10, meta: false, titulo: "Línea " + (ob.j + 1) + " en su sitio · +10", feed: "puso la línea " + (ob.j + 1) + " de " + corto(pr) };
    },
    alTomar: function () { mio.tomado = performance.now(); },
    alEntregar: function (ob, z, res) { if (res.meta === 1) juego.anuncio("¡Corrió!", corto(ob.prog) + " · +1 a la meta"); },
    meta: { contador: "corren", texto: "Programas que corren", objetivo: function (n) { return n <= 1 ? 2 : Math.round(2 + n * 0.9); }, logro: "¡la fábrica cumplió su meta de programas!" },
    reflexion: { clave: "py01-juego", pregunta: "¿Qué bug te cazó y cómo lo reconoces ahora?", placeholder: "Olvidé los dos puntos del if: ahora miro el final de la línea",
      porDefecto: "Python lee de arriba abajo: cada línea en su lugar." },
    alReflexion: function (t) { guardarLocal("muro-py01-juego", t); },
    alRonda: function () { reiniciarMio(); },
    resultado: function (s) {
      var corrieron = Object.keys(mio.progs).filter(function (k) { return VIG.hechos[k]; }).length;
      var peor = "", n = 0;
      Object.keys(mio.metidos).forEach(function (k) { if (mio.metidos[k] > n) { n = mio.metidos[k]; peor = k; } });
      var titulo = corrieron >= 4 && mio.bugs >= 2 ? "Mente de intérprete" : mio.bugs >= 3 ? "Cazabugs de la fábrica" : corrieron >= 3 ? "Pieza clave de la fábrica"
        : mio.lineas >= 1 ? "Primeras líneas en Python" : mio.bugs >= 1 ? "Ojo para los bugs" : "De visita en la fábrica";
      var mejor = Math.max(leerLocal("mejor-fabrica", 0), corrieron);
      guardarLocal("mejor-fabrica", mejor);
      guardarLocal("ultimo", { juego: "fabrica", programas: corrieron, lineas: mio.lineas, bugs: mio.bugs, titulo: titulo, mejor: mejor, peor: peor });
      return {
        etiqueta: "Mi turno en la fábrica", titulo: titulo,
        resultado: corrieron + (corrieron === 1 ? " programa corrió" : " programas corrieron") + " con mis líneas",
        detalle: mio.lineas + (mio.lineas === 1 ? " línea" : " líneas") + " en su sitio · " + mio.bugs + (mio.bugs === 1 ? " bug cazado" : " bugs cazados") + " · " + juego.puntos + " pts"
          + (peor ? " · repasa: " + TRAMPAS[peor].n.toLowerCase() : ""),
      };
    },
  });
  setInterval(vigilar, 150);
  vigilar();
  // Solo lectura, para las pruebas con Playwright (como window.__arenaJMD del motor).
  window.__fabrica = {
    bloque: function (id) { var d = juego.objeto(id); return { id: d.id, v: d.v, x: d.x, y: d.y, s: d.s, bug: d.bug, j: d.j, k: d.k, linea: d.linea }; },
    estado: function () { return TALLERES.map(function (T, s) { var e = estado(s); return { taller: T.id, programa: e.kc, prog: e.prog.f, sig: e.sig, puestas: e.puestas }; }); },
    mio: function () { return JSON.parse(JSON.stringify(mio)); },
    talleres: TALLERES.map(function (T) { return { mat: T.mat }; }), depurador: DEPURADOR, bloques: OBJS.length, prefijo: PREF,
  };
})();
