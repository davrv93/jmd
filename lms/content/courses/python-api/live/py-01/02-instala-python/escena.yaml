id: 02-instala-python
titulo: Instala Python 3
fase: experiencia
paso: instalar
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Windows: instalar Python 3.13", cmd: "winget install -e --id Python.Python.3.13"}
  - {titulo: "Windows: comprobar", cmd: "py --version"}
  - {titulo: "macOS: instalar con Homebrew", cmd: "brew install python@3.13"}
  - {titulo: "Linux (Ubuntu o Debian): instalar", cmd: "sudo apt update && sudo apt install -y python3 python3-venv python3-pip"}
  - {titulo: "macOS y Linux: comprobar", cmd: "python3 --version"}
  - {titulo: "Comprobar Docker", cmd: "docker --version"}
