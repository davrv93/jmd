id: 13-docker-dos-versiones
titulo: Tu script en 3.11 y 3.13
fase: experimentacion
paso: docker
duracion_min: 12
lo_logre: true
evidencia: hallazgo
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "macOS y Linux: correr hola.py en Python 3.11", cmd: "docker run --rm -v \"$PWD\":/app -w /app python:3.11 python hola.py"}
  - {titulo: "macOS y Linux: correr hola.py en Python 3.13", cmd: "docker run --rm -v \"$PWD\":/app -w /app python:3.13 python hola.py"}
  - {titulo: "Windows (PowerShell): correr hola.py en Python 3.11", cmd: "docker run --rm -v \"${PWD}:/app\" -w /app python:3.11 python hola.py"}
  - {titulo: "Windows (PowerShell): correr hola.py en Python 3.13", cmd: "docker run --rm -v \"${PWD}:/app\" -w /app python:3.13 python hola.py"}
  - {titulo: "Contenido del Dockerfile", cmd: "FROM python:3.13-slim\nWORKDIR /app\nCOPY hola.py .\nCMD [\"python\", \"hola.py\"]\n"}
  - {titulo: "Construir y correr la imagen", cmd: "docker build -t hola . && docker run --rm hola"}
