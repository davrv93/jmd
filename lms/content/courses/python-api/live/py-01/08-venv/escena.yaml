id: 08-venv
titulo: Un venv por proyecto
fase: conceptualizacion
paso: venv
duracion_min: 12
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Windows: crear el venv", cmd: "py -3.13 -m venv .venv"}
  - {titulo: "Windows: activarlo (PowerShell)", cmd: ".venv\\Scripts\\Activate.ps1"}
  - {titulo: "Windows: si PowerShell bloquea el script", cmd: "Set-ExecutionPolicy -Scope CurrentUser RemoteSigned"}
  - {titulo: "macOS y Linux: crear el venv", cmd: "python3 -m venv .venv"}
  - {titulo: "macOS y Linux: activarlo", cmd: "source .venv/bin/activate"}
  - {titulo: "Instalar una librería", cmd: "pip install requests"}
  - {titulo: "Anotar las dependencias", cmd: "pip freeze > requirements.txt"}
  - {titulo: "Reinstalar en otra máquina", cmd: "pip install -r requirements.txt"}
  - {titulo: "Salir del venv", cmd: "deactivate"}
