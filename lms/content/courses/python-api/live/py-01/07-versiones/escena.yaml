id: 07-versiones
titulo: Varias versiones, en paz
fase: conceptualizacion
paso: versiones
duracion_min: 10
lo_logre: true
evidencia: captura
umbral_pct: 80
compuerta: lo_logre
comandos:
  - {titulo: "Windows: instalar también 3.11", cmd: "winget install -e --id Python.Python.3.11"}
  - {titulo: "Windows: ver las versiones", cmd: "py -0p"}
  - {titulo: "Windows: correr con 3.11", cmd: "py -3.11 --version"}
  - {titulo: "macOS: instalar pyenv", cmd: "brew install pyenv"}
  - {titulo: "macOS: conectar pyenv a zsh (luego abre otra terminal)", cmd: "echo 'export PYENV_ROOT=\"$HOME/.pyenv\"' >> ~/.zshrc\necho '[[ -d $PYENV_ROOT/bin ]] && export PATH=\"$PYENV_ROOT/bin:$PATH\"' >> ~/.zshrc\necho 'eval \"$(pyenv init - zsh)\"' >> ~/.zshrc"}
  - {titulo: "Linux: herramientas para compilar", cmd: "sudo apt update && sudo apt install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev"}
  - {titulo: "Linux: instalar pyenv", cmd: "curl -fsSL https://pyenv.run | bash"}
  - {titulo: "Linux: conectar pyenv a bash (luego abre otra terminal)", cmd: "echo 'export PYENV_ROOT=\"$HOME/.pyenv\"' >> ~/.bashrc\necho '[[ -d $PYENV_ROOT/bin ]] && export PATH=\"$PYENV_ROOT/bin:$PATH\"' >> ~/.bashrc\necho 'eval \"$(pyenv init - bash)\"' >> ~/.bashrc"}
  - {titulo: "macOS y Linux: 3.11 en esta carpeta", cmd: "pyenv install 3.11.10 && pyenv local 3.11.10 && python --version"}
