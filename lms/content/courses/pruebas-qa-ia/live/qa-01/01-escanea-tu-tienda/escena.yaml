id: "01-escanea-tu-tienda"
titulo: "Abre tu Tienda Sol en la nube y escanéala con la IA"
fase: experiencia
paso: ver
duracion_min: 7
lo_logre: true
evidencia: ninguna
umbral_pct: 100
compuerta: lo_logre
comandos:
  - titulo: "Instala solo las pruebas (en pruebas/)"
    cmd: "npm install && npx playwright install chromium"
  - titulo: "Escanea tu tienda de la nube (Windows: $env:BASE_URL=\"…\" y luego npm run escanear)"
    cmd: "BASE_URL=https://jmd-learn.online/tienda-sol/TU_CODIGO npm run escanear"
  - titulo: "Deja que Claude Code maneje el navegador (Playwright MCP)"
    cmd: "claude mcp add playwright -- npx @playwright/mcp@latest"
