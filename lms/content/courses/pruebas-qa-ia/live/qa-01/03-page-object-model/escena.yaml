id: 03-page-object-model
titulo: "Page Object Model: un cambio de diseño, una sola edición"
fase: conceptualizacion
paso: pom
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Instalar Playwright en el proyecto"
    cmd: "cd pruebas && npm install && npx playwright install chromium"
  - titulo: "Grabar localizadores mientras navegas"
    cmd: "npx playwright codegen localhost:3000"
  - titulo: "Correr solo la prueba de login"
    cmd: "npx playwright test specs/login.spec.ts --project=chromium"
