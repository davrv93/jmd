id: "16-informe-de-pruebas"
titulo: "El informe de pruebas"
fase: conceptualizacion
paso: entregar
duracion_min: 6
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Correr la suite (deja resultados/resultados.json)"
    cmd: "npm test"
  - titulo: "Redacta informe/datos.json y genera el Word"
    cmd: "npm run informe"
  - titulo: "Revisarlo como jefe de QA (marcadores, veredicto, defectos Alta citados)"
    cmd: "npm run informe:revisar"
  - titulo: "Abrirlo (Windows: start informe-de-pruebas.docx)"
    cmd: "open ../informe/informe-de-pruebas.docx"
