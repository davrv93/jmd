id: 08-ia-y-tarea
titulo: "La IA propone, el runner decide: tarea e insignia"
fase: experimentacion
paso: entregar
duracion_min: 10
lo_logre: false
evidencia: ninguna
compuerta: ninguna
comandos:
  - titulo: "Agentes de prueba de Playwright (planner, generator, healer)"
    cmd: "npx playwright init-agents --loop=claude --project=chromium"
  - titulo: "Playwright MCP para tu agente"
    cmd: "claude mcp add playwright -- npx @playwright/mcp@latest"
  - titulo: "Romper a propósito: verla fallar antes de confiar"
    cmd: "npx playwright test specs/venta.spec.ts --project=chromium --retries=0"
  - titulo: "Subir la tarea"
    cmd: "git add pruebas docs EVIDENCIA.md && git commit -m \"taller QA: E2E con POM, bug y portal\" && git push"
tareas:
  - {id: T1, titulo: "E2E de login y venta con POM, en verde"}
  - {id: T2, titulo: "Un bug encontrado con su caso en rojo"}
  - {id: T3, titulo: "Portal de resultados generado"}
  - {id: T4, titulo: "Dashboard con alerta configurada"}
