id: 06-portal-y-trace
titulo: "Portal de resultados y reproducción paso a paso"
fase: experiencia
paso: portal
duracion_min: 15
lo_logre: true
evidencia: ninguna
umbral_pct: 100
compuerta: lo_logre
comandos:
  - titulo: "Guardar el trace solo cuando la prueba falla (playwright.config.ts)"
    cmd: "use: { trace: 'retain-on-failure', screenshot: 'only-on-failure' }"
  - titulo: "Correr la suite y generar el portal (el JSON queda en resultados/)"
    cmd: "npm test ; npm run portal"
  - titulo: "Abrir el reporte HTML"
    cmd: "npx playwright show-report"
  - titulo: "Reproducir un caso paso a paso"
    cmd: "npx playwright show-trace test-results/*VEN-002*/trace.zip"
