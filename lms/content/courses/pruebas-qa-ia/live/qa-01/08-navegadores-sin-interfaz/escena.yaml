id: "08-navegadores-sin-interfaz"
titulo: "Navegadores sin interfaz: Chromium, Lightpanda y Obscura"
fase: conceptualizacion
paso: motores
duracion_min: 12
lo_logre: true
evidencia: ninguna
umbral_pct: 80
compuerta: lo_logre
comandos:
  - titulo: "Levantar Lightpanda (9222) y Obscura (9223) con Docker"
    cmd: "cd motores && docker compose up -d"
  - titulo: "Medir la RAM de cada motor mientras corre la suite"
    cmd: "docker stats --no-stream"
  - titulo: "La misma suite en los tres motores"
    cmd: "npm run test:chromium && npm run test:lightpanda && npm run test:obscura"
