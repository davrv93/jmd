id: "11-semilla-del-usuario"
titulo: "Reproduce exactamente el error del usuario (con su consentimiento)"
fase: experiencia
paso: portal
duracion_min: 8
lo_logre: true
evidencia: ninguna
umbral_pct: 100
compuerta: lo_logre
comandos:
  - titulo: "Ver las sesiones grabadas y reproducirlas paso a paso"
    cmd: "open http://localhost:3000/reproducir.html    # Windows: start http://localhost:3000/reproducir.html"
  - titulo: "Correr la prueba generada desde la grabación (rojo = reproduce el bug)"
    cmd: "npx playwright test specs/reproducir-*.spec.ts --project=chromium"
  - titulo: "La misma prueba contra la app corregida (verde)"
    cmd: "BUGS=0 npx playwright test specs/reproducir-*.spec.ts --project=chromium"
