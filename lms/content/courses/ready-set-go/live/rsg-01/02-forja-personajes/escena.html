<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #14111c; color: #f5f0ff; font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  ol { display: flex; gap: 6px 18px; flex-wrap: wrap; list-style: none; padding: 8px 14px; border-bottom: 1px solid #322b45; counter-reset: paso; }
  li { display: flex; gap: 7px; align-items: center; }
  li::before { counter-increment: paso; content: counter(paso); flex: none; width: 20px; height: 20px; border-radius: 50%; background: #c6ff4a; color: #1a2400; font-weight: 800; font-size: 12px; display: grid; place-items: center; }
  b { color: #c6ff4a; }
  iframe { flex: 1; width: 100%; border: 0; min-height: 0; }
</style>
</head>
<body>
<ol>
  <li>Describe tu héroe arriba y pulsa <b>Forjar</b></li>
  <li>Afínalo con el muelle de la izquierda</li>
  <li>Pruébalo en <b>Juegos</b> (tecla V: rayos X)</li>
  <li>Publícalo en la <b>Galería</b>, sala <b>rsg-01</b>, y vota</li>
