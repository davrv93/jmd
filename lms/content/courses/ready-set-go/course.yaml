id: ready-set-go
title: "🎮 Ready Set Go! Haz tu videojuego con IA de forma profesional"
description: >
  Taller en vivo (S/ 30; con la hackathon del domingo 13 de diciembre, S/ 40): haces tu propio videojuego con IA, sin instalar
  ningún programa. Phaser 4 y el framework JMD Play, rivales con pathfinding, arte, animación y
  música con IA, y tu juego publicado. Eliges tu juego: fútbol o plataformas. Cuatro clases los
  jueves 19 y 26 de noviembre y 3 y 10 de diciembre, de 9:15 a 10:45 pm (la última hasta las 11:15 pm).
cohorts: [ready-set-go-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tu videojuego de fútbol o de plataformas, con rivales que piensan, arte y música hechos con IA,
  publicado en una página web para compartirlo.
requisitos:
  - Una laptop con navegador (no hace falta instalar ningún programa)
  - Una cuenta en jmd-learn.online
  - Muchas ganas de aprender
dedicacion: "4 clases en vivo: jueves 19 y 26 de noviembre y 3 y 10 de diciembre, 9:15 a 10:45 pm (la última hasta las 11:15 pm) · S/ 30"
# Inscripción: jmd-learn.online/readysetgo/ (curso S/ 30, hackathon S/ 30, ambos S/ 40), que abre WhatsApp al +51 939 602 914.

modules:
  - id: s1
    title: "Clase 1 · Tu primer juego con IA: Phaser 4 y JMD Play"
    lessons: [rsg-01]
  - id: s2
    title: "Clase 2 · Rivales que piensan: pathfinding, estados y puntos"
    lessons: [rsg-02]
  - id: s3
    title: "Clase 3 · Arte, animación y música con IA"
    lessons: [rsg-03]
  - id: s4
    title: "Clase 4 · Tu juego terminado y publicado"
    lessons: [rsg-04]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Ready Set Go! Videojuegos con IA", grupo: "Grupo 1", area: agentica, minutos: 90}
