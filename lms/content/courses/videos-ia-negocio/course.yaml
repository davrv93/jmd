id: videos-ia-negocio
title: "Videos con IA para tu negocio"
description: >
  Haz los videos de tu negocio con IA, sin saber editar: guion que vende, imágenes y clips de tu producto, voz natural, música, subtítulos automáticos y formato vertical para estados de WhatsApp, TikTok y Reels. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): lunes 23, martes 24 y miércoles 25 de noviembre, de 3:00 p. m. a 4:15 p. m. Inversión: S/ 25.
cohorts: [videos-ia-negocio-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  Tres videos cortos de tu propio negocio (producto, oferta y testimonio o «cómo se hace»), con voz, música y subtítulos, listos para publicar.
requisitos:
  - Un celular o una laptop con Windows, macOS o Linux
  - Fotos o videos de tus productos (los del celular sirven)
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 25 (ruleta de descuentos en /sorteo-videos/).

modules:
  - id: s1
    title: "Sesión 1 · Del producto al guion: el video que vende"
    lessons: [vn-01]
  - id: s2
    title: "Sesión 2 · Imagen, voz y música con IA"
    lessons: [vn-02]
  - id: s3
    title: "Sesión 3 · Edición, subtítulos y publicación"
    lessons: [vn-03]

# Cómo sale en el calendario del instructor (/instructor/agenda/).
agenda: {nombre: "Videos con IA para tu negocio", grupo: "Grupo 1", area: diseno, minutos: 75}

# Identidad en el portal del alumno (portada, color, frase y lo que vas a poder hacer).
identidad:
  color: magenta
  icono: video
  nivel: "Desde cero"
  frase: "Haz los videos de tu negocio con IA, sin saber editar: guion que vende, voz, música y subtítulos."
  resultado:
    - "Escribir el guion de un video que vende"
    - "Crear imagen, voz y música con IA"
    - "Publicar en vertical para WhatsApp, TikTok y Reels"
