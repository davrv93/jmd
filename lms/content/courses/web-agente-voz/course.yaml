id: web-agente-voz
title: "Crea un agente de voz con Gemini (modalidad web)"
description: >
  Curso a tu ritmo, en video. Construyes un agente que escucha con Gemini Flash-Lite, decide con los datos
  de tu negocio y responde con voz natural usando Gemini Flash TTS. Seis pasos cortos: texto a voz, dos voces
  en una llamada, entender un audio, el agente completo, una botica que atiende por voz y, al final, costos,
  cuotas y seguridad. Los mismos comandos en Windows y en Mac, con un repositorio listo para levantar con Docker.
cohorts: [web-agente-voz]
proyecto_final: >
  Tu agente de voz con los datos de tu negocio: recibe una pregunta hablada (o una nota de voz), la entiende,
  responde solo con tu información, deriva a una persona cuando no debe contestar y habla con la voz y el
  estilo que elegiste, con la llave protegida en el servidor y límites que cuidan tu cuota.
requisitos:
  - Laptop con Windows 10/11 o Mac, Chrome o Edge y conexión estable
  - Docker Desktop (el repositorio explica cómo instalarlo, paso a paso)
  - Una cuenta de Google para crear tu llave gratis en Google AI Studio
  - Micrófono (opcional; también puedes subir audios)
  - Un asistente de IA (Claude, DeepSeek u otro) para los prompts
dedicacion: "Modalidad web: 7 videos cortos y un repositorio con todos los ejemplos. Avanzas a tu ritmo."

