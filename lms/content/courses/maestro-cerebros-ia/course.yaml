id: maestro-cerebros-ia
title: "Maestro de cerebros de IA"
description: >
  Nivel maestro: diseña el «cerebro» de un asistente de IA para un negocio real: conocimiento con embeddings, reglas de decisión, memoria y evaluación de respuestas. Tres sesiones en vivo de 1 h 15 min por Zoom (hora de Lima): domingo 13 de diciembre de 11:45 a. m. a 1:00 p. m.; jueves 17 de diciembre de 9:15 p. m. a 10:30 p. m.; sábado 19 de diciembre de 7:00 p. m. a 8:15 p. m.. Inversión: S/ 35.
cohorts: [maestro-cerebros-ia-1]
# Ficha del curso (la muestra la página del curso).
proyecto_final: >
  El cerebro de un asistente para tu negocio: base de conocimiento con embeddings, reglas, memoria y un banco de pruebas que mide su calidad.
requisitos:
  - Una laptop con Windows, macOS o Linux
  - Una cuenta en jmd-learn.online
dedicacion: "3 sesiones en vivo de 1 h 15 min"
# Inscripción: WhatsApp 986 149 476. Precio: S/ 35.

