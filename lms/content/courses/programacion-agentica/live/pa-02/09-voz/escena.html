  PLANTILLA DE ESCENA DEL MODO LIVE
  Copia este archivo a live/<lección>/<NN-nombre>/escena.html y cambia SOLO tres cosas:

<style>

  --bad: #b11f1f; --bad-bg: rgba(177,31,31,.10); --info: #1d4ed8; --info-bg: rgba(29,78,216,.10);

/* ---- Base ---- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; } /* si no, display:grid o flex le ganan al atributo */
html, body { margin: 0; height: 100%; }
body {
  font: 400 clamp(15px, calc(1.2vw + .5vh), 30px)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--fg);
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 55%, var(--bg3) 100%);
  overflow: hidden;
}
.esc { position: relative; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 3.2vw 2vh; gap: 2vh; }

/* ---- Cielo de fondo (decorativo, 0 JS) ---- */
.esc-cielo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: var(--cielo); }
.esc-cielo .e { fill: var(--est); }
.esc-cielo .eg { fill: var(--est-g); }
.esc-cielo .eo { fill: var(--est-o); }
.esc-cielo .t { fill: none; stroke: var(--est); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; stroke-dasharray: 1; stroke-dashoffset: 1; animation: esc-trazo 4s ease-out .3s forwards; }
.esc-cielo .tb { fill: none; stroke: var(--est-g); stroke-width: 1.4; stroke-linecap: round; opacity: .5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: esc-trazo 5s ease-out .8s forwards; }
.esc-cielo .p { animation: esc-parpadeo 5s ease-in-out infinite; animation-delay: var(--p, 0s); }
.esc > * { position: relative; z-index: 1; }

/* ---- Cabecera, cuerpo y pie ---- */
.esc-cab { display: flex; align-items: center; gap: 1vw; }
.esc-fase { --c: var(--ph-ec); --cb: var(--ph-ec-bg); display: inline-flex; align-items: center; gap: .5em; padding: .3em .9em; border-radius: 999px; font-weight: 700; font-size: .72em; letter-spacing: .08em; text-transform: uppercase; color: var(--c); background: var(--cb); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.esc-fase::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--c); }
.esc-fase[data-ph="ec"] { --c: var(--ph-ec); --cb: var(--ph-ec-bg); }
.esc-fase[data-ph="or"] { --c: var(--ph-or); --cb: var(--ph-or-bg); }
.esc-fase[data-ph="ca"] { --c: var(--ph-ca); --cb: var(--ph-ca-bg); }
.esc-fase[data-ph="ea"] { --c: var(--ph-ea); --cb: var(--ph-ea-bg); }
.esc-num { margin-left: auto; font: 700 .8em var(--mono); color: var(--muted); letter-spacing: .12em; }
.esc-cuerpo { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2.2vh; }
.esc-pie { font-size: .62em; color: var(--muted); display: flex; align-items: center; gap: .6em; }
.esc-pie::before { content: ""; width: 1.6em; height: 2px; background: var(--line2); }

/* ---- Tipografía y piezas reutilizables ---- */
.esc-titulo { margin: 0; font-size: 2.3em; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; }
.esc-titulo em { font-style: normal; background: linear-gradient(100deg, var(--accent), var(--est-g)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.esc-sub { margin: 0; font-size: 1.15em; color: var(--muted); max-width: 46em; }
.esc-big { font-size: 3.4em; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.esc-card { background: var(--s1); border: 1px solid var(--line); border-radius: 1em; padding: 1em 1.2em; box-shadow: var(--card-shadow); }
.esc-card h3 { margin: 0 0 .3em; font-size: 1em; }
.esc-card p { margin: 0; color: var(--muted); font-size: .88em; }
.esc-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vw; align-items: stretch; }
.esc-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vw; align-items: stretch; }
.esc-fila { display: flex; align-items: center; gap: 1.2vw; flex-wrap: wrap; }
.esc-chip { display: inline-flex; align-items: center; gap: .4em; padding: .25em .75em; border-radius: 999px; font-size: .72em; font-weight: 700; background: var(--accent-bg); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.esc-chip.ok { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.esc-chip.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.esc-chip.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.esc-cmd { margin: 0; font: 600 .78em/1.5 var(--mono); background: #14122b; color: #e9e6ff; border-radius: .8em; padding: .8em 1.1em; overflow: hidden; white-space: pre-wrap; border: 1px solid rgba(190,185,255,.22); }
.esc-cmd .p { color: #8e7dff; user-select: none; }
.esc-cmd .c { color: #7f7aa8; }
.esc-lista { margin: 0; padding: 0; list-style: none; display: grid; gap: .55em; }
.esc-lista li { display: flex; gap: .7em; align-items: baseline; }
.esc-lista li::before { content: ""; flex: none; width: .55em; height: .55em; border-radius: 50%; background: var(--accent); transform: translateY(-.05em); }
.esc-svg { width: 100%; height: auto; display: block; overflow: visible; }
.esc-svg text { font-family: inherit; fill: var(--fg); }

/* ---- Animaciones (solo transform, opacity y dashoffset; 300-500 ms, ease-out) ---- */
@keyframes esc-entra { from { opacity: 0; transform: translateY(1.2vh); } to { opacity: 1; transform: none; } }
@keyframes esc-pop { 0% { opacity: 0; transform: scale(.82); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes esc-trazo { to { stroke-dashoffset: 0; } }
@keyframes esc-flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1vh); } }
@keyframes esc-pulso { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes esc-parpadeo { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes esc-viaja { from { offset-distance: 0%; } to { offset-distance: 100%; } }
.a-in   { animation: esc-entra .45s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.a-pop  { animation: esc-pop .5s cubic-bezier(.2,.8,.3,1.2) both; animation-delay: var(--d, 0s); transform-origin: center; transform-box: fill-box; }
.a-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: esc-trazo var(--t, .9s) ease-out forwards; animation-delay: var(--d, 0s); }
.a-flota { animation: esc-flota 4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.a-pulso { animation: esc-pulso 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
/* Para SVG con pathLength="1": <path class="a-draw" pathLength="1" ...> */

/* Apaga TODO el movimiento: cada pieza queda en su estado final, legible. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .a-draw, .esc-cielo .t, .esc-cielo .tb { stroke-dashoffset: 0 !important; }
}
</style>
<style id="esc-propio">

.esc-svg text.m { fill: var(--muted); }
.esc-svg text.ac { fill: var(--accent); }
.esc-svg text.mono { font-family: var(--mono); }
.nodo { fill: var(--s1); stroke: var(--line2); stroke-width: 2.5; }
.motor { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.casa { fill: none; stroke: var(--line2); stroke-width: 2; stroke-dasharray: 7 6; }
.carril { fill: none; stroke: var(--line2); stroke-width: 3; stroke-linecap: round; }
.punta { fill: var(--line2); }
.mic { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.mic-l { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.barra { fill: var(--accent); transform-box: fill-box; transform-origin: center; }
.barra.w { animation: vz-onda .42s ease-in-out infinite alternate; animation-delay: var(--w, 0s); animation-iteration-count: 7; }
.slot-b { fill: var(--accent); opacity: 0; transform-box: fill-box; transform-origin: center; animation: vz-barra .3s ease-in forwards; animation-delay: var(--d); animation-fill-mode: both; }
.slot-t { font-family: var(--mono); font-weight: 700; font-size: 30px; fill: var(--fg); animation: vz-letra .32s cubic-bezier(.2,.8,.3,1.2) both; animation-delay: var(--d); transform-box: fill-box; transform-origin: center; }
.campo { fill: var(--s1); stroke: var(--accent); stroke-width: 3; }
.cursor { fill: var(--accent); animation: vz-cursor 1s steps(2, start) 4.8s 4; }
.btn { fill: var(--accent); }
.esc-svg text.btn-t { fill: var(--on-accent); font-weight: 800; }

@keyframes vz-onda { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
@keyframes vz-barra { 0% { opacity: .9; transform: scaleY(1); } 100% { opacity: 0; transform: scaleY(.1); } }
@keyframes vz-letra { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@keyframes vz-cursor { to { opacity: 0; } }
.slot-b { opacity: 0; }

.vz-regla { text-align: center; padding: .55em 1em; border-radius: 1em; background: var(--accent-bg); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 1.7em; font-weight: 800; letter-spacing: -.01em; }
.vz-regla em { font-style: normal; color: var(--accent); }
.vz-fila { display: flex; gap: .8em 1.2vw; align-items: center; flex-wrap: wrap; }
.vz-paso { display: inline-flex; align-items: center; gap: .5em; font-size: .85em; font-weight: 700; }
.vz-paso i { font-style: normal; display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: .85em; }
.vz-dato { margin-left: auto; font-size: .8em; color: var(--muted); }
.vz-dato b { color: var(--ok); }

</style>
