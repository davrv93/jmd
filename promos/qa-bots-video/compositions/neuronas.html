<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070a16; }
    #neu-lienzo { position: absolute; inset: 0; }
    #neu-lienzo canvas { position: absolute; left: 0; top: 0; width: 1920px !important; height: 1080px !important; }
  </style>
  <div id="root" data-composition-id="neuronas" data-width="1920" data-height="1080" data-duration="66">
    <div id="neu-lienzo"></div>
  </div>
  <script>
    // Red de neuronas (p5, determinista). Tres capas de profundidad: lejanas (pequeñas, difusas), medias y cercanas
    // (grandes, nítidas). Cada neurona: soma con núcleo, 5–8 dendritas ramificadas, un axón curvo con botones
    // terminales hacia otra neurona, e impulsos que viajan por el axón. Todo es función de t (segundos locales).
    // Fases locales: 0–8 crecen (soma → dendritas → axones) · 9 / 19.2 / 27.2 se encienden las tres neuronas
    // grandes (EXPLORA celeste, VIGILA verde, REPARA ámbar) · 36+ red completa, impulsos tranquilos · 50+ claro al centro.
    (function () {
      const W = 1920, H = 1080;
      function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(1511);
      const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
      const lerp = (a, b, k) => a + (b - a) * k;

      // ---------- construcción ----------
      function rama(x, y, ang, len, grosor, prof, out) {
        // una dendrita: polilínea con curvatura suave, se bifurca hasta prof 0
        const pts = [[x, y]]; let a = ang, cx = x, cy = y;
        const n = 6 + Math.floor(R() * 4);
        for (let i = 0; i < n; i++) { a += (R() - 0.5) * 0.55; cx += Math.cos(a) * (len / n); cy += Math.sin(a) * (len / n); pts.push([cx, cy]); }
        out.push({ pts, g: grosor, prof });
        if (prof > 0) {
          const k = 2 + (R() < 0.35 ? 1 : 0);
          for (let j = 0; j < k; j++) rama(cx, cy, a + (j - (k - 1) / 2) * (0.55 + R() * 0.5), len * (0.55 + R() * 0.2), grosor * 0.6, prof - 1, out);
        }
        return out;
      }
      function neurona(x, y, r, capa, nace) {
        const dend = []; const nd = 4 + Math.floor(R() * 3); const a0 = R() * 6.28;
        for (let i = 0; i < nd; i++) rama(x, y, a0 + (i / nd) * 6.28 + (R() - 0.5) * 0.6, r * (3.5 + R() * 3), r * 0.28, capa === 2 ? 2 : 1, dend);
        return { x, y, r, capa, nace, dend, nucleo: { dx: (R() - 0.5) * r * 0.5, dy: (R() - 0.5) * r * 0.5, r: r * 0.42 }, ax: null, f: R() * 6.28 };
      }
      const capas = [[], [], []];
      // lejanas
      for (let i = 0; i < 8; i++) capas[0].push(neurona(R() * W, R() * H, 5 + R() * 5, 0, R() * 6));
      // medias
      for (let i = 0; i < 8; i++) capas[1].push(neurona(R() * W, R() * H, 10 + R() * 7, 1, 0.5 + R() * 6));
      // cercanas: tres grandes de las etapas + 5 más
      const grandes = [
        { x: 430, y: 600, r: 30, c: [125, 211, 252], on: 9.0 },
        { x: 960, y: 400, r: 32, c: [94, 234, 212], on: 19.2 },
        { x: 1490, y: 600, r: 30, c: [251, 191, 36], on: 27.2 },
      ];
      grandes.forEach((g, i) => { const n = neurona(g.x, g.y, g.r, 2, 1.2 + i * 0.4); n.grande = g; capas[2].push(n); });
      for (let i = 0; i < 2; i++) capas[2].push(neurona(200 + R() * 1500, 120 + R() * 840, 16 + R() * 8, 2, 1 + R() * 6));
      // axones: cada neurona media/cercana apunta a otra de su capa o a una grande; bezier con ondulación
      const todas = capas.flat();
      function axon(a, b) {
        const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
        const nx = -dy / L, ny = dx / L, s = (R() - 0.5) * L * 0.6;
        const p1 = [a.x + dx * 0.3 + nx * s, a.y + dy * 0.3 + ny * s], p2 = [a.x + dx * 0.7 - nx * s * 0.6, a.y + dy * 0.7 - ny * s * 0.6];
        const pts = []; const N = 40;
        for (let i = 0; i <= N; i++) { const u = i / N, v = 1 - u; pts.push([v * v * v * a.x + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * b.x, v * v * v * a.y + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * b.y]); }
        // acortar: termina antes del soma destino, con botones terminales
        const fin = pts[N - 3];
        const term = []; for (let j = 0; j < 3; j++) { const ang = Math.atan2(b.y - fin[1], b.x - fin[0]) + (j - 1) * 0.7; term.push([fin[0] + Math.cos(ang) * b.r * 1.6, fin[1] + Math.sin(ang) * b.r * 1.6]); }
        return { pts: pts.slice(0, N - 2), term, nace: Math.max(a.nace, b.nace) + 1.2 + R() * 1.5, vel: 0.12 + R() * 0.1, f: R(), to: b };
      }
      [...capas[1], ...capas[2]].forEach((n) => {
        const cand = (n.capa === 2 ? capas[2] : [...capas[1], ...capas[2]]).filter((m) => m !== n);
        cand.sort((p, q) => Math.hypot(p.x - n.x, p.y - n.y) - Math.hypot(q.x - n.x, q.y - n.y));
        const dest = cand[Math.floor(R() * Math.min(3, cand.length))];
        if (dest) n.ax = axon(n, dest);
      });
      // las grandes además reciben 2 axones extra de neuronas medias cercanas
      grandes.forEach((g, gi) => { const n = capas[2][gi]; capas[1].filter((m) => Math.hypot(m.x - g.x, m.y - g.y) < 520).slice(0, 1).forEach((m) => { m.ax2 = axon(m, n); }); });
      capas[0].forEach((n) => { const d = capas[0][Math.floor(R() * capas[0].length)]; if (R() < 0.5 && d !== n && Math.hypot(d.x - n.x, d.y - n.y) < 700) n.ax = axon(n, d); });

      // ---------- dibujo ----------
      let T = 0;
      const sk = new p5((p) => {
        p.setup = () => { p.createCanvas(W, H); p.pixelDensity(1); p.noLoop(); };
        function poli(pts, k, g, col, al) {
          // polilínea hasta la fracción k (crecimiento), en 3 tramos con grosor decreciente
          const total = pts.length - 1; const n = Math.max(1, Math.floor(total * k));
          p.noFill(); p.stroke(col[0], col[1], col[2], al);
          const tramos = 3;
          for (let tr = 0; tr < tramos; tr++) {
            const i0 = Math.floor(n * tr / tramos), i1 = Math.min(n, Math.floor(n * (tr + 1) / tramos));
            if (i1 <= i0) continue;
            p.strokeWeight(g * (1 - (tr / tramos) * 0.65));
            p.beginShape(); for (let i = i0; i <= i1; i++) p.vertex(pts[i][0], pts[i][1]); p.endShape();
          }
          if (n < total) { const u = total * k - n; const a = pts[n], b = pts[n + 1]; p.strokeWeight(g * 0.4); p.line(a[0], a[1], lerp(a[0], b[0], u), lerp(a[1], b[1], u)); }
        }
        function dibujaNeurona(n, t, claro) {
          const vive = ease((t - n.nace) / 1.0); if (vive <= 0) return;
          const dc = Math.hypot(n.x - W / 2, n.y - H / 2);
          const at = claro > 0 && dc < 560 ? 1 - claro * 0.9 * (1 - dc / 560) : 1;
          const g = n.grande; const enc = g ? ease((t - g.on) / 0.7) : 0;
          const base = n.capa === 0 ? [88, 108, 160] : n.capa === 1 ? [112, 148, 200] : [150, 190, 230];
          const col = g ? [lerp(base[0], g.c[0], enc), lerp(base[1], g.c[1], enc), lerp(base[2], g.c[2], enc)] : base;
          const alpha = (n.capa === 0 ? 42 : n.capa === 1 ? 95 : 165) * at;
          const resp = 1 + 0.03 * Math.sin(t * 1.3 + n.f); // respiración lenta del soma
          // dendritas: crecen tras el soma
          n.dend.forEach((d) => {
            const k = ease((t - n.nace - 0.4 - (3 - d.prof) * 0.5) / 1.2); if (k <= 0) return;
            poli(d.pts, k, d.g * (n.capa === 0 ? 2.2 : 1), col, alpha * (n.capa === 0 ? 0.5 : 0.8));
          });
          // axón
          [n.ax, n.ax2].forEach((ax) => {
            if (!ax) return; const k = ease((t - ax.nace) / 2.2); if (k <= 0) return;
            poli(ax.pts, k, n.r * 0.22, col, alpha * 0.75);
            if (k >= 1) {
              // botones terminales
              const fin = ax.pts[ax.pts.length - 1];
              ax.term.forEach((q) => { p.stroke(col[0], col[1], col[2], alpha * 0.7); p.strokeWeight(n.r * 0.14); p.line(fin[0], fin[1], q[0], q[1]); p.noStroke(); p.fill(col[0], col[1], col[2], alpha); p.circle(q[0], q[1], n.r * 0.3); });
              // impulso que viaja
              const u = (t * ax.vel + ax.f) % 1; const i = Math.floor(u * (ax.pts.length - 1)); const a = ax.pts[i], b = ax.pts[Math.min(i + 1, ax.pts.length - 1)]; const fr = u * (ax.pts.length - 1) - i;
              const px = lerp(a[0], b[0], fr), py = lerp(a[1], b[1], fr);
              p.noStroke();
              const bril = g ? [255, 255, 255] : [220, 240, 255];
              p.fill(bril[0], bril[1], bril[2], 28 * at); p.circle(px, py, n.r * 0.9);
              p.fill(bril[0], bril[1], bril[2], 230 * at); p.circle(px, py, n.r * 0.38);
              // estela
              for (let s = 1; s <= 4; s++) { const uu = ((u - s * 0.012) % 1 + 1) % 1; const ii = Math.floor(uu * (ax.pts.length - 1)); const aa = ax.pts[ii]; p.fill(bril[0], bril[1], bril[2], (120 - s * 18) * at); p.circle(aa[0], aa[1], n.r * 0.3 * (1 - s / 8)); }
              // llegada: destello en el soma destino
              if (u > 0.96 && ax.to) { p.fill(col[0], col[1], col[2], 90 * at); p.circle(ax.to.x, ax.to.y, ax.to.r * 3.2); }
            }
          });
          // soma: halo, membrana, cuerpo, núcleo
          p.noStroke();
          const rr = n.r * vive * resp * (g ? 1 + 0.25 * enc : 1);
          p.fill(col[0], col[1], col[2], 18 * at); p.circle(n.x, n.y, rr * 3.6 + (g ? 40 * enc : 0));
          p.fill(col[0], col[1], col[2], 48 * at); p.circle(n.x, n.y, rr * 2.4);
          // cuerpo irregular (soma no es un círculo perfecto)
          p.fill(lerp(col[0], 255, 0.25), lerp(col[1], 255, 0.25), lerp(col[2], 255, 0.25), alpha);
          p.beginShape(); for (let a = 0; a < 6.283; a += 0.35) { const rad = rr * (1 + 0.12 * Math.sin(a * 3 + n.f) + 0.06 * Math.sin(a * 7 + n.f * 2)); p.vertex(n.x + Math.cos(a) * rad, n.y + Math.sin(a) * rad); } p.endShape(p.CLOSE);
          p.fill(20, 28, 60, alpha * 0.9); p.circle(n.x + n.nucleo.dx, n.y + n.nucleo.dy, n.nucleo.r * 2 * vive);
          p.fill(255, 255, 255, alpha * 0.6); p.circle(n.x + n.nucleo.dx - n.nucleo.r * 0.3, n.y + n.nucleo.dy - n.nucleo.r * 0.3, n.nucleo.r * 0.5);
        }
        p.draw = () => {
          const t = T;
          // fondo: niebla profunda, más clara al centro
          const luz = ease((t - 52) / 5);
          p.background(lerp(7, 16, luz), lerp(10, 20, luz), lerp(22, 44, luz));
          const gr = p.drawingContext.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1200);
          gr.addColorStop(0, luz > 0 ? `rgba(${Math.round(lerp(28, 70, luz))},${Math.round(lerp(36, 62, luz))},${Math.round(lerp(80, 90, luz))},0.4)` : "rgba(28,36,80,0.35)"); gr.addColorStop(1, "rgba(7,10,22,0)");
          p.drawingContext.fillStyle = gr; p.drawingContext.fillRect(0, 0, W, H);
          const claro = ease((t - 50) / 2.5);
          // motas lejanas (pocas, difusas)
          p.noStroke();
          const Rm = rng(99);
          for (let i = 0; i < 22; i++) { const x = Rm() * W, y = Rm() * H, s = 2 + Rm() * 3, f = Rm() * 6.28; const a = 0.25 + 0.25 * Math.sin(t * 0.6 + f); p.fill(140, 170, 230, 36 * a); p.circle(x + Math.sin(t * 0.2 + f) * 6, y + Math.cos(t * 0.17 + f) * 6, s); }
          capas[0].forEach((n) => dibujaNeurona(n, t, claro));
          capas[1].forEach((n) => dibujaNeurona(n, t, claro));
          capas[2].forEach((n) => dibujaNeurona(n, t, claro));
          // viñeta suave
          const vg = p.drawingContext.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
          vg.addColorStop(0, "rgba(7,10,22,0)"); vg.addColorStop(1, "rgba(7,10,22,0.75)");
          p.drawingContext.fillStyle = vg; p.drawingContext.fillRect(0, 0, W, H);
        };
      }, document.getElementById("neu-lienzo"));

      function renderAt(t) { T = t; if (sk && sk.redraw) sk.redraw(); }
      window.addEventListener("hf-seek", (e) => { renderAt(e.detail.time); });
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 66 });
      window.__timelines["neuronas"] = tl;
      setTimeout(() => renderAt(0), 0);
    })();
  </script>
</template>
