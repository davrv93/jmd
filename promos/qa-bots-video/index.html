<!doctype html>
<html lang="es"
  data-composition-variables='[
    {"id":"marca","type":"string","label":"Marca","default":"JMD Learning"},
    {"id":"fechas","type":"string","label":"Fechas","default":"dom 15 · 22 · 29 nov · 3:00 p.m."},
    {"id":"whatsapp","type":"string","label":"WhatsApp","default":"986 149 476 · escribe «QA BOTS»"},
    {"id":"acento","type":"color","label":"Acento","default":"#fbbf24"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <style>
      :root { --ground: #05070f; --ink: #f4f6ff; --acento: #fbbf24; --font-display: "Outfit", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #root { position: relative; width: 100%; height: 100%; }
      #fondo { position: absolute; inset: 0; background: #05070f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="86" data-width="1920" data-height="1080">
      <div id="fondo"></div>

      <!-- Mundo 1: la oficina de noche. Deploy, alarmas, la omisión. -->
      <div id="oficina" data-composition-id="oficina" data-composition-src="compositions/oficina.html"
           data-start="0" data-duration="21" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>

      <!-- Mundo 2: red de neuronas (p5), de fondo hasta el final. -->
      <div id="neuronas" data-composition-id="neuronas" data-composition-src="compositions/neuronas.html"
           data-start="20" data-duration="66" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>

      <div id="etapas" data-composition-id="etapas" data-composition-src="compositions/etapas.html"
           data-start="20.3" data-duration="35.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>

      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
           data-start="56" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>

      <!-- Narración: gpt-audio «ash» vía OpenRouter, natural y continua; el cierre en tono esperanzador. La voz es el reloj. -->
      <audio id="voz1" class="clip" src="assets/voz/v3/a.wav" data-start="4.1" data-duration="14.85" data-track-index="4" data-volume="1"></audio>
      <audio id="voz2" class="clip" src="assets/voz/v3/b.wav" data-start="20.5" data-duration="7.15" data-track-index="4" data-volume="1"></audio>

      <!-- Música: piano solo cálido y esperanzador, Lyria 3 (OpenRouter), recortado a 86 s con fundido. Bajo la voz a 0.18. -->
      <audio id="musica" class="clip" src="assets/musica/piano-luz.mp3" data-start="0" data-duration="86" data-track-index="3" data-volume="0.18" data-fade-in="1.5" data-fade-out="4"></audio>

      <!-- Efectos: cada uno tiene su causa en pantalla. -->
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.mp3" data-start="1.0" data-duration="1.52" data-track-index="5" data-volume="0.25"></audio>
      <audio id="sfx-alarma1" class="clip" src="assets/sfx/notification.mp3" data-start="12.0" data-duration="2.48" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-alarma2" class="clip" src="assets/sfx/error.mp3" data-start="12.35" data-duration="1.64" data-track-index="5" data-volume="0.5"></audio>

      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="47.6" data-duration="0.74" data-track-index="5" data-volume="0.35"></audio>

      <audio id="sfx-impacto" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="73.0" data-duration="2.61" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
