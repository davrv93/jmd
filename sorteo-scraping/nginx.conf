# Sorteo de penales de Web scraping ético (S/ 60 → S/ 10) con cupones de descuento: https://jmd-learn.online/sorteo-scraping/
# Contenedor sorteo-scraping en 127.0.0.1:18698 (fuente: ~/Documents/jmd/sorteo-scraping en la Mac).
location = /sorteo-scraping { return 301 /sorteo-scraping/; }
location ^~ /sorteo-scraping/ {
    proxy_pass http://127.0.0.1:18698/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
