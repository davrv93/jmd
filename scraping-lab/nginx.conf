# Laboratorio de scraping JMD (taller «Web scraping ético con IA», ws-01): https://jmd-learn.online/scraping-lab/
# Contenedor scraping-lab en 127.0.0.1:18685 (fuente: ~/Documents/jmd/scraping-lab en la Mac).
# Sin barra final en proxy_pass: la ruta llega entera (/scraping-lab/...), el servicio vive bajo ese prefijo.
location = /scraping-lab { return 301 /scraping-lab/; }
location ^~ /scraping-lab/ {
    proxy_pass http://127.0.0.1:18685;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    client_max_body_size 64k;
}
