# Rutas profesionales de JMD Learning (12-11-2026): https://jmd-learn.online/rutas/
# Contenido: ~/Documents/jmd/rutas-web/web del Mac (lo genera armar.py) copiado a /var/www/rutas/ (desplegar.sh).
location = /rutas { return 301 /rutas/; }
location ^~ /rutas/ {
    alias /var/www/rutas/;
    index index.html;
    add_header Cache-Control "no-cache";
}
