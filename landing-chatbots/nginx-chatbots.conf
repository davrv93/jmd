# Landing de chatbots de WhatsApp: https://jmd-learn.online/chatbots/
# Va dentro del server 443 de /etc/nginx/sites-enabled/jmd-learn, antes de «location /».
location = /chatbots { return 301 /chatbots/; }
location ^~ /chatbots/ {
    alias /var/www/chatbots/;
    index index.html;
    add_header Cache-Control "no-cache";
}
