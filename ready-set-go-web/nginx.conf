# Ready Set Go! · inscripción al curso y a la hackathon: https://jmd-learn.online/readysetgo/
# Contenido: ~/Documents/jmd/ready-set-go-web/web del Mac copiado a /var/www/readysetgo/ (lo hace desplegar.sh).
location = /readysetgo { return 301 /readysetgo/; }
location ^~ /readysetgo/ {
    alias /var/www/readysetgo/;
    index index.html;
    add_header Cache-Control "no-cache";
}
