# Laboratorio Python (12-11-2026): https://jmd-learn.online/pylab/ · estático, Python corre en el navegador (Pyodide).
# Contenido: ~/Documents/jmd/pylab/web del Mac copiado a /var/www/pylab/ (desplegar.sh). No hay contenedor ni usa RAM.
location = /pylab { return 301 /pylab/; }
location ^~ /pylab/pyodide/ {
    alias /var/www/pylab/pyodide/;
    types { application/wasm wasm; application/javascript js; application/json json; application/zip zip; }
    gzip on; gzip_types application/wasm application/javascript application/json; gzip_min_length 1024;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
location ^~ /pylab/ {
    alias /var/www/pylab/;
    index index.html;
    add_header Cache-Control "no-cache";
}
