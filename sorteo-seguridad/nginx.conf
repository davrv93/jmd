# Ruleta de la charla de seguridad: https://jmd-learn.online/sorteo-seguridad/
# Contenedor sorteo-seguridad en 127.0.0.1:18645 (fuente: ~/Documents/jmd/sorteo-seguridad en la Mac).
location = /sorteo-seguridad { return 301 /sorteo-seguridad/; }
location ^~ /sorteo-seguridad/ {
    proxy_pass http://127.0.0.1:18645/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
