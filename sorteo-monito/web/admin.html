<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Ruleta del monito</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
:root{--crema:#FFF4DE;--banana:#FFC93C;--tinta:#1B1F3B;--suave:#5A5F80;--rojo:#FF5A5F;--verde:#2BB673;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 60px}
main{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:26px}h1 small{color:var(--rojo);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:block}
h2{margin:0 0 8px;font-size:17px}
.panel{background:#fff;border:2px solid var(--tinta);border-radius:14px;padding:18px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
input{font:inherit;padding:9px 12px;border-radius:9px;border:2px solid var(--tinta);width:100%;max-width:320px}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:9px;border:2px solid var(--tinta);background:var(--banana);color:var(--tinta);cursor:pointer;margin:8px 8px 0 0}
.btn.sec{background:#fff}
.error{color:#C8282E;min-height:1.4em;margin:6px 0 0;font-weight:700}
.suave{color:var(--suave);margin:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid #ddd;vertical-align:middle;white-space:nowrap}
th{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td button,td a{font:inherit;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--tinta);background:#fff;color:var(--tinta);cursor:pointer;margin-right:4px;text-decoration:none}
td button.si{background:var(--verde);color:#fff;border-color:var(--verde)}
tr.ok td{background:#eafaf1}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1><small>Panel del organizador</small>Ruleta del monito · Laboratorio de caos</h1>

  <section class="panel" id="login">
    <label for="clave">Clave del panel</label>
    <input id="clave" type="password" autocomplete="current-password">
    <button class="btn" id="entrar" type="button">Entrar</button>
    <p class="error" id="loginError"></p>
  </section>

  <div id="panel" hidden>
    <section class="panel">
      <h2>Estado: <span id="fase"></span></h2>
      <p class="suave" id="resumen"></p>
      <button class="btn" id="cerrar" type="button">Cerrar la ruleta</button>
      <button class="btn sec" id="abrirFase" type="button">Reabrir</button>
      <button class="btn sec" id="csv" type="button">⬇ CSV</button>
      <button class="btn sec" id="refrescar" type="button">↻ Refrescar</button>
      <p class="error" id="error"></p>
    </section>
    <section class="panel">
      <h2>Inscripciones <span id="total"></span></h2>
      <p class="suave">«Confirmar» cuando llegue su Yape. El botón WhatsApp abre el chat con esa persona.</p>
      <div class="tabla"><table>
        <thead><tr><th>#</th><th>Hora</th><th>Nombre</th><th>Celular</th><th>Opción</th><th>Premio</th><th>Paga</th><th>Código</th><th></th></tr></thead>
        <tbody id="personas"></tbody>
      </table></div>
    </section>
  </div>
</main>
<script>
(function(){
  var BASE = new URL(".", location.href).pathname;
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var hora=function(iso){return new Date(iso).toLocaleString('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
  var clave=''; try{clave=sessionStorage.getItem('monito-clave')||'';}catch(e){}
  function adm(ruta,cuerpo){
    var op=cuerpo===undefined?{headers:{'X-Clave':clave}}:{method:'POST',headers:{'X-Clave':clave,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)};
    return fetch(BASE+ruta,op).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok)throw new Error(d.error||('Error '+r.status));return d;});});
  }
  function pintar(e){
    $('#login').hidden=true; $('#panel').hidden=false;
    $('#fase').textContent=e.abierto?'abierta':(e.fase==='abierto'?'cerrada por hora (cierre '+hora(e.cierre)+')':'cerrada a mano');
    $('#cerrar').hidden=e.fase!=='abierto'; $('#abrirFase').hidden=e.fase==='abierto';
    var L=e.personasLista, conf=L.filter(function(p){return p.confirmado;}).length;
    var ent=e.entregados;
    $('#resumen').textContent=L.length+' giros · '+conf+' confirmados · gratis '+ent.G100+'/10 · 90 % '+ent.D90+'/2 · 40 % '+ent.D40+' · 35 % '+ent.D35+' · 30 % '+ent.D30;
    $('#total').textContent='('+L.length+')';
    $('#personas').innerHTML=L.slice().reverse().map(function(p){
      return '<tr class="'+(p.confirmado?'ok':'')+'"><td>'+p.id+'</td><td>'+hora(p.hora)+'</td><td>'+esc(p.nombre)+'</td><td class="mono">'+esc(p.telefono)+'</td>'+
        '<td>'+(p.certificado?'+ certificado':'taller')+'</td><td>'+esc(p.premioNombre)+'</td><td><b>'+esc(p.paga)+'</b></td><td class="mono">'+esc(p.codigo)+'</td>'+
        '<td><button class="'+(p.confirmado?'si':'')+'" data-conf="'+p.id+'" data-v="'+(p.confirmado?0:1)+'">'+(p.confirmado?'✓ Inscrito':'Confirmar')+'</button>'+
        '<a href="https://wa.me/51'+esc(p.telefono)+'" target="_blank" rel="noopener">WhatsApp</a>'+
        '<button data-quitar="'+p.id+'">Quitar</button></td></tr>';
    }).join('');
  }
  function cargar(){return adm('api/admin/estado').then(pintar);}
  function fallo(x){$('#error').textContent=x.message;}
  $('#entrar').onclick=function(){clave=$('#clave').value;try{sessionStorage.setItem('monito-clave',clave);}catch(e){}cargar().catch(function(x){$('#loginError').textContent=x.message;});};
  $('#clave').addEventListener('keydown',function(e){if(e.key==='Enter')$('#entrar').click();});
  $('#refrescar').onclick=function(){cargar().catch(fallo);};
  $('#cerrar').onclick=function(){adm('api/admin/fase',{fase:'cerrado'}).then(pintar).catch(fallo);};
  $('#abrirFase').onclick=function(){adm('api/admin/fase',{fase:'abierto'}).then(pintar).catch(fallo);};
  $('#csv').onclick=function(){
    fetch(BASE+'api/admin/csv',{headers:{'X-Clave':clave}}).then(function(r){return r.blob();}).then(function(b){
      var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ruleta-monito.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    }).catch(fallo);
  };
  var pendienteQuitar=0;
  $('#personas').onclick=function(e){
    var b=e.target.closest('button'); if(!b)return;
    if(b.dataset.conf){adm('api/admin/confirmar',{id:+b.dataset.conf,confirmado:b.dataset.v==='1'}).then(pintar).catch(fallo);}
    if(b.dataset.quitar){
      if(pendienteQuitar!==+b.dataset.quitar){pendienteQuitar=+b.dataset.quitar;b.textContent='¿Seguro? Clic otra vez';return;}
      pendienteQuitar=0; adm('api/admin/quitar',{id:+b.dataset.quitar}).then(pintar).catch(fallo);
    }
  };
  if(clave)cargar().catch(function(){});
  setInterval(function(){if(!$('#panel').hidden)cargar().catch(function(){});},20000);
})();
</script>
</body>
</html>
