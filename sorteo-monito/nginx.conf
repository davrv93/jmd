# Ruleta del monito, Laboratorio de caos: https://jmd-learn.online/monito/
# Contenedor sorteo-monito en 127.0.0.1:18712 (fuente: ~/Documents/jmd/sorteo-monito en la Mac).
location = /monito { return 301 /monito/; }
location ^~ /monito/ {
    proxy_pass http://127.0.0.1:18712/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
