# Sorteo del colibrí (curso Crea contenido con OpenMontage): https://jmd-learn.online/colibri/
# Contenedor sorteo-colibri en 127.0.0.1:18665 (fuente: ~/Documents/jmd/sorteo-colibri en la Mac).
location = /colibri { return 301 /colibri/; }
location ^~ /colibri/ {
    proxy_pass http://127.0.0.1:18665/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
