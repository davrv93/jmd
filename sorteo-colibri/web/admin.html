<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1136">
<title>Administración · Sorteo del colibrí · JMD Learning</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin-base.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<header class="tope">
  <div class="marca">
    <img class="logo" src="logo.svg" alt="" width="40" height="40">
    <span class="marca-nombre">Sorteo del colibrí</span>
  </div>
  <button class="enlace" id="salir" type="button" hidden>Salir</button>
</header>

<main class="a-cuerpo">
  <section class="a-entrada" id="entrada">
    <h1>Administración del sorteo</h1>
    <form id="f-clave" novalidate>
      <label for="clave">Clave de administración</label>
      <input id="clave" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <p class="error" id="e-clave" role="alert"></p>
      <button class="boton-oro" type="submit">Entrar</button>
    </form>
  </section>

  <section id="tablero" hidden>
    <h1 class="a-titulo">Participantes y cupones</h1>
    <p class="a-estado" id="estado"></p>
    <ul class="a-resumen" id="resumen"></ul>
    <div class="a-filtros">
      <div>
        <label for="buscar">Buscar</label>
        <input id="buscar" type="search" placeholder="Nombre, número o cupón" autocomplete="off">
      </div>
      <div>
        <label for="filtro">Mostrar</label>
        <select id="filtro">
          <option value="todos">Todos</option>
          <option value="pendientes">Cupones sin canjear</option>
          <option value="canjeados">Cupones canjeados</option>
          <option value="sin">Sin premio</option>
        </select>
      </div>
      <button class="a-boton" id="actualizar" type="button">Actualizar</button>
      <button class="a-boton" id="csv" type="button">Descargar CSV</button>
    </div>
    <p class="error" id="e-tablero" role="alert"></p>
    <p class="a-cuenta" id="cuenta" aria-live="polite"></p>
    <div class="a-tabla-caja">
      <table class="a-tabla">
        <thead><tr><th scope="col">Participante</th><th scope="col">WhatsApp</th><th scope="col">Resultado</th><th scope="col">Cupón</th><th scope="col">Vence</th><th scope="col">Participó</th><th scope="col">Canje</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <p class="a-vacio" id="vacio" hidden>Todavía no hay participantes.</p>
  </section>
</main>
<script src="admin.js" defer></script>
</body>
</html>
