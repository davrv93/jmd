# Funciona igual con:
#   docker compose up -d --build
#   podman compose up -d --build      (o podman-compose up -d --build)
#
# Las variables salen de .env (copia .env.example y, para el LMS, lms/.env.example). La
# configuración viva y la telemetría quedan en aio_data; la base del LMS, en lms_data.

services:
  orchestrator:
    build: .
    image: localhost/ai-orchestrator:latest
    container_name: ai-orchestrator
    ports:
      # Solo en local. Para exponerlo, pon un proxy con HTTPS delante (o cambia a "4000:4000").
      - "127.0.0.1:${AIO_PORT:-4000}:4000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - aio_data:/data
    restart: unless-stopped

  lms:
    build:
      context: ./lms
      args:
        # 1 = instala el cliente docker en la imagen para el runner (ver aviso de seguridad).
        WITH_RUNNER: ${WITH_RUNNER:-0}
    image: localhost/lms:latest
    container_name: lms
    ports:
      - "127.0.0.1:${LMS_PORT:-8080}:8080"
    environment:
      LMS_ADMIN_EMAIL: ${LMS_ADMIN_EMAIL:-}
      LMS_ADMIN_PASSWORD: ${LMS_ADMIN_PASSWORD:-}
      LMS_ADMIN_NAME: ${LMS_ADMIN_NAME:-Instructor}
      LMS_INVITE_CODE: ${LMS_INVITE_CODE:-}
      LMS_COHORT: ${LMS_COHORT:-}
      # Ventana: hasta LMS_COHORT_HASTA (RFC 3339) las cuentas nuevas entran a LMS_COHORT_VENTANA.
      LMS_COHORT_VENTANA: ${LMS_COHORT_VENTANA:-}
      LMS_COHORT_HASTA: ${LMS_COHORT_HASTA:-}
      LMS_PUBLIC_URL: ${LMS_PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-lms-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-lms-api}
      # Runner de código: vacío = desactivado. Si se activa, ver el aviso del socket más abajo.
      LMS_RUNNER: ${LMS_RUNNER:-}
      LMS_RUNNER_TIMEOUT: ${LMS_RUNNER_TIMEOUT:-15s}
      # Estudio de landing: terminal aislada + generación con IA (gateway OpenAI-compatible).
      LMS_TERM_IMAGE: ${LMS_TERM_IMAGE:-}
      LMS_LLM_URL: ${LMS_LLM_URL:-}
      LMS_LLM_KEY: ${LMS_LLM_KEY:-}
      LMS_LLM_MODEL: ${LMS_LLM_MODEL:-auto}
      # Modo LIVE: un contenedor de aula por alumno (imagen jmd/aula, ver lms/aula/README.md). Vacío = sin aula.
      LMS_AULA_IMAGE: ${LMS_AULA_IMAGE:-}
      LMS_AULA_RED: ${LMS_AULA_RED:-}
      LMS_AULA_GATEWAY: ${LMS_AULA_GATEWAY:-}
      LMS_AULA_TOKEN: ${LMS_AULA_TOKEN:-}
    volumes:
      - lms_data:/data
      # El temario se lee de aquí: edita lms/content, haz commit, y se recarga solo.
      - ./lms/content:/app/content:ro
      # AVISO DE SEGURIDAD: montar el socket de Docker da control del host a quien lo tenga.
      # Descoméntalo SOLO si vas a usar el runner, y mejor en una máquina/VM dedicada al runner.
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Imágenes locales para las aulas del LIVE (sd-turbo en CPU, calidades baja y media). Se enciende con
  #   docker compose --profile imagen up -d --build imagen
  # y se llega desde las aulas como http://imagen:8000 (red aula_net). Pide ~2,5 GB de RAM mientras genera y
  # los suelta tras 30 minutos sin pedidos; ver lms/imagen/app.py.
  imagen:
    profiles: ["imagen"]
    build: ./lms/imagen
    image: jmd/imagen:latest
    container_name: imagen
    mem_limit: 3g
    environment:
      IMAGEN_TOKEN: ${LMS_AULA_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      IMAGEN_MEDIA: ${IMAGEN_MEDIA:-dreamshaper}
      IMAGEN_REPOSO: ${IMAGEN_REPOSO:-1800}
    volumes:
      - imagen_modelos:/modelos
    networks: [default, aula_net]
    restart: unless-stopped

networks:
  aula_net:
    external: true
    name: aula_net

volumes:
  aio_data:
  lms_data:
  imagen_modelos:
