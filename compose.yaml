# Funciona igual con:
#   docker compose up -d --build
#   podman compose up -d --build      (o podman-compose up -d --build)
#
# Las variables salen de .env (copia .env.example y, para el LMS, lms/.env.example). La
# configuración viva y la telemetría quedan en aio_data; la base del LMS, en lms_data.

services:
  orchestrator:
    build: .
    image: localhost/ai-orchestrator:latest
    container_name: ai-orchestrator
    ports:
      # Solo en local. Para exponerlo, pon un proxy con HTTPS delante (o cambia a "4000:4000").
      - "127.0.0.1:${AIO_PORT:-4000}:4000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - aio_data:/data
    restart: unless-stopped

  lms:
    build:
      context: ./lms
      args:
        # 1 = instala el cliente docker en la imagen para el runner (ver aviso de seguridad).
        WITH_RUNNER: ${WITH_RUNNER:-0}
    image: localhost/lms:latest
    container_name: lms
    ports:
      - "127.0.0.1:${LMS_PORT:-8080}:8080"
    environment:
      LMS_ADMIN_EMAIL: ${LMS_ADMIN_EMAIL:-}
      LMS_ADMIN_PASSWORD: ${LMS_ADMIN_PASSWORD:-}
      LMS_ADMIN_NAME: ${LMS_ADMIN_NAME:-Instructor}
      # Sprites del LIVE: FLUX.1 schnell (mascota) y FLUX.2 klein (poses con referencia) vía Workers AI.
      # En el .env del servidor las credenciales están como CF_API_TOKEN y CF_ACCOUNT_ID.
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-${CF_API_TOKEN:-}}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}
      SPRITE_POSES_POR_ALUMNO: ${SPRITE_POSES_POR_ALUMNO:-6}
      SPRITE_NEURONAS_DIA: ${SPRITE_NEURONAS_DIA:-9000}
      LMS_INVITE_CODE: ${LMS_INVITE_CODE:-}
      LMS_COHORT: ${LMS_COHORT:-}
      # Ventana: hasta LMS_COHORT_HASTA (RFC 3339) las cuentas nuevas entran a LMS_COHORT_VENTANA.
      LMS_COHORT_VENTANA: ${LMS_COHORT_VENTANA:-}
      LMS_COHORT_HASTA: ${LMS_COHORT_HASTA:-}
      # Grupos con inscripción abierta por enlace (/inscripcion/<grupo>), separados por comas. Vacío = ninguno.
      LMS_INSCRIPCION: ${LMS_INSCRIPCION:-}
      # Vacantes gratuitas por grupo (grupo-8:7). Agotadas, la cuenta queda en «<grupo>-pago» y se pide coordinar
      # el pago por WhatsApp al número de LMS_INSCRIPCION_WHATSAPP.
      LMS_INSCRIPCION_CUPOS: ${LMS_INSCRIPCION_CUPOS:-}
      LMS_INSCRIPCION_WHATSAPP: ${LMS_INSCRIPCION_WHATSAPP:-}
      LMS_PUBLIC_URL: ${LMS_PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-lms-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-lms-api}
      # Runner de código: vacío = desactivado. Si se activa, ver el aviso del socket más abajo.
      LMS_RUNNER: ${LMS_RUNNER:-}
      LMS_RUNNER_TIMEOUT: ${LMS_RUNNER_TIMEOUT:-15s}
      # Estudio de landing: terminal aislada + generación con IA (gateway OpenAI-compatible).
      LMS_TERM_IMAGE: ${LMS_TERM_IMAGE:-}
      LMS_LLM_URL: ${LMS_LLM_URL:-}
      LMS_LLM_KEY: ${LMS_LLM_KEY:-}
      LMS_LLM_MODEL: ${LMS_LLM_MODEL:-auto}
      # Modo LIVE: un contenedor de aula por alumno (imagen jmd/aula, ver lms/aula/README.md). Vacío = sin aula.
      LMS_AULA_IMAGE: ${LMS_AULA_IMAGE:-}
      LMS_AULA_RED: ${LMS_AULA_RED:-}
      LMS_AULA_GATEWAY: ${LMS_AULA_GATEWAY:-}
      LMS_AULA_TOKEN: ${LMS_AULA_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # LIVE: calificar prompts y transcribir audio con Gemini (cadena de hasta 8 modelos, ver live_gemini.go).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELOS: ${GEMINI_MODELOS:-}
      LMS_IMAGEN_MODELO: ${LMS_IMAGEN_MODELO:-google/gemini-2.5-flash-image}
      # Tope de RAM de cada aula (vacío = 384m; ver lms/aula/README.md).
      LMS_AULA_MEMORIA: ${LMS_AULA_MEMORIA:-}
      # Aulas que nunca se apagan por inactividad (IDs o emails del LMS, separados por coma): su robot de
      # WhatsApp sigue atendiendo aunque nadie tenga el LIVE abierto.
      LMS_AULAS_VIVAS: ${LMS_AULAS_VIVAS:-}
      # Clase 3 (WhatsApp, perfil «clase» más abajo). Vacías = las aulas se crean sin base ni WhatsApp.
      # LMS_AULA_PG: contenedor de Postgres que el LMS administra con «docker exec … psql» (una base y un rol por alumno).
      LMS_AULA_PG: ${LMS_AULA_PG:-}
      # Evolution Go visto desde el LMS y su GLOBAL_API_KEY, que NUNCA entra a las aulas.
      LMS_EVO_URL: ${LMS_EVO_URL:-}
      LMS_EVO_KEY: ${LMS_EVO_KEY:-}
      # Salida a internet de las aulas, solo al registro de npm (bun install).
      LMS_AULA_PROXY: ${LMS_AULA_PROXY:-}
      # JMRV embebido en el visor del Estudio (vacío = 503; ver lms/jmrv/).
      LMS_JMRV_URL: ${LMS_JMRV_URL:-http://jmrv:8790}
      # Semilla de las credenciales por alumno; vacía = una aleatoria en lms_data/aula-secreto.
      LMS_AULA_SECRETO: ${LMS_AULA_SECRETO:-}
    volumes:
      - lms_data:/data
      # El temario se lee de aquí: edita lms/content, haz commit, y se recarga solo.
      - ./lms/content:/app/content:ro
      # AVISO DE SEGURIDAD: montar el socket de Docker da control del host a quien lo tenga.
      # Descoméntalo SOLO si vas a usar el runner, y mejor en una máquina/VM dedicada al runner.
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # JMRV · Image Studio (genera imagen con IA y video por cuadros). Vive detrás
  # del LMS: el front lo muestra embebido en el visor (/jmrv/ → este servicio).
  # Las claves entran por entorno (servidor) y nunca van al repo.
  jmrv:
    build: ./lms/jmrv
    image: localhost/jmrv:latest
    container_name: jmrv
    environment:
      JMRV_HOST: 0.0.0.0
      JMRV_PORT: 8790
      POLLINATIONS_API_KEY: ${JMRV_POLLINATIONS_API_KEY:-${POLLINATIONS_API_KEY:-}}
      POLLINATIONS_PUBLIC_KEY: ${JMRV_POLLINATIONS_PUBLIC_KEY:-${POLLINATIONS_PUBLIC_KEY:-}}
      CLOUDFLARE_TOKEN: ${JMRV_CLOUDFLARE_TOKEN:-${CLOUDFLARE_TOKEN:-}}
      CLOUDFLARE_ACCOUNT_ID: ${JMRV_CLOUDFLARE_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    volumes:
      - jmrv_data:/app/outputs
    networks: [default, aula_net]
    restart: unless-stopped

  # Imágenes locales para las aulas del LIVE (sd-turbo en CPU, calidades baja y media). Se enciende con
  #   docker compose --profile imagen up -d --build imagen
  # y se llega desde las aulas como http://imagen:8000 (red aula_net). Pide ~2,5 GB de RAM mientras genera y
  # los suelta tras 30 minutos sin pedidos; ver lms/imagen/app.py.
  imagen:
    profiles: ["imagen"]
    build: ./lms/imagen
    image: jmd/imagen:latest
    container_name: imagen
    mem_limit: 3g
    # Solo en loopback: el nginx del host lo publica en /aula-nube/imagen/ para el kit robo-local-nube
    # (lms/nginx/aula-nube.conf), donde solo se ofrece «maxima» y la voz.
    ports:
      - "127.0.0.1:${IMAGEN_PORT:-18600}:8000"
    environment:
      IMAGEN_TOKEN: ${LMS_AULA_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      IMAGEN_MEDIA: ${IMAGEN_MEDIA:-dreamshaper}
      IMAGEN_REPOSO: ${IMAGEN_REPOSO:-1800}
      # 0 = sin sd-turbo: solo Cloudflare y la voz (devuelve ~2,5 GB si la clase no usa baja/media).
      IMAGEN_LOCAL: ${IMAGEN_LOCAL:-1}
      # Kit robo-local-nube: el gateway valida los tokens personales; tope diario de «maxima» por alumno (también por aula).
      NUBE_GATEWAY_URL: http://ai-orchestrator:4000
      IMAGEN_MAXIMA_POR_ALUMNO: ${IMAGEN_MAXIMA_POR_ALUMNO:-5}
      # FLUX schnell: 2 pasos (~90 neurons por imagen) en vez de 3.
      CF_PASOS: ${CF_PASOS:-2}
      CF_NEURONS_DIA: ${CF_NEURONS_DIA:-9800}
    volumes:
      - imagen_modelos:/modelos
    networks: [default, aula_net]
    restart: unless-stopped

  # Videos de alumnos con HyperFrames + p5.js, sin GPU (lms/render). El LMS lo llama como http://render:8000
  # desde la escena LIVE; renderiza de a uno y con la CPU limitada para no frenar las aulas. Se enciende con
  #   docker compose --profile render up -d --build render
  render:
    profiles: ["render"]
    build: ./lms/render
    image: jmd/render:latest
    container_name: render
    cpus: ${RENDER_CPUS:-1.4}
    mem_limit: 3g
    environment:
      RENDER_TOKEN: ${LMS_AULA_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RENDER_MAX_POR_ALUMNO: ${RENDER_MAX_POR_ALUMNO:-5}
      RENDER_PARALELO: ${RENDER_PARALELO:-1}
    volumes:
      - render_trabajos:/trabajos
    restart: unless-stopped

  # Voz a texto (faster-whisper int8, sin torch) para el dictado de Robo: aulas (http://stt:8000) y kit
  # robo-local-nube (/aula-nube/stt por nginx). Se enciende con
  #   docker compose --profile stt up -d --build stt
  # Modelo «base»: ~380 MB de pico mientras transcribe, ~150 MB en reposo (lo suelta tras STT_REPOSO s sin uso).
  # «small» entiende mejor pero pide ~820 MB y tarda ~4x: STT_MODELO=small y STT_MEMORIA=1g.
  stt:
    profiles: ["stt"]
    build: ./lms/stt
    image: jmd/stt:latest
    container_name: stt
    mem_limit: ${STT_MEMORIA:-600m}
    cpus: 1.5
    ports:
      - "127.0.0.1:${STT_PORT:-18610}:8000"
    environment:
      STT_TOKEN: ${LMS_AULA_TOKEN:-}
      STT_MODELO: ${STT_MODELO:-base}
      STT_REPOSO: ${STT_REPOSO:-300}
      STT_HILOS: ${STT_HILOS:-2}
      STT_COLA: ${STT_COLA:-6}
      STT_POR_ALUMNO_DIA: ${STT_POR_ALUMNO_DIA:-300}
      NUBE_GATEWAY_URL: http://ai-orchestrator:4000
    volumes:
      - stt_modelos:/modelos
    networks: [default, aula_net]
    restart: unless-stopped

  # Clase 3 (chatbot de WhatsApp con Bun + Elysia + PostgreSQL). Se enciende con
  #   docker compose --profile clase up -d --build aula-pg evogo-clase npm-proxy
  # Los tres viven en aula_net (interna) para que las aulas los alcancen por nombre; evogo-clase y npm-proxy
  # están además en la red del compose, que es su salida a internet (WhatsApp y el registro de npm).

  # Postgres de las aulas: una base y un rol por alumno (los crea el LMS) y las dos de evolution-go
  # (evogo_auth, evogo_users, con su rol «evogo»; ver lms/clase/initdb-evogo.sh, solo en el primer arranque).
  aula-pg:
    profiles: ["clase"]
    image: docker.io/library/postgres:16-alpine
    container_name: aula-pg
    # Cada conexión ~3-4 MiB y el «sql» de Bun abre 10 por alumno: 13 alumnos x 15 (tope por rol) + evolution-go
    # caben en 250 y ~0,9 GB en el peor caso. Las ociosas de los alumnos se cierran a los 10 min.
    mem_limit: 1g
    command: ["postgres", "-c", "max_connections=250", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_PASSWORD: ${AULA_PG_PASSWORD:-}
      EVOGO_DB_PASSWORD: ${EVOGO_DB_PASSWORD:-}
    volumes:
      - aula_pg_data:/var/lib/postgresql/data
      - ./lms/clase/initdb-evogo.sh:/docker-entrypoint-initdb.d/10-evogo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [aula_net]
    restart: unless-stopped

  # Evolution Go compartido: una instancia por alumno (la crea el LMS con LMS_EVO_KEY). Sin webhook global:
  # cada instancia entrega a http://<contenedor-del-aula>:8766/api/webhook (lo fija «aula whatsapp»).
  evogo-clase:
    profiles: ["clase"]
    image: importking/evogo:latest
    container_name: evogo-clase
    mem_limit: 512m
    depends_on:
      aula-pg:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      GLOBAL_API_KEY: ${LMS_EVO_KEY:-}
      POSTGRES_AUTH_DB: postgres://evogo:${EVOGO_DB_PASSWORD:-}@aula-pg:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgres://evogo:${EVOGO_DB_PASSWORD:-}@aula-pg:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "false"
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
      CLIENT_NAME: JMD-Clase
      LOGTYPE: console
    volumes:
      - evogo_clase_data:/app/dbdata
    networks: [default, aula_net]
    restart: unless-stopped

  # Única salida a internet de las aulas: HTTP y HTTPS (CONNECT 443/80) a lo que diga «permitidos», hoy todo
  # (lms/clase/npm-proxy).
  npm-proxy:
    profiles: ["clase"]
    build: ./lms/clase/npm-proxy
    image: jmd/npm-proxy:latest
    container_name: npm-proxy
    mem_limit: 32m
    networks: [default, aula_net]
    restart: unless-stopped

networks:
  aula_net:
    external: true
    name: aula_net

volumes:
  aio_data:
  lms_data:
  jmrv_data:
  imagen_modelos:
  render_trabajos:
  stt_modelos:
  aula_pg_data:
  evogo_clase_data:
