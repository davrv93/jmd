# Protección anti-scraping de jmd-learn.online (contexto http). Instalar en /etc/nginx/conf.d/.
# Lo aplica aplicar.sh; el bloque de servidor está en jmd-antiscraping-server.conf.

# Bots de IA, herramientas de scraping y clientes sin navegador. UA vacío también cuenta.
# HeadlessChrome queda fuera a propósito: lo usan nuestras capturas de brochures y pruebas.
map $http_user_agent $jmd_bot {
    default 0;
    "" 1;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|ClaudeBot|Claude-Web|anthropic-ai|PerplexityBot|Bytespider|Amazonbot|Applebot-Extended|Google-Extended|meta-externalagent|FacebookBot|Diffbot|ImagesiftBot|Omgilibot|DataForSeoBot|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|scrapy|python-requests|python-httpx|python-urllib|aiohttp|Go-http-client|node-fetch|axios|okhttp|libwww-perl|PhantomJS|Selenium|HTTrack|wget) 1;
}

# Tope por IP holgado: en clase muchos alumnos salen por la misma IP pública.
limit_req_zone $binary_remote_addr zone=jmd_web:20m rate=20r/s;
# Login: frena la fuerza bruta (el LMS tiene además su propio tope por cuenta).
limit_req_zone $binary_remote_addr zone=jmd_login:10m rate=10r/m;
limit_req_status 429;
