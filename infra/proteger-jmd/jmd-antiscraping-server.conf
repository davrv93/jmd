# Protección anti-scraping de jmd-learn.online (dentro del server {} del LMS, antes de «location /»).

location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
    return 200 "# jmd-learn.online\nUser-agent: GPTBot\nDisallow: /\n\nUser-agent: ChatGPT-User\nDisallow: /\n\nUser-agent: CCBot\nDisallow: /\n\nUser-agent: ClaudeBot\nDisallow: /\n\nUser-agent: anthropic-ai\nDisallow: /\n\nUser-agent: PerplexityBot\nDisallow: /\n\nUser-agent: Bytespider\nDisallow: /\n\nUser-agent: Google-Extended\nDisallow: /\n\nUser-agent: Applebot-Extended\nDisallow: /\n\nUser-agent: meta-externalagent\nDisallow: /\n\nUser-agent: *\nAllow: /$\nAllow: /courses/\nAllow: /inscripcion/\nAllow: /scraping-lab/\nDisallow: /api/\nDisallow: /files/\nDisallow: /live/\nDisallow: /lessons/\nDisallow: /assignments/\nDisallow: /instructor/\nDisallow: /admin\nCrawl-delay: 5\n";
}

# Login: tope fuerte por IP.
location = /api/v1/auth/login {
    if ($jmd_bot) { return 403; }
    limit_req zone=jmd_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# LIVE: autenticado y con topes propios por alumno (la Arena manda ~15 estados/s por jugador):
# sin tope por IP, para no cortar una clase que sale por la misma IP. Solo se bloquean bots.
location ^~ /api/v1/live/ {
    if ($jmd_bot) { return 403; }
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
