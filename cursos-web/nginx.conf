# Páginas públicas de los cursos que aún no empiezan (11-11-2026): https://jmd-learn.online/cursos/
# Contenido: ~/Documents/jmd/cursos-web/web del Mac (lo genera armar.py) copiado a /var/www/cursos/ (desplegar.sh).
location = /cursos { return 301 /cursos/; }
location ^~ /cursos/ {
    alias /var/www/cursos/;
    index index.html;
    add_header Cache-Control "no-cache";
}
